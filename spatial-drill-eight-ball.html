<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Space+Mono:wght@400&display=swap" rel="stylesheet" />
<title>Noctuary — eight-ball</title>
<style>
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: #07060a; touch-action: none;
  }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  .name {
    position: fixed; left: 16px; top: 16px; z-index: 2;
    font-family: "Bricolage Grotesque", system-ui, sans-serif;
    font-weight: 650; font-size: 1.35rem; letter-spacing: -0.03em;
    color: #f4efe6; pointer-events: none;
  }
  .name span {
    display: block; margin-top: 4px;
    font-family: "Space Mono", ui-monospace, monospace;
    font-weight: 400; font-size: 10px; letter-spacing: 0.18em;
    text-transform: uppercase; color: rgba(244,239,230,0.5);
  }
  .hint {
    position: fixed; left: 16px; bottom: 16px; z-index: 2;
    font-family: "Space Mono", ui-monospace, monospace;
    font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase;
    color: rgba(255,244,230,0.55); pointer-events: none;
  }
</style>
</head>
<body>
<div class="name">Eight-ball<span>sixteen · break</span></div>
<div class="hint">click or drag the cue ball to break</div>

<script type="importmap">
{
  "imports": {
    "three": "./vendor/three/build/three.module.js",
    "three/addons/": "./vendor/three/examples/jsm/",
    "cannon-es": "https://unpkg.com/cannon-es@0.20.0/dist/cannon-es.js"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import * as CANNON from 'cannon-es';

const BALL_R = 0.12;
const BALL_MASS = 0.17;
const BALL_D = BALL_R * 2;
const ROW_GAP = BALL_D * Math.sqrt(3) / 2;

/** Standard solid colors 1–7; 8 black; 9–15 stripe of 1–7. */
const BALL_COLORS = {
  1: 0xf0c24b,  // yellow
  2: 0x2a5fd4,  // blue
  3: 0xc62828,  // red
  4: 0x6b3fa0,  // purple
  5: 0xe07020,  // orange
  6: 0x2e7d32,  // green
  7: 0x6b1e2a,  // maroon / burgundy
  8: 0x0a0a0c,  // black
};

/**
 * Rack numbers: apex (row 0) = 1, center of row 2 = 8,
 * back corners one solid + one stripe.
 * Rows apex→foot: apex (row 0) points toward the cue ball at +Z.
 */
const RACK = [
  [1],
  [9, 2],
  [10, 8, 11],
  [3, 12, 7, 14],
  [15, 4, 13, 6, 5],
];

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.75));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.92;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color('#07060a');
scene.fog = new THREE.Fog('#07060a', 6.5, 16);

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.05, 40);
// Cue end is +Z. Camera sits behind the head spot, looking down the table at the rack.
camera.position.set(0, 1.32, 2.46);
camera.lookAt(0, 0.0, -0.4);

const hemi = new THREE.HemisphereLight(0x3a3550, 0x0a080c, 0.55);
scene.add(hemi);
const key = new THREE.DirectionalLight(0xffe8d0, 1.15);
key.position.set(2.2, 4.8, 3.4);
key.castShadow = true;
key.shadow.mapSize.set(1024, 1024);
key.shadow.camera.near = 0.5;
key.shadow.camera.far = 16;
key.shadow.camera.left = -3;
key.shadow.camera.right = 3;
key.shadow.camera.top = 3;
key.shadow.camera.bottom = -3;
scene.add(key);
const fill = new THREE.PointLight(0x6a5a90, 18, 12);
fill.position.set(-2.4, 2.2, 1.5);
scene.add(fill);
const rim = new THREE.PointLight(0x204060, 10, 10);
rim.position.set(0.5, 1.8, -2.5);
scene.add(rim);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
if ('environmentIntensity' in scene) scene.environmentIntensity = 0.72;

// —— Table dimensions (felt playing surface) ——
const FELT_W = 2.05;    // X extent
const FELT_L = 3.35;    // Z extent
const FELT_Y = 0;
const FELT_THICK = 0.06;
const RAIL_H = 0.09;
const RAIL_T = 0.08;

const feltMat = new THREE.MeshStandardMaterial({
  color: 0x1a5c38,
  roughness: 0.88,
  metalness: 0.02,
});
const woodMat = new THREE.MeshStandardMaterial({
  color: 0x2a1810,
  roughness: 0.55,
  metalness: 0.08,
});
const woodTopMat = new THREE.MeshStandardMaterial({
  color: 0x3a2418,
  roughness: 0.48,
  metalness: 0.1,
});

// Felt top
const feltMesh = new THREE.Mesh(
  new THREE.BoxGeometry(FELT_W, FELT_THICK, FELT_L),
  feltMat
);
feltMesh.position.y = FELT_Y - FELT_THICK / 2;
feltMesh.receiveShadow = true;
scene.add(feltMesh);

// Table apron / under-slab
const apron = new THREE.Mesh(
  new THREE.BoxGeometry(FELT_W + 0.22, 0.28, FELT_L + 0.22),
  woodMat
);
apron.position.y = FELT_Y - FELT_THICK - 0.14;
apron.receiveShadow = true;
scene.add(apron);

// Cushion rails with openings at six pockets (visual)
function addRail(w, h, d, x, y, z) {
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), woodTopMat);
  mesh.position.set(x, y, z);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  scene.add(mesh);
  return mesh;
}
const railY = FELT_Y + RAIL_H / 2;
const halfW = FELT_W / 2;
const halfL = FELT_L / 2;
// Jaw openings: corners and side pockets. Wide enough for a ball center to cross the hole.
const CORNER_JAW = 0.30;
const SIDE_GAP = 0.50;

const longLen = (halfL - CORNER_JAW) - SIDE_GAP / 2;
const longZ = (SIDE_GAP / 2 + (halfL - CORNER_JAW)) / 2;
function addLongSide(x) {
  addRail(RAIL_T, RAIL_H, longLen, x, railY, longZ);
  addRail(RAIL_T, RAIL_H, longLen, x, railY, -longZ);
}
addLongSide(-halfW - RAIL_T / 2);
addLongSide(halfW + RAIL_T / 2);

const shortLen = FELT_W - CORNER_JAW * 2;
addRail(shortLen, RAIL_H, RAIL_T, 0, railY, -halfL - RAIL_T / 2);
addRail(shortLen, RAIL_H, RAIL_T, 0, railY, halfL + RAIL_T / 2);

// Pocket mouths — four corners and two side pockets. Dark wells, not cushions.
const POCKET_R = 0.165;
const pockets = [
  { x: -halfW, z: -halfL },
  { x:  halfW, z: -halfL },
  { x: -halfW, z:  halfL },
  { x:  halfW, z:  halfL },
  { x: -halfW, z:  0 },
  { x:  halfW, z:  0 },
];
const pocketMat = new THREE.MeshStandardMaterial({ color: 0x050506, roughness: 0.96, metalness: 0.04 });
const mouthGeo = new THREE.CircleGeometry(POCKET_R, 28);
const mouthMat = new THREE.MeshBasicMaterial({ color: 0x07080c });
const wellGeo = new THREE.CylinderGeometry(POCKET_R * 0.92, POCKET_R * 0.5, 0.42, 20);
for (const pk of pockets) {
  const mouth = new THREE.Mesh(mouthGeo, mouthMat);
  mouth.rotation.x = -Math.PI / 2;
  mouth.position.set(pk.x, 0.006, pk.z);
  scene.add(mouth);
  const well = new THREE.Mesh(wellGeo, pocketMat);
  well.position.set(pk.x, -0.18, pk.z);
  scene.add(well);
}

// Dim room floor under the table
const roomFloor = new THREE.Mesh(
  new THREE.PlaneGeometry(18, 18),
  new THREE.MeshStandardMaterial({ color: 0x0c0a10, roughness: 0.95, metalness: 0 })
);
roomFloor.rotation.x = -Math.PI / 2;
roomFloor.position.y = -0.45;
scene.add(roomFloor);

// —— Physics world (same approach as buildStacking) ——
const world = new CANNON.World({ gravity: new CANNON.Vec3(0, -9.82, 0) });
world.allowSleep = true;
world.defaultContactMaterial.friction = 0.15;
world.defaultContactMaterial.restitution = 0.4;
world.solver.iterations = 12;

const matBall = new CANNON.Material('ball');
const matFelt = new CANNON.Material('felt');
const matCushion = new CANNON.Material('cushion');

world.addContactMaterial(new CANNON.ContactMaterial(matBall, matBall, {
  friction: 0.04,
  restitution: 0.92,
}));
world.addContactMaterial(new CANNON.ContactMaterial(matBall, matFelt, {
  friction: 0.22,
  restitution: 0.35,
}));
world.addContactMaterial(new CANNON.ContactMaterial(matBall, matCushion, {
  friction: 0.08,
  restitution: 0.75,
}));

// Static felt ground (box matching visual top)
const feltBody = new CANNON.Body({
  mass: 0,
  material: matFelt,
  shape: new CANNON.Box(new CANNON.Vec3(FELT_W / 2, FELT_THICK / 2, FELT_L / 2)),
  position: new CANNON.Vec3(0, FELT_Y - FELT_THICK / 2, 0),
});
world.addBody(feltBody);

// Cushion bodies — same gaps as the visual rails so balls can reach pockets
function addCushionBody(hx, hy, hz, x, y, z) {
  const body = new CANNON.Body({
    mass: 0,
    material: matCushion,
    shape: new CANNON.Box(new CANNON.Vec3(hx, hy, hz)),
    position: new CANNON.Vec3(x, y, z),
  });
  world.addBody(body);
}
function addLongCushions(x) {
  addCushionBody(RAIL_T / 2, RAIL_H / 2, longLen / 2, x, railY, longZ);
  addCushionBody(RAIL_T / 2, RAIL_H / 2, longLen / 2, x, railY, -longZ);
}
addLongCushions(-halfW - RAIL_T / 2);
addLongCushions(halfW + RAIL_T / 2);
addCushionBody(shortLen / 2, RAIL_H / 2, RAIL_T / 2, 0, railY, -halfL - RAIL_T / 2);
addCushionBody(shortLen / 2, RAIL_H / 2, RAIL_T / 2, 0, railY, halfL + RAIL_T / 2);

function makeNumberTexture(num) {
  const s = 128;
  const cnv = document.createElement('canvas');
  cnv.width = cnv.height = s;
  const ctx = cnv.getContext('2d');
  ctx.clearRect(0, 0, s, s);
  ctx.beginPath();
  ctx.arc(s / 2, s / 2, s * 0.46, 0, Math.PI * 2);
  ctx.fillStyle = '#f7f4ee';
  ctx.fill();
  ctx.beginPath();
  ctx.arc(s / 2, s / 2, s * 0.46, 0, Math.PI * 2);
  ctx.strokeStyle = 'rgba(20,16,12,0.18)';
  ctx.lineWidth = 3;
  ctx.stroke();
  ctx.fillStyle = num === 8 ? '#111114' : '#1a1520';
  ctx.font = 'bold 64px "Bricolage Grotesque", system-ui, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(String(num), s / 2, s / 2 + 2);
  const tex = new THREE.CanvasTexture(cnv);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 4;
  return tex;
}

function ballBaseColor(num) {
  if (num >= 9) return 0xf4f0e8; // striped: white body
  return BALL_COLORS[num];
}

function stripeColor(num) {
  return BALL_COLORS[num - 8];
}

function makeBallMesh(num) {
  const group = new THREE.Group();
  const isStripe = num >= 9;
  const isEight = num === 8;

  const bodyMat = new THREE.MeshPhysicalMaterial({
    color: ballBaseColor(num),
    roughness: isEight ? 0.22 : 0.14,
    metalness: 0.02,
    clearcoat: 0.85,
    clearcoatRoughness: 0.12,
    envMapIntensity: 1.05,
  });
  const sphere = new THREE.Mesh(
    new THREE.SphereGeometry(BALL_R, 40, 32),
    bodyMat
  );
  sphere.castShadow = true;
  sphere.receiveShadow = true;
  group.add(sphere);

  if (isStripe) {
    // Equatorial band as a latitude slice of a slightly larger sphere (child, not a photo texture)
    const band = new THREE.Mesh(
      new THREE.SphereGeometry(
        BALL_R * 1.004,
        40,
        16,
        0,
        Math.PI * 2,
        Math.PI * 0.38,
        Math.PI * 0.24
      ),
      new THREE.MeshPhysicalMaterial({
        color: stripeColor(num),
        roughness: 0.16,
        metalness: 0.02,
        clearcoat: 0.8,
        clearcoatRoughness: 0.14,
        envMapIntensity: 1.0,
      })
    );
    band.castShadow = true;
    group.add(band);
  }

  // Number discs — CircleGeometry children, opposite sides, roll with the ball
  const discR = BALL_R * 0.32;
  const numTex = makeNumberTexture(num);
  const discMat = new THREE.MeshBasicMaterial({
    map: numTex,
    transparent: true,
    depthWrite: false,
  });
  const discGeo = new THREE.CircleGeometry(discR, 28);
  const d1 = new THREE.Mesh(discGeo, discMat);
  const d2 = new THREE.Mesh(discGeo, discMat.clone());
  const lift = BALL_R * 1.002;
  d1.position.set(0, 0, lift);
  d2.position.set(0, 0, -lift);
  d2.rotation.y = Math.PI;
  group.add(d1);
  group.add(d2);

  // Orient so a number face is roughly readable at rest (stripe band equatorial)
  if (isStripe) {
    // Band already around Y-up equator; numbers on ±Z — rotate so band is vertical-ish relative to table? Keep as-is.
  }

  return group;
}

function makeCueBallMesh() {
  const group = new THREE.Group();
  const sphere = new THREE.Mesh(
    new THREE.SphereGeometry(BALL_R, 40, 32),
    new THREE.MeshPhysicalMaterial({
      color: 0xf4f1ea,
      roughness: 0.1,
      metalness: 0.02,
      clearcoat: 0.92,
      clearcoatRoughness: 0.08,
      envMapIntensity: 1.12,
    })
  );
  sphere.castShadow = true;
  sphere.receiveShadow = true;
  group.add(sphere);
  return group;
}

function syncMesh(mesh, body) {
  mesh.position.copy(body.position);
  mesh.quaternion.copy(body.quaternion);
}

// Rack at the foot (−Z), apex pointing toward the cue (+Z). Cue on the head spot.
const ballY = FELT_Y + BALL_R + 0.001;
const HEAD_SPOT_Z = FELT_L * 0.25;
// Back row clears the foot rail; apex still aims at the cue ball.
const backRowZ = -halfL + BALL_R + 0.20;
const apexZ = backRowZ + 4 * ROW_GAP;

const balls = [];
let apexBall = null;
let cueBall = null;

function addBallBody(mesh, x, y, z) {
  const body = new CANNON.Body({
    mass: BALL_MASS,
    material: matBall,
    shape: new CANNON.Sphere(BALL_R),
    position: new CANNON.Vec3(x, y, z),
    linearDamping: 0.28,
    angularDamping: 0.32,
    sleepSpeedLimit: 0.12,
    sleepTimeLimit: 0.4,
  });
  body.quaternion.setFromEuler(0, mesh.rotation.y, 0);
  world.addBody(body);
  return body;
}

for (let row = 0; row < RACK.length; row++) {
  const nums = RACK[row];
  const n = nums.length;
  const z = apexZ - row * ROW_GAP;
  const x0 = -((n - 1) * BALL_D) / 2;
  for (let col = 0; col < n; col++) {
    const num = nums[col];
    const x = x0 + col * BALL_D;
    const mesh = makeBallMesh(num);
    mesh.position.set(x, ballY, z);
    mesh.rotation.y = ((num * 37) % 360) * (Math.PI / 180);
    scene.add(mesh);

    const body = addBallBody(mesh, x, ballY, z);
    const entry = { mesh, body, num, cue: false, sunk: false, prevX: x, prevZ: z };
    balls.push(entry);
    if (num === 1) apexBall = entry;
  }
}

{
  const mesh = makeCueBallMesh();
  mesh.position.set(0, ballY, HEAD_SPOT_Z);
  scene.add(mesh);
  const body = addBallBody(mesh, 0, ballY, HEAD_SPOT_Z);
  cueBall = { mesh, body, num: 0, cue: true, sunk: false, prevX: 0, prevZ: HEAD_SPOT_Z };
  balls.push(cueBall);
}

if (balls.length !== 16) {
  console.error('[eight-ball] expected 16 balls, got', balls.length);
}

// —— Interaction: click or drag strikes the cue ball toward the rack ——
const raycaster = new THREE.Raycaster();
const ndc = new THREE.Vector2();
const tablePlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), -ballY);
const hit = new THREE.Vector3();
const prevHit = new THREE.Vector3();
let pointerDown = false;
let cueAim = false;
let grabbed = null;
let grabOffset = new THREE.Vector3();
let throwVel = new THREE.Vector3();
let lastSampleT = 0;
let dragDist = 0;
const POCKET_CAPTURE = POCKET_R;

const canvasEl = renderer.domElement;
canvasEl.style.cursor = 'crosshair';

function setNDC(e) {
  const rect = canvasEl.getBoundingClientRect();
  const w = Math.max(1, rect.width);
  const h = Math.max(1, rect.height);
  ndc.x = ((e.clientX - rect.left) / w) * 2 - 1;
  ndc.y = -((e.clientY - rect.top) / h) * 2 + 1;
}

function pickBall() {
  raycaster.setFromCamera(ndc, camera);
  const targets = [];
  for (const b of balls) {
    if (b.sunk) continue;
    b.mesh.traverse((o) => {
      if (o.isMesh && o.geometry && o.geometry.type === 'SphereGeometry') targets.push(o);
    });
  }
  const hits = raycaster.intersectObjects(targets, false);
  if (hits.length) {
    let obj = hits[0].object;
    while (obj && !balls.find((b) => b.mesh === obj)) obj = obj.parent;
    return balls.find((b) => b.mesh === obj) || null;
  }
  if (!raycaster.ray.intersectPlane(tablePlane, hit)) return null;
  let best = null;
  let bestD = BALL_R * 2.2;
  for (const b of balls) {
    if (b.sunk) continue;
    const d = Math.hypot(b.body.position.x - hit.x, b.body.position.z - hit.z);
    if (d < bestD) { bestD = d; best = b; }
  }
  return best;
}

function cueStrikeDir() {
  let dx = 0;
  let dz = -1;
  if (apexBall && !apexBall.sunk) {
    dx = apexBall.body.position.x - cueBall.body.position.x;
    dz = apexBall.body.position.z - cueBall.body.position.z;
  }
  const len = Math.hypot(dx, dz) || 1;
  return { x: dx / len, z: dz / len };
}

function strikeCue(power) {
  if (!cueBall || cueBall.sunk) return;
  const dir = cueStrikeDir();
  cueBall.body.wakeUp();
  cueBall.body.applyImpulse(
    new CANNON.Vec3(dir.x * power, 0, dir.z * power),
    new CANNON.Vec3(0, 0, 0)
  );
}

function overPocket(x0, z0, x1, z1) {
  for (const pk of pockets) {
    const dx = x1 - x0;
    const dz = z1 - z0;
    const fx = x0 - pk.x;
    const fz = z0 - pk.z;
    const a = dx * dx + dz * dz;
    let t = 0;
    if (a > 1e-10) t = Math.max(0, Math.min(1, -(fx * dx + fz * dz) / a));
    const cx = fx + t * dx;
    const cz = fz + t * dz;
    if (cx * cx + cz * cz <= POCKET_CAPTURE * POCKET_CAPTURE) return true;
  }
  return false;
}

function sinkBall(b) {
  if (b.sunk) return;
  b.sunk = true;
  world.removeBody(b.body);
  if (grabbed === b) grabbed = null;
  b.dropY = b.mesh.position.y;
}

function onPointerDown(e) {
  setNDC(e);
  pointerDown = true;
  dragDist = 0;
  throwVel.set(0, 0, 0);
  lastSampleT = performance.now();
  try { canvasEl.setPointerCapture(e.pointerId); } catch (_) {}
  const picked = pickBall();
  raycaster.setFromCamera(ndc, camera);
  if (raycaster.ray.intersectPlane(tablePlane, hit)) prevHit.copy(hit);

  // Object balls can still be dragged; the break itself is always the cue ball.
  if (picked && !picked.cue) {
    cueAim = false;
    grabbed = picked;
    grabbed.body.wakeUp();
    grabbed.body.velocity.set(0, 0, 0);
    grabbed.body.angularVelocity.set(0, 0, 0);
    grabOffset.set(
      grabbed.body.position.x - hit.x,
      0,
      grabbed.body.position.z - hit.z
    );
    canvasEl.style.cursor = 'grabbing';
    return;
  }

  cueAim = true;
  if (picked && picked.cue) {
    grabbed = picked;
    grabbed.body.wakeUp();
    grabbed.body.velocity.set(0, 0, 0);
    grabbed.body.angularVelocity.set(0, 0, 0);
    grabOffset.set(
      grabbed.body.position.x - hit.x,
      0,
      grabbed.body.position.z - hit.z
    );
    canvasEl.style.cursor = 'grabbing';
  }
}

function onPointerMove(e) {
  setNDC(e);
  if (!pointerDown) return;
  raycaster.setFromCamera(ndc, camera);
  if (!raycaster.ray.intersectPlane(tablePlane, hit)) return;
  const now = performance.now();
  const sampleDt = Math.max(0.008, (now - lastSampleT) / 1000);
  throwVel.set(
    (hit.x - prevHit.x) / sampleDt,
    0,
    (hit.z - prevHit.z) / sampleDt
  );
  dragDist += Math.hypot(hit.x - prevHit.x, hit.z - prevHit.z);
  prevHit.copy(hit);
  lastSampleT = now;
  if (!grabbed || grabbed.sunk) return;
  const tx = hit.x + grabOffset.x;
  const tz = hit.z + grabOffset.z;
  const margin = BALL_R + 0.02;
  grabbed.body.wakeUp();
  grabbed.body.position.x = THREE.MathUtils.clamp(tx, -halfW + margin, halfW - margin);
  grabbed.body.position.y = ballY;
  grabbed.body.position.z = THREE.MathUtils.clamp(tz, -halfL + margin, halfL - margin);
  grabbed.body.velocity.set(0, 0, 0);
  grabbed.body.angularVelocity.set(0, 0, 0);
}

function onPointerUp() {
  if (grabbed && !grabbed.cue && !grabbed.sunk) {
    grabbed.body.wakeUp();
    const speed = Math.hypot(throwVel.x, throwVel.z);
    if (speed > 0.15) {
      const boost = Math.min(2.4, 0.35 + speed * 0.22);
      const nx = throwVel.x / speed;
      const nz = throwVel.z / speed;
      grabbed.body.applyImpulse(
        new CANNON.Vec3(nx * boost, 0, nz * boost),
        new CANNON.Vec3(0, 0, 0)
      );
    }
  } else if (cueAim) {
    // Click or drag sends the cue down the table at the rack. Drag length is power.
    const power = dragDist > 0.04
      ? THREE.MathUtils.clamp(0.9 + dragDist * 1.6, 0.9, 1.7)
      : 1.35;
    strikeCue(power);
  }
  grabbed = null;
  cueAim = false;
  pointerDown = false;
  canvasEl.style.cursor = 'crosshair';
}

canvasEl.addEventListener('pointerdown', onPointerDown, { passive: true });
canvasEl.addEventListener('pointermove', onPointerMove, { passive: true });
canvasEl.addEventListener('pointerup', onPointerUp, { passive: true });
canvasEl.addEventListener('pointercancel', onPointerUp, { passive: true });

function resize() {
  camera.aspect = innerWidth / Math.max(1, innerHeight);
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
}
addEventListener('resize', resize);

const clock = new THREE.Clock();

function frame() {
  clock.getDelta();
  if (!grabbed) {
    world.fixedStep();
  } else {
    // Still step contacts lightly while holding so others can settle
    world.fixedStep();
  }
  for (let i = balls.length - 1; i >= 0; i--) {
    const b = balls[i];
    if (b.sunk) {
      b.dropY -= 0.05;
      b.mesh.position.y = b.dropY;
      if (b.dropY < -1.5) {
        scene.remove(b.mesh);
        balls.splice(i, 1);
      }
      continue;
    }
    const x = b.body.position.x;
    const z = b.body.position.z;
    const y = b.body.position.y;
    const leftTable = Math.abs(x) > halfW - 0.01 || Math.abs(z) > halfL - 0.01;
    const inPocket = y < ballY + BALL_R && overPocket(b.prevX, b.prevZ, x, z);
    if ((inPocket || leftTable) && b !== grabbed) {
      syncMesh(b.mesh, b.body);
      sinkBall(b);
      continue;
    }
    if (y < ballY - 0.02) {
      b.body.position.y = ballY;
      if (b.body.velocity.y < 0) b.body.velocity.y *= -0.2;
    }
    b.prevX = b.body.position.x;
    b.prevZ = b.body.position.z;
    syncMesh(b.mesh, b.body);
  }
  key.intensity = 1.1 + Math.sin(clock.elapsedTime * 0.45) * 0.04;
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
