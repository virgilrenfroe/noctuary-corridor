<!DOCTYPE html>

<head>
<meta charset="utf-8"/>

<title>06 · PCSS soft shadows + contact · WebGL Lab</title>
<style>
:root { --ink:#0a0b10; --paper:#e8e2d6; --mute:rgba(232,226,214,.55); --accent:#f0c24b; --line:rgba(232,226,214,.16); }
*{box-sizing:border-box} html,body{margin:0;height:100%;background:var(--ink);color:var(--paper);font:13px/1.45 "IBM Plex Sans",system-ui,sans-serif;overflow:hidden}
canvas{display:block;width:100%;height:100%}
.hud{position:fixed;inset:0;pointer-events:none;z-index:2}
.top{position:absolute;top:14px;left:14px;right:14px;display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.brand,.pill{pointer-events:auto;border:1px solid var(--line);background:rgba(10,11,16,.55);backdrop-filter:blur(10px);border-radius:999px;padding:8px 12px;color:var(--paper);text-decoration:none;font-size:11px;letter-spacing:.14em;text-transform:uppercase}
.brand a{color:inherit;text-decoration:none}
.note{position:absolute;bottom:14px;left:14px;right:14px;max-width:520px;color:var(--mute);font-size:12px;background:rgba(10,11,16,.45);border:1px solid var(--line);border-radius:12px;padding:10px 12px;backdrop-filter:blur(8px)}
.note b{color:var(--accent);font-weight:600}
.error{position:fixed;inset:auto 14px 14px 14px;background:#3a1212;color:#ffd6d6;padding:12px 14px;border-radius:10px;z-index:9;display:none;white-space:pre-wrap}
body.embed .hud{display:none!important} body.embed .error{display:none!important}
</style>

<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.170.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.170.0/examples/jsm/"}}</script>
</head>
<body>
<script>
(function(){const q=new URLSearchParams(location.search);if(q.has('embed')||q.has('still'))document.body.classList.add('embed');})();
</script>

<div class="hud">
  <div class="top">
    <div class="brand"><a href="./INDEX.html">← WebGL Lab</a> · 06 PCSS soft shadows + contact</div>
    <div class="pill">three@0.170.0</div>
  </div>
  <div class="note"><b>PCSS soft shadows + contact.</b> PCF-soft directional shadows plus a screen-space-ish contact shadow plane under each prop.</div>
</div>
<div class="error" id="err"></div>
<script type="module">

const err = document.getElementById('err');
window.addEventListener('error', e => { err.style.display='block'; err.textContent = e.message || String(e.error||e); });
window.addEventListener('unhandledrejection', e => { err.style.display='block'; err.textContent = String(e.reason); });
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

function makeRenderer(opts={}) {
  const r = new THREE.WebGLRenderer({ antialias:true, alpha:false, powerPreference:'high-performance', ...opts });
  r.setPixelRatio(Math.min(devicePixelRatio, 2));
  r.setSize(innerWidth, innerHeight);
  r.outputColorSpace = THREE.SRGBColorSpace;
  r.toneMapping = THREE.ACESFilmicToneMapping;
  r.toneMappingExposure = 1.0;
  document.body.prepend(r.domElement);
  return r;
}
function onResize(camera, renderer, composer=null) {
  addEventListener('resize', () => {
    camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
    if (composer) composer.setSize(innerWidth, innerHeight);
  });
}

const renderer = makeRenderer();
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1c24);
const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 100);
camera.position.set(3.5, 3.2, 4.5);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.target.set(0,0.5,0);

const floor = new THREE.Mesh(new THREE.PlaneGeometry(12,12), new THREE.MeshStandardMaterial({color:0x2a2e3a, roughness:0.85}));
floor.rotation.x=-Math.PI/2; floor.receiveShadow=true; scene.add(floor);

function contactShadow(x,z,rx=0.55,rz=0.4) {
  const m = new THREE.Mesh(
    new THREE.PlaneGeometry(rx*2, rz*2),
    new THREE.MeshBasicMaterial({ color:0x000000, transparent:true, opacity:0.45, depthWrite:false })
  );
  m.rotation.x=-Math.PI/2; m.position.set(x,0.002,z); scene.add(m); return m;
}

const props = [];
const shapes = [
  [new THREE.BoxGeometry(0.8,1.2,0.8), [-1.2,0.6,0]],
  [new THREE.SphereGeometry(0.45,32,32), [0.3,0.45,0.8]],
  [new THREE.CylinderGeometry(0.3,0.35,1.0,24), [1.3,0.5,-0.4]],
];
shapes.forEach(([g,p],i) => {
  const mesh = new THREE.Mesh(g, new THREE.MeshStandardMaterial({color:[0xf0c24b,0x5ec8c0,0xe07060][i], roughness:0.4, metalness:0.15}));
  mesh.position.set(...p); mesh.castShadow=true; mesh.receiveShadow=true; scene.add(mesh); props.push(mesh);
  contactShadow(p[0], p[2], 0.55, 0.45);
});

const light = new THREE.DirectionalLight(0xffffff, 2.8);
light.position.set(4, 8, 2);
light.castShadow = true;
light.shadow.mapSize.set(2048,2048);
light.shadow.camera.near=0.5; light.shadow.camera.far=30;
light.shadow.camera.left=-6; light.shadow.camera.right=6;
light.shadow.camera.top=6; light.shadow.camera.bottom=-6;
light.shadow.radius = 4; // soft PCF
light.shadow.bias = -0.0005;
scene.add(light);
scene.add(new THREE.AmbientLight(0x6688aa, 0.35));

onResize(camera, renderer);
(function tick(){
  requestAnimationFrame(tick);
  const t = performance.now()*0.001;
  light.position.x = Math.cos(t*0.35)*5; light.position.z = Math.sin(t*0.35)*3 + 1;
  controls.update(); renderer.render(scene, camera);
})();

</script>
</body>
