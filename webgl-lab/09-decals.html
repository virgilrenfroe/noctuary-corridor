<script>

<div class="hud">
  <div class="top">
    <div class="brand"><a href="./INDEX.html">← WebGL Lab</a> · 09 Decals</div>
    <div class="pill">three@0.170.0 local</div>
  </div>
</div>
<div class="error" id="err"></div>
<script type="module">

const err = document.getElementById('err');
window.addEventListener('error', e => { err.style.display='block'; err.textContent = e.message || String(e.error||e); });
window.addEventListener('unhandledrejection', e => { err.style.display='block'; err.textContent = String(e.reason); });
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

function makeRenderer(opts={}) {
  const embed = document.body.classList.contains('embed');
  const r = new THREE.WebGLRenderer({ antialias:true, alpha:embed, premultipliedAlpha:true, powerPreference:'high-performance', ...opts });
  r.setPixelRatio(Math.min(devicePixelRatio, 2));
  r.setSize(innerWidth, innerHeight);
  r.outputColorSpace = THREE.SRGBColorSpace;
  r.toneMapping = THREE.ACESFilmicToneMapping;
  r.toneMappingExposure = 1.0;
  if (embed) { r.setClearColor(0x000000, 0); r.setClearAlpha(0); }
  document.body.prepend(r.domElement);
  return r;
}
function onResize(camera, renderer, composer=null) {
  addEventListener('resize', () => {
    camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
    if (composer) composer.setSize(innerWidth, innerHeight);
  });
}

import { DecalGeometry } from 'three/addons/geometries/DecalGeometry.js';

const renderer = makeRenderer();
const scene = new THREE.Scene();
const __floatClearBg = () => { if (document.body.classList.contains('embed')) scene.background = null; };
scene.background = new THREE.Color(0x101218); __floatClearBg();
const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 100);
camera.position.set(0, 0.5, 4);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

const target = new THREE.Mesh(
  new THREE.SphereGeometry(1, 64, 64),
  new THREE.MeshStandardMaterial({ color:0x3a4258, roughness:0.55, metalness:0.2 })
);
scene.add(target);

// The Hobbit — successive short opening phrases (click stamps & advances)
const phrases = [
  'In a hole in the ground there lived a hobbit.',
  'Not a nasty, dirty, wet hole…',
  '…filled with the ends of worms and an oozy smell…',
  '…nor yet a dry, bare, sandy hole…',
  '…it was a hobbit-hole, and that means comfort.',
  'It had a perfectly round door like a porthole…',
  '…painted green, with a shiny yellow brass knob…',
  'This hobbit was a very well-to-do hobbit…',
  '…and his name was Baggins.'
];
const DEFAULT_PHRASE = phrases[0];
let phraseIndex = 0;

function currentPhrase() {
  return phrases[phraseIndex] || DEFAULT_PHRASE;
}
function setPhraseIndex(i) {
  if (!phrases.length) return;
  phraseIndex = ((i % phrases.length) + phrases.length) % phrases.length;
}
function nextPhrase() { setPhraseIndex(phraseIndex + 1); }
function prevPhrase() { setPhraseIndex(phraseIndex - 1); }

const textureCache = new Map();

function wrapLines(ctx, text, maxWidth, maxLines = 3) {
  const words = text.split(/\s+/).filter(Boolean);
  const lines = [];
  let line = '';
  for (const word of words) {
    const trial = line ? line + ' ' + word : word;
    if (ctx.measureText(trial).width <= maxWidth) {
      line = trial;
    } else {
      if (line) lines.push(line);
      line = word;
      if (lines.length >= maxLines - 1) break;
    }
  }
  if (lines.length < maxLines && line) {
    // if we stopped early because maxLines, append remaining as truncated last line
    if (lines.length === maxLines - 1) {
      const rest = words.slice(words.indexOf(line)).join(' ');
      let last = rest;
      while (ctx.measureText(last + '…').width > maxWidth && last.length > 4) {
        last = last.slice(0, -1);
      }
      if (ctx.measureText(rest).width > maxWidth) last = last.replace(/\s+\S*$/, '') + '…';
      lines.push(last);
    } else {
      lines.push(line);
    }
  }
  // leftover beyond maxLines → ensure last ends with …
  if (words.length && lines.join(' ') !== text && !lines[lines.length - 1]?.endsWith('…')) {
    const last = lines[lines.length - 1] || '';
    let t = last;
    while (ctx.measureText(t + '…').width > maxWidth && t.length > 4) t = t.slice(0, -1);
    lines[lines.length - 1] = t.replace(/\s+\S*$/, '').trimEnd() + '…';
  }
  return lines.length ? lines : [text];
}

function makePhraseTexture(phrase) {
  const key = phrase;
  if (textureCache.has(key)) return textureCache.get(key);
  const size = 512;
  const c = document.createElement('canvas');
  c.width = size; c.height = size;
  const ctx = c.getContext('2d');
  ctx.clearRect(0, 0, size, size);
  const pad = 28;
  ctx.fillStyle = 'rgba(8,10,16,0.62)';
  roundRect(ctx, pad, pad, size - pad * 2, size - pad * 2, 36);
  ctx.fill();
  ctx.strokeStyle = 'rgba(240,194,75,0.55)';
  ctx.lineWidth = 4;
  roundRect(ctx, pad, pad, size - pad * 2, size - pad * 2, 36);
  ctx.stroke();

  ctx.fillStyle = '#f0c24b';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  const maxW = size - pad * 2 - 36;
  let fontSize = phrase.length < 28 ? 42 : phrase.length < 48 ? 34 : 28;
  let lines;
  do {
    ctx.font = `600 ${fontSize}px Georgia, "Times New Roman", serif`;
    lines = wrapLines(ctx, phrase, maxW, 3);
    const widest = Math.max(...lines.map(l => ctx.measureText(l).width));
    if (widest <= maxW || fontSize <= 20) break;
    fontSize -= 2;
  } while (fontSize > 18);

  const lineH = fontSize * 1.25;
  const blockH = lines.length * lineH;
  let y = size / 2 - blockH / 2 + lineH / 2;
  for (const line of lines) {
    ctx.fillText(line, size / 2, y);
    y += lineH;
  }

  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.needsUpdate = true;
  textureCache.set(key, tex);
  return tex;
}
function roundRect(ctx, x, y, w, h, r) {
  const rr = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + rr, y);
  ctx.arcTo(x + w, y, x + w, y + h, rr);
  ctx.arcTo(x + w, y + h, x, y + h, rr);
  ctx.arcTo(x, y + h, x, y, rr);
  ctx.arcTo(x, y, x + w, y, rr);
  ctx.closePath();
}

const decals = [];
const decalMatBase = {
  color: 0xffffff,
  transparent: true,
  depthTest: true,
  depthWrite: false,
  polygonOffset: true,
  polygonOffsetFactor: -4,
  opacity: 1,
  roughness: 0.65,
  metalness: 0.05,
  map: null
};

const ray = new THREE.Raycaster();
const ptr = new THREE.Vector2();
const mouseHelper = new THREE.Object3D();

function stamp(intersect) {
  const phrase = currentPhrase();
  const map = makePhraseTexture(phrase);
  const n = intersect.face.normal.clone();
  n.transformDirection(target.matrixWorld);
  n.multiplyScalar(10); n.add(intersect.point);
  mouseHelper.position.copy(intersect.point);
  mouseHelper.lookAt(n);
  // larger than single-word blobs so opening lines stay readable
  const size = 0.72 + Math.random() * 0.12;
  const mat = new THREE.MeshStandardMaterial({
    ...decalMatBase,
    map
  });
  const m = new THREE.Mesh(
    new DecalGeometry(target, intersect.point, mouseHelper.rotation, new THREE.Vector3(size, size, size * 0.28)),
    mat
  );
  scene.add(m); decals.push(m);
  nextPhrase();
}

function clearDecals() {
  decals.forEach(d => {
    scene.remove(d);
    d.geometry.dispose();
    if (d.material) d.material.dispose();
  });
  decals.length = 0;
}

let ptrDown = null;
function eventOnUi(t) {
  return t && t.closest && (t.closest('.brand') || t.closest('.pill'));
}
function stampAtClient(clientX, clientY) {
  // Use the canvas box (not window) so CSS3D iframe / contain sizing still stamps on the sphere.
  const rect = renderer.domElement.getBoundingClientRect();
  const w = Math.max(1, rect.width);
  const h = Math.max(1, rect.height);
  ptr.x = ((clientX - rect.left) / w) * 2 - 1;
  ptr.y = -((clientY - rect.top) / h) * 2 + 1;
  ray.setFromCamera(ptr, camera);
  const hits = ray.intersectObject(target);
  if (hits.length) stamp(hits[0]);
}
renderer.domElement.style.touchAction = 'none';
renderer.domElement.style.cursor = 'crosshair';
function onStampDown(e) {
  if (eventOnUi(e.target)) return;
  if (e.button === 2) {
    clearDecals();
    return;
  }
  if (e.button !== 0) return;
  ptrDown = { x: e.clientX, y: e.clientY, id: e.pointerId };
}
function onStampUp(e) {
  if (!ptrDown || e.pointerId !== ptrDown.id) return;
  const dx = e.clientX - ptrDown.x;
  const dy = e.clientY - ptrDown.y;
  const moved = dx * dx + dy * dy;
  ptrDown = null;
  if (eventOnUi(e.target)) return;
  if (e.button !== 0) return;
  // Click (not drag) stamps — orbit drag still works via OrbitControls
  if (moved < 36) stampAtClient(e.clientX, e.clientY);
}
// Canvas primary; window fallback for odd iframe compositing paths.
// Guard with _stampBound so canvas+window don't double-stamp one gesture.
renderer.domElement.addEventListener('pointerdown', (e) => { e._decalsStamp = true; onStampDown(e); });
renderer.domElement.addEventListener('pointerup', (e) => { e._decalsStamp = true; onStampUp(e); });
renderer.domElement.addEventListener('pointercancel', () => { ptrDown = null; });
addEventListener('pointerdown', (e) => { if (e._decalsStamp) return; onStampDown(e); });
addEventListener('pointerup', (e) => { if (e._decalsStamp) return; onStampUp(e); });
addEventListener('pointercancel', () => { ptrDown = null; });
addEventListener('contextmenu', e => e.preventDefault());

// Keep WebGL sized inside CSS3D cubicle iframes (resize may not fire on arm)
function fitRenderer() {
  const w = Math.max(1, innerWidth);
  const h = Math.max(1, innerHeight);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h, false);
  renderer.domElement.style.width = '100%';
  renderer.domElement.style.height = '100%';
}
fitRenderer();
if (typeof ResizeObserver !== 'undefined') {
  new ResizeObserver(() => fitRenderer()).observe(document.documentElement);
}

// Silent keyboard cycle (no on-screen language chrome)
addEventListener('keydown', (e) => {
  if (e.key === 'n' || e.key === 'N' || e.key === ']') { nextPhrase(); return; }
  if (e.key === '[') { prevPhrase(); return; }
  if (e.key >= '1' && e.key <= '9') {
    const i = parseInt(e.key, 10) - 1;
    if (i < phrases.length) setPhraseIndex(i);
  }
});

scene.add(new THREE.AmbientLight(0xffffff, 0.5));
const d = new THREE.DirectionalLight(0xffffff, 1.6); d.position.set(3, 4, 2); scene.add(d);
addEventListener('resize', fitRenderer);
(function tick(){ requestAnimationFrame(tick); target.rotation.y += 0.003; controls.update(); renderer.render(scene, camera); })();

</script>
