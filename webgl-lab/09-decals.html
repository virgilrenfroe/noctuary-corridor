<script>

<div class="error" id="err"></div>
<script type="module">

const err = document.getElementById('err');
window.addEventListener('error', e => { err.style.display='block'; err.textContent = e.message || String(e.error||e); });
window.addEventListener('unhandledrejection', e => { err.style.display='block'; err.textContent = String(e.reason); });
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { fitEmbedOrbit } from './embed-fit.js';

function makeRenderer(opts={}) {
  const embed = document.body.classList.contains('embed');
  const r = new THREE.WebGLRenderer({ antialias:true, alpha:embed, premultipliedAlpha:!embed, powerPreference:'high-performance', ...opts });
  r.setPixelRatio(Math.min(devicePixelRatio, 2));
  r.setSize(innerWidth, innerHeight);
  r.outputColorSpace = THREE.SRGBColorSpace;
  r.toneMapping = THREE.ACESFilmicToneMapping;
  r.toneMappingExposure = 1.0;
  if (embed) { r.setClearColor(0x000000, 0); r.setClearAlpha(0); }
  if (embed) {
    r.domElement.style.background = 'transparent';
    r.domElement.style.backgroundColor = 'transparent';
  }
  document.body.prepend(r.domElement);
  return r;
}
function onResize(camera, renderer, composer=null) {
  addEventListener('resize', () => {
    camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
    if (composer) composer.setSize(innerWidth, innerHeight);
  });
}

import { DecalGeometry } from 'three/addons/geometries/DecalGeometry.js';

const renderer = makeRenderer();
const scene = new THREE.Scene();
const __floatClearBg = () => { if (document.body.classList.contains('embed')) scene.background = null; };
scene.background = new THREE.Color(0x101218); __floatClearBg();
const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 100);
camera.position.set(0, 0.5, 4);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

const target = new THREE.Mesh(
  new THREE.SphereGeometry(1, 64, 64),
  new THREE.MeshStandardMaterial({ color:0x3a4258, roughness:0.55, metalness:0.2 })
);
scene.add(target);

// Decals — every two googly eyes, then one kissy lips (eye, eye, lips, …)
const eyes = [
  { pair: false, gaze: [-0.55, 0.12], sclera: 0.74 },
  { pair: false, gaze: [0.62, -0.18], sclera: 0.8 },
  { pair: false, gaze: [0.04, 0.72], sclera: 0.66 },
  { pair: false, gaze: [-0.22, -0.68], sclera: 0.86 },
  { pair: true, gaze: [-0.48, 0.22], sclera: 0.58 },
  { pair: true, gaze: [0.52, -0.16], sclera: 0.62 },
  { pair: true, gaze: [0.06, 0.58], sclera: 0.54 },
  { pair: true, gazeL: [-0.72, 0.08], gazeR: [0.66, -0.1], sclera: 0.6 },
  { pair: false, gaze: [0.38, 0.34], sclera: 0.92 }
];
const lips = [
  { scale: 0.78, color: '#e85a7a', tilt: -0.08, purse: 0.92 },
  { scale: 0.86, color: '#d43d5c', tilt: 0.1, purse: 1.05 },
  { scale: 0.72, color: '#f07890', tilt: 0.04, purse: 0.85 },
  { scale: 0.9, color: '#c92b4a', tilt: -0.14, purse: 1.12 },
  { scale: 0.8, color: '#eb6b88', tilt: 0.16, purse: 0.98 },
  { scale: 0.84, color: '#de4a68', tilt: -0.02, purse: 1.0 }
];
let eyeIndex = 0;
let lipsIndex = 0;
let stampStep = 0; // 0,1 → eye; 2 → lips; repeat

function setEyeIndex(i) {
  if (!eyes.length) return;
  eyeIndex = ((i % eyes.length) + eyes.length) % eyes.length;
}
function nextEye() { setEyeIndex(eyeIndex + 1); }
function prevEye() { setEyeIndex(eyeIndex - 1); }
function nextLips() {
  if (!lips.length) return;
  lipsIndex = (lipsIndex + 1) % lips.length;
}

const eyeTextureCache = new Map();
const lipsTextureCache = new Map();

function drawGooglyEye(ctx, cx, cy, r, gx, gy) {
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.fillStyle = '#f4f1ea';
  ctx.fill();
  ctx.lineWidth = Math.max(3, r * 0.07);
  ctx.strokeStyle = '#12141a';
  ctx.stroke();

  const maxOff = r * 0.42;
  const px = cx + Math.max(-1, Math.min(1, gx)) * maxOff;
  const py = cy + Math.max(-1, Math.min(1, gy)) * maxOff;
  const pr = r * 0.46;
  ctx.beginPath();
  ctx.arc(px, py, pr, 0, Math.PI * 2);
  ctx.fillStyle = '#16181e';
  ctx.fill();

  ctx.beginPath();
  ctx.arc(px - pr * 0.32, py - pr * 0.34, Math.max(2, pr * 0.26), 0, Math.PI * 2);
  ctx.fillStyle = '#ffffff';
  ctx.fill();
}

function drawKissyLips(ctx, cx, cy, w, h, color, purse) {
  const halfW = w * 0.5;
  const halfH = h * 0.5;
  const bow = halfW * 0.22 * purse;
  const tipY = -halfH * 0.55 * purse;
  const midY = -halfH * 0.08;
  const cornerY = halfH * 0.12;
  const lowerY = halfH * 0.72 * purse;

  ctx.save();
  ctx.translate(cx, cy);

  // Full lip silhouette (upper cupid's bow + lower pout)
  ctx.beginPath();
  ctx.moveTo(-halfW, cornerY);
  ctx.bezierCurveTo(-halfW * 0.72, midY - halfH * 0.15, -bow * 1.1, tipY, 0, tipY + halfH * 0.12);
  ctx.bezierCurveTo(bow * 1.1, tipY, halfW * 0.72, midY - halfH * 0.15, halfW, cornerY);
  ctx.bezierCurveTo(halfW * 0.55, lowerY * 0.35, halfW * 0.35, lowerY, 0, lowerY);
  ctx.bezierCurveTo(-halfW * 0.35, lowerY, -halfW * 0.55, lowerY * 0.35, -halfW, cornerY);
  ctx.closePath();
  ctx.fillStyle = color;
  ctx.fill();
  ctx.lineWidth = Math.max(3, w * 0.035);
  ctx.strokeStyle = '#5a1524';
  ctx.stroke();

  // Mouth seam
  ctx.beginPath();
  ctx.moveTo(-halfW * 0.78, cornerY * 0.35);
  ctx.quadraticCurveTo(0, midY + halfH * 0.18 * purse, halfW * 0.78, cornerY * 0.35);
  ctx.lineWidth = Math.max(2, w * 0.028);
  ctx.strokeStyle = 'rgba(90, 21, 36, 0.85)';
  ctx.stroke();

  // Soft highlight on lower lip
  ctx.beginPath();
  ctx.ellipse(0, halfH * 0.28, halfW * 0.28, halfH * 0.16, 0, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(255, 220, 230, 0.45)';
  ctx.fill();

  ctx.restore();
}

function makeEyeTexture(index) {
  const eye = eyes[index];
  if (eyeTextureCache.has(index)) return eyeTextureCache.get(index);
  const size = 512;
  const c = document.createElement('canvas');
  c.width = size; c.height = size;
  const ctx = c.getContext('2d');
  ctx.clearRect(0, 0, size, size);
  const base = size * (eye.sclera || 0.7) * 0.42;
  if (eye.pair) {
    const gap = base * 1.15;
    const r = base * 0.72;
    const gL = eye.gazeL || eye.gaze;
    const gR = eye.gazeR || eye.gaze;
    drawGooglyEye(ctx, size / 2 - gap, size / 2, r, gL[0], gL[1]);
    drawGooglyEye(ctx, size / 2 + gap, size / 2, r, gR[0], gR[1]);
  } else {
    drawGooglyEye(ctx, size / 2, size / 2, base, eye.gaze[0], eye.gaze[1]);
  }
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.needsUpdate = true;
  eyeTextureCache.set(index, tex);
  return tex;
}

function makeLipsTexture(index) {
  const lip = lips[index];
  if (lipsTextureCache.has(index)) return lipsTextureCache.get(index);
  const size = 512;
  const c = document.createElement('canvas');
  c.width = size; c.height = size;
  const ctx = c.getContext('2d');
  ctx.clearRect(0, 0, size, size);
  const s = lip.scale || 0.8;
  const w = size * 0.55 * s;
  const h = size * 0.38 * s;
  ctx.save();
  ctx.translate(size / 2, size / 2);
  ctx.rotate(lip.tilt || 0);
  drawKissyLips(ctx, 0, 0, w, h, lip.color || '#e85a7a', lip.purse || 1);
  ctx.restore();
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.needsUpdate = true;
  lipsTextureCache.set(index, tex);
  return tex;
}

const decals = [];
const decalMatBase = {
  color: 0xffffff,
  transparent: true,
  depthTest: true,
  depthWrite: false,
  polygonOffset: true,
  polygonOffsetFactor: -4,
  opacity: 1,
  roughness: 0.65,
  metalness: 0.05,
  map: null
};

const ray = new THREE.Raycaster();
const ptr = new THREE.Vector2();
const mouseHelper = new THREE.Object3D();

function stamp(intersect) {
  const useLips = (stampStep % 3) === 2;
  let map;
  let size;
  if (useLips) {
    map = makeLipsTexture(lipsIndex);
    size = 0.48 + (lips[lipsIndex].scale || 0.8) * 0.28 + Math.random() * 0.08;
    nextLips();
  } else {
    map = makeEyeTexture(eyeIndex);
    size = 0.48 + (eyes[eyeIndex].sclera || 0.7) * 0.28 + Math.random() * 0.08;
    nextEye();
  }
  stampStep += 1;
  const n = intersect.face.normal.clone();
  n.transformDirection(target.matrixWorld);
  n.multiplyScalar(10); n.add(intersect.point);
  mouseHelper.position.copy(intersect.point);
  mouseHelper.lookAt(n);
  const mat = new THREE.MeshStandardMaterial({
    ...decalMatBase,
    map
  });
  const m = new THREE.Mesh(
    new DecalGeometry(target, intersect.point, mouseHelper.rotation, new THREE.Vector3(size, size, size * 0.28)),
    mat
  );
  scene.add(m); decals.push(m);
}

function clearDecals() {
  decals.forEach(d => {
    scene.remove(d);
    d.geometry.dispose();
    if (d.material) d.material.dispose();
  });
  decals.length = 0;
}

let ptrDown = null;
function eventOnUi(t) {
  return t && t.closest && (t.closest('.brand') || t.closest('.pill'));
}
function stampAtClient(clientX, clientY) {
  // Use the canvas box (not window) so CSS3D iframe / contain sizing still stamps on the sphere.
  const rect = renderer.domElement.getBoundingClientRect();
  const w = Math.max(1, rect.width);
  const h = Math.max(1, rect.height);
  ptr.x = ((clientX - rect.left) / w) * 2 - 1;
  ptr.y = -((clientY - rect.top) / h) * 2 + 1;
  ray.setFromCamera(ptr, camera);
  const hits = ray.intersectObject(target);
  if (hits.length) stamp(hits[0]);
}
renderer.domElement.style.touchAction = 'none';
renderer.domElement.style.cursor = 'crosshair';
function onStampDown(e) {
  if (eventOnUi(e.target)) return;
  if (e.button === 2) {
    clearDecals();
    return;
  }
  if (e.button !== 0) return;
  ptrDown = { x: e.clientX, y: e.clientY, id: e.pointerId };
}
function onStampUp(e) {
  if (!ptrDown || e.pointerId !== ptrDown.id) return;
  const dx = e.clientX - ptrDown.x;
  const dy = e.clientY - ptrDown.y;
  const moved = dx * dx + dy * dy;
  ptrDown = null;
  if (eventOnUi(e.target)) return;
  if (e.button !== 0) return;
  // Click (not drag) stamps — orbit drag still works via OrbitControls
  if (moved < 36) stampAtClient(e.clientX, e.clientY);
}
// Canvas primary; window fallback for odd iframe compositing paths.
// Guard with _stampBound so canvas+window don't double-stamp one gesture.
renderer.domElement.addEventListener('pointerdown', (e) => { e._decalsStamp = true; onStampDown(e); });
renderer.domElement.addEventListener('pointerup', (e) => { e._decalsStamp = true; onStampUp(e); });
renderer.domElement.addEventListener('pointercancel', () => { ptrDown = null; });
addEventListener('pointerdown', (e) => { if (e._decalsStamp) return; onStampDown(e); });
addEventListener('pointerup', (e) => { if (e._decalsStamp) return; onStampUp(e); });
addEventListener('pointercancel', () => { ptrDown = null; });
addEventListener('contextmenu', e => e.preventDefault());

// Keep WebGL sized inside CSS3D cubicle iframes (resize may not fire on arm)
function fitRenderer() {
  const w = Math.max(1, innerWidth);
  const h = Math.max(1, innerHeight);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h, false);
  renderer.domElement.style.width = '100%';
  renderer.domElement.style.height = '100%';
}
fitRenderer();
if (typeof ResizeObserver !== 'undefined') {
  new ResizeObserver(() => fitRenderer()).observe(document.documentElement);
}

// Silent keyboard cycle (no on-screen language chrome)
addEventListener('keydown', (e) => {
  if (e.key === 'n' || e.key === 'N' || e.key === ']') { nextEye(); return; }
  if (e.key === '[') { prevEye(); return; }
  if (e.key >= '1' && e.key <= '9') {
    const i = parseInt(e.key, 10) - 1;
    if (i < eyes.length) setEyeIndex(i);
  }
});

scene.add(new THREE.AmbientLight(0xffffff, 0.5));
const d = new THREE.DirectionalLight(0xffffff, 1.6); d.position.set(3, 4, 2); scene.add(d);
addEventListener('resize', fitRenderer);
if (document.body.classList.contains('embed') && !document.body.classList.contains('wall')) fitEmbedOrbit(camera, controls, scene);
(function tick(){ requestAnimationFrame(tick); target.rotation.y += 0.003; controls.update(); renderer.render(scene, camera); })();

</script>
