<!DOCTYPE html>

<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>07 · Outline / selection pass · WebGL Lab</title>
<style>
:root { --ink:#0a0b10; --paper:#e8e2d6; --mute:rgba(232,226,214,.55); --accent:#f0c24b; --line:rgba(232,226,214,.16); }
*{box-sizing:border-box} html,body{margin:0;height:100%;background:var(--ink);color:var(--paper);font:13px/1.45 "IBM Plex Sans",system-ui,sans-serif;overflow:hidden}
canvas{display:block;width:100%;height:100%}
.hud{position:fixed;inset:0;pointer-events:none;z-index:2}
.top{position:absolute;top:14px;left:14px;right:14px;display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.brand,.pill{pointer-events:auto;border:1px solid var(--line);background:rgba(10,11,16,.55);backdrop-filter:blur(10px);border-radius:999px;padding:8px 12px;color:var(--paper);text-decoration:none;font-size:11px;letter-spacing:.14em;text-transform:uppercase}
.brand a{color:inherit;text-decoration:none}
.note{position:absolute;bottom:14px;left:14px;right:14px;max-width:520px;color:var(--mute);font-size:12px;background:rgba(10,11,16,.45);border:1px solid var(--line);border-radius:12px;padding:10px 12px;backdrop-filter:blur(8px)}
.note b{color:var(--accent);font-weight:600}
.error{position:fixed;inset:auto 14px 14px 14px;background:#3a1212;color:#ffd6d6;padding:12px 14px;border-radius:10px;z-index:9;display:none;white-space:pre-wrap}
body.embed .hud{display:none!important} body.embed .error{display:none!important}
body.embed,body.embed html{background:transparent!important} body.embed canvas{background:transparent!important}
</style>

<script type="importmap">{"imports":{"three":"../vendor/three/build/three.module.js","three/addons/":"../vendor/three/examples/jsm/"}}</script>
</head>
<body>
<script>
(function(){const q=new URLSearchParams(location.search);if(q.has('embed')||q.has('still')){document.body.classList.add('embed');document.documentElement.classList.add('embed');document.documentElement.style.background='transparent';document.body.style.background='transparent';}})();
</script>

<div class="hud">
  <div class="top">
    <div class="brand"><a href="./INDEX.html">← WebGL Lab</a> · 07 Outline / selection pass</div>
    <div class="pill">three@0.170.0 local</div>
  </div>
  <div class="note"><b>Outline / selection pass.</b> Click any mesh to select it — OutlinePass draws a glowing edge. Empty click clears.</div>
</div>
<div class="error" id="err"></div>
<script type="module">

const err = document.getElementById('err');
window.addEventListener('error', e => { err.style.display='block'; err.textContent = e.message || String(e.error||e); });
window.addEventListener('unhandledrejection', e => { err.style.display='block'; err.textContent = String(e.reason); });
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

function makeRenderer(opts={}) {
  const embed = document.body.classList.contains('embed');
  const r = new THREE.WebGLRenderer({ antialias:true, alpha:embed, premultipliedAlpha:true, powerPreference:'high-performance', ...opts });
  r.setPixelRatio(Math.min(devicePixelRatio, 2));
  r.setSize(innerWidth, innerHeight);
  r.outputColorSpace = THREE.SRGBColorSpace;
  r.toneMapping = THREE.ACESFilmicToneMapping;
  r.toneMappingExposure = 1.0;
  if (embed) { r.setClearColor(0x000000, 0); r.setClearAlpha(0); }
  document.body.prepend(r.domElement);
  return r;
}
function onResize(camera, renderer, composer=null) {
  addEventListener('resize', () => {
    camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
    if (composer) composer.setSize(innerWidth, innerHeight);
  });
}

import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { OutlinePass } from 'three/addons/postprocessing/OutlinePass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { GammaCorrectionShader } from 'three/addons/shaders/GammaCorrectionShader.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';

const renderer = makeRenderer();
const scene = new THREE.Scene();
const __floatClearBg = () => { if (document.body.classList.contains('embed')) scene.background = null; };
scene.background = new THREE.Color(0x12141c); __floatClearBg();
const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 100);
camera.position.set(0, 2, 6);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

const __embed = document.body.classList.contains('embed');
const selectable = [];
const colors = [0xf0c24b, 0x8a7bb8, 0x5ec8c0, 0xe07060, 0xffffff];
// Embed/CSS3D iframe (~square) frustum-crops a wide 5-object row. Pack tighter + pull
// camera so leftmost cube and rightmost DodecahedronGeometry stay fully inside (no hard rect).
// Embed/CSS3D iframe is near-square — prior gap/cam still clipped the rightmost dodecahedron.
const __gap = __embed ? 0.72 : 1.3;
const __geoms = __embed
  ? [new THREE.BoxGeometry(0.62,0.62,0.62), new THREE.SphereGeometry(0.36,32,32), new THREE.ConeGeometry(0.32,0.72,24),
     new THREE.TorusGeometry(0.28,0.11,16,48), new THREE.DodecahedronGeometry(0.34)]
  : [new THREE.BoxGeometry(0.8,0.8,0.8), new THREE.SphereGeometry(0.5,32,32), new THREE.ConeGeometry(0.45,1,24),
     new THREE.TorusGeometry(0.4,0.15,16,48), new THREE.DodecahedronGeometry(0.5)];
for (let i=0;i<5;i++) {
  const m = new THREE.Mesh(
    __geoms[i],
    new THREE.MeshStandardMaterial({ color: colors[i], roughness:0.4, metalness:0.2 })
  );
  m.position.set((i-2)*__gap, 0.5, 0); scene.add(m); selectable.push(m);
}
if (__embed) {
  // Fit full row with margin: pull back + narrow FOV so cube…dodecahedron stay inside frustum.
  camera.position.set(0, 1.05, 11.8);
  camera.fov = 32;
  camera.updateProjectionMatrix();
  controls.target.set(0, 0.5, 0);
  controls.enableDamping = false;
  controls.update();
  // Hard fit: if aspect is narrow, nudge further back
  const halfW = 2 * __gap + 0.4; // outer centers + radius pad
  const vFov = THREE.MathUtils.degToRad(camera.fov);
  const hFov = 2 * Math.atan(Math.tan(vFov / 2) * camera.aspect);
  const needZ = (halfW / Math.tan(hFov / 2)) * 1.18;
  if (needZ > camera.position.z) {
    camera.position.z = needZ;
    controls.update();
  }
  window.__outlineEmbed = { gap: __gap, cam: camera.position.toArray(), fov: camera.fov, aspect: camera.aspect, needZ };
}
const fl = new THREE.Mesh(new THREE.PlaneGeometry(14,14), new THREE.MeshStandardMaterial({color:0x1a1e2a, roughness:0.9}));
fl.rotation.x=-Math.PI/2; scene.add(fl);
if (document.body.classList.contains('embed')) fl.visible = false;
scene.add(new THREE.AmbientLight(0xffffff,0.5));
const d = new THREE.DirectionalLight(0xffffff,1.8); d.position.set(3,6,4); scene.add(d);

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const outline = new OutlinePass(new THREE.Vector2(innerWidth, innerHeight), scene, camera);
outline.edgeStrength = 4; outline.edgeGlow = 0.6; outline.edgeThickness = 2;
outline.visibleEdgeColor.set(0xf0c24b); outline.hiddenEdgeColor.set(0x553300);
composer.addPass(outline);
composer.addPass(new OutputPass());

const ray = new THREE.Raycaster();
const ptr = new THREE.Vector2();
addEventListener('pointerdown', (e) => {
  ptr.x = (e.clientX/innerWidth)*2-1; ptr.y = -(e.clientY/innerHeight)*2+1;
  ray.setFromCamera(ptr, camera);
  const hits = ray.intersectObjects(selectable);
  outline.selectedObjects = hits.length ? [hits[0].object] : [];
});

onResize(camera, renderer, __embed ? null : composer);
(function tick(){
  requestAnimationFrame(tick);
  controls.update();
  // Embed/objects-only: skip OutlinePass composer — on some mobile GPUs it fills an opaque plate.
  if (__embed) renderer.render(scene, camera);
  else composer.render();
})();

</script>
</body>
</html>
