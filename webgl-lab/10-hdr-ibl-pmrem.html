<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>10 · HDR IBL / PMREM · WebGL Lab</title>
<style>
:root { --ink:#0a0b10; --paper:#e8e2d6; --mute:rgba(232,226,214,.55); --accent:#f0c24b; --line:rgba(232,226,214,.16); }
*{box-sizing:border-box} html,body{margin:0;height:100%;background:var(--ink);color:var(--paper);font:13px/1.45 "IBM Plex Sans",system-ui,sans-serif;overflow:hidden}
canvas{display:block;width:100%;height:100%}
.hud{position:fixed;inset:0;pointer-events:none;z-index:2}
.top{position:absolute;top:14px;left:14px;right:14px;display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.brand,.pill{pointer-events:auto;border:1px solid var(--line);background:rgba(10,11,16,.55);backdrop-filter:blur(10px);border-radius:999px;padding:8px 12px;color:var(--paper);text-decoration:none;font-size:11px;letter-spacing:.14em;text-transform:uppercase}
.brand a{color:inherit;text-decoration:none}
.note{position:absolute;bottom:14px;left:14px;right:14px;max-width:520px;color:var(--mute);font-size:12px;background:rgba(10,11,16,.45);border:1px solid var(--line);border-radius:12px;padding:10px 12px;backdrop-filter:blur(8px)}
.note b{color:var(--accent);font-weight:600}
.error{position:fixed;inset:auto 14px 14px 14px;background:#3a1212;color:#ffd6d6;padding:12px 14px;border-radius:10px;z-index:9;display:none;white-space:pre-wrap}
body.embed .hud{display:none!important} body.embed .error{display:none!important}
/* Float embed: transparent. Wall embed (?wall=1): keep opaque env/dark stage. */
html.embed:not(.wall),body.embed:not(.wall){background:transparent!important}
body.embed:not(.wall) canvas{background:transparent!important;background-color:transparent!important}
/* Wall: Taxodium purple bark stage — never Venice-sunset beige plate. */
html.embed.wall,body.embed.wall{background:#140818!important}
body.embed.wall canvas{background:#140818!important;background-color:#140818!important}
body.embed.wall{--ink:#140818;--paper:#ffe8c8;--mute:rgba(255,200,140,.55);--accent:#ff9a28;--line:rgba(200,120,255,.22)}
</style>

<script type="importmap">{"imports":{"three":"../vendor/three/build/three.module.js","three/addons/":"../vendor/three/examples/jsm/"}}</script>
</head>
<body>
<script>
(function(){const q=new URLSearchParams(location.search);const emb=q.has('embed')||q.has('still');const wall=q.has('wall')||q.get('opaque')==='1';if(emb){document.body.classList.add('embed');document.documentElement.classList.add('embed');if(wall){document.body.classList.add('wall');document.documentElement.classList.add('wall');}else{document.documentElement.style.background='transparent';document.body.style.background='transparent';}}})();
</script>

<div class="hud">
  <div class="top">
    <div class="brand"><a href="./INDEX.html">← WebGL Lab</a> · 10 HDR IBL / PMREM</div>
    <div class="pill">three@0.170.0 local</div>
  </div>
  <div class="note"><b>HDR IBL / PMREM.</b> RGBELoader + PMREMGenerator. Orbit a chrome knot under Venice Sunset HDR.</div>
</div>
<div class="error" id="err"></div>
<script type="module">

const err = document.getElementById('err');
window.addEventListener('error', e => { err.style.display='block'; err.textContent = e.message || String(e.error||e); });
window.addEventListener('unhandledrejection', e => { err.style.display='block'; err.textContent = String(e.reason); });
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

function makeRenderer(opts={}) {
  const embed = document.body.classList.contains('embed');
  const wall = document.body.classList.contains('wall');
  const alpha = embed && !wall;
  const r = new THREE.WebGLRenderer({ antialias:true, alpha, premultipliedAlpha:!alpha, powerPreference:'high-performance', ...opts });
  r.setPixelRatio(Math.min(devicePixelRatio, 2));
  r.setSize(innerWidth, innerHeight);
  r.outputColorSpace = THREE.SRGBColorSpace;
  r.toneMapping = THREE.ACESFilmicToneMapping;
  r.toneMappingExposure = 1.0;
  if (alpha) {
    r.setClearColor(0x000000, 0); r.setClearAlpha(0);
    r.domElement.style.background = 'transparent';
    r.domElement.style.backgroundColor = 'transparent';
  }
  document.body.prepend(r.domElement);
  return r;
}
function onResize(camera, renderer, composer=null) {
  addEventListener('resize', () => {
    camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
    if (composer) composer.setSize(innerWidth, innerHeight);
  });
}

import { RGBELoader } from 'three/addons/loaders/RGBELoader.js';

const renderer = makeRenderer();
renderer.toneMappingExposure = 1.25;
const scene = new THREE.Scene();
const __wall = document.body.classList.contains('wall');
const __floatClearBg = () => { if (document.body.classList.contains('embed') && !__wall) scene.background = null; };
const __embed = document.body.classList.contains('embed');
const camera = new THREE.PerspectiveCamera((__embed && !__wall) ? 36 : (__wall ? 40 : 45), innerWidth/innerHeight, 0.1, 100);
// Float embed: pull back for square CSS3D. Wall embed: keep env background, slightly wider FOV.
camera.position.set(0, (__embed && !__wall) ? 0.55 : (__wall ? 0.35 : 1), (__embed && !__wall) ? 6.4 : (__wall ? 5.2 : 4));
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
if (__embed) { controls.target.set(0, 0, 0); controls.enableDamping = false; controls.update(); }

const pmrem = new THREE.PMREMGenerator(renderer);
pmrem.compileEquirectangularShader();

const mats = {
  chrome: new THREE.MeshStandardMaterial({ color:0xffffff, metalness:1, roughness:0.05 }),
  gold: new THREE.MeshStandardMaterial({ color:0xf0c24b, metalness:1, roughness:0.18 }),
  dielectric: new THREE.MeshStandardMaterial({ color:0x8a7bb8, metalness:0.0, roughness:0.25 }),
};
const __knotR = (__embed && !__wall) ? 0.48 : (__wall ? 0.55 : 0.6);
const __knotT = (__embed && !__wall) ? 0.17 : (__wall ? 0.2 : 0.22);
const __sphR = (__embed && !__wall) ? 0.32 : (__wall ? 0.36 : 0.4);
const __gap = (__embed && !__wall) ? 1.05 : (__wall ? 1.2 : 1.4);
const chrome = new THREE.Mesh(new THREE.TorusKnotGeometry(__knotR,__knotT,180,32), mats.chrome); scene.add(chrome);
const gold = new THREE.Mesh(new THREE.SphereGeometry(__sphR,64,64), mats.gold); gold.position.set(-__gap,0,0); scene.add(gold);
const diel = new THREE.Mesh(new THREE.SphereGeometry(__sphR,64,64), mats.dielectric); diel.position.set(__gap,0,0); scene.add(diel);
if (__embed) {
  // Hard frustum fit: outer sphere centers + radius must stay inside horizontal FOV with ~18% pad.
  const halfW = __gap + __sphR;
  const vFov = THREE.MathUtils.degToRad(camera.fov);
  const hFov = 2 * Math.atan(Math.tan(vFov / 2) * camera.aspect);
  const needZ = (halfW / Math.tan(hFov / 2)) * (__wall ? 1.12 : 1.22);
  if (needZ > camera.position.z) camera.position.z = needZ;
  controls.update();
}

// Wall mode: Taxodium palette — glossy purple bark + orange/cream leaf metals.
// Keep HDR for reflections only; NEVER use Venice Sunset as the visible plate (beige SaaS).
if (__wall) {
  renderer.setClearColor(0x140818, 1);
  scene.background = new THREE.Color(0x140818);
  mats.chrome.color.setHex(0xe8eef6);
  mats.chrome.roughness = 0.06;
  mats.gold.color.setHex(0xffb020); // orange leaf
  mats.gold.roughness = 0.22;
  mats.dielectric.color.setHex(0x8a40c8); // purple bark glass
  mats.dielectric.metalness = 0.15;
  mats.dielectric.roughness = 0.18;
  scene.add(new THREE.AmbientLight(0x8030a8, 0.35));
  scene.add(new THREE.DirectionalLight(0xffc060, 1.2).translateX(2).translateY(3).translateZ(2));
  scene.add(new THREE.PointLight(0xff8c30, 14, 8).translateX(-1.2).translateY(0.6).translateZ(1.5));
}
new RGBELoader().load(
  'https://threejs.org/examples/textures/equirectangular/venice_sunset_1k.hdr',
  (tex) => {
    const env = pmrem.fromEquirectangular(tex).texture;
    scene.environment = env;
    if (__wall) {
      // Reflections only — opaque Taxodium purple plate, not beige sunset wash
      scene.background = new THREE.Color(0x140818);
      scene.backgroundBlurriness = 0;
      renderer.toneMappingExposure = 1.15;
    } else {
      scene.background = env;
      __floatClearBg();
      scene.backgroundBlurriness = 0.05;
    }
    tex.dispose(); pmrem.dispose();
  },
  undefined,
  (e) => {
    if (err) { err.style.display='block'; err.textContent='HDR load failed: '+e; }
    if (__wall) scene.background = new THREE.Color(0x140818);
  }
);

onResize(camera, renderer);
(function tick(){ requestAnimationFrame(tick); chrome.rotation.y+=0.008; controls.update(); renderer.render(scene,camera); })();

</script>
</body>
</html>
