<body>

<div class="hud">

  </div>
  <div class="note"><b>Scroll / path-driven camera dolly.</b> Scroll the page to dolly the camera along a CatmullRom path through floating props. Wheel / trackpad.</div>
</div>
<div class="error" id="err"></div>
<script type="module">

const err = document.getElementById('err');
window.addEventListener('error', e => { err.style.display='block'; err.textContent = e.message || String(e.error||e); });
window.addEventListener('unhandledrejection', e => { err.style.display='block'; err.textContent = String(e.reason); });
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

function makeRenderer(opts={}) {
  const r = new THREE.WebGLRenderer({ antialias:true, alpha:false, powerPreference:'high-performance', ...opts });
  r.setPixelRatio(Math.min(devicePixelRatio, 2));
  r.setSize(innerWidth, innerHeight);
  r.outputColorSpace = THREE.SRGBColorSpace;
  r.toneMapping = THREE.ACESFilmicToneMapping;
  r.toneMappingExposure = 1.0;
  document.body.prepend(r.domElement);
  return r;
}
function onResize(camera, renderer, composer=null) {
  addEventListener('resize', () => {
    camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
    if (composer) composer.setSize(innerWidth, innerHeight);
  });
}

const renderer = makeRenderer();
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b0d14);
scene.fog = new THREE.Fog(0x0b0d14, 8, 40);
const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 100);

// Path
const curve = new THREE.CatmullRomCurve3([
  new THREE.Vector3(0, 1.2, 10),
  new THREE.Vector3(3, 1.8, 5),
  new THREE.Vector3(0, 1.0, 0),
  new THREE.Vector3(-3, 2.2, -4),
  new THREE.Vector3(1, 1.4, -9),
  new THREE.Vector3(0, 1.6, -14),
]);
const pathGeo = new THREE.TubeGeometry(curve, 120, 0.03, 6, false);
scene.add(new THREE.Mesh(pathGeo, new THREE.MeshBasicMaterial({color:0xf0c24b, transparent:true, opacity:0.35})));

const mats = [0xf0c24b, 0x8a7bb8, 0x5ec8c0, 0xe07060, 0xffffff];
for (let i=0;i<24;i++) {
  const t = i/24;
  const p = curve.getPointAt(t);
  const m = new THREE.Mesh(
    i%3===0 ? new THREE.BoxGeometry(0.6,0.6,0.6) : i%3===1 ? new THREE.SphereGeometry(0.35,24,24) : new THREE.TetrahedronGeometry(0.45),
    new THREE.MeshStandardMaterial({ color: mats[i%mats.length], roughness:0.4, metalness:0.25 })
  );
  m.position.copy(p).add(new THREE.Vector3((i%2?1:-1)*1.2, Math.sin(i)*0.4, 0));
  scene.add(m);
}
const ground = new THREE.GridHelper(40, 40, 0x333850, 0x1a1e2a); scene.add(ground);
scene.add(new THREE.AmbientLight(0xffffff,0.45));
const d = new THREE.DirectionalLight(0xffffff,1.6); d.position.set(4,8,2); scene.add(d);

// Scrollable spacer
const spacer = document.createElement('div');
spacer.style.cssText = 'position:fixed;inset:0;overflow:auto;pointer-events:auto;z-index:1;';
spacer.innerHTML = '<div style="height:400vh"></div>';
document.body.appendChild(spacer);
// keep canvas above for visuals but let spacer receive scroll — actually put canvas pointer-events none
renderer.domElement.style.pointerEvents = 'none';
renderer.domElement.style.position = 'fixed';
renderer.domElement.style.inset = '0';
renderer.domElement.style.zIndex = '0';

let progress = 0;
spacer.addEventListener('scroll', () => {
  const max = spacer.scrollHeight - spacer.clientHeight;
  progress = max > 0 ? spacer.scrollTop / max : 0;
}, { passive:true });

onResize(camera, renderer);
const look = new THREE.Vector3();
(function tick(){
  requestAnimationFrame(tick);
  const t = THREE.MathUtils.clamp(progress, 0, 1);
  const pos = curve.getPointAt(t);
  const lookT = Math.min(t + 0.02, 1);
  look.copy(curve.getPointAt(lookT));
  camera.position.lerp(pos, 0.15);
  camera.lookAt(look);
  renderer.render(scene, camera);
})();

</script>
</body>
