<style>
:root { --ink:#0a0b10; --paper:#e8e2d6; --mute:rgba(232,226,214,.55); --accent:#f0c24b; --line:rgba(232,226,214,.16); }
*{box-sizing:border-box} html,body{margin:0;height:100%;background:var(--ink);color:var(--paper);font:13px/1.45 "IBM Plex Sans",system-ui,sans-serif;overflow:hidden}
canvas{display:block;width:100%;height:100%}

body.embed .hud{display:none!important} body.embed .error{display:none!important}
body.embed,body.embed html{background:transparent!important} body.embed canvas{background:transparent!important}

<body>
<script>
(function(){const q=new URLSearchParams(location.search);if(q.has('embed')||q.has('still')){document.body.classList.add('embed');document.documentElement.classList.add('embed');document.documentElement.style.background='transparent';document.body.style.background='transparent';}})();

<div class="hud">
  <div class="top">
    <div class="brand"><a href="./INDEX.html">← WebGL Lab</a> · 14 GPU InstancedMesh</div>
    <div class="pill">three@0.170.0 local</div>
  </div>
  <div class="note"><b>GPU InstancedMesh.</b> 4000 instanced boxes with per-instance color + matrix. One draw call — orbit to appreciate density.</div>
</div>
<div class="error" id="err"></div>
<script type="module">

const err = document.getElementById('err');
window.addEventListener('error', e => { err.style.display='block'; err.textContent = e.message || String(e.error||e); });
window.addEventListener('unhandledrejection', e => { err.style.display='block'; err.textContent = String(e.reason); });
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

function makeRenderer(opts={}) {
  const embed = document.body.classList.contains('embed');
  const r = new THREE.WebGLRenderer({ antialias:true, alpha:embed, premultipliedAlpha:true, powerPreference:'high-performance', ...opts });
  r.setPixelRatio(Math.min(devicePixelRatio, 2));
  r.setSize(innerWidth, innerHeight);
  r.outputColorSpace = THREE.SRGBColorSpace;
  r.toneMapping = THREE.ACESFilmicToneMapping;
  r.toneMappingExposure = 1.0;
  if (embed) { r.setClearColor(0x000000, 0); r.setClearAlpha(0); }
  document.body.prepend(r.domElement);
  return r;
}
function onResize(camera, renderer, composer=null) {
  addEventListener('resize', () => {
    camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
    if (composer) composer.setSize(innerWidth, innerHeight);
  });
}

const renderer = makeRenderer();
const scene = new THREE.Scene();
const __floatClearBg = () => { if (document.body.classList.contains('embed')) scene.background = null; };
scene.background = new THREE.Color(0x08090e); __floatClearBg();
const __embed = document.body.classList.contains('embed');
if (!__embed) scene.fog = new THREE.Fog(0x08090e, 20, 80);
const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 200);
camera.position.set(__embed ? 14 : 18, __embed ? 11 : 14, __embed ? 16 : 22);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
if (__embed) { controls.target.set(0, 4, 0); controls.update(); }

const COUNT = 4000;
const geo = new THREE.BoxGeometry(0.4, 0.4, 0.4);
const mat = new THREE.MeshStandardMaterial({ roughness:0.4, metalness:0.3 });
const mesh = new THREE.InstancedMesh(geo, mat, COUNT);
mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);

const dummy = new THREE.Object3D();
const color = new THREE.Color();
for (let i=0;i<COUNT;i++) {
  dummy.position.set((Math.random()-0.5)*40, Math.random()*12, (Math.random()-0.5)*40);
  dummy.rotation.set(Math.random()*Math.PI, Math.random()*Math.PI, 0);
  const s = 0.4 + Math.random()*1.6; dummy.scale.setScalar(s);
  dummy.updateMatrix(); mesh.setMatrixAt(i, dummy.matrix);
  color.setHSL(0.08 + Math.random()*0.15, 0.7, 0.45 + Math.random()*0.25);
  mesh.setColorAt(i, color);
}
scene.add(mesh);
scene.add(new THREE.AmbientLight(0x445566, 0.6));
const d = new THREE.DirectionalLight(0xffe0b0, 2); d.position.set(10,20,8); scene.add(d);

onResize(camera, renderer);
(function tick(){
  requestAnimationFrame(tick);
  const t = performance.now()*0.001;
  for (let i=0;i<COUNT;i+=7) {
    mesh.getMatrixAt(i, dummy.matrix); dummy.matrix.decompose(dummy.position, dummy.quaternion, dummy.scale);
    dummy.rotation.y += 0.02; dummy.position.y += Math.sin(t + i)*0.01;
    dummy.updateMatrix(); mesh.setMatrixAt(i, dummy.matrix);
  }
  mesh.instanceMatrix.needsUpdate = true;
  controls.update(); renderer.render(scene, camera);
})();

</script>
