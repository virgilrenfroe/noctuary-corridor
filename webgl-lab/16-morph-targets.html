<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>16 · Morph targets / blend shapes · WebGL Lab</title>
<style>
:root { --ink:#0a0b10; --paper:#e8e2d6; --mute:rgba(232,226,214,.55); --accent:#f0c24b; --line:rgba(232,226,214,.16); }
*{box-sizing:border-box} html,body{margin:0;height:100%;background:var(--ink);color:var(--paper);font:13px/1.45 "IBM Plex Sans",system-ui,sans-serif;overflow:hidden}
canvas{display:block;width:100%;height:100%}
.hud{position:fixed;inset:0;pointer-events:none;z-index:2}
.top{position:absolute;top:14px;left:14px;right:14px;display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.brand,.pill{pointer-events:auto;border:1px solid var(--line);background:rgba(10,11,16,.55);backdrop-filter:blur(10px);border-radius:999px;padding:8px 12px;color:var(--paper);text-decoration:none;font-size:11px;letter-spacing:.14em;text-transform:uppercase}
.brand a{color:inherit;text-decoration:none}
.note{position:absolute;bottom:14px;left:14px;right:14px;max-width:520px;color:var(--mute);font-size:12px;background:rgba(10,11,16,.45);border:1px solid var(--line);border-radius:12px;padding:10px 12px;backdrop-filter:blur(8px)}
.note b{color:var(--accent);font-weight:600}
.error{position:fixed;inset:auto 14px 14px 14px;background:#3a1212;color:#ffd6d6;padding:12px 14px;border-radius:10px;z-index:9;display:none;white-space:pre-wrap}
body.embed .hud{display:none!important} body.embed .error{display:none!important}
html.embed,body.embed{background:transparent!important} body.embed canvas{background:transparent!important;background-color:transparent!important}
</style>

<script type="importmap">{"imports":{"three":"../vendor/three/build/three.module.js","three/addons/":"../vendor/three/examples/jsm/"}}</script>
</head>
<body>
<script>
(function(){const q=new URLSearchParams(location.search);if(q.has('embed')||q.has('still')){document.body.classList.add('embed');document.documentElement.classList.add('embed');document.documentElement.style.background='transparent';document.body.style.background='transparent';}})();
</script>

<div class="hud">
  <div class="top">
    <div class="brand"><a href="./INDEX.html">← WebGL Lab</a> · 16 Morph targets / blend shapes</div>
    <div class="pill">three@0.170.0 local</div>
  </div>
  <div class="note"><b>Morph targets / blend shapes.</b> Procedural sphere with two morph targets (spike + squash). Sliders drive blend weights.</div>
</div>
<div class="error" id="err"></div>
<script type="module">

const err = document.getElementById('err');
window.addEventListener('error', e => { err.style.display='block'; err.textContent = e.message || String(e.error||e); });
window.addEventListener('unhandledrejection', e => { err.style.display='block'; err.textContent = String(e.reason); });
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { fitEmbedOrbit } from './embed-fit.js';

function makeRenderer(opts={}) {
  const embed = document.body.classList.contains('embed');
  const r = new THREE.WebGLRenderer({ antialias:true, alpha:embed, premultipliedAlpha:!embed, powerPreference:'high-performance', ...opts });
  r.setPixelRatio(Math.min(devicePixelRatio, 2));
  r.setSize(innerWidth, innerHeight);
  r.outputColorSpace = THREE.SRGBColorSpace;
  r.toneMapping = THREE.ACESFilmicToneMapping;
  r.toneMappingExposure = 1.0;
  if (embed) { r.setClearColor(0x000000, 0); r.setClearAlpha(0); }
  if (embed) {
    r.domElement.style.background = 'transparent';
    r.domElement.style.backgroundColor = 'transparent';
  }
  document.body.prepend(r.domElement);
  return r;
}
function onResize(camera, renderer, composer=null) {
  addEventListener('resize', () => {
    camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
    if (composer) composer.setSize(innerWidth, innerHeight);
  });
}

const renderer = makeRenderer();
const scene = new THREE.Scene();
const __floatClearBg = () => { if (document.body.classList.contains('embed')) scene.background = null; };
scene.background = new THREE.Color(0x12141c); __floatClearBg();
const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 100);
camera.position.set(0, 0.5, 3.2);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

const base = new THREE.SphereGeometry(0.8, 64, 64);
const pos = base.attributes.position;
const spike = new Float32Array(pos.count * 3);
const squash = new Float32Array(pos.count * 3);
const v = new THREE.Vector3();
for (let i=0;i<pos.count;i++) {
  v.fromBufferAttribute(pos, i);
  // spike: push along normal by noise
  const n = v.clone().normalize();
  const bump = 0.35 * Math.abs(Math.sin(n.x*8) * Math.cos(n.y*6) * Math.sin(n.z*7));
  const s = n.multiplyScalar(0.8 + bump);
  spike[i*3]=s.x; spike[i*3+1]=s.y; spike[i*3+2]=s.z;
  // squash
  squash[i*3]=v.x*1.35; squash[i*3+1]=v.y*0.55; squash[i*3+2]=v.z*1.35;
}
base.morphAttributes.position = [
  new THREE.Float32BufferAttribute(spike, 3),
  new THREE.Float32BufferAttribute(squash, 3),
];

const mesh = new THREE.Mesh(base, new THREE.MeshStandardMaterial({
  color:0x8a7bb8, roughness:0.35, metalness:0.15, flatShading:false
}));
mesh.morphTargetInfluences = [0, 0];
scene.add(mesh);
scene.add(new THREE.AmbientLight(0xffffff,0.5));
const d = new THREE.DirectionalLight(0xffffff,1.8); d.position.set(2,3,2); scene.add(d);

// HUD sliders (hidden in cubicles embed)
const embedMode = document.body.classList.contains('embed');
let s0 = { value: 0 }, s1 = { value: 0 }, auto = { checked: true };
if (!embedMode) {
  const panel = document.createElement('div');
  panel.style.cssText = 'pointer-events:auto;position:fixed;top:56px;right:14px;z-index:3;background:rgba(10,11,16,.6);border:1px solid rgba(232,226,214,.16);border-radius:12px;padding:10px 12px;color:#e8e2d6;font:12px/1.4 system-ui;min-width:180px';
  panel.innerHTML = `<label>Spike <input id="s0" type="range" min="0" max="1" step="0.01" value="0" style="width:120px"/></label><br/><label>Squash <input id="s1" type="range" min="0" max="1" step="0.01" value="0" style="width:120px"/></label><br/><label><input id="auto" type="checkbox" checked/> auto</label>`;
  document.body.appendChild(panel);
  s0 = panel.querySelector('#s0'); s1 = panel.querySelector('#s1'); auto = panel.querySelector('#auto');
}

onResize(camera, renderer);
if (document.body.classList.contains('embed') && !document.body.classList.contains('wall')) fitEmbedOrbit(camera, controls, scene);
(function tick(){
  requestAnimationFrame(tick);
  const t = performance.now()*0.001;
  if (auto.checked) {
    s0.value = (Math.sin(t*1.2)*0.5+0.5).toFixed(2);
    s1.value = (Math.sin(t*0.8+1)*0.5+0.5).toFixed(2);
  }
  mesh.morphTargetInfluences[0] = +s0.value;
  mesh.morphTargetInfluences[1] = +s1.value;
  mesh.rotation.y += 0.005;
  controls.update(); renderer.render(scene, camera);
})();

</script>
</body>
