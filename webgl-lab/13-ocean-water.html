<style>
:root { --ink:#0a0b10; --paper:#e8e2d6; --mute:rgba(232,226,214,.55); --accent:#f0c24b; --line:rgba(232,226,214,.16); }
*{box-sizing:border-box} html,body{margin:0;height:100%;background:var(--ink);color:var(--paper);font:13px/1.45 "IBM Plex Sans",system-ui,sans-serif;overflow:hidden}
canvas{display:block;width:100%;height:100%}

body.embed .hud{display:none!important} body.embed .error{display:none!important}
body.embed,body.embed html{background:transparent!important} body.embed canvas{background:transparent!important}

<body>
<script>
(function(){const q=new URLSearchParams(location.search);if(q.has('embed')||q.has('still')){document.body.classList.add('embed');document.documentElement.classList.add('embed');document.documentElement.style.background='transparent';document.body.style.background='transparent';}})();

<div class="hud">
  <div class="top">
    <div class="brand"><a href="./INDEX.html">← WebGL Lab</a> · 13 Ocean / water shader</div>
    <div class="pill">three@0.170.0 local</div>
  </div>
  <div class="note"><b>Ocean / water shader.</b> three.js Water addon with normals + sun reflection. Drag to orbit; waves animate continuously.</div>
</div>
<div class="error" id="err"></div>
<script type="module">

const err = document.getElementById('err');
window.addEventListener('error', e => { err.style.display='block'; err.textContent = e.message || String(e.error||e); });
window.addEventListener('unhandledrejection', e => { err.style.display='block'; err.textContent = String(e.reason); });
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

function makeRenderer(opts={}) {
  const embed = document.body.classList.contains('embed');
  const r = new THREE.WebGLRenderer({ antialias:true, alpha:embed, premultipliedAlpha:true, powerPreference:'high-performance', ...opts });
  r.setPixelRatio(Math.min(devicePixelRatio, 2));
  r.setSize(innerWidth, innerHeight);
  r.outputColorSpace = THREE.SRGBColorSpace;
  r.toneMapping = THREE.ACESFilmicToneMapping;
  r.toneMappingExposure = 1.0;
  if (embed) { r.setClearColor(0x000000, 0); r.setClearAlpha(0); }
  document.body.prepend(r.domElement);
  return r;
}
function onResize(camera, renderer, composer=null) {
  addEventListener('resize', () => {
    camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
    if (composer) composer.setSize(innerWidth, innerHeight);
  });
}

import { Water } from 'three/addons/objects/Water.js';
import { Sky } from 'three/addons/objects/Sky.js';

const renderer = makeRenderer();
renderer.toneMappingExposure = document.body.classList.contains('embed') ? 0.85 : 0.55;
const scene = new THREE.Scene();
const __embed = document.body.classList.contains('embed');
const __floatClearBg = () => { if (__embed) scene.background = null; };
__floatClearBg();
const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.5, 20000);
if (__embed) {
  // Look down onto the plane so water fills the near-square iframe (no empty sky cut-off).
  camera.fov = 52;
  camera.position.set(2.5, 7.5, 11);
  camera.updateProjectionMatrix();
} else {
  camera.position.set(30, 20, 60);
}
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.maxPolarAngle = Math.PI*0.495; controls.target.set(0, __embed ? 0.6 : 0, 0);
if (__embed) { controls.enableDamping = false; controls.update(); }

const sun = new THREE.Vector3();
const water = new Water(new THREE.PlaneGeometry(__embed ? 2000 : 10000, __embed ? 2000 : 10000), {
  textureWidth: __embed ? 1024 : 512, textureHeight: __embed ? 1024 : 512,
  waterNormals: new THREE.TextureLoader().load('../vendor/three/examples/textures/waternormals.jpg', (tex)=>{
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    if (__embed) { tex.repeat.set(4, 4); }
  }),
  sunDirection: new THREE.Vector3(), sunColor: __embed ? 0xfff2c8 : 0xffffff,
  waterColor: __embed ? 0x0a8f78 : 0x001e0f,
  distortionScale: __embed ? 8.0 : 3.7, fog: false,
  alpha: 1.0
});
water.rotation.x = -Math.PI/2; scene.add(water);

const sky = new Sky(); sky.scale.setScalar(10000);
// Embed: Water stays; Sky mesh stays OUT of the rendered scene (PMREM only) — sky dome = opaque plate.
if (!__embed) scene.add(sky);
const skyUniforms = sky.material.uniforms;
skyUniforms['turbidity'].value = 8;
skyUniforms['rayleigh'].value = 2;
skyUniforms['mieCoefficient'].value = 0.005;
skyUniforms['mieDirectionalG'].value = 0.8;

const pmrem = new THREE.PMREMGenerator(renderer);
const sceneEnv = new THREE.Scene();
let renderTarget;

function updateSun(elevation=3, azimuth=180) {
  const phi = THREE.MathUtils.degToRad(90 - elevation);
  const theta = THREE.MathUtils.degToRad(azimuth);
  sun.setFromSphericalCoords(1, phi, theta);
  sky.material.uniforms['sunPosition'].value.copy(sun);
  water.material.uniforms['sunDirection'].value.copy(sun).normalize();
  if (renderTarget) renderTarget.dispose();
  sceneEnv.add(sky);
  renderTarget = pmrem.fromScene(sceneEnv);
  if (!__embed) scene.add(sky);
  scene.environment = renderTarget.texture;
}
updateSun(__embed ? 8 : 3, __embed ? 160 : 180);
if (__embed) {
  // Sky stays out of the rendered scene (PMREM only). Water fills the view; transparent clear.
  sky.visible = false;
  water.visible = true;
  scene.background = null;
  // Mirror sun into a directional so the buoy + water glints read without sky dome
  const sunLit = new THREE.DirectionalLight(0xfff0c8, 2.4);
  sunLit.position.copy(sun).multiplyScalar(100);
  scene.add(sunLit);
  scene.add(new THREE.AmbientLight(0x88aacc, 0.55));
}

const buoy = new THREE.Mesh(new THREE.CylinderGeometry(1,1.2,4,16), new THREE.MeshStandardMaterial({color:0xe07060, roughness:0.5}));
buoy.position.y = 1; scene.add(buoy);

// Embed: soft alpha vignette so the water plane doesn't read as a hard square slab.
let __vigScene = null, __vigCam = null, __vigQuad = null;
if (__embed) {
  __vigScene = new THREE.Scene();
  __vigCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
  const vigMat = new THREE.ShaderMaterial({
    transparent: true,
    depthTest: false,
    depthWrite: false,
    // Multiply dest RGB+A by vignette (center=1, edges→0) so edges fade to clear.
    blending: THREE.CustomBlending,
    blendSrc: THREE.ZeroFactor,
    blendDst: THREE.SrcColorFactor,
    blendSrcAlpha: THREE.ZeroFactor,
    blendDstAlpha: THREE.SrcAlphaFactor,
    uniforms: {},
    vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position.xy,0.0,1.0); }`,
    fragmentShader: `
      varying vec2 vUv;
      void main(){
        vec2 p = vUv * 2.0 - 1.0;
        // Soft radial + slight square falloff — feather ~18% of half-extent
        float r = length(p);
        float radial = 1.0 - smoothstep(0.55, 1.05, r);
        float edgeX = 1.0 - smoothstep(0.72, 1.0, abs(p.x));
        float edgeY = 1.0 - smoothstep(0.72, 1.0, abs(p.y));
        float v = radial * edgeX * edgeY;
        v = pow(clamp(v, 0.0, 1.0), 0.85);
        gl_FragColor = vec4(v, v, v, v);
      }`,
  });
  __vigQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), vigMat);
  __vigScene.add(__vigQuad);
}

onResize(camera, renderer);
(function tick(){
  requestAnimationFrame(tick);
  water.material.uniforms['time'].value += 1.0/60.0;
  buoy.position.y = 1 + Math.sin(performance.now()*0.002)*0.4;
  buoy.rotation.z = Math.sin(performance.now()*0.001)*0.08;
  controls.update();
  renderer.render(scene, camera);
  if (__vigScene) {
    renderer.autoClear = false;
    renderer.render(__vigScene, __vigCam);
    renderer.autoClear = true;
  }
})();

</script>
</body>
