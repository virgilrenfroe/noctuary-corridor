<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>15 · 3D LUT color grade · WebGL Lab</title>
<style>
:root { --ink:#0a0b10; --paper:#e8e2d6; --mute:rgba(232,226,214,.55); --accent:#f0c24b; --line:rgba(232,226,214,.16); }
*{box-sizing:border-box} html,body{margin:0;height:100%;background:var(--ink);color:var(--paper);font:13px/1.45 "IBM Plex Sans",system-ui,sans-serif;overflow:hidden}
canvas{display:block;width:100%;height:100%}
.hud{position:fixed;inset:0;pointer-events:none;z-index:2}
.top{position:absolute;top:14px;left:14px;right:14px;display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.brand,.pill{pointer-events:auto;border:1px solid var(--line);background:rgba(10,11,16,.55);backdrop-filter:blur(10px);border-radius:999px;padding:8px 12px;color:var(--paper);text-decoration:none;font-size:11px;letter-spacing:.14em;text-transform:uppercase}
.brand a{color:inherit;text-decoration:none}
.note{position:absolute;bottom:14px;left:14px;right:14px;max-width:520px;color:var(--mute);font-size:12px;background:rgba(10,11,16,.45);border:1px solid var(--line);border-radius:12px;padding:10px 12px;backdrop-filter:blur(8px)}
.note b{color:var(--accent);font-weight:600}
.error{position:fixed;inset:auto 14px 14px 14px;background:#3a1212;color:#ffd6d6;padding:12px 14px;border-radius:10px;z-index:9;display:none;white-space:pre-wrap}
body.embed .hud{display:none!important} body.embed .error{display:none!important}
</style>

<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.170.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.170.0/examples/jsm/"}}</script>
</head>
<body>
<script>
(function(){const q=new URLSearchParams(location.search);if(q.has('embed')||q.has('still'))document.body.classList.add('embed');})();
</script>

<div class="hud">
  <div class="top">
    <div class="brand"><a href="./INDEX.html">← WebGL Lab</a> · 15 3D LUT color grade</div>
    <div class="pill">three@0.170.0</div>
  </div>
  <div class="note"><b>3D LUT color grade.</b> LUTPass with Bourbon 64.CUBE. Press 1–4 to switch looks (identity / bourbon / remy / half-intensity).</div>
</div>
<div class="error" id="err"></div>
<script type="module">

const err = document.getElementById('err');
window.addEventListener('error', e => { err.style.display='block'; err.textContent = e.message || String(e.error||e); });
window.addEventListener('unhandledrejection', e => { err.style.display='block'; err.textContent = String(e.reason); });
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

function makeRenderer(opts={}) {
  const r = new THREE.WebGLRenderer({ antialias:true, alpha:false, powerPreference:'high-performance', ...opts });
  r.setPixelRatio(Math.min(devicePixelRatio, 2));
  r.setSize(innerWidth, innerHeight);
  r.outputColorSpace = THREE.SRGBColorSpace;
  r.toneMapping = THREE.ACESFilmicToneMapping;
  r.toneMappingExposure = 1.0;
  document.body.prepend(r.domElement);
  return r;
}
function onResize(camera, renderer, composer=null) {
  addEventListener('resize', () => {
    camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
    if (composer) composer.setSize(innerWidth, innerHeight);
  });
}

import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { LUTPass } from 'three/addons/postprocessing/LUTPass.js';
import { LUTCubeLoader } from 'three/addons/loaders/LUTCubeLoader.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const renderer = makeRenderer();
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87a0b8);
const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 100);
camera.position.set(2.5, 1.8, 4);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

const floor = new THREE.Mesh(new THREE.PlaneGeometry(20,20), new THREE.MeshStandardMaterial({color:0x6a7a50, roughness:0.9}));
floor.rotation.x=-Math.PI/2; scene.add(floor);
const ball = new THREE.Mesh(new THREE.SphereGeometry(0.6,48,48), new THREE.MeshStandardMaterial({color:0xe07060, roughness:0.35}));
ball.position.set(-0.8,0.6,0); scene.add(ball);
const box = new THREE.Mesh(new THREE.BoxGeometry(1,1,1), new THREE.MeshStandardMaterial({color:0xf0c24b, roughness:0.4}));
box.position.set(0.9,0.5,0.2); scene.add(box);
const knot = new THREE.Mesh(new THREE.TorusKnotGeometry(0.4,0.12,100,16), new THREE.MeshStandardMaterial({color:0xffffff, metalness:1, roughness:0.15}));
knot.position.set(0,1.4,-0.8); scene.add(knot);
scene.add(new THREE.HemisphereLight(0xffffff,0x445566,1));
const sun = new THREE.DirectionalLight(0xffe6c0, 2); sun.position.set(4,6,2); scene.add(sun);

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const lutPass = new LUTPass(); composer.addPass(lutPass);
composer.addPass(new OutputPass());

const luts = {};
const loader = new LUTCubeLoader();
const urls = {
  bourbon: 'https://threejs.org/examples/luts/Bourbon%2064.CUBE',
  remy: 'https://threejs.org/examples/luts/Remy%2024.CUBE',
};
Promise.all(Object.entries(urls).map(([k,u]) => loader.loadAsync(u).then(t => { luts[k]=t; }))).then(() => {
  lutPass.lut = luts.bourbon.texture3D; lutPass.intensity = 1;
}).catch(e => { err.style.display='block'; err.textContent='LUT load: '+e; });

addEventListener('keydown', (e) => {
  if (e.key==='1') { lutPass.intensity = 0; }
  if (e.key==='2' && luts.bourbon) { lutPass.lut = luts.bourbon.texture3D; lutPass.intensity=1; }
  if (e.key==='3' && luts.remy) { lutPass.lut = luts.remy.texture3D; lutPass.intensity=1; }
  if (e.key==='4') { lutPass.intensity = 0.5; }
});

onResize(camera, renderer, composer);
(function tick(){ requestAnimationFrame(tick); knot.rotation.y+=0.01; controls.update(); composer.render(); })();

</script>
</body>
</html>
