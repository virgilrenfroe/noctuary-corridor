<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>04 · SSR (screen-space reflections) · WebGL Lab</title>
<style>
:root { --ink:#0a0b10; --paper:#e8e2d6; --mute:rgba(232,226,214,.55); --accent:#f0c24b; --line:rgba(232,226,214,.16); }
*{box-sizing:border-box} html,body{margin:0;height:100%;background:var(--ink);color:var(--paper);font:13px/1.45 "IBM Plex Sans",system-ui,sans-serif;overflow:hidden}
canvas{display:block;width:100%;height:100%}
.hud{position:fixed;inset:0;pointer-events:none;z-index:2}
.top{position:absolute;top:14px;left:14px;right:14px;display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.brand,.pill{pointer-events:auto;border:1px solid var(--line);background:rgba(10,11,16,.55);backdrop-filter:blur(10px);border-radius:999px;padding:8px 12px;color:var(--paper);text-decoration:none;font-size:11px;letter-spacing:.14em;text-transform:uppercase}
.brand a{color:inherit;text-decoration:none}
.note{position:absolute;bottom:14px;left:14px;right:14px;max-width:520px;color:var(--mute);font-size:12px;background:rgba(10,11,16,.45);border:1px solid var(--line);border-radius:12px;padding:10px 12px;backdrop-filter:blur(8px)}
.note b{color:var(--accent);font-weight:600}
.error{position:fixed;inset:auto 14px 14px 14px;background:#3a1212;color:#ffd6d6;padding:12px 14px;border-radius:10px;z-index:9;display:none;white-space:pre-wrap}
body.embed .hud{display:none!important} body.embed .error{display:none!important}
body.embed,body.embed html{background:transparent!important} body.embed canvas{background:transparent!important}
</style>

<script type="importmap">{"imports":{"three":"../vendor/three/build/three.module.js","three/addons/":"../vendor/three/examples/jsm/"}}</script>
</head>
<body>
<script>
(function(){const q=new URLSearchParams(location.search);if(q.has('embed')||q.has('still')){document.body.classList.add('embed');document.documentElement.classList.add('embed');document.documentElement.style.background='transparent';document.body.style.background='transparent';}})();
</script>

<div class="hud">
  <div class="top">
    <div class="brand"><a href="./INDEX.html">← WebGL Lab</a> · 04 SSR (screen-space reflections)</div>
    <div class="pill">three@0.170.0 local</div>
  </div>
  <div class="note"><b>SSR (screen-space reflections).</b> SSRPass over a glossy floor and colored props. Quality depends on screen coverage — edges fade.</div>
</div>
<div class="error" id="err"></div>
<script type="module">

const err = document.getElementById('err');
window.addEventListener('error', e => { err.style.display='block'; err.textContent = e.message || String(e.error||e); });
window.addEventListener('unhandledrejection', e => { err.style.display='block'; err.textContent = String(e.reason); });
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

function makeRenderer(opts={}) {
  const embed = document.body.classList.contains('embed');
  const r = new THREE.WebGLRenderer({ antialias:true, alpha:embed, premultipliedAlpha:true, powerPreference:'high-performance', ...opts });
  r.setPixelRatio(Math.min(devicePixelRatio, 2));
  r.setSize(innerWidth, innerHeight);
  r.outputColorSpace = THREE.SRGBColorSpace;
  r.toneMapping = THREE.ACESFilmicToneMapping;
  r.toneMappingExposure = 1.0;
  if (embed) { r.setClearColor(0x000000, 0); r.setClearAlpha(0); }
  document.body.prepend(r.domElement);
  return r;
}
function onResize(camera, renderer, composer=null) {
  addEventListener('resize', () => {
    camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
    if (composer) composer.setSize(innerWidth, innerHeight);
  });
}

import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { SSRPass } from 'three/addons/postprocessing/SSRPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { ReflectorForSSRPass } from 'three/addons/objects/ReflectorForSSRPass.js';

const renderer = makeRenderer();
renderer.toneMappingExposure = 1.1;
const scene = new THREE.Scene();
const __floatClearBg = () => { if (document.body.classList.contains('embed')) scene.background = null; };
scene.background = new THREE.Color(0x0e1018); __floatClearBg();
const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 100);
camera.position.set(0, 2.2, 6);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.target.set(0,0.6,0);

const geo = new THREE.PlaneGeometry(12, 12);
const groundReflector = new ReflectorForSSRPass(geo, { resolution: 1024, clipBias: 0.0001 });
groundReflector.material.depthWrite = false;
groundReflector.rotation.x = -Math.PI/2; groundReflector.visible = false; scene.add(groundReflector);

const floorVis = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color:0x222833, metalness:0.9, roughness:0.15 }));
floorVis.rotation.x = -Math.PI/2; floorVis.position.y = 0.001; scene.add(floorVis);
if (document.body.classList.contains('embed')) floorVis.visible = false; // floating labs: props only

const colors = [0xf0c24b, 0x8a7bb8, 0x5ec8c0, 0xe07060];
colors.forEach((c,i) => {
  const m = new THREE.Mesh(
    i%2 ? new THREE.BoxGeometry(0.8,0.8,0.8) : new THREE.SphereGeometry(0.45,32,32),
    new THREE.MeshStandardMaterial({ color:c, metalness:0.6, roughness:0.2 })
  );
  m.position.set((i-1.5)*1.4, 0.45, (i%2)*0.6 - 0.3);
  scene.add(m);
});
const knot = new THREE.Mesh(new THREE.TorusKnotGeometry(0.5,0.15,120,20), new THREE.MeshStandardMaterial({color:0xffffff, metalness:1, roughness:0.08}));
knot.position.set(0,1.2,-1.2); scene.add(knot);

scene.add(new THREE.AmbientLight(0xffffff, 0.35));
const d = new THREE.DirectionalLight(0xffffff, 2); d.position.set(4,8,3); scene.add(d);

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const ssr = new SSRPass({ renderer, scene, camera, width:innerWidth, height:innerHeight, groundReflector, selects: null });
ssr.thickness = 0.018; ssr.infiniteThick = false; ssr.maxDistance = 10;
composer.addPass(ssr);
composer.addPass(new OutputPass());

onResize(camera, renderer, composer);
(function tick(){
  requestAnimationFrame(tick);
  knot.rotation.y += 0.01; knot.rotation.x += 0.004;
  controls.update(); composer.render();
})();

</script>
</body>
</html>
