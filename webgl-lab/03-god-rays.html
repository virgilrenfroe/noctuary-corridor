  <div class="note"><b>Volumetric lighting / god rays.</b> Occlusion-map radial blur god rays through a window cutout. Pure WebGL post-process (no WebGPU).</div>
</div>
<div class="error" id="err"></div>
<script type="module">

const err = document.getElementById('err');
window.addEventListener('error', e => { err.style.display='block'; err.textContent = e.message || String(e.error||e); });
window.addEventListener('unhandledrejection', e => { err.style.display='block'; err.textContent = String(e.reason); });
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

function makeRenderer(opts={}) {
  // Opaque canvas always — volumetric occlusion map + radial blur need a dark clear.
  // Transparent embed clear was wiping shafts to white / objects-only silhouettes.
  const r = new THREE.WebGLRenderer({ antialias:true, alpha:false, powerPreference:'high-performance', ...opts });
  r.setPixelRatio(Math.min(devicePixelRatio, 2));
  r.setSize(innerWidth, innerHeight);
  r.outputColorSpace = THREE.SRGBColorSpace;
  r.toneMapping = THREE.ACESFilmicToneMapping;
  r.toneMappingExposure = 1.05;
  r.setClearColor(0x020308, 1);
  document.body.prepend(r.domElement);
  return r;
}
function onResize(camera, renderer, composer=null) {
  addEventListener('resize', () => {
    camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
    if (composer) composer.setSize(innerWidth, innerHeight);
  });
}

import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const renderer = makeRenderer();
const scene = new THREE.Scene();
// Keep dark background in solo AND embed — null bg + alpha clear killed the shafts.
scene.background = new THREE.Color(0x020308);
const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 100);
camera.position.set(0, 1.2, 4.5);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.target.set(0,1.1,0);

// Room (occlusion volume for god-ray window)
const room = new THREE.Mesh(new THREE.BoxGeometry(8,4,8), new THREE.MeshStandardMaterial({color:0x151820, side:THREE.BackSide, roughness:1}));
scene.add(room);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(8,8), new THREE.MeshStandardMaterial({color:0x1c2030, roughness:0.8}));
floor.rotation.x=-Math.PI/2; scene.add(floor);

// Window wall with hole (bright emissive panel behind)
const wall = new THREE.Mesh(new THREE.PlaneGeometry(8,4), new THREE.MeshStandardMaterial({color:0x12151e, roughness:1}));
wall.position.set(0,2,-3.95); scene.add(wall);
const lightPanel = new THREE.Mesh(new THREE.PlaneGeometry(1.6, 2.2), new THREE.MeshBasicMaterial({color:0xfff6e0}));
lightPanel.position.set(0, 1.8, -3.9); scene.add(lightPanel);
// bars
for (let i=-2;i<=2;i++) {
  const bar = new THREE.Mesh(new THREE.BoxGeometry(0.08,2.2,0.08), new THREE.MeshStandardMaterial({color:0x0a0a0e}));
  bar.position.set(i*0.35, 1.8, -3.85); scene.add(bar);
}

const pillar = new THREE.Mesh(new THREE.CylinderGeometry(0.25,0.3,2.4,16), new THREE.MeshStandardMaterial({color:0x2a3040, roughness:0.6}));
pillar.position.set(-1.2,1.2,0.5); scene.add(pillar);
const statue = new THREE.Mesh(new THREE.TorusKnotGeometry(0.35,0.12,100,16), new THREE.MeshStandardMaterial({color:0x8a7bb8, roughness:0.35, metalness:0.4}));
statue.position.set(1.1,1.1,0.2); scene.add(statue);

scene.add(new THREE.AmbientLight(0x334455, 0.25));
const key = new THREE.DirectionalLight(0xffe6b0, 1.35); key.position.set(0,3,-2); scene.add(key);

// God rays shader — radial blur from window light (classic occlusion-map shafts)
const GodRaysShader = {
  uniforms: {
    tDiffuse: { value: null },
    lightPosition: { value: new THREE.Vector2(0.5, 0.62) },
    exposure: { value: 0.52 },
    decay: { value: 0.94 },
    density: { value: 0.95 },
    weight: { value: 0.55 },
    samples: { value: 72 }
  },
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
  fragmentShader: `
    uniform sampler2D tDiffuse; uniform vec2 lightPosition;
    uniform float exposure, decay, density, weight; uniform int samples;
    varying vec2 vUv;
    void main(){
      vec2 texCoord = vUv;
      vec2 delta = texCoord - lightPosition;
      delta *= 1.0 / float(samples) * density;
      vec4 color = texture2D(tDiffuse, texCoord);
      float illuminationDecay = 1.0;
      for(int i=0;i<100;i++){
        if(i>=samples) break;
        texCoord -= delta;
        vec4 s = texture2D(tDiffuse, texCoord);
        s *= illuminationDecay * weight;
        color += s;
        illuminationDecay *= decay;
      }
      gl_FragColor = color * exposure;
    }`
};

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const god = new ShaderPass(GodRaysShader);
composer.addPass(god);
composer.addPass(new OutputPass());

onResize(camera, renderer, composer);
(function tick(){
  requestAnimationFrame(tick);
  // project light panel to NDC for ray origin
  const sp = lightPanel.position.clone().project(camera);
  god.uniforms.lightPosition.value.set(sp.x*0.5+0.5, sp.y*0.5+0.5);
  statue.rotation.y += 0.005;
  controls.update();
  composer.render();
})();

</script>
