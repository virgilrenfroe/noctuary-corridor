<style>
:root { --ink:#0a0b10; --paper:#e8e2d6; --mute:rgba(232,226,214,.55); --accent:#f0c24b; --line:rgba(232,226,214,.16); }
*{box-sizing:border-box} html,body{margin:0;height:100%;background:var(--ink);color:var(--paper);font:13px/1.45 "IBM Plex Sans",system-ui,sans-serif;overflow:hidden}
canvas{display:block;width:100%;height:100%}
.hud{position:fixed;inset:0;pointer-events:none;z-index:2}
.top{position:absolute;top:14px;left:14px;right:14px;display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.brand,.pill{pointer-events:auto;border:1px solid var(--line);background:rgba(10,11,16,.55);backdrop-filter:blur(10px);border-radius:999px;padding:8px 12px;color:var(--paper);text-decoration:none;font-size:11px;letter-spacing:.14em;text-transform:uppercase}

.note b{color:var(--accent);font-weight:600}
.error{position:fixed;inset:auto 14px 14px 14px;background:#3a1212;color:#ffd6d6;padding:12px 14px;border-radius:10px;z-index:9;display:none;white-space:pre-wrap}
body.embed .hud{display:none!important} body.embed .error{display:none!important}
/* God-rays need an opaque dark stage — keep ink bg even in embed (no alpha punch-through). */
html.embed,body.embed{background:#020308!important}
body.embed canvas{background:#020308!important;background-color:#020308!important}
/* Wall embed (?wall=1): Taxodium palette — glossy purple bark + orange/cream leaf light (not beige SaaS). */
html.embed.wall,body.embed.wall{background:#140818!important}
body.embed.wall canvas{background:#140818!important;background-color:#140818!important}
body.embed.wall{--ink:#140818;--paper:#ffe8c8;--mute:rgba(255,200,140,.55);--accent:#ff9a28;--line:rgba(200,120,255,.22)}
</style>

<script type="importmap">{"imports":{"three":"../vendor/three/build/three.module.js","three/addons/":"../vendor/three/examples/jsm/"}}</script>

<body>
<script>
(function(){const q=new URLSearchParams(location.search);const emb=q.has('embed')||q.has('still');const wall=q.has('wall')||q.get('opaque')==='1';if(emb){document.body.classList.add('embed');document.documentElement.classList.add('embed');if(wall){document.body.classList.add('wall');document.documentElement.classList.add('wall');}}})();
</script>

<div class="hud">
  <div class="top">
    <div class="brand"><a href="./INDEX.html">← WebGL Lab</a> · 03 Volumetric lighting / god rays</div>
    <div class="pill">three@0.170.0 local</div>
  </div>
  <div class="note"><b>Volumetric lighting / god rays.</b> Occlusion-map radial blur god rays through a window cutout. Pure WebGL post-process (no WebGPU).</div>
</div>
<div class="error" id="err"></div>
<script type="module">

const err = document.getElementById('err');
window.addEventListener('error', e => { err.style.display='block'; err.textContent = e.message || String(e.error||e); });
window.addEventListener('unhandledrejection', e => { err.style.display='block'; err.textContent = String(e.reason); });
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

function makeRenderer(opts={}) {
  // Opaque canvas always — volumetric occlusion map + radial blur need a dark clear.
  // Transparent embed clear was wiping shafts to white / objects-only silhouettes.
  const r = new THREE.WebGLRenderer({ antialias:true, alpha:false, powerPreference:'high-performance', ...opts });
  r.setPixelRatio(Math.min(devicePixelRatio, 2));
  r.setSize(innerWidth, innerHeight);
  r.outputColorSpace = THREE.SRGBColorSpace;
  r.toneMapping = THREE.ACESFilmicToneMapping;
  r.toneMappingExposure = 1.05;
  r.setClearColor(0x020308, 1);
  document.body.prepend(r.domElement);
  return r;
}
function onResize(camera, renderer, composer=null) {
  addEventListener('resize', () => {
    camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
    if (composer) composer.setSize(innerWidth, innerHeight);
  });
}

import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const renderer = makeRenderer();
const scene = new THREE.Scene();
const __wall = document.body.classList.contains('wall');
// Keep dark background in solo AND embed — null bg + alpha clear killed the shafts.
// Wall: Taxodium purple bark void (not beige SaaS cream).
scene.background = new THREE.Color(__wall ? 0x140818 : 0x020308);
if (__wall) {
  renderer.setClearColor(0x140818, 1);
  renderer.toneMappingExposure = 1.12;
}
const camera = new THREE.PerspectiveCamera(__wall ? 46 : 50, innerWidth/innerHeight, 0.1, 100);
camera.position.set(0, __wall ? 1.05 : 1.2, __wall ? 4.1 : 4.5);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.target.set(0,1.1,0);

// Room (occlusion volume for god-ray window)
const roomCol = __wall ? 0x2a0c40 : 0x151820; // glossy purple bark
const floorCol = __wall ? 0x1a0828 : 0x1c2030;
const wallCol = __wall ? 0x3a1458 : 0x12151e;
const room = new THREE.Mesh(new THREE.BoxGeometry(8,4,8), new THREE.MeshStandardMaterial({
  color: roomCol, side: THREE.BackSide, roughness: __wall ? 0.38 : 1, metalness: __wall ? 0.55 : 0,
  emissive: __wall ? 0x3a1050 : 0x000000, emissiveIntensity: __wall ? 0.12 : 0,
}));
scene.add(room);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(8,8), new THREE.MeshStandardMaterial({
  color: floorCol, roughness: __wall ? 0.42 : 0.8, metalness: __wall ? 0.4 : 0,
}));
floor.rotation.x=-Math.PI/2; scene.add(floor);

// Window wall with hole — leaf-light window (orange/cream), not flat beige panel
const wall = new THREE.Mesh(new THREE.PlaneGeometry(8,4), new THREE.MeshStandardMaterial({
  color: wallCol, roughness: __wall ? 0.45 : 1, metalness: __wall ? 0.35 : 0,
}));
wall.position.set(0,2,-3.95); scene.add(wall);
const lightPanel = new THREE.Mesh(new THREE.PlaneGeometry(1.6, 2.2), new THREE.MeshBasicMaterial({
  color: __wall ? 0xffb020 : 0xfff6e0, // orange leaf core (cream rim via tone map)
}));
lightPanel.position.set(0, 1.8, -3.9); scene.add(lightPanel);
if (__wall) {
  const creamRim = new THREE.Mesh(new THREE.PlaneGeometry(1.85, 2.45), new THREE.MeshBasicMaterial({
    color: 0xffe2b0, transparent: true, opacity: 0.35,
  }));
  creamRim.position.set(0, 1.8, -3.92); scene.add(creamRim);
}
// bars — deep purple bark mullions
for (let i=-2;i<=2;i++) {
  const bar = new THREE.Mesh(new THREE.BoxGeometry(0.08,2.2,0.08), new THREE.MeshStandardMaterial({
    color: __wall ? 0x100418 : 0x0a0a0e, roughness: __wall ? 0.3 : 0.5, metalness: __wall ? 0.7 : 0,
  }));
  bar.position.set(i*0.35, 1.8, -3.85); scene.add(bar);
}

const pillar = new THREE.Mesh(new THREE.CylinderGeometry(0.25,0.3,2.4,16), new THREE.MeshStandardMaterial({
  color: __wall ? 0x4a1868 : 0x2a3040, roughness: __wall ? 0.28 : 0.6, metalness: __wall ? 0.75 : 0,
  emissive: __wall ? 0x2a0c40 : 0x000000, emissiveIntensity: __wall ? 0.15 : 0,
}));
pillar.position.set(-1.2,1.2,0.5); scene.add(pillar);
const statue = new THREE.Mesh(new THREE.TorusKnotGeometry(0.35,0.12,100,16), new THREE.MeshStandardMaterial({
  color: __wall ? 0xd8b0ff : 0x8a7bb8, roughness: __wall ? 0.12 : 0.35, metalness: __wall ? 0.85 : 0.4,
  emissive: __wall ? 0x5a2878 : 0x000000, emissiveIntensity: __wall ? 0.08 : 0,
}));
statue.position.set(1.1,1.1,0.2); scene.add(statue);

scene.add(new THREE.AmbientLight(__wall ? 0x8030a8 : 0x334455, __wall ? 0.35 : 0.25));
const key = new THREE.DirectionalLight(__wall ? 0xffc060 : 0xffe6b0, __wall ? 1.55 : 1.35);
key.position.set(0,3,-2); scene.add(key);
if (__wall) {
  scene.add(new THREE.PointLight(0xff8c30, 18, 10).translateX(0).translateY(2.2).translateZ(-2.5)); // orange leaf wash
  scene.add(new THREE.PointLight(0xc040ff, 10, 9).translateX(-1.5).translateY(1.4).translateZ(0.4)); // purple bark kick
}

// God rays shader — radial blur from window light (classic occlusion-map shafts)
const GodRaysShader = {
  uniforms: {
    tDiffuse: { value: null },
    lightPosition: { value: new THREE.Vector2(0.5, 0.62) },
    exposure: { value: __wall ? 0.58 : 0.52 },
    decay: { value: 0.94 },
    density: { value: __wall ? 0.92 : 0.95 },
    weight: { value: __wall ? 0.6 : 0.55 },
    samples: { value: 72 }
  },
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
  fragmentShader: `
    uniform sampler2D tDiffuse; uniform vec2 lightPosition;
    uniform float exposure, decay, density, weight; uniform int samples;
    varying vec2 vUv;
    void main(){
      vec2 texCoord = vUv;
      vec2 delta = texCoord - lightPosition;
      delta *= 1.0 / float(samples) * density;
      vec4 color = texture2D(tDiffuse, texCoord);
      float illuminationDecay = 1.0;
      for(int i=0;i<100;i++){
        if(i>=samples) break;
        texCoord -= delta;
        vec4 s = texture2D(tDiffuse, texCoord);
        s *= illuminationDecay * weight;
        color += s;
        illuminationDecay *= decay;
      }
      gl_FragColor = color * exposure;
    }`
};

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const god = new ShaderPass(GodRaysShader);
composer.addPass(god);
composer.addPass(new OutputPass());

onResize(camera, renderer, composer);
(function tick(){
  requestAnimationFrame(tick);
  // project light panel to NDC for ray origin
  const sp = lightPanel.position.clone().project(camera);
  god.uniforms.lightPosition.value.set(sp.x*0.5+0.5, sp.y*0.5+0.5);
  statue.rotation.y += 0.005;
  controls.update();
  composer.render();
})();

</script>
</body>
