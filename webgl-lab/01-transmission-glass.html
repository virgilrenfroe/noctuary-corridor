<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>01 · Transmission / refraction glass · WebGL Lab</title>
<style>
:root { --ink:#0a0b10; --paper:#e8e2d6; --mute:rgba(232,226,214,.55); --accent:#f0c24b; --line:rgba(232,226,214,.16); }
*{box-sizing:border-box} html,body{margin:0;height:100%;background:var(--ink);color:var(--paper);font:13px/1.45 "IBM Plex Sans",system-ui,sans-serif;overflow:hidden}
canvas{display:block;width:100%;height:100%}
.hud{position:fixed;inset:0;pointer-events:none;z-index:2}
.top{position:absolute;top:14px;left:14px;right:14px;display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.brand,.pill{pointer-events:auto;border:1px solid var(--line);background:rgba(10,11,16,.55);backdrop-filter:blur(10px);border-radius:999px;padding:8px 12px;color:var(--paper);text-decoration:none;font-size:11px;letter-spacing:.14em;text-transform:uppercase}
.brand a{color:inherit;text-decoration:none}
.note{position:absolute;bottom:14px;left:14px;right:14px;max-width:520px;color:var(--mute);font-size:12px;background:rgba(10,11,16,.45);border:1px solid var(--line);border-radius:12px;padding:10px 12px;backdrop-filter:blur(8px)}
.note b{color:var(--accent);font-weight:600}
.error{position:fixed;inset:auto 14px 14px 14px;background:#3a1212;color:#ffd6d6;padding:12px 14px;border-radius:10px;z-index:9;display:none;white-space:pre-wrap}
body.embed .hud{display:none!important} body.embed .error{display:none!important}
body.embed,body.embed html{background:transparent!important} body.embed canvas{background:transparent!important}
</style>

<script type="importmap">{"imports":{"three":"../vendor/three/build/three.module.js","three/addons/":"../vendor/three/examples/jsm/"}}</script>
</head>
<body>
<script>
(function(){const q=new URLSearchParams(location.search);if(q.has('embed')||q.has('still')){document.body.classList.add('embed');document.documentElement.classList.add('embed');document.documentElement.style.background='transparent';document.body.style.background='transparent';}})();
</script>

<div class="hud">
  <div class="top">
    <div class="brand"><a href="./INDEX.html">← WebGL Lab</a> · 01 Transmission / refraction glass</div>
    <div class="pill">three@0.170.0 local</div>
  </div>
  <div class="note"><b>Transmission / refraction glass.</b> Drag to orbit. Thick glass torus + sphere with MeshPhysicalMaterial transmission, IOR, thickness, and roughness.</div>
</div>
<div class="error" id="err"></div>
<script type="module">

const err = document.getElementById('err');
window.addEventListener('error', e => { err.style.display='block'; err.textContent = e.message || String(e.error||e); });
window.addEventListener('unhandledrejection', e => { err.style.display='block'; err.textContent = String(e.reason); });
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

function makeRenderer(opts={}) {
  const embed = document.body.classList.contains('embed');
  const r = new THREE.WebGLRenderer({ antialias:true, alpha:embed, premultipliedAlpha:true, powerPreference:'high-performance', ...opts });
  r.setPixelRatio(Math.min(devicePixelRatio, 2));
  r.setSize(innerWidth, innerHeight);
  r.outputColorSpace = THREE.SRGBColorSpace;
  r.toneMapping = THREE.ACESFilmicToneMapping;
  r.toneMappingExposure = 1.0;
  if (embed) { r.setClearColor(0x000000, 0); r.setClearAlpha(0); }
  document.body.prepend(r.domElement);
  return r;
}
function onResize(camera, renderer, composer=null) {
  addEventListener('resize', () => {
    camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
    if (composer) composer.setSize(innerWidth, innerHeight);
  });
}

import { RGBELoader } from 'three/addons/loaders/RGBELoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const renderer = makeRenderer();
renderer.toneMappingExposure = 1.15;
const scene = new THREE.Scene();
const __floatClearBg = () => { if (document.body.classList.contains('embed')) scene.background = null; };
const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 100);
camera.position.set(2.4, 1.4, 3.2);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.target.set(0, 0.4, 0);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.background = new THREE.Color(0x101018); __floatClearBg();

const floor = new THREE.Mesh(
  new THREE.CircleGeometry(4, 64),
  new THREE.MeshStandardMaterial({ color:0x1a1c28, metalness:0.2, roughness:0.55 })
);
floor.rotation.x = -Math.PI/2; scene.add(floor);
if (document.body.classList.contains('embed')) floor.visible = false; // floating labs: object only

const checker = new THREE.Mesh(
  new THREE.BoxGeometry(0.55, 0.55, 0.55),
  new THREE.MeshStandardMaterial({ color:0xf0c24b, metalness:0.1, roughness:0.35 })
);
checker.position.set(-0.85, 0.28, 0); scene.add(checker);

const __embedGlass = document.body.classList.contains('embed');
// Transmission needs an opaque scene background; with alpha canvas it paints a black plate
// behind the whole iframe. Embed uses refractive-look PBR without transmission so objects float.
const glassMat = new THREE.MeshPhysicalMaterial(__embedGlass ? {
  color: 0xffffff, metalness: 0, roughness: 0.06,
  transparent: true, opacity: 0.42, depthWrite: false,
  thickness: 1.2, ior: 1.5,
  specularIntensity: 1, envMapIntensity: 1.6,
  clearcoat: 1, clearcoatRoughness: 0.05,
} : {
  color: 0xffffff, metalness: 0, roughness: 0.05,
  transmission: 1.0, thickness: 1.2, ior: 1.5,
  specularIntensity: 1, envMapIntensity: 1.2,
  clearcoat: 1, clearcoatRoughness: 0.05,
});
const torus = new THREE.Mesh(new THREE.TorusKnotGeometry(0.45, 0.16, 180, 32), glassMat);
torus.position.set(0.35, 0.75, 0); scene.add(torus);

const ball = new THREE.Mesh(new THREE.SphereGeometry(0.38, 64, 64), glassMat.clone());
ball.material.color.set(0xa8d8ff);
if (!__embedGlass) { ball.material.thickness = 2.0; ball.material.ior = 1.7; }
else { ball.material.opacity = 0.55; }
ball.position.set(1.15, 0.4, 0.35); scene.add(ball);

const key = new THREE.DirectionalLight(0xffffff, 2.2); key.position.set(3,5,2); scene.add(key);
scene.add(new THREE.AmbientLight(0x8899bb, 0.35));

new RGBELoader().load('https://threejs.org/examples/textures/equirectangular/venice_sunset_1k.hdr', (tex) => {
  tex.mapping = THREE.EquirectangularReflectionMapping;
  const env = pmrem.fromEquirectangular(tex).texture;
  scene.environment = env; scene.background = env; __floatClearBg(); scene.backgroundBlurriness = 0.35;
  tex.dispose();
}, undefined, () => {});

onResize(camera, renderer);
(function tick(){
  requestAnimationFrame(tick);
  torus.rotation.y += 0.004; torus.rotation.x += 0.002;
  controls.update(); renderer.render(scene, camera);
})();

</script>
</body>
</html>
