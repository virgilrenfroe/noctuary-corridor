<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />

<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
<title>Noctuary — physics panel</title>
<style>
  :root {
    --font-display: "Bricolage Grotesque", system-ui, sans-serif;
    --font-sans: "Instrument Sans", system-ui, sans-serif;
    --font-mono: "Space Mono", ui-monospace, monospace;
    --ink: #12151c;
    --paper: #f2ebe0;
    --mute: rgba(18,21,28,0.55);
    --accent: #f0c24b;
    --violet: #8a7bb8;
    --sky: #c9d6ea;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: #d8d2c6; color: var(--ink);
    font-family: var(--font-sans);
    touch-action: none;
  }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  .chrome {
    position: fixed; inset: 0; pointer-events: none; z-index: 2;
    display: flex; flex-direction: column; justify-content: space-between;
    padding: 14px 16px 16px;
  }
  .label {
    align-self: flex-start;
    max-width: 92%;
    padding: 10px 12px; border-radius: 14px;
    border: 1px solid rgba(18,21,28,0.12);
    background: rgba(247,241,230,0.88);
    backdrop-filter: blur(10px);
  }
  .label .tag {
    margin: 0 0 4px;
    font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.18em;
    text-transform: uppercase; color: rgba(18,21,28,0.5);
  }
  .label h1 {
    margin: 0; font-family: var(--font-display); font-weight: 700;
    font-size: clamp(1.15rem, 4.5vw, 1.55rem); letter-spacing: -0.03em; line-height: 1.05;
  }
  .label p {
    margin: 6px 0 0; font-size: 11px; line-height: 1.4; color: var(--mute);
  }
  .hint {
    align-self: flex-end;
    font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.12em;
    text-transform: uppercase; color: rgba(18,21,28,0.55);
    padding: 8px 10px; border-radius: 999px;
    border: 1px solid rgba(18,21,28,0.1);
    background: rgba(247,241,230,0.78);
  }
  body.embed .chrome,
  body.embed .label,
  body.embed .hint,
  body.embed .open-full { display: none !important; }
  html.embed, body.embed { background: transparent !important; }
  body.embed canvas { background: transparent !important; }
  /* Never show open-full chrome plate in floating embeds */
  body.embed .open-full { display: none !important; visibility: hidden !important; }
  body.still .hint { opacity: 0.35; }
  /* Flow field: no title card and no pointer hint (full page and embed). */
  body.particles .label,
  body.particles .hint { display: none !important; }
  .open-full {
    display: none;
    position: fixed; z-index: 3;
    right: max(10px, env(safe-area-inset-right));
    bottom: max(10px, env(safe-area-inset-bottom));
    appearance: none; text-decoration: none;
    border: 1px solid rgba(18,21,28,0.14);
    background: rgba(247,241,230,0.9);
    color: var(--ink); border-radius: 999px;
    padding: 8px 12px; font: inherit;
    font-family: var(--font-mono); font-size: 9px;
    letter-spacing: 0.14em; text-transform: uppercase;
    backdrop-filter: blur(10px); pointer-events: auto;
    cursor: pointer;
  }
  @media (pointer: coarse), (max-width: 900px) {
    body.embed .open-full {
      padding: 10px 14px; font-size: 10px;
      background: rgba(247,241,230,0.96);
      border-color: rgba(240,194,75,0.45);
    }
  }
</style>

<script>
(function(){const q=new URLSearchParams(location.search);const demo=(q.get('demo')||'gravity').toLowerCase();if(q.has('embed')||q.has('still')){document.body.classList.add('embed');document.documentElement.classList.add('embed');document.documentElement.style.background='transparent';document.body.style.background='transparent';}if(demo==='particles'||demo==='flow')document.body.classList.add('particles');})();
</script>
  <div class="chrome">

    </div>

<script type="importmap">
{
  "imports": {
    "three": "./vendor/three/build/three.module.js",
    "three/addons/": "./vendor/three/examples/jsm/",
    "cannon-es": "https://unpkg.com/cannon-es@0.20.0/dist/cannon-es.js"

<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { fitEmbedOrbit } from './webgl-lab/embed-fit.js';
import * as CANNON from 'cannon-es';

const params = new URLSearchParams(location.search);
const demoRaw = (params.get('demo') || 'gravity').toLowerCase();
const demo = demoRaw === 'flow' ? 'particles' : demoRaw;
const embed = params.has('embed');
const still = matchMedia('(prefers-reduced-motion: reduce)').matches || params.has('still');
if (embed) document.body.classList.add('embed');
if (still) document.body.classList.add('still');

const META = {
  gravity: {
    tag: 'Rigid body',
    title: 'Gravity & bounce',
    blurb: 'g = −9.82 · restitution on contact. Drop / toss with click.',
    hint: 'click to toss',
  },
  spring: {
    tag: 'Feel language',
    title: 'Spring & damping',
    blurb: "Hooke's spring + zeta damping — light overshoots, heavy settles.",
    hint: 'drag the mass',
  },
  collision: {
    tag: 'Contact',
    title: 'Collision',
    blurb: 'Impulse exchange on hit — grab any block and throw into depth against the back wall.',
    hint: 'drag to throw into depth · click empty to fire',
  },
  constraints: {
    tag: 'Joints',
    title: 'Constraints',
    blurb: 'PointToPoint hinge — lantern swings, does not free-fall.',
    hint: 'drag to swing',
  },
  cloth: {
    tag: 'Soft body',
    title: 'Cloth',
    blurb: 'Velvet Verlet cloth — shear links, wind drape, pin & tug.',
    hint: 'drag fabric',
  },
  particles: {
    tag: 'Forces',
    title: 'Flow field',
    blurb: 'Curl-advected particles — pointer spins a local vortex.',
    hint: 'move or drag pointer',
  },
  stacking: {
    tag: 'Rigid body',
    title: 'Stacking',
    blurb: 'Sleeping crates on a quay — shake the stack, watch sleep wake.',
    hint: 'click to shake',
  },
};

const meta = META[demo] || META.gravity;
document.getElementById('tag').textContent = meta.tag;
document.getElementById('title').textContent = meta.title;
document.getElementById('blurb').textContent = meta.blurb;
document.getElementById('hint').textContent = meta.hint;
document.title = `Noctuary — ${meta.title}`;

const openFull = document.getElementById('open-full');
if (openFull) {
  const fullQ = new URLSearchParams({ demo });
  if (still || params.has('still')) fullQ.set('still', '1');
  openFull.href = './physics-panel.html?' + fullQ.toString();
  // Optional escape hatch — small on desktop, easier on phone (see CSS)
  if (!embed) openFull.style.display = 'none';
}

const BG = 0xd8d2c6;
const INK = 0x12151c;
const PAPER = 0xf2ebe0;
const ACCENT = 0xf0c24b;
const VIOLET = 0x8a7bb8;
const TEAL = 0x4db6a4;

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: !!embed, premultipliedAlpha: !embed, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.75));
if (embed) {
  renderer.setClearColor(0x000000, 0); renderer.setClearAlpha(0);
  renderer.domElement.style.background = 'transparent';
  renderer.domElement.style.backgroundColor = 'transparent';
}
else renderer.setClearColor(BG, 1);
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
if (!embed) scene.background = new THREE.Color(BG);
if (!embed) scene.fog = new THREE.Fog(BG, 8, 22);
const camera = new THREE.PerspectiveCamera(42, 1, 0.1, 60);
if (embed && (demo === 'cloth' || demo === 'particles')) {
  // Particles: pull back so curl cloud stays inside square iframe (no edge overflow).
  camera.fov = demo === 'particles' ? 34 : 38;
  camera.position.set(0, demo === 'cloth' ? 1.45 : 1.5, demo === 'cloth' ? 4.4 : 5.8);
  camera.lookAt(0, demo === 'cloth' ? 1.35 : 1.45, 0);
} else if (embed && demo === 'constraints') {
  camera.fov = 36;
  camera.position.set(0.35, 1.55, 4.6);
  camera.lookAt(0.55, 1.45, 0);
} else {
  camera.position.set(0, 1.55, 5.2);
  camera.lookAt(0, 0.9, 0);
}

const hemi = new THREE.HemisphereLight(0xf7f2e8, 0x8a8490, 1.15);
scene.add(hemi);
const key = new THREE.DirectionalLight(0xfff8ee, 1.05);
key.position.set(3.5, 7, 4);
scene.add(key);
const fill = new THREE.PointLight(VIOLET, 12, 18);
fill.position.set(-2.5, 2.2, 2);
scene.add(fill);

const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(14, 10),
  new THREE.MeshStandardMaterial({ color: 0xcfc7b8, roughness: 0.82, metalness: 0.04 })
);
floor.rotation.x = -Math.PI / 2;
floor.position.y = 0;
scene.add(floor);

const back = new THREE.Mesh(
  new THREE.PlaneGeometry(14, 8),
  new THREE.MeshStandardMaterial({ color: 0xbdb5a8, roughness: 0.92, metalness: 0.02 })
);
back.position.set(0, 3.2, -3.2);
scene.add(back);
if (embed) { floor.visible = false; back.visible = false; } // floating labs: interactive bodies only

function resize() {
  const w = innerWidth;
  const h = innerHeight;
  camera.aspect = w / Math.max(1, h);
  camera.updateProjectionMatrix();
  renderer.setSize(w, h, false);
}
addEventListener('resize', resize);
resize();

const clock = new THREE.Clock();
const pointer = new THREE.Vector2(0, 0);
const raycaster = new THREE.Raycaster();
let pointerDown = false;
let pointerActive = false;
const ndc = new THREE.Vector2();
const pointerWorld = new THREE.Vector3(0, 1.4, 0);
const interactPlane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
const _planeHit = new THREE.Vector3();

function setNDC(e) {
  const rect = renderer.domElement.getBoundingClientRect();
  const w = Math.max(1, rect.width);
  const h = Math.max(1, rect.height);
  const cx = e.clientX - rect.left;
  const cy = e.clientY - rect.top;
  ndc.x = (cx / w) * 2 - 1;
  ndc.y = -(cy / h) * 2 + 1;
  pointer.x = ndc.x;
  pointer.y = ndc.y;
  raycaster.setFromCamera(ndc, camera);
  if (raycaster.ray.intersectPlane(interactPlane, _planeHit)) {
    pointerWorld.copy(_planeHit);
  }
  pointerActive = true;
}

const canvasEl = renderer.domElement;
canvasEl.style.touchAction = 'none';
canvasEl.style.cursor = 'crosshair';

function onPointerMove(e) { setNDC(e); }
function onPointerDown(e) {
  setNDC(e);
  pointerDown = true;
  try { canvasEl.setPointerCapture(e.pointerId); } catch (_) {}
  onDown(e);
}
function onPointerUp(e) {
  pointerDown = false;
  try { canvasEl.releasePointerCapture(e.pointerId); } catch (_) {}
  onUp(e);
}
function onPointerCancel() {
  pointerDown = false;
  onUp();
}

canvasEl.addEventListener('pointermove', onPointerMove, { passive: true });
canvasEl.addEventListener('pointerdown', onPointerDown, { passive: true });
canvasEl.addEventListener('pointerup', onPointerUp, { passive: true });
canvasEl.addEventListener('pointercancel', onPointerCancel, { passive: true });
canvasEl.addEventListener('pointerleave', () => { /* keep last pointer for hover demos */ });
// Fallback for environments that only deliver window-level moves
addEventListener('pointermove', (e) => {
  if (e.target === canvasEl) return;
  setNDC(e);
});

let onDown = () => {};
let onUp = () => {};
let tick = (_dt, _t) => {};

function makeMat(color, opts = {}) {
  return new THREE.MeshStandardMaterial({
    color, roughness: opts.roughness ?? 0.45, metalness: opts.metalness ?? 0.08,
    emissive: opts.emissive ?? 0x000000, emissiveIntensity: opts.emissiveIntensity ?? 0,
  });
}

function syncMesh(mesh, body) {
  mesh.position.copy(body.position);
  mesh.quaternion.copy(body.quaternion);
}

// —— Demo builders ——
function buildGravity() {
  const world = new CANNON.World({ gravity: new CANNON.Vec3(0, still ? 0 : -9.82, 0) });
  world.allowSleep = true;
  world.defaultContactMaterial.friction = 0.35;
  world.defaultContactMaterial.restitution = 0.72;

  const groundBody = new CANNON.Body({ mass: 0, shape: new CANNON.Plane() });
  groundBody.quaternion.setFromEuler(-Math.PI / 2, 0, 0);
  world.addBody(groundBody);

  const ball = new THREE.Mesh(new THREE.SphereGeometry(0.28, 28, 20), makeMat(ACCENT, { roughness: 0.28 }));
  scene.add(ball);
  const body = new CANNON.Body({
    mass: 1.2,
    shape: new CANNON.Sphere(0.28),
    position: new CANNON.Vec3(0, 2.6, 0),
    linearDamping: 0.05,
    angularDamping: 0.08,
  });
  world.addBody(body);

  const shadow = new THREE.Mesh(
    new THREE.CircleGeometry(0.32, 24),
    new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.12 })
  );
  shadow.rotation.x = -Math.PI / 2;
  shadow.position.y = 0.01;
  if (!embed) scene.add(shadow);
  else shadow.visible = false;

  function toss() {
    if (still) return;
    body.wakeUp();
    body.velocity.set((Math.random() - 0.5) * 3.5, 4.2 + Math.random() * 1.5, (Math.random() - 0.5) * 1.2);
    body.angularVelocity.set(Math.random() * 4, Math.random() * 2, Math.random() * 4);
    body.position.y = Math.max(body.position.y, 1.4);
  }
  onDown = toss;

  tick = (dt) => {
    if (!still) world.fixedStep();
    syncMesh(ball, body);
    shadow.position.x = body.position.x;
    shadow.position.z = body.position.z;
    shadow.scale.setScalar(1.1 - Math.min(0.55, body.position.y * 0.18));
  };
}

function buildSpring() {
  const anchor = new THREE.Vector3(0, 2.85, 0);
  const mass = { pos: new THREE.Vector3(0, 1.35, 0), vel: new THREE.Vector3(), m: 1.4 };
  const k = 28;
  const zeta = 0.22;
  const c = zeta * 2 * Math.sqrt(k * mass.m);
  const rest = 1.35;

  const peg = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 0.14, 16), makeMat(INK));
  peg.position.copy(anchor);
  scene.add(peg);

  const bob = new THREE.Mesh(new THREE.SphereGeometry(0.32, 28, 20), makeMat(VIOLET, { roughness: 0.35 }));
  scene.add(bob);

  const springGeo = new THREE.BufferGeometry().setFromPoints([anchor, mass.pos]);
  const springLine = new THREE.Line(springGeo, new THREE.LineBasicMaterial({ color: 0x5a5348 }));
  scene.add(springLine);

  const plane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
  const hit = new THREE.Vector3();
  let dragging = false;

  onDown = () => {
    raycaster.setFromCamera(ndc, camera);
    if (raycaster.ray.intersectPlane(plane, hit)) {
      if (hit.distanceTo(mass.pos) < 0.85) dragging = true;
    }
  };
  onUp = () => { dragging = false; };

  tick = (dt) => {
    if (dragging) {
      raycaster.setFromCamera(ndc, camera);
      if (raycaster.ray.intersectPlane(plane, hit)) {
        mass.pos.x += (hit.x - mass.pos.x) * 0.55;
        mass.pos.y += (Math.max(0.45, hit.y) - mass.pos.y) * 0.55;
        mass.vel.set(0, 0, 0);
      }
    } else if (!still) {
      const dx = mass.pos.x - anchor.x;
      const dy = mass.pos.y - (anchor.y - rest);
      const fx = -k * dx - c * mass.vel.x;
      const fy = -k * dy - c * mass.vel.y - 9.82 * mass.m * 0.08;
      mass.vel.x += (fx / mass.m) * dt;
      mass.vel.y += (fy / mass.m) * dt;
      mass.pos.x += mass.vel.x * dt;
      mass.pos.y += mass.vel.y * dt;
      if (mass.pos.y < 0.35) { mass.pos.y = 0.35; mass.vel.y *= -0.2; }
    }
    bob.position.copy(mass.pos);
    springGeo.setFromPoints([anchor, mass.pos]);
    springGeo.attributes.position.needsUpdate = true;
  };
}

function buildCollision() {
  const world = new CANNON.World({ gravity: new CANNON.Vec3(0, still ? 0 : -9.82, 0) });
  world.defaultContactMaterial.friction = 0.2;
  world.defaultContactMaterial.restitution = 0.85;
  const ground = new CANNON.Body({ mass: 0, shape: new CANNON.Plane() });
  ground.quaternion.setFromEuler(-Math.PI / 2, 0, 0);
  world.addBody(ground);
  // Back wall (visual at z=-3.2). Camera at +Z looks toward -Z — throws go into depth.
  const backWall = new CANNON.Body({ mass: 0, shape: new CANNON.Plane() });
  backWall.position.set(0, 0, -3.05);
  world.addBody(backWall);
  // Soft near clip so boxes don't sail past the camera forever
  const nearWall = new CANNON.Body({ mass: 0, shape: new CANNON.Plane() });
  nearWall.quaternion.setFromEuler(0, Math.PI, 0);
  nearWall.position.set(0, 0, 3.6);
  world.addBody(nearWall);

  function makeBox(color, mass, x, y) {
    const mesh = new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.55, 0.55), makeMat(color));
    scene.add(mesh);
    const body = new CANNON.Body({
      mass,
      shape: new CANNON.Box(new CANNON.Vec3(0.275, 0.275, 0.275)),
      position: new CANNON.Vec3(x, y, 0),
      linearDamping: 0.04,
      angularDamping: 0.06,
    });
    world.addBody(body);
    return { mesh, body };
  }

  const boxes = [
    makeBox(ACCENT, 1.0, -1.6, 0.28),
    makeBox(TEAL, 2.4, 1.4, 0.28),
    makeBox(VIOLET, 0.85, 0.0, 0.28),
  ];
  for (const b of boxes) b.body.velocity.set(0, 0, 0);

  const hit = new THREE.Vector3();
  const prevHit = new THREE.Vector3();
  let grabbed = null;
  let grabOffset = new THREE.Vector3();
  let lastSampleT = 0;
  const throwVel = new THREE.Vector3();

  function pickBox() {
    raycaster.setFromCamera(ndc, camera);
    const hits = raycaster.intersectObjects(boxes.map((b) => b.mesh), false);
    if (hits.length) {
      return boxes.find((b) => b.mesh === hits[0].object) || null;
    }
    if (!raycaster.ray.intersectPlane(interactPlane, hit)) return null;
    let best = null;
    let bestD = 0.75;
    for (const b of boxes) {
      const d = Math.hypot(b.body.position.x - hit.x, b.body.position.y - hit.y);
      if (d < bestD) { bestD = d; best = b; }
    }
    return best;
  }

  function firePair() {
    // Alternate / fire whichever boxes are settled — both can be launched
    const left = boxes[0];
    const right = boxes[1];
    const mid = boxes[2];
    left.body.wakeUp();
    right.body.wakeUp();
    mid.body.wakeUp();
    left.body.position.set(-1.7, 0.28, 0);
    right.body.position.set(1.5, 0.28, 0);
    mid.body.position.set(0.1, 1.1, 0);
    left.body.velocity.set(6.2, 1.1, -3.8);
    right.body.velocity.set(-1.2, 0.4, -2.4);
    mid.body.velocity.set((Math.random() - 0.5) * 2.5, 2.2, -4.2);
    left.body.angularVelocity.set(0, 0, -2);
    right.body.angularVelocity.set(0, 0, 1.2);
    mid.body.angularVelocity.set(0, 1.5, 0);
  }

  onDown = () => {
    if (still) return;
    const picked = pickBox();
    if (picked) {
      grabbed = picked;
      grabbed.body.wakeUp();
      grabbed.body.velocity.set(0, 0, 0);
      grabbed.body.angularVelocity.set(0, 0, 0);
      raycaster.setFromCamera(ndc, camera);
      if (raycaster.ray.intersectPlane(interactPlane, hit)) {
        grabOffset.set(
          grabbed.body.position.x - hit.x,
          grabbed.body.position.y - hit.y,
          0
        );
        prevHit.copy(hit);
        throwVel.set(0, 0, 0);
        lastSampleT = performance.now();
      }
      canvasEl.style.cursor = 'grabbing';
    } else {
      firePair();
    }
  };

  onUp = () => {
    if (grabbed && !still) {
      grabbed.body.wakeUp();
      const speed = throwVel.length();
      const boost = Math.min(14, 4 + speed * 1.1);
      if (speed > 0.05) {
        const dir = throwVel.clone().normalize();
        // Camera-forward depth is -Z (toward back wall). Screen flick drives XY; always push into depth.
        const vz = -Math.min(12, Math.max(3.2, boost * 0.72 + speed * 0.35));
        grabbed.body.velocity.set(
          dir.x * boost,
          Math.max(0.15, dir.y * boost * 0.85),
          vz
        );
        grabbed.body.angularVelocity.set(
          Math.max(-4, Math.min(4, -dir.y * boost * 0.28)),
          -boost * 0.18,
          -dir.x * boost * 0.4
        );
      } else {
        // Soft flick / release still sends a nudge toward the back wall
        grabbed.body.velocity.set(0, 0.4, -2.8);
      }
    }
    grabbed = null;
    canvasEl.style.cursor = 'crosshair';
  };

  tick = (dt) => {
    if (grabbed && !still) {
      raycaster.setFromCamera(ndc, camera);
      if (raycaster.ray.intersectPlane(interactPlane, hit)) {
        const tx = hit.x + grabOffset.x;
        const ty = Math.max(0.28, hit.y + grabOffset.y);
        const now = performance.now();
        const sampleDt = Math.max(0.008, (now - lastSampleT) / 1000);
        throwVel.set(
          (hit.x - prevHit.x) / sampleDt,
          (hit.y - prevHit.y) / sampleDt,
          0
        );
        prevHit.copy(hit);
        lastSampleT = now;
        grabbed.body.wakeUp();
        grabbed.body.position.x = tx;
        grabbed.body.position.y = ty;
        grabbed.body.position.z = 0;
        grabbed.body.velocity.set(0, 0, 0);
        grabbed.body.angularVelocity.set(0, 0, 0);
      }
    }
    if (!still) world.fixedStep();
    for (const b of boxes) syncMesh(b.mesh, b.body);
  };
}

function buildConstraints() {
  const world = new CANNON.World({ gravity: new CANNON.Vec3(0, still ? 0 : -9.82, 0) });
  world.allowSleep = true;

  const post = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.09, 2.4, 12), makeMat(0x3a342c));
  post.position.set(0, 1.2, 0);
  scene.add(post);
  const arm = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.08, 0.08), makeMat(0x4a4338));
  arm.position.set(0.55, 2.35, 0);
  scene.add(arm);

  const anchorBody = new CANNON.Body({ mass: 0, position: new CANNON.Vec3(1.2, 2.35, 0) });
  world.addBody(anchorBody);

  // Vivid blue bob — prior ACCENT+hot PointLight washed the sphere to pale white under embed lights.
  const CONSTRAINT_BLUE = 0x2f7cf6;
  const lampMesh = new THREE.Mesh(new THREE.SphereGeometry(0.22, 20, 16), makeMat(CONSTRAINT_BLUE, {
    roughness: 0.34, metalness: 0.1,
    emissive: 0x1a4fd0, emissiveIntensity: embed ? 0.62 : 0.45,
  }));
  scene.add(lampMesh);
  const lampLight = new THREE.PointLight(0x5a9bff, embed ? 4.5 : 6.5, 7);
  lampMesh.add(lampLight);

  const lampBody = new CANNON.Body({
    mass: 0.8,
    shape: new CANNON.Sphere(0.22),
    position: new CANNON.Vec3(1.2, 1.35, 0),
    linearDamping: 0.12,
    angularDamping: 0.2,
  });
  world.addBody(lampBody);
  const constraint = new CANNON.PointToPointConstraint(
    anchorBody, new CANNON.Vec3(0, 0, 0),
    lampBody, new CANNON.Vec3(0, 0.22, 0)
  );
  world.addConstraint(constraint);

  const cordGeo = new THREE.BufferGeometry().setFromPoints([
    new THREE.Vector3(1.2, 2.35, 0), new THREE.Vector3(1.2, 1.35, 0),
  ]);
  const cord = new THREE.Line(cordGeo, new THREE.LineBasicMaterial({ color: 0x2a2620 }));
  scene.add(cord);

  const plane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
  const hit = new THREE.Vector3();
  let dragging = false;
  onDown = () => {
    raycaster.setFromCamera(ndc, camera);
    if (raycaster.ray.intersectPlane(plane, hit) && hit.distanceTo(lampMesh.position) < 1.0) {
      dragging = true;
    }
  };
  onUp = () => { dragging = false; };

  tick = () => {
    if (dragging && !still) {
      raycaster.setFromCamera(ndc, camera);
      if (raycaster.ray.intersectPlane(plane, hit)) {
        lampBody.wakeUp();
        const target = hit.clone();
        target.y = Math.max(0.4, Math.min(2.1, target.y));
        lampBody.velocity.set(
          (target.x - lampBody.position.x) * 8,
          (target.y - lampBody.position.y) * 8,
          0
        );
      }
    }
    if (!still) world.fixedStep();
    syncMesh(lampMesh, lampBody);
    cordGeo.setFromPoints([
      new THREE.Vector3(1.2, 2.35, 0),
      lampMesh.position.clone(),
    ]);
    cordGeo.attributes.position.needsUpdate = true;
  };
}

function buildCloth() {
  // Richer fabric: denser mesh, shear links, full-rail pin, velvet sheen, wind draping, warm rim light.
  const cols = 22;
  const rows = 18;
  const rest = 0.105;
  const particles = [];
  const originX = -((cols - 1) * rest) / 2;
  const originY = 2.62;
  const railZ = 0.02;

  for (let y = 0; y < rows; y++) {
    for (let x = 0; x < cols; x++) {
      // Soft initial drape so folds read immediately (not a flat sheet).
      const fold = Math.sin(x * 0.55) * 0.04 * (y / Math.max(1, rows - 1));
      const sag = (y / Math.max(1, rows - 1)) * (y / Math.max(1, rows - 1)) * 0.08;
      const px = originX + x * rest;
      const py = originY - y * rest - sag;
      const pz = fold;
      particles.push({
        pos: new THREE.Vector3(px, py, pz),
        prev: new THREE.Vector3(px, py, pz),
        pinned: y === 0, // hang from full top rail for heavier draping
      });
    }
  }

  const constraints = [];
  function link(a, b) {
    constraints.push({ a, b, rest: particles[a].pos.distanceTo(particles[b].pos) });
  }
  for (let y = 0; y < rows; y++) {
    for (let x = 0; x < cols; x++) {
      const i = y * cols + x;
      if (x < cols - 1) link(i, i + 1);
      if (y < rows - 1) link(i, i + cols);
      // Shear (diagonal) — fabric resists diamond collapse, richer folds
      if (x < cols - 1 && y < rows - 1) {
        link(i, i + cols + 1);
        link(i + 1, i + cols);
      }
    }
  }

  // Brass hanging rail
  const railW = (cols - 1) * rest + 0.18;
  const rail = new THREE.Mesh(
    new THREE.CylinderGeometry(0.035, 0.035, railW, 16),
    new THREE.MeshStandardMaterial({ color: 0xc4a574, roughness: 0.32, metalness: 0.85 })
  );
  rail.rotation.z = Math.PI / 2;
  rail.position.set(0, originY + 0.02, railZ);
  scene.add(rail);
  for (const side of [-1, 1]) {
    const knob = new THREE.Mesh(
      new THREE.SphereGeometry(0.055, 12, 10),
      new THREE.MeshStandardMaterial({ color: 0xb8955a, roughness: 0.28, metalness: 0.9 })
    );
    knob.position.set(side * railW * 0.5, originY + 0.02, railZ);
    scene.add(knob);
  }

  // Cloth-only warm key + cool rim so velvet sheen reads in embed (no floor/back plate).
  const clothKey = new THREE.DirectionalLight(0xffe2c4, embed ? 1.55 : 1.15);
  clothKey.position.set(2.2, 5.5, 3.2);
  scene.add(clothKey);
  const clothRim = new THREE.DirectionalLight(0x9bb6ff, embed ? 0.85 : 0.55);
  clothRim.position.set(-3.2, 2.8, -2.4);
  scene.add(clothRim);
  const clothFill = new THREE.PointLight(0xff8a5c, embed ? 28 : 14, 12);
  clothFill.position.set(-1.4, 2.0, 2.6);
  scene.add(clothFill);

  const geo = new THREE.BufferGeometry();
  const positions = new Float32Array(cols * rows * 3);
  const uvs = new Float32Array(cols * rows * 2);
  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  for (let y = 0; y < rows; y++) {
    for (let x = 0; x < cols; x++) {
      const i = y * cols + x;
      uvs[i * 2] = x / (cols - 1);
      uvs[i * 2 + 1] = 1 - y / (rows - 1);
    }
  }
  geo.setAttribute('uv', new THREE.BufferAttribute(uvs, 2));
  const indices = [];
  for (let y = 0; y < rows - 1; y++) {
    for (let x = 0; x < cols - 1; x++) {
      const i = y * cols + x;
      indices.push(i, i + cols, i + 1, i + 1, i + cols, i + cols + 1);
    }
  }
  geo.setIndex(indices);
  geo.computeVertexNormals();

  // Procedural weave tint via canvas texture (subtle warp/weft)
  const cnv = document.createElement('canvas');
  cnv.width = 256; cnv.height = 256;
  const ctx = cnv.getContext('2d');
  const base = embed ? '#e8785a' : '#8a7bb8';
  ctx.fillStyle = base;
  ctx.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 256; i += 4) {
    ctx.fillStyle = i % 8 === 0 ? 'rgba(255,255,255,0.07)' : 'rgba(0,0,0,0.05)';
    ctx.fillRect(i, 0, 2, 256);
    ctx.fillRect(0, i, 256, 2);
  }
  // Soft vignette folds cue
  const grad = ctx.createRadialGradient(128, 40, 20, 128, 140, 180);
  grad.addColorStop(0, 'rgba(255,220,180,0.18)');
  grad.addColorStop(1, 'rgba(40,10,30,0.22)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, 256, 256);
  const weave = new THREE.CanvasTexture(cnv);
  weave.wrapS = weave.wrapT = THREE.RepeatWrapping;
  weave.repeat.set(3.2, 2.6);
  weave.colorSpace = THREE.SRGBColorSpace;

  const mat = new THREE.MeshPhysicalMaterial({
    map: weave,
    color: embed ? 0xff8f6a : 0xb5a6d6,
    roughness: 0.72,
    metalness: 0.02,
    sheen: 1.0,
    sheenRoughness: 0.42,
    sheenColor: new THREE.Color(embed ? 0xffd2a8 : 0xe8dff8),
    clearcoat: 0.08,
    clearcoatRoughness: 0.7,
    side: THREE.DoubleSide,
    flatShading: false,
    emissive: embed ? 0x2a0c08 : 0x0a0612,
    emissiveIntensity: embed ? 0.16 : 0.06,
  });
  const mesh = new THREE.Mesh(geo, mat);
  scene.add(mesh);

  // Pin beads along the rail (every few verts)
  const pinIdx = [];
  for (let x = 0; x < cols; x += Math.max(1, Math.floor(cols / 6))) pinIdx.push(x);
  if (pinIdx[pinIdx.length - 1] !== cols - 1) pinIdx.push(cols - 1);
  for (const i of pinIdx) {
    const m = new THREE.Mesh(
      new THREE.SphereGeometry(0.038, 10, 8),
      new THREE.MeshStandardMaterial({ color: 0x1a1520, roughness: 0.45, metalness: 0.35 })
    );
    m.position.copy(particles[i].pos);
    m.position.y += 0.01;
    scene.add(m);
  }

  let grab = -1;
  const plane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
  const hit = new THREE.Vector3();
  onDown = () => {
    raycaster.setFromCamera(ndc, camera);
    if (!raycaster.ray.intersectPlane(plane, hit)) return;
    let best = -1; let bestD = 0.38;
    for (let i = 0; i < particles.length; i++) {
      const d = particles[i].pos.distanceTo(hit);
      if (d < bestD) { bestD = d; best = i; }
    }
    grab = best;
  };
  onUp = () => { grab = -1; };

  let tCloth = 0;
  tick = (dt) => {
    tCloth += dt;
    if (!still) {
      const g = 9.82 * 0.38;
      const windAmp = embed ? 0.55 : 0.4;
      for (let i = 0; i < particles.length; i++) {
        const p = particles[i];
        if (p.pinned) continue;
        const y = Math.floor(i / cols);
        const x = i % cols;
        const vx = p.pos.x - p.prev.x;
        const vy = p.pos.y - p.prev.y;
        const vz = p.pos.z - p.prev.z;
        p.prev.copy(p.pos);
        // Gentle cross-breeze + vertical ripple for living drape
        const wind = Math.sin(tCloth * 1.15 + x * 0.35 + y * 0.12) * windAmp * (y / rows);
        const lift = Math.sin(tCloth * 0.7 + x * 0.2) * 0.08 * (y / rows);
        p.pos.x += vx * 0.978 + wind * dt * dt * 18;
        p.pos.y += vy * 0.978 - g * dt * dt + lift * dt * dt * 6;
        p.pos.z += vz * 0.978 + Math.sin(tCloth * 0.9 + x * 0.4) * 0.35 * (y / rows) * dt * dt * 14;
        if (p.pos.y < 0.05) { p.pos.y = 0.05; p.prev.y = p.pos.y; }
      }
      if (grab >= 0) {
        raycaster.setFromCamera(ndc, camera);
        if (raycaster.ray.intersectPlane(plane, hit)) {
          particles[grab].pos.copy(hit);
          particles[grab].prev.copy(hit);
        }
      }
      for (let iter = 0; iter < 5; iter++) {
        for (const c of constraints) {
          const pa = particles[c.a];
          const pb = particles[c.b];
          const dx = pb.pos.x - pa.pos.x;
          const dy = pb.pos.y - pa.pos.y;
          const dz = pb.pos.z - pa.pos.z;
          const dist = Math.hypot(dx, dy, dz) || 0.0001;
          const diff = (dist - c.rest) / dist;
          const ox = dx * 0.5 * diff;
          const oy = dy * 0.5 * diff;
          const oz = dz * 0.5 * diff;
          if (!pa.pinned) { pa.pos.x += ox; pa.pos.y += oy; pa.pos.z += oz; }
          if (!pb.pinned) { pb.pos.x -= ox; pb.pos.y -= oy; pb.pos.z -= oz; }
        }
      }
    }
    let i3 = 0;
    for (const p of particles) {
      positions[i3++] = p.pos.x;
      positions[i3++] = p.pos.y;
      positions[i3++] = p.pos.z;
    }
    geo.attributes.position.needsUpdate = true;
    geo.computeVertexNormals();
  };
}

function buildParticles() {
  const N = embed ? 560 : 900;
  // Embed: tighter XY bounds so the curl field reads as a floating cloud, not a square slab.
  const xSpan = embed ? 2.6 : 4.5;
  const yMin = embed ? 0.7 : 0.4;
  const ySpan = embed ? 1.7 : 2.6;
  const xBound = embed ? 1.45 : 2.6;
  const yLo = embed ? 0.55 : 0.2;
  const yHi = embed ? 2.55 : 3.1;
  const positions = new Float32Array(N * 3);
  const velocities = new Float32Array(N * 3);
  // funnel=1 (cubicle embeds) and the full particles panel: gold double helix.
  // Other embeds keep the upright ribbon.
  const helix = params.has('funnel') || !embed;
  const tornado = !helix && !embed;
  // Tornado funnel, world units: wide mouth, narrow base, particles on a vertical spiral.
  const funnelTopR = 0.66;
  const funnelBotR = 0.09;
  const funnelH = 2.15;
  const funnelTurns = 4;
  const funnelCy = embed ? 1.4 : 1.02;
  // Double helix: two strands of constant radius twisting around a vertical axis.
  const helixR = 0.46;
  const helixH = 1.85;
  const helixTurns = 3;
  const helixCy = embed ? 1.4 : 1.05;
  // Grove embed: each dot keeps a lane on a double spiral so the cloud is a ribbon, not a sprinkle.
  const laneR = (embed || tornado || helix) ? new Float32Array(N) : null;
  const laneAng = (embed || tornado || helix) ? new Float32Array(N) : null;
  const laneU = (tornado || helix) ? new Float32Array(N) : null;
  // Keep the ribbon tight, but stretch its local spiral vertically so it stands upright.
  const ribbonX = embed ? 0.68 : 1;
  const ribbonY = embed ? 1.42 : 1;
  if (helix) {
    const half = N >> 1;
    for (let i = 0; i < N; i++) {
      const arm = i < half ? 0 : 1;
      const j = i - arm * half;
      const count = arm === 0 ? half : N - half;
      const u = j / Math.max(1, count - 1);
      const ang = u * Math.PI * 2 * helixTurns + arm * Math.PI;
      const shell = 1 + (((j * 13) % 5) - 2) * 0.045;
      const rad = helixR * shell;
      laneU[i] = u;
      laneR[i] = rad;
      laneAng[i] = ang;
      positions[i * 3] = Math.cos(ang) * rad;
      positions[i * 3 + 1] = helixCy + (u - 0.5) * helixH;
      positions[i * 3 + 2] = Math.sin(ang) * rad;
      const w0 = 0.6;
      velocities[i * 3] = -Math.sin(ang) * w0 * rad;
      velocities[i * 3 + 1] = 0;
      velocities[i * 3 + 2] = Math.cos(ang) * w0 * rad;
    }
  } else if (tornado) {
    const half = N >> 1;
    for (let i = 0; i < N; i++) {
      const arm = i < half ? 0 : 1;
      const j = i - arm * half;
      const count = arm === 0 ? half : N - half;
      const u = j / Math.max(1, count - 1);
      const ang = u * Math.PI * 2 * funnelTurns + arm * Math.PI;
      const shell = 1 + (((j * 13) % 5) - 2) * 0.035;
      const rad = (funnelBotR + (funnelTopR - funnelBotR) * u) * shell;
      laneU[i] = u;
      laneR[i] = rad;
      laneAng[i] = ang;
      positions[i * 3] = Math.cos(ang) * rad;
      positions[i * 3 + 1] = funnelCy + (u - 0.5) * funnelH;
      positions[i * 3 + 2] = Math.sin(ang) * rad;
      const omega0 = 1.15;
      velocities[i * 3] = -Math.sin(ang) * omega0 * rad;
      velocities[i * 3 + 1] = 0;
      velocities[i * 3 + 2] = Math.cos(ang) * omega0 * rad;
    }
  } else if (embed) {
    const cy = 1.4;
    const half = N >> 1;
    const turns = 2.75;
    const r0 = 0.16;
    const r1 = 0.40;
    for (let i = 0; i < N; i++) {
      const arm = i < half ? 0 : 1;
      const j = i - arm * half;
      const count = arm === 0 ? half : N - half;
      const u = j / Math.max(1, count - 1);
      const ang = u * Math.PI * 2 * turns + arm * Math.PI;
      const rad = r0 + (r1 - r0) * u + (((j * 13) % 5) - 2) * 0.004;
      laneR[i] = rad;
      laneAng[i] = ang;
      positions[i * 3] = Math.cos(ang) * rad * ribbonX;
      positions[i * 3 + 1] = cy + Math.sin(ang) * rad * ribbonY;
      positions[i * 3 + 2] = (((j * 7) % 5) - 2) * 0.008;
      const omega0 = 1.15;
      velocities[i * 3] = -Math.sin(ang) * omega0 * rad * ribbonX;
      velocities[i * 3 + 1] = Math.cos(ang) * omega0 * rad * ribbonY;
      velocities[i * 3 + 2] = 0;
    }
  } else {
    for (let i = 0; i < N; i++) {
      positions[i * 3] = (Math.random() - 0.5) * xSpan;
      positions[i * 3 + 1] = yMin + Math.random() * ySpan;
      positions[i * 3 + 2] = (Math.random() - 0.5) * 1.2;
      velocities[i * 3] = 0;
      velocities[i * 3 + 1] = 0;
      velocities[i * 3 + 2] = 0;
    }
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  // Ribbon embeds stay orange/purple. Helix particles are reflective metal, not flat sprites.
  const __ptColor = (embed && !helix) ? 0xff6a00 : ACCENT;
  // Grove embed only: vertex color is the only change. No cream, ivory, or white swatches.
  let crispDot = null;
  let helixBeads = null;
  let beadMat = null;
  const metalName = (params.get('metal') || '').trim().toLowerCase();
  const _bead = new THREE.Object3D();
  if (helix) {
    // Polished steel beads. Env map is on the material only so floor and other demos stay put.
    // metal= swaps the bead finish only. Missing or unknown values stay this silver.
    const pmrem = new THREE.PMREMGenerator(renderer);
    const envMap = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
    pmrem.dispose();
    // Sketches, not the default. Each stays metalness 1 so the helix reads as beads, not tinted dots.
    const helixMetals = {
      copper: {
        // Warm polished copper. Clearcoat is the white glint; the body stays copper.
        color: 0xc4622d,
        roughness: 0.14,
        envMapIntensity: 1.5,
        clearcoat: 0.35,
        clearcoatRoughness: 0.05,
      },
      brass: {
        // Deeper yellow brass so the polished highlight is not the same value as the body.
        color: 0xa6842e,
        roughness: 0.12,
        envMapIntensity: 1.6,
        clearcoat: 0.6,
        clearcoatRoughness: 0.04,
      },
      violet: {
        // Near-black plum metal. A tight magenta sheen, not a solid purple fill.
        color: 0x1c1028,
        roughness: 0.24,
        envMapIntensity: 1.55,
        sheen: 1,
        sheenColor: 0xff4ad0,
        sheenRoughness: 0.15,
      },
      oil: {
        // White metal base; instance colors paint green and magenta patches the film then shifts.
        color: 0xffffff,
        roughness: 0.1,
        envMapIntensity: 1.35,
        clearcoat: 0.4,
        clearcoatRoughness: 0.05,
        iridescence: 0.4,
        iridescenceIOR: 1.8,
        iridescenceThicknessRange: [300, 860],
      },
    };
    const metalLook = helixMetals[metalName] || null;
    beadMat = new THREE.MeshPhysicalMaterial(Object.assign({
      color: 0xc5ccd4,
      metalness: 1,
      roughness: 0.18,
      envMap,
      envMapIntensity: 1.2,
    }, metalLook || {}));
    if (metalName === 'oil' && metalLook) {
      // One shared film would average to cyan on a bead a few pixels wide.
      // Each instance keeps its own thickness so neighbors land on different hues.
      beadMat.customProgramCacheKey = () => 'helix-oil-film';
      beadMat.onBeforeCompile = (shader) => {
        shader.uniforms.uFilmShift = { value: 0 };
        beadMat.userData.filmShader = shader;
        shader.vertexShader = shader.vertexShader
          .replace('#include <common>', '#include <common>\nvarying float vFilm;')
          .replace(
            '#include <begin_vertex>',
            '#include <begin_vertex>\n vFilm = fract(sin(float(gl_InstanceID) * 12.9898) * 43758.5453);'
          );
        shader.fragmentShader = shader.fragmentShader
          .replace('#include <common>', '#include <common>\nvarying float vFilm;\nuniform float uFilmShift;')
          .replace(
            'material.iridescenceThickness = iridescenceThicknessMaximum;',
            'material.iridescenceThickness = mix(300.0, 860.0, fract(vFilm + uFilmShift));'
          );
      };
    }
    const beadGeo = new THREE.SphereGeometry(embed ? 0.03 : 0.02, 16, 12);
    helixBeads = new THREE.InstancedMesh(beadGeo, beadMat, N);
    helixBeads.frustumCulled = false;
    for (let i = 0; i < N; i++) {
      _bead.position.set(positions[i * 3], positions[i * 3 + 1], positions[i * 3 + 2]);
      _bead.updateMatrix();
      helixBeads.setMatrixAt(i, _bead.matrix);
    }
    helixBeads.instanceMatrix.needsUpdate = true;
    if (metalName === 'oil') {
      // Patches, not confetti: a run of beads shares a green or magenta metal.
      const oilPalette = [0x1f9a6c, 0x147a62, 0x5ed6a2, 0xe23d92, 0xc21878, 0xff5cad];
      const oilColor = new THREE.Color();
      for (let i = 0; i < N; i++) {
        const band = Math.floor(i / 16);
        const h = Math.abs(Math.sin(band * 12.9898) * 43758.5453);
        const idx = Math.floor((h % 1) * oilPalette.length);
        oilColor.setHex(oilPalette[idx]);
        helixBeads.setColorAt(i, oilColor);
      }
      helixBeads.instanceColor.needsUpdate = true;
    }
    scene.add(helixBeads);
  }
  if (embed && !helix) {
    const colors = new Float32Array(N * 3);
    const orange = [0xff4d00, 0xff6a00, 0xff8c1a];
    const purple = [0x9b30ff, 0xc44dff, 0xe070ff];
    const tmp = new THREE.Color();
    const half = N >> 1;
    for (let i = 0; i < N; i++) {
      const arm = i < half ? 0 : 1;
      const swatches = arm === 0 ? orange : purple;
      tmp.setHex(swatches[i % swatches.length]);
      tmp.toArray(colors, i * 3);
    }
    geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
    const s = 64;
    const canvas = document.createElement('canvas');
    canvas.width = canvas.height = s;
    const g = canvas.getContext('2d');
    g.clearRect(0, 0, s, s);
    g.fillStyle = '#ffffff';
    g.beginPath();
    g.arc(s / 2, s / 2, s * 0.42, 0, Math.PI * 2);
    g.fill();
    crispDot = new THREE.CanvasTexture(canvas);
    crispDot.colorSpace = THREE.SRGBColorSpace;
    crispDot.needsUpdate = true;
  }
  // Embed ribbon: hard disc in pixels (no attenuation) so it reads as crisp points, not foggy squares.
  // Helix does not use this sprite. Ribbon vertex orange/purple still multiply a white disc.
  if (!helix) {
    const pts = new THREE.Points(
      geo,
      new THREE.PointsMaterial({
        color: (embed && !helix) ? 0xffffff : __ptColor,
        vertexColors: embed && !helix,
        map: crispDot || null,
        size: embed ? 4.0 : 0.045,
        sizeAttenuation: !embed,
        transparent: true, opacity: embed ? 1 : 0.9, depthWrite: false,
        alphaTest: embed ? 0.45 : 0,
      })
    );
    scene.add(pts);
  }

  // Visible cue so pointer drive is obvious
  const vortexMesh = new THREE.Mesh(
    new THREE.RingGeometry(
      tornado ? funnelTopR * 0.9 : (embed ? 0.05 : 0.18),
      tornado ? funnelTopR : (embed ? 0.09 : 0.28),
      tornado ? 48 : 32
    ),
    new THREE.MeshBasicMaterial({ color: __ptColor, transparent: true, opacity: embed ? 0.75 : 0.55, side: THREE.DoubleSide })
  );
  if (helix) {
    vortexMesh.visible = false;
  } else if (tornado) {
    vortexMesh.rotation.x = Math.PI / 2;
    vortexMesh.position.set(0, funnelCy + funnelH * 0.5, 0);
  } else {
    if (embed) vortexMesh.scale.set(ribbonX, ribbonY, 1);
    vortexMesh.position.set(0, 1.4, 0.05);
  }
  scene.add(vortexMesh);

  const vortex = new THREE.Vector3(0, helix ? helixCy : (tornado ? funnelCy : 1.4), 0);
  let funnelSpin = 0;
  let helixSpin = 0;
  tick = (dt, t) => {
    if (still) return;
    // Resting pattern is always a vortex. Follow pointer only while dragging;
    // on release, return to the idle vortex (pointerActive alone must not stick).
    if (helix) {
      // Drag scatters the dots. The helix axis stays put so they have a shape to return to.
      vortex.x = Math.sin(t * 0.3) * 0.16;
      vortex.y = helixCy + Math.cos(t * 0.24) * 0.06;
    } else if (pointerDown) {
      // Embed inset keeps the ribbon inside the frame instead of shattering on the walls.
      const edge = embed ? 0.52 : 0.15;
      vortex.x = THREE.MathUtils.clamp(pointerWorld.x, -xBound + edge, xBound - edge);
      vortex.y = THREE.MathUtils.clamp(pointerWorld.y, yLo + edge, yHi - edge);
    } else {
      // Idle vortex drift — default and post-interaction resting pattern
      vortex.x = Math.sin(t * 0.35) * (embed ? 0.55 : (tornado ? 0.28 : 0.9));
      vortex.y = (tornado ? funnelCy : (embed ? 1.4 : 1.35)) + Math.cos(t * 0.28) * (embed ? 0.22 : (tornado ? 0.1 : 0.35));
    }
    if (!helix) {
      vortexMesh.position.x = vortex.x;
      vortexMesh.position.y = tornado ? vortex.y + funnelH * 0.5 : vortex.y;
      if (tornado) vortexMesh.rotation.x = Math.PI / 2;
      vortexMesh.rotation.z = t * 1.8;
      vortexMesh.material.opacity = pointerDown ? 0.85 : 0.35;
    }

    if (helix) {
      // Hold scatters them. Release is a slow spring back onto the twisting strands.
      helixSpin += (pointerDown ? 0.2 : 0.6) * dt;
      const ks = pointerDown ? 0 : 16;
      const kd = pointerDown ? 0.35 : 8;
      const xMax = embed ? 1.2 : 2.1;
      const zMax = embed ? 1.05 : 1.5;
      const y0 = embed ? 0.5 : 0.2;
      const y1 = embed ? 2.35 : 2.85;
      for (let i = 0; i < N; i++) {
        const ix = i * 3;
        let x = positions[ix];
        let y = positions[ix + 1];
        let z = positions[ix + 2];
        const ang = laneAng[i] + helixSpin;
        const homeX = vortex.x + Math.cos(ang) * laneR[i];
        const homeY = vortex.y + (laneU[i] - 0.5) * helixH;
        const homeZ = Math.sin(ang) * laneR[i];
        let vx = velocities[ix];
        let vy = velocities[ix + 1];
        let vz = velocities[ix + 2];
        if (pointerDown) {
          const ox = x - vortex.x;
          const oy = y - vortex.y;
          const oz = z;
          const orad = Math.hypot(ox, oz) + 0.25;
          const sx = Math.sin(i * 12.9898);
          const sy = Math.cos(i * 78.233);
          const sz = Math.sin(i * 45.164);
          vx += (ox / orad * 3.4 + sx * 1.9) * dt;
          vy += (oy * 0.35 + sy * 2.3) * dt;
          vz += (oz / orad * 3.4 + sz * 1.9) * dt;
        }
        vx += ((homeX - x) * ks - vx * kd) * dt;
        vy += ((homeY - y) * ks - vy * kd) * dt;
        vz += ((homeZ - z) * ks - vz * kd) * dt;
        const sp = Math.hypot(vx, vy, vz);
        const cap = pointerDown ? 2.2 : 3.4;
        if (sp > cap) {
          const sc = cap / sp;
          vx *= sc; vy *= sc; vz *= sc;
        }
        x += vx * dt;
        y += vy * dt;
        z += vz * dt;
        if (x > vortex.x + xMax) { x = vortex.x + xMax; vx *= -0.25; }
        else if (x < vortex.x - xMax) { x = vortex.x - xMax; vx *= -0.25; }
        if (z > zMax) { z = zMax; vz *= -0.25; }
        else if (z < -zMax) { z = -zMax; vz *= -0.25; }
        if (y > y1) { y = y1; vy *= -0.25; }
        else if (y < y0) { y = y0; vy *= -0.25; }
        velocities[ix] = vx;
        velocities[ix + 1] = vy;
        velocities[ix + 2] = vz;
        positions[ix] = x;
        positions[ix + 1] = y;
        positions[ix + 2] = z;
      }
    } else if (tornado) {
      const omega = pointerDown ? 2.55 : 1.15;
      funnelSpin += omega * dt;
      const hold = pointerDown ? 10 : 18;
      const k = pointerDown ? 8 : 16;
      const blend = 1 - Math.exp(-k * dt);
      for (let i = 0; i < N; i++) {
        const ix = i * 3;
        let x = positions[ix];
        let y = positions[ix + 1];
        let z = positions[ix + 2];
        const dx = x - vortex.x;
        const dz = z;
        const r = Math.hypot(dx, dz) + 1e-4;
        const inv = 1 / r;
        const tx = -dz * inv;
        const tz = dx * inv;
        const nx = dx * inv;
        const nz = dz * inv;
        const ang = Math.atan2(dz, dx);
        let dang = laneAng[i] + funnelSpin - ang;
        dang = Math.atan2(Math.sin(dang), Math.cos(dang));
        const vTang = velocities[ix] * tx + velocities[ix + 2] * tz;
        const vRad = velocities[ix] * nx + velocities[ix + 2] * nz;
        const tangTarget = laneR[i] * (omega + dang * hold);
        const radTarget = -(r - laneR[i]) * hold;
        const wobble = pointerDown ? Math.sin(t * 1.4 + laneAng[i]) * 0.04 : 0;
        const newVTang = vTang + (tangTarget - vTang) * blend;
        const newVRad = vRad + (radTarget - vRad) * blend;
        const targetY = vortex.y + (laneU[i] - 0.5) * funnelH;
        const vYTarget = -(y - targetY) * hold;
        const newVY = velocities[ix + 1] + (vYTarget - velocities[ix + 1]) * blend;
        velocities[ix] = tx * (newVTang + wobble) + nx * newVRad;
        velocities[ix + 1] = newVY;
        velocities[ix + 2] = tz * (newVTang + wobble) + nz * newVRad;
        positions[ix] = x + velocities[ix] * dt;
        positions[ix + 1] = y + velocities[ix + 1] * dt;
        positions[ix + 2] = z + velocities[ix + 2] * dt;
      }
    } else if (embed) {
      const omega = pointerDown ? 2.55 : 1.15;
      const hold = pointerDown ? 10 : 18;
      const k = pointerDown ? 8 : 16;
      const blend = 1 - Math.exp(-k * dt);
      for (let i = 0; i < N; i++) {
        const ix = i * 3;
        let x = positions[ix];
        let y = positions[ix + 1];
        // Solve the curl in the ribbon's normalized ellipse so it stays upright
        // while following the pointer, rather than relaxing back to a round loop.
        const dx = (x - vortex.x) / ribbonX;
        const dy = (y - vortex.y) / ribbonY;
        const r = Math.hypot(dx, dy) + 1e-4;
        const inv = 1 / r;
        const tx = -dy * inv;
        const ty = dx * inv;
        const nx = dx * inv;
        const ny = dy * inv;
        const localVX = velocities[ix] / ribbonX;
        const localVY = velocities[ix + 1] / ribbonY;
        const vTang = localVX * tx + localVY * ty;
        const vRad = localVX * nx + localVY * ny;
        const tangTarget = omega * laneR[i];
        const radTarget = -(r - laneR[i]) * hold;
        const newVTang = vTang + (tangTarget - vTang) * blend;
        const newVRad = vRad + (radTarget - vRad) * blend;
        const wobble = pointerDown ? Math.sin(t * 1.4 + laneAng[i]) * 0.04 : 0;
        velocities[ix] = ribbonX * (tx * newVTang + nx * newVRad);
        velocities[ix + 1] = ribbonY * (ty * (newVTang + wobble) + ny * newVRad);
        x += velocities[ix] * dt;
        y += velocities[ix + 1] * dt;
        positions[ix] = x;
        positions[ix + 1] = y;
      }
    } else {
      const strength = pointerDown ? 2.4 : 0.85;
      for (let i = 0; i < N; i++) {
        const ix = i * 3;
        let x = positions[ix];
        let y = positions[ix + 1];
        const dx = x - vortex.x;
        const dy = y - vortex.y;
        const r2 = dx * dx + dy * dy + 0.06;
        const curl = strength / r2;
        const pull = pointerDown ? 0.55 / r2 : 0.2 / r2;
        velocities[ix] += ((-dy * curl - dx * pull) - velocities[ix] * 0.5) * dt;
        velocities[ix + 1] += ((dx * curl - dy * pull) + Math.sin(t * 0.7 + i * 0.01) * 0.12 - velocities[ix + 1] * 0.5) * dt;
        x += velocities[ix] * dt * 2.6;
        y += velocities[ix + 1] * dt * 2.6;
        if (x < -xBound || x > xBound) { x = Math.sign(x) * xBound * 0.92; velocities[ix] *= -0.4; }
        if (y < yLo || y > yHi) { y = Math.max(yLo, Math.min(yHi, y)); velocities[ix + 1] *= -0.4; }
        positions[ix] = x;
        positions[ix + 1] = y;
      }
    }
    geo.attributes.position.needsUpdate = true;
    if (helixBeads) {
      for (let i = 0; i < N; i++) {
        _bead.position.set(positions[i * 3], positions[i * 3 + 1], positions[i * 3 + 2]);
        _bead.updateMatrix();
        helixBeads.setMatrixAt(i, _bead.matrix);
      }
      helixBeads.instanceMatrix.needsUpdate = true;
      if (metalName === 'oil' && beadMat.userData.filmShader) {
        // Drift the film so a bead walks from green through magenta instead of sitting on one hue.
        beadMat.userData.filmShader.uniforms.uFilmShift.value = (t * 0.07) % 1;
      }
    }
  };
}

function buildStacking() {
  const world = new CANNON.World({ gravity: new CANNON.Vec3(0, still ? 0 : -9.82, 0) });
  world.allowSleep = true;
  world.defaultContactMaterial.friction = 0.55;
  world.defaultContactMaterial.restitution = 0.05;
  const ground = new CANNON.Body({ mass: 0, shape: new CANNON.Plane() });
  ground.quaternion.setFromEuler(-Math.PI / 2, 0, 0);
  world.addBody(ground);

  const colors = [PAPER, ACCENT, VIOLET, TEAL, 0xe8a87c];
  const crates = [];
  let n = 0;
  for (let row = 0; row < 4; row++) {
    for (let col = 0; col < 3 - Math.floor(row / 2); col++) {
      const s = 0.42 - row * 0.02;
      const mesh = new THREE.Mesh(
        new THREE.BoxGeometry(s, s, s),
        makeMat(colors[n % colors.length], { roughness: 0.5 })
      );
      scene.add(mesh);
      const body = new CANNON.Body({
        mass: 0.6 + row * 0.25,
        shape: new CANNON.Box(new CANNON.Vec3(s / 2, s / 2, s / 2)),
        position: new CANNON.Vec3((col - 1) * 0.5 + (row % 2) * 0.12, 0.22 + row * 0.46, 0),
        sleepSpeedLimit: 0.12,
        sleepTimeLimit: 0.4,
      });
      world.addBody(body);
      crates.push({ mesh, body });
      n++;
    }
  }

  onDown = () => {
    if (still) return;
    for (const c of crates) {
      c.body.wakeUp();
      c.body.applyImpulse(
        new CANNON.Vec3((Math.random() - 0.5) * 1.8, 0.6 + Math.random() * 1.2, (Math.random() - 0.5) * 0.6),
        new CANNON.Vec3((Math.random() - 0.5) * 0.15, 0, (Math.random() - 0.5) * 0.15)
      );
    }
  };

  tick = () => {
    if (!still) world.fixedStep();
    for (const c of crates) syncMesh(c.mesh, c.body);
  };
}

const builders = {
  gravity: buildGravity,
  spring: buildSpring,
  collision: buildCollision,
  constraints: buildConstraints,
  cloth: buildCloth,
  particles: buildParticles,
  stacking: buildStacking,
};
(builders[demo] || buildGravity)();
if (embed && (demo === 'cloth' || demo === 'particles')) fitEmbedOrbit(camera, null, scene, { margin: 1.6 });

function frame() {
  const dt = Math.min(0.033, clock.getDelta());
  const t = clock.elapsedTime;
  tick(dt, t);
  key.intensity = 1.0 + Math.sin(t * 0.6) * 0.05;
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
