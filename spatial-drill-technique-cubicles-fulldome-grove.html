<script>
/* Boot guard: if three/module fails (CDN/blocker), beige UI alone must not be silent. */
(function () {
  const tip = document.getElementById('gl-tip');
  let shown = false;
  function showBootFail(err) {
    if (shown || !tip) return;
    const stageEl = document.getElementById('stage');
    if (stageEl && stageEl.querySelector('canvas')) return; // module already started
    shown = true;
    const detail = (err && (err.message || String(err))) || 'unknown error';
    tip.hidden = false;
    tip.classList.add('show');
    tip.innerHTML = '3D failed to load — tap to reload<br><span style="font-size:11px;color:rgba(26,29,38,0.55);word-break:break-word"></span>';
    tip.querySelector('span').textContent = detail.slice(0, 220);
  }
  window.addEventListener('error', (e) => {
    const msg = e.message || (e.error && e.error.message) || '';
    if (!msg && !e.filename) return;
    // Ignore benign resize/resource noise; catch module / fetch / import failures
    if (/Failed to (fetch|load)|Importing a module|error loading dynamically|SyntaxError|TypeError|three/i.test(msg) ||
        (e.filename && /three|spatial-drill|vendor\/three/i.test(e.filename))) {
      showBootFail(e.error || new Error(msg || 'script error'));
    }
  });
  window.addEventListener('unhandledrejection', (e) => {
    showBootFail(e.reason || new Error('unhandled rejection'));
  });
  if (tip) tip.addEventListener('click', () => { location.reload(); });
  setTimeout(() => {
    const stage = document.getElementById('stage');
    if (stage && !stage.querySelector('canvas')) {
      showBootFail(new Error('module did not start (no WebGL canvas)'));
    }
  }, 4000);
})();
</script>
<script type="module">
import * as THREE from 'three';
import { CSS3DRenderer, CSS3DObject } from 'three/addons/renderers/CSS3DRenderer.js';
import { Water } from 'three/addons/objects/Water.js';

const params = new URLSearchParams(location.search);
// Also accept #chrome=N / #chrome:N for temporary look switches
const hashParams = new URLSearchParams(String(location.hash || '').replace(/^#/, '').replace(/,/g, '&'));
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches || params.has('still');
if (reduceMotion) document.body.classList.add('reduce');

/** Temporary chrome HDR look for aisle cypresses: ?chrome=1|2|3 (or #chrome=N). */
function resolveChromeVariant() {
  const raw = params.get('chrome') || hashParams.get('chrome') || '1';
  const n = parseInt(String(raw).replace(/[^0-9]/g, ''), 10);
  if (n === 2 || n === 3) return n;
  return 1;
}
const chromeVariant = resolveChromeVariant();
const CHROME_LOOK = {
  1: 'heavy-mirror',
  2: 'brushed-gold-canopy',
  3: 'cooler-purple-chrome',
}[chromeVariant];
console.info('[cubicles] chrome variant', chromeVariant, CHROME_LOOK);

/** Outer box interior (visible walls). 5×4×1 equal cells + entrance foyer. */
const OUTER_W = 32;   // X — roomier cells for pointer
const OUTER_D = 30;   // Z — deeper so foyer + grid both fit
const OUTER_H = 12.0; // Y — cathedral vault for chrome cypress nave
const COLS = 5;
const ROWS = 4;
/** Empty entrance strip on +Z; cells do NOT cover this AABB. */

const GRID_Z_MAX = OUTER_D / 2 - FOYER_DEPTH;    // foyer starts here
const GRID_D = GRID_Z_MAX - GRID_Z_MIN;          // depth of 5×4 field
const CELL_W = OUTER_W / COLS;
const CELL_D = GRID_D / ROWS;
const EYE = 1.65;
const MAX_ARMED = 8;
/** Arm embeds across ~full grid depth so back rows stay live while walking. */
const ARM_DIST = Math.max(22, GRID_D * 0.95);
/** Reach deep enough for far-wall cells (row 3–4) from the cell aisle. */
const INTERACT_DIST = Math.max(20, CELL_D * 3.6);
function interactDistFor(panel) {
  if (!panel) return INTERACT_DIST;
  // Back half of the grid needs more slack — wallpaper + deeper standing line.
  return panel.row >= 2 ? INTERACT_DIST * 1.35 : INTERACT_DIST;
}
let hoverPanel = null; // panel under cursor (screen ray)
/** Mid-foyer spawn: outside every cell AABB, looking −Z at the grid */
const SPAWN = {
  x: 0,
  y: EYE,
  z: (GRID_Z_MAX + OUTER_D / 2) * 0.5, // center of foyer strip
  yaw: 0,
  pitch: -0.04,
};
/** ?aisle=1 / ?view=aisle — stand beside a column aisle looking at chrome cypresses between panels. */
const wantAisle = params.has('aisle') || params.get('view') === 'aisle' || hashParams.get('view') === 'aisle';
if (wantAisle) {
  // Foyer edge looking −Z into a column aisle of cathedral chrome cypresses
  const aisleX = -OUTER_W / 2 + CELL_W * 1.0;
  SPAWN.x = aisleX + 3.15; // clearance so near-plane does not slice buttress flare
  SPAWN.z = GRID_Z_MAX + 3.8; // foyer edge — full Taxodium midground
  SPAWN.yaw = 0.16;
  SPAWN.pitch = 0.06; // waterline + knees grounded; canopy still in frame
  console.info('[cubicles] aisle viewpoint', SPAWN.x.toFixed(2), SPAWN.z.toFixed(2), 'yaw', SPAWN.yaw, 'pitch', SPAWN.pitch);
}
// Optional still-camera overrides: ?camx=&camz=&yaw=&pitch=
{
  const cx = params.get('camx') ?? hashParams.get('camx');
  const cz = params.get('camz') ?? hashParams.get('camz');
  const cyaw = params.get('yaw') ?? hashParams.get('yaw');
  const cpitch = params.get('pitch') ?? hashParams.get('pitch');
  if (cx != null && cx !== '') SPAWN.x = parseFloat(cx);
  if (cz != null && cz !== '') SPAWN.z = parseFloat(cz);
  if (cyaw != null && cyaw !== '') SPAWN.yaw = parseFloat(cyaw);
  if (cpitch != null && cpitch !== '') SPAWN.pitch = parseFloat(cpitch);
}

const CELLS = [
  { id: 'glass', num: '01', name: 'Transmission glass', hint: 'Drag to orbit · thick glass', src: './webgl-lab/01-transmission-glass.html?embed=1&v=noghost2' },
  { id: 'caustics', num: '02', name: 'Caustics', hint: 'Projected caustic pattern', src: './webgl-lab/02-caustics.html?embed=1&v=noghost2' },
  { id: 'god-rays', num: '03', name: 'God rays', hint: 'Volumetric window rays', src: './webgl-lab/03-god-rays.html?embed=1&v=noghost2' },
  { id: 'ssr', num: '04', name: 'SSR', hint: 'Screen-space reflections', src: './webgl-lab/04-ssr.html?embed=1&v=noghost2' },
  { id: 'ssao', num: '05', name: 'SSAO', hint: 'Contact occlusion', src: './webgl-lab/05-ssao.html?embed=1&v=noghost2' },
  { id: 'pcss', num: '06', name: 'PCSS shadows', hint: 'Soft + contact shadows', src: './webgl-lab/06-pcss-contact-shadows.html?embed=1&v=noghost2' },
  { id: 'outline', num: '07', name: 'Outline selection', hint: 'Click to select', src: './webgl-lab/07-outline-selection.html?embed=1&v=noghost2' },
  { id: 'stencil', num: '08', name: 'Stencil portals', hint: 'Look through the frame', src: './webgl-lab/08-stencil-portals.html?embed=1&v=noghost2' },
  { id: 'decals', num: '09', name: 'Decals', hint: 'Stamp Hobbit opening phrases', src: './webgl-lab/09-decals.html?embed=1&v=noghost2' },
  { id: 'hdr-ibl', num: '10', name: 'HDR IBL / PMREM', hint: 'Chrome under HDR', src: './webgl-lab/10-hdr-ibl-pmrem.html?embed=1&v=noghost2' },

  { id: 'lut', num: '15', name: 'LUT color grade', hint: 'Keys 1–4 switch looks', src: './webgl-lab/15-lut-color-grade.html?embed=1&v=noghost2' },
  { id: 'morph', num: '16', name: 'Morph targets', hint: 'Blend shapes', src: './webgl-lab/16-morph-targets.html?embed=1&v=noghost2' },
  { id: 'ribbons', num: '17', name: 'Fat ribbons', hint: 'Screen-space trails', src: './webgl-lab/17-fat-ribbons.html?embed=1&v=noghost2' },
  { id: 'dolly', num: '18', name: 'Camera dolly', hint: 'Scroll to dolly', src: './webgl-lab/18-scroll-camera-dolly.html?embed=1&v=noghost2' },
  { id: 'cloth', num: '19', name: 'Cloth', hint: 'Verlet soft body · physics', src: './physics-panel.html?demo=cloth&embed=1&v=noghost2' },
  { id: 'particles', num: '20', name: 'Flow particles', hint: 'Curl field · physics', src: './physics-panel.html?demo=particles&embed=1&v=noghost2' },
];

const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: 'high-performance' });
const forceDesktop = params.has('desktop') || params.get('hq') === '1' || hashParams.get('desktop') === '1';

let glContextLost = false;

function hideGlTip() {
  if (!glTip) return;
  glTip.hidden = true;

}
renderer.domElement.addEventListener('webglcontextlost', (e) => {
  e.preventDefault();

  glContextLost = false;

const yaw = { value: SPAWN.yaw };

// Non-blocking: failures fall back; never blocks WebGL boot.

/** Magenta/gold-family equirect; punchy specular lobes for liquid mercury. */
function makeMagentaGoldEquirect(size = 512, variant = chromeVariant) {
  const data = new Float32Array(size * size * 4);
  for (let y = 0; y < size; y++) {
    for (let x = 0; x < size; x++) {
      const u = x / size;
      const v = y / size;
      const gold = Math.pow(Math.max(0, Math.cos((u - 0.18) * Math.PI * 2) * 0.55 + 0.35), 2.05);
      const gold2 = Math.pow(Math.max(0, Math.cos((u - 0.72) * Math.PI * 2) * 0.4 + 0.2), 2.2);
      const magenta = Math.pow(Math.max(0, 1 - Math.abs(v - 0.42) * 1.8), 1.45);
      const vault = Math.pow(Math.max(0, v - 0.55), 1.25);
      const coolBand = Math.pow(Math.max(0, 1 - Math.abs(v - 0.55) * 2.2), 1.8);
      // Hot specular windows — extreme beads for mercury chrome
      const winA = Math.pow(Math.max(0, 1 - Math.hypot(u - 0.22, v - 0.62) * 9), 4.5) * 4.2;
      const winB = Math.pow(Math.max(0, 1 - Math.hypot(u - 0.78, v - 0.58) * 11), 5.0) * 3.6;
      const winC = Math.pow(Math.max(0, 1 - Math.hypot(u - 0.5, v - 0.78) * 7), 3.8) * 3.0;
      const i = (y * size + x) * 4;
      let r, g, b;
      if (variant === 2) {
        r = 0.18 + gold * 4.4 + gold2 * 2.6 + magenta * 0.55 + vault * 0.55 + winA * 1.2 + winC;
        g = 0.08 + gold * 3.0 + gold2 * 1.7 + magenta * 0.08 + vault * 0.2 + winA * 0.85 + winC * 0.7;
        b = 0.06 + magenta * 1.4 + vault * 0.9 + gold * 0.25 + winB * 0.35;
      } else if (variant === 3) {
        r = 0.10 + gold * 1.4 + gold2 * 0.6 + magenta * 2.0 + coolBand * 1.2 + vault * 0.5 + winA * 0.6 + winB * 0.9;
        g = 0.03 + gold * 0.7 + magenta * 0.25 + coolBand * 0.35;
        b = 0.22 + magenta * 3.8 + coolBand * 2.8 + vault * 2.2 + gold * 0.15 + winB * 1.4 + winC * 0.5;
      } else {
        // Dark cathedral vault + hot gold/magenta specular windows (mercury beads)
        r = 0.03 + gold * 2.2 + gold2 * 1.1 + magenta * 0.35 + vault * 0.15 + winA * 3.8 + winC * 2.8;
        g = 0.015 + gold * 1.4 + gold2 * 0.7 + winA * 2.4 + winC * 1.8;
        b = 0.04 + magenta * 1.1 + vault * 0.7 + gold * 0.15 + winB * 2.6 + winC * 0.5;
      }
      data[i] = r; data[i + 1] = g; data[i + 2] = b; data[i + 3] = 1;
    }
  }
  const tex = new THREE.DataTexture(data, size, size, THREE.RGBAFormat, THREE.FloatType);
  tex.mapping = THREE.EquirectangularReflectionMapping;
  tex.colorSpace = THREE.LinearSRGBColorSpace;
  tex.needsUpdate = true;
  return tex;
}

/** Lift + tint Poly Haven HDR toward Sketch C magenta/gold (preserve luminance). */
function tintHdrTowardMagentaGold(tex, variant = chromeVariant) {
  const img = tex.image;
  if (!img || !img.data) return tex;
  const data = img.data;
  for (let i = 0; i < data.length; i += 4) {
    const r = data[i], g = data[i + 1], b = data[i + 2];
    const lum = 0.2126 * r + 0.7152 * g + 0.0722 * b;
    const goldW = Math.min(4.5, Math.pow(Math.max(0.02, lum), 0.85) * 1.35);
    const magW = Math.min(3.8, Math.pow(Math.max(0.05, 1.25 - Math.abs(lum - 0.45)), 1.2) * 1.25);
    if (variant === 2) {
      data[i]     = r * 1.05 + goldW * 2.8 + magW * 0.4 + 0.06;
      data[i + 1] = g * 0.95 + goldW * 2.0 + magW * 0.1 + 0.03;
      data[i + 2] = b * 0.75 + goldW * 0.45 + magW * 0.85 + 0.04;
    } else if (variant === 3) {
      data[i]     = r * 0.95 + goldW * 0.9 + magW * 1.8 + 0.05;
      data[i + 1] = g * 0.7 + goldW * 0.4 + magW * 0.25 + 0.02;
      data[i + 2] = b * 1.15 + goldW * 0.25 + magW * 2.6 + 0.08;
    } else {
      data[i]     = r * 1.0 + goldW * 2.5 + magW * 1.55 + 0.07;
      data[i + 1] = g * 0.85 + goldW * 1.55 + magW * 0.15 + 0.03;
      data[i + 2] = b * 1.05 + goldW * 0.35 + magW * 2.15 + 0.06;
    }
  }
  tex.needsUpdate = true;
  return tex;
}

async function setupCathedralEnvAndBloom() {
  const pmrem = new THREE.PMREMGenerator(renderer);
  try { pmrem.compileEquirectangularShader(); } catch (_) {}

  let usedLocalHdrBg = false;
  // Fast path: pre-baked soft cathedral equirect (WebP) — skips RGBE decode + PMREM of 1.6MB HDR on first paint.
  // Visual match for backgroundBlurriness≈0.68; envMap still uses punchy synth below.
  try {
    const prebakedUrl = './demo-assets/hdr/small_cathedral_02_1k_pmrem_bg.webp';
    const prebaked = await new THREE.TextureLoader().loadAsync(prebakedUrl);
    prebaked.mapping = THREE.EquirectangularReflectionMapping;
    prebaked.colorSpace = THREE.SRGBColorSpace;
    scene.background = prebaked;
    scene.backgroundBlurriness = 0.12; // already soft-baked
    scene.backgroundIntensity = chromeVariant === 2 ? 0.42 : 0.36;
    window.__sketchCHdrEnv = prebaked;
    usedLocalHdrBg = true;
    console.info('[cubicles] prebaked PMREM-style bg (skip HDR decode)', prebakedUrl, 'chrome=' + chromeVariant);
  } catch (preErr) {
    console.warn('[cubicles] prebaked bg missing — HDR fallback', preErr);
  }
  // Optional: full HDR upgrade only when ?hdr=1 (quality A/B), otherwise skip decode cost.
  if (!usedLocalHdrBg || params.has('hdr')) {
    try {
      const { RGBELoader } = await import('three/addons/loaders/RGBELoader.js');
      const localCandidates = [
        './demo-assets/hdr/small_cathedral_02_1k.hdr',
        './demo-assets/hdr/neon_photostudio_1k.hdr',
      ];
      let hdr = null;
      let hdrSrc = null;
      for (const url of localCandidates) {
        try {
          hdr = await new RGBELoader().loadAsync(url);
          hdrSrc = url;
          break;
        } catch (_) { /* try next */ }
      }
      if (!hdr) {
        try {
          hdr = await new RGBELoader().loadAsync(
            'https://threejs.org/examples/textures/equirectangular/venice_sunset_1k.hdr'
          );
          hdrSrc = 'cdn:venice_sunset';
        } catch (_) {}
      }
      if (hdr) {
        tintHdrTowardMagentaGold(hdr, chromeVariant);
        const bgRT = pmrem.fromEquirectangular(hdr);
        scene.background = bgRT.texture;
        scene.backgroundBlurriness = 0.68;
        scene.backgroundIntensity = chromeVariant === 2 ? 0.34 : 0.28;
        window.__sketchCHdrEnv = bgRT.texture;
        hdr.dispose();
        usedLocalHdrBg = true;
        console.info('[cubicles] Poly Haven HDR → PMREM background', hdrSrc, 'chrome=' + chromeVariant);
      }
    } catch (loaderErr) {
      console.warn('[cubicles] RGBELoader unavailable', loaderErr);
    }
  }

  // Sketch C chrome reflections: punchy magenta/gold synth with hot specular windows (mercury beads)
  try {
    const synth = makeMagentaGoldEquirect(mobileLike ? 256 : 512, chromeVariant);
    const env = pmrem.fromEquirectangular(synth).texture;
    scene.environment = env;
    scene.environmentIntensity = chromeVariant === 2 ? 1.05 : chromeVariant === 3 ? 1.25 : 1.2;
    if (!scene.background || scene.background.isColor) {
      scene.background = env;
      scene.backgroundBlurriness = 0.48;
      scene.backgroundIntensity = 0.34;
    }
    synth.dispose();
    // Explicit envMap bind — helps InstancedMesh / delayed chrome mats under SwiftShader
    window.__sketchCEnvTex = env;
    const bindChromeEnv = () => {
      const mats = window.__sketchCChromeMats || [];
      for (const m of mats) {
        if (!m) continue;
        m.envMap = env;
        m.needsUpdate = true;
      }
    };
    bindChromeEnv();
    // Re-bind once trees finish chromeify/clone (async GLB)
    setTimeout(bindChromeEnv, 800);
    setTimeout(bindChromeEnv, 2200);
    console.info('[cubicles] magenta/gold synth envMap (mercury)', 'chrome=' + chromeVariant, CHROME_LOOK,
      usedLocalHdrBg ? '+HDR bg' : 'synth-only');
  } catch (pmErr) {
    console.warn('[cubicles] equirect PMREM failed — fromScene / HDR fallback', pmErr);
    if (window.__sketchCHdrEnv) {
      scene.environment = window.__sketchCHdrEnv;
      scene.environmentIntensity = 1.85;
    } else {
      try {
        const probe = new THREE.Scene();
        probe.add(new THREE.Mesh(
          new THREE.SphereGeometry(2, 16, 12),
          new THREE.MeshBasicMaterial({ color: 0xffc050 })
        ).translateX(4).translateY(3).translateZ(-2));
        probe.add(new THREE.Mesh(
          new THREE.SphereGeometry(2.4, 16, 12),
          new THREE.MeshBasicMaterial({ color: 0xc028ff })
        ).translateX(-5).translateY(2.5).translateZ(3));
        scene.environment = pmrem.fromScene(probe, 0.04).texture;
        scene.environmentIntensity = 1.85;
      } catch (probeErr) {
        console.warn('[cubicles] PMREM fromScene failed — colored lights only', probeErr);
      }
    }
  }

  try { pmrem.dispose(); } catch (_) {}

  if (mobileLike) {
    console.info('[cubicles] bloom skipped on mobile-like');
    return;
  }
  try {
    const { EffectComposer } = await import('three/addons/postprocessing/EffectComposer.js');
    const { RenderPass } = await import('three/addons/postprocessing/RenderPass.js');
    const { UnrealBloomPass } = await import('three/addons/postprocessing/UnrealBloomPass.js');
    const { OutputPass } = await import('three/addons/postprocessing/OutputPass.js');
    composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));
    // Mercury bloom: moderate strength, tight radius, mid-high threshold → specular beads not trunk wash
    bloomPass = new UnrealBloomPass(
      new THREE.Vector2(innerWidth, innerHeight),
      wantAisle ? 0.08 : 0.11,
      wantAisle ? 0.12 : 0.15,
      wantAisle ? 0.95 : 0.92
    );
    composer.addPass(bloomPass);
    composer.addPass(new OutputPass());
    composer.setSize(innerWidth, innerHeight);
    console.info('[cubicles] UnrealBloomPass mercury bloom enabled');
  } catch (bloomErr) {
    composer = null;
    bloomPass = null;
    console.warn('[cubicles] bloom skipped', bloomErr);
  }
}

function createWallpaper() {
  const wallpaperGeo = new THREE.BoxGeometry(0.22, 0.22, 0.22);
  const wallpaperMat = mobileLike
    ? new THREE.MeshBasicMaterial({ transparent: true, opacity: 0.88 })
    : new THREE.MeshStandardMaterial({
        roughness: 0.48,
        metalness: 0.22,
        transparent: true,
        opacity: 0.88,
      });
  const mesh = new THREE.InstancedMesh(wallpaperGeo, wallpaperMat, WALLPAPER_COUNT);
  mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  mesh.frustumCulled = false;
  mesh.matrixAutoUpdate = false;
  mesh.raycast = () => {}; // never steal clicks / navigation
  mesh.castShadow = false;
  mesh.receiveShadow = false;
  const dummy = new THREE.Object3D();
  const color = new THREE.Color();
  const base = new Float32Array(WALLPAPER_COUNT * 3);
  const phase = new Float32Array(WALLPAPER_COUNT);
  const scale = new Float32Array(WALLPAPER_COUNT);
  const euler = new Float32Array(WALLPAPER_COUNT * 3);
  for (let i = 0; i < WALLPAPER_COUNT; i++) {
    const x = (Math.random() - 0.5) * (OUTER_W - 0.6);
    const y = 0.25 + Math.random() * (OUTER_H - 0.5);
    const z = WALL_Z + (Math.random() - 0.5) * 0.55;
    base[i * 3] = x;
    base[i * 3 + 1] = y;
    base[i * 3 + 2] = z;
    phase[i] = Math.random() * Math.PI * 2;
    const s = 0.35 + Math.random() * 1.35;
    scale[i] = s;
    const rx = Math.random() * Math.PI;
    const ry = Math.random() * Math.PI;
    const rz = Math.random() * 0.4;
    euler[i * 3] = rx;
    euler[i * 3 + 1] = ry;
    euler[i * 3 + 2] = rz;
    dummy.position.set(x, y, z);
    dummy.rotation.set(rx, ry, rz);
    dummy.scale.setScalar(s);
    dummy.updateMatrix();
    mesh.setMatrixAt(i, dummy.matrix);
    // Warm amber/bronze, dialed so hung panels stay readable
    color.setHSL(0.07 + Math.random() * 0.1, 0.55 + Math.random() * 0.2, 0.32 + Math.random() * 0.22);
    mesh.setColorAt(i, color);
  }
  mesh.instanceMatrix.needsUpdate = true;
  if (mesh.instanceColor) mesh.instanceColor.needsUpdate = true;
  scene.add(mesh);
  if (!mobileLike) {
    scene.add(new THREE.PointLight(0xffe0b0, 18, 22).translateX(0).translateY(OUTER_H * 0.55).translateZ(WALL_Z + 2.2));
  }
  wallpaper = mesh;
  wallpaperDummy = dummy;
  wallpaperBase = base;
  wallpaperPhase = phase;
  wallpaperScale = scale;
  wallpaperEuler = euler;
  wallpaperOk = true;
}

// —— Far/back wall stargazing clip (portrait ~14s, muted loop) ——
// Sharp planar −Z mural (NOT sphere / NOT full-dome equirect smear).
// Widen bandW toward OUTER_W cover (~24×18, ~75% wall). Cover UV crops

(function installStargazingWall() {
  try {
    const vid = document.createElement('video');
    vid.src = './demo-assets/backwall/stargazing.mp4';
    vid.crossOrigin = 'anonymous';
    vid.loop = true;
    vid.muted = true;
    vid.playsInline = true;
    vid.setAttribute('playsinline', '');
    vid.setAttribute('muted', '');
    vid.preload = 'auto';
    vid.width = 720;
    vid.height = 974;
    vid.setAttribute('aria-hidden', 'true');
    const maxAniso = (renderer.capabilities && renderer.capabilities.getMaxAnisotropy)
      ? renderer.capabilities.getMaxAnisotropy()
      : 1;
    const tex = new THREE.VideoTexture(vid);
    tex.colorSpace = THREE.SRGBColorSpace;
    tex.minFilter = THREE.LinearFilter;
    tex.magFilter = THREE.LinearFilter;
    tex.generateMipmaps = false;
    tex.anisotropy = maxAniso;
    tex.wrapS = THREE.ClampToEdgeWrapping;
    tex.wrapT = THREE.ClampToEdgeWrapping;
    // Wider band toward OUTER_W; H stays mural-tall so cover crop stays moderate.
    const muralW = 24.0;
    const muralH = 18.0;
    const bandAspect = muralW / muralH;
    const videoAspect = 720 / 974;
    let repX = 1.0, repY = 1.0, offX = 0.0, offY = 0.0;
    if (videoAspect > bandAspect) {
      // Video wider than band → crop left/right (center)
      repX = bandAspect / videoAspect;
      repY = 1.0;
      offX = (1.0 - repX) * 0.5;
      offY = 0.0;
    } else {
      // Band wider than portrait → crop top/bottom; pin sample to TOP of source
      // so woman’s face is in the strip (top-half crop: offY = 1 − repY).
      repX = 1.0;
      repY = videoAspect / bandAspect;
      offX = 0.0;
      offY = 1.0 - repY;
    }
    tex.repeat.set(repX, repY);
    tex.offset.set(offX, offY);
    const poster = new THREE.TextureLoader().load('./demo-assets/backwall/stargazing-poster.jpg');
    poster.colorSpace = THREE.SRGBColorSpace;
    poster.minFilter = THREE.LinearFilter;
    poster.magFilter = THREE.LinearFilter;
    poster.generateMipmaps = false;
    poster.anisotropy = maxAniso;
    poster.wrapS = THREE.ClampToEdgeWrapping;
    poster.wrapT = THREE.ClampToEdgeWrapping;
    poster.repeat.copy(tex.repeat);
    poster.offset.copy(tex.offset);
    const mat = new THREE.MeshBasicMaterial({
      map: poster,
      toneMapped: false,
      side: THREE.FrontSide,
      fog: false,
    });
    const mesh = new THREE.Mesh(new THREE.PlaneGeometry(muralW, muralH), mat);
    // Bottom near floor; top may extend past ceiling — framing aspect matters for UV, not room fit.
    mesh.position.set(0, muralH * 0.5 + 0.15, WALL_Z + 0.04);

function updateWallpaper(t) {
  if (!wallpaperOk || !wallpaper || reduceMotion) return;
  wallpaperFrame++;
  if (WALLPAPER_FRAME_N > 1 && (wallpaperFrame % WALLPAPER_FRAME_N) !== 0) return;
  try {
    // Rewrite matrix from stored base pos / euler / phase — no getMatrixAt→decompose→Euler mix
    for (let i = 0; i < WALLPAPER_COUNT; i += WALLPAPER_STRIDE) {
      const bx = wallpaperBase[i * 3];
      const by = wallpaperBase[i * 3 + 1];
      const bz = wallpaperBase[i * 3 + 2];
      const ph = wallpaperPhase[i];
      wallpaperDummy.position.set(
        bx + Math.sin(t * 0.55 + ph) * 0.06,
        by + Math.sin(t + ph) * 0.09,
        bz
      );
      wallpaperDummy.rotation.set(
        wallpaperEuler[i * 3] + t * 0.35,
        wallpaperEuler[i * 3 + 1] + t * 0.55,
        wallpaperEuler[i * 3 + 2]
      );
      wallpaperDummy.scale.setScalar(wallpaperScale[i]);
      wallpaperDummy.updateMatrix();
      wallpaper.setMatrixAt(i, wallpaperDummy.matrix);
    }
    wallpaper.instanceMatrix.needsUpdate = true;
  } catch (err) {
    console.warn('[cubicles] wallpaper update failed; removing', err);
    disposeWallpaper();
  }
}

function updateSparklines(t) {
  if (!sparkOk || reduceMotion) return;
  sparkFrame++;
  if (SPARK_FRAME_N > 1 && (sparkFrame % SPARK_FRAME_N) !== 0) return;
  try {
    // Pendants: subtle sway + glow bob
    for (let i = 0; i < SPARK_CEIL_N; i += SPARK_STRIDE) {
      const bx = sparkCeilBase[i * 3];
      const headY = sparkCeilBase[i * 3 + 1];
      const bz = sparkCeilBase[i * 3 + 2];
      const ph = sparkCeilPhase[i];
      const stemLen = sparkCeilScale[i];
      const sway = Math.sin(t * 0.55 + ph) * 0.035;
      const bob = Math.sin(t * 0.7 + ph) * 0.04;

      sparkDummy.position.set(bx + sway, OUTER_H - stemLen * 0.5, bz);
      sparkDummy.rotation.set(sway * 0.4, 0, -sway * 0.3);
      sparkDummy.scale.set(1, stemLen, 1);
      sparkDummy.updateMatrix();
      sparkStem.setMatrixAt(i, sparkDummy.matrix);

      const glowR = 0.9 + Math.sin(t * 1.1 + ph) * 0.08;
      sparkDummy.position.set(bx + sway, headY + bob, bz);
      sparkDummy.rotation.set(0, 0, 0);
      sparkDummy.scale.setScalar(glowR);
      sparkDummy.updateMatrix();
      sparkGlow.setMatrixAt(i, sparkDummy.matrix);
    }
    sparkStem.instanceMatrix.needsUpdate = true;
    sparkGlow.instanceMatrix.needsUpdate = true;

    for (let i = 0; i < sparkLights.length; i++) {
      const ph = sparkCeilPhase[i] || 0;
      sparkLights[i].intensity = 4.2 + Math.sin(t * 1.05 + ph) * 0.85;
    }
  } catch (err) {
    console.warn('[cubicles] sparklines update failed; removing', err);
    disposeSparklines();
  }
}

/** Reveal iframe only once its WebGL canvas exists (avoids empty black rectangles). */
function revealLabWhenReady(panel) {
  if (!panel || panel._revealWatch) return;
  panel._revealWatch = true;
  let tries = 0;
  const tick = () => {
    tries++;
    try {
      const doc = panel.iframe.contentDocument;
      const canvas = doc && doc.querySelector('canvas');
      if (canvas && canvas.width > 0) {
        panel.iframe.style.opacity = '1';
        panel._revealWatch = false;
        return;
      }
    } catch {}
    if (tries < 180) requestAnimationFrame(tick);
    else { panel._revealWatch = false; } // stay hidden if canvas never arrives (no empty plate)
  };
  panel.iframe.addEventListener('load', () => { tries = 0; requestAnimationFrame(tick); }, { once: true });
  requestAnimationFrame(tick);
}

function armLab(panel) {
  if (!panel) return;
  if (!panel.embedArmed) {
    panel.iframe.src = panel.embedUrl;
    panel.embedArmed = true;
    revealLabWhenReady(panel);
  } else if (panel.iframe.style.opacity !== '1') {
    revealLabWhenReady(panel);
  }
}

/** Replace GLTF mesh mats with cathedral chrome / gold; keep normal maps for mercurial bark. */
function chromeifyCypressRoot(root) {
  root.traverse((o) => {
    if (!o.isMesh) return;
    const oldMat = o.material;
    const mats = Array.isArray(oldMat) ? oldMat : [oldMat];
    const name = ((o.name || '') + ' ' + mats.map((m) => m?.name || '').join(' ')).toLowerCase();
    const isFoliage =
      mats.some((m) => m && (m.transparent || m.alphaMode === 'BLEND' || (m.opacity != null && m.opacity < 0.99))) ||
      /leaf|foliage|canopy|needle|crown|twig|plane/i.test(name);
    const isKnee = /knee|pneumatophore|buttress/i.test(name);
    const base = isFoliage ? cypressFoliageMat : (isKnee ? cypressKneeMat : cypressTrunkMat);
    const mat = base.clone();
    for (const src of mats) {
      if (!src) continue;
      if (src.normalMap && !mat.normalMap) {
        mat.normalMap = src.normalMap;
        mat.normalScale = src.normalScale ? src.normalScale.clone() : new THREE.Vector2(0.55, 0.55);
      }
      if (src.aoMap && !mat.aoMap) {
        mat.aoMap = src.aoMap;
        mat.aoMapIntensity = 0.18;
      }
    }
    if (mat.normalMap) mat.normalScale = new THREE.Vector2(0.35, 0.35);
    if (isFoliage) {
      mat.side = THREE.DoubleSide;
      mat.transparent = false;
      mat.opacity = 1;
      mat.depthWrite = true;
      mat.alphaTest = 0.35;
    }
    o.material = mat;
    cypressChromeMats.push(mat);
    o.castShadow = !mobileLike;
    o.receiveShadow = true;
    o.raycast = () => {};
  });
}

function cypressRand(seed) {
  let t = (seed >>> 0) + 0x6d2b79f5;
  t = Math.imul(t ^ (t >>> 15), t | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}

const taxBranchGeo = new THREE.CylinderGeometry(0.22, 1, 1, mobileLike ? 5 : 6, 1, true);
// Thin needle shafts for feathery sprays (NOT fat cones); open-ended = no mid-air discs
const taxNeedleGeo = new THREE.CylinderGeometry(0.05, 0.18, 1, 3, 1, true);
// Soft oval tuft
const taxTuftGeo = new THREE.SphereGeometry(1, mobileLike ? 4 : 6, mobileLike ? 3 : 4);
taxTuftGeo.scale(0.7, 1.6, 0.28);
// Alpha card for feathery canopy planes
const taxCardGeo = new THREE.PlaneGeometry(1.1, 1.55);
// Feathery crown spray — elongated oval (NOT flat gold disc / mushroom)
const taxCrownGeo = new THREE.SphereGeometry(1, mobileLike ? 5 : 7, mobileLike ? 4 : 5);
taxCrownGeo.scale(0.45, 1.55, 0.35); // hanging spray, vertical bias

function taxHash(i) {
  let t = (i >>> 0) + 0x6d2b79f5;
  t = Math.imul(t ^ (t >>> 15), t | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}

/**
 * Instanced Taxodium grove — flared fluted buttress, blunt knees,
 * ascending scaffold, feathery needle fans + alpha cards, Spanish moss separate.
 */
function placeBaldCypresses() {
  const trees = cypressPositions;
  const n = trees.length;
  const kneesPer = mobileLike ? 8 : 12;
  const branchPer = mobileLike ? 8 : 11;
  const needlePer = mobileLike ? 60 : 110;
  const tuftPer = mobileLike ? 3 : 5;
  const cardPer = mobileLike ? 60 : 110;
  const crownPer = mobileLike ? 0 : 0; // disable disc sprays entirely
  const flutePer = mobileLike ? 2 : 3; // subtle bark ribs, not pipe-bundle

  const trunkInst = new THREE.InstancedMesh(taxTrunkGeo, cypressTrunkMat, n);
  const kneeInst = new THREE.InstancedMesh(taxKneeGeo, cypressKneeMat, n * kneesPer);
  const branchInst = new THREE.InstancedMesh(taxBranchGeo, cypressTrunkMat, n * (branchPer + flutePer));
  const needleInst = new THREE.InstancedMesh(taxNeedleGeo, cypressFoliageMat, n * needlePer);
  const tuftInst = new THREE.InstancedMesh(taxTuftGeo, cypressFoliageMat, n * tuftPer);
  const cardInst = new THREE.InstancedMesh(taxCardGeo, cypressCardMat, n * cardPer);
  const crownInst = new THREE.InstancedMesh(taxCrownGeo, cypressFoliageMat, Math.max(1, n * crownPer));
  for (const inst of [trunkInst, kneeInst, branchInst, needleInst, tuftInst, cardInst, crownInst]) {
    inst.castShadow = !mobileLike;
    inst.receiveShadow = true;
    inst.frustumCulled = true;
    inst.raycast = () => {};
  }

  const dummy = new THREE.Object3D();
  const _yUp = new THREE.Vector3(0, 1, 0);
  const _dir = new THREE.Vector3();
  const WATER_Y = 0.02;
  // Plant so max flare (local y=0) sits under water; closed root tip continues below
  const TRUNK_SINK = 0.22;
  let ki = 0, bi = 0, ni = 0, ti = 0, ci = 0, cri = 0;

  for (let i = 0; i < n; i++) {
    const p = trees[i];
    const h = p.h;
    const yaw = (p.yaw != null) ? p.yaw : ((p.x * 0.3 + p.z * 0.17) % (Math.PI * 2));
    const base = i * 97 + 11;
    const trunkY = WATER_Y - TRUNK_SINK;

    dummy.position.set(p.x, trunkY, p.z);
    dummy.rotation.set(0, yaw, 0);
    dummy.scale.set(h, h, h);
    dummy.updateMatrix();
    trunkInst.setMatrixAt(i, dummy.matrix);

    // Vertical bark ridges — glued to trunk surface (open-ended, no floating chops)
    for (let f = 0; f < flutePer; f++) {
      const ang = yaw + (f / flutePer) * Math.PI * 2 + taxHash(base + f) * 0.1;
      const rh = h * (0.42 + taxHash(base + 20 + f) * 0.22);
      const midY = trunkY + rh * 0.52;
      dummy.position.set(p.x + Math.cos(ang) * h * 0.048, midY, p.z + Math.sin(ang) * h * 0.048);
      dummy.rotation.set(0, ang, 0);
      dummy.scale.set(h * 0.0055, rh, h * 0.008);
      dummy.updateMatrix();
      branchInst.setMatrixAt(bi++, dummy.matrix);
    }

    // Woody cypress knees — dome mounds emerging FROM water (not hovering above)
    for (let k = 0; k < kneesPer; k++) {
      const ang = yaw + (k / kneesPer) * Math.PI * 2 + taxHash(base + 40 + k) * 0.45;
      const rad = h * (0.11 + taxHash(base + 50 + k) * 0.13);
      const rKnee = h * (0.032 + taxHash(base + 60 + k) * 0.028); // dome radius
      const sx = rKnee * (0.9 + taxHash(base + 70 + k) * 0.35);
      const sy = rKnee * (0.7 + taxHash(base + 75 + k) * 0.35);
      const sz = rKnee * (0.85 + taxHash(base + 77 + k) * 0.3);
      // Sink ~55% of dome height so the mound emerges from water (not hovering)
      dummy.position.set(
        p.x + Math.cos(ang) * rad,
        WATER_Y - sy * 0.55,
        p.z + Math.sin(ang) * rad
      );
      dummy.rotation.set((taxHash(base + 80 + k) - 0.5) * 0.18, ang, (taxHash(base + 90 + k) - 0.5) * 0.18);
      dummy.scale.set(sx, sy, sz);
      dummy.updateMatrix();
      kneeInst.setMatrixAt(ki++, dummy.matrix);
    }

    const tips = [];
    for (let b = 0; b < branchPer; b++) {
      const tAttach = 0.38 + (b / Math.max(1, branchPer - 1)) * 0.48;
      const ang = yaw + b * 2.399 + taxHash(base + 100 + b) * 0.65;
      const len = h * (0.16 + (1 - tAttach) * 0.24 + taxHash(base + 110 + b) * 0.08);
      // Slim limbs — thick cylinders looked like severed floating trunk chunks
      const thick = h * (0.0055 + (1 - tAttach) * 0.006);
      const up = 0.48 + taxHash(base + 120 + b) * 0.32;
      // Local trunk radius at attach height (flare → stem profile)
      let trunkR;
      if (tAttach < 0.12) {
        const u = tAttach / 0.12;
        trunkR = h * (0.17 * (1 - Math.pow(u, 0.38)) + 0.058 * Math.pow(u, 0.38));
      } else if (tAttach < 0.52) {
        const u = (tAttach - 0.12) / 0.4;
        trunkR = h * THREE.MathUtils.lerp(0.058, 0.034, u);
      } else {
        const u = (tAttach - 0.52) / 0.48;
        trunkR = h * THREE.MathUtils.lerp(0.034, 0.022, Math.pow(u, 0.7));
      }
      const attachY = trunkY + h * tAttach;
      const ax = p.x + Math.cos(ang) * trunkR * 0.92;
      const az = p.z + Math.sin(ang) * trunkR * 0.92;
      const tipX = ax + Math.cos(ang) * len * 0.92;
      const tipY = attachY + len * up;
      const tipZ = az + Math.sin(ang) * len * 0.92;
      // Center cylinder on the limb span; aim Y-axis along attach→tip (no floating chop ends)
      dummy.position.set((ax + tipX) * 0.5, (attachY + tipY) * 0.5, (az + tipZ) * 0.5);
      _dir.set(tipX - ax, tipY - attachY, tipZ - az);
      if (_dir.lengthSq() < 1e-8) _dir.set(0, 1, 0);
      else _dir.normalize();
      dummy.quaternion.setFromUnitVectors(_yUp, _dir);
      dummy.scale.set(thick, len, thick);
      dummy.updateMatrix();
      branchInst.setMatrixAt(bi++, dummy.matrix);
      tips.push({
        x: tipX,
        y: tipY,
        z: tipZ,
        ang,
      });
    }

    // Feathery needle fans — thin shafts clustered at tips + crown envelope
    for (let s = 0; s < needlePer; s++) {
      const tip = tips[s % tips.length];
      const hh = taxHash(base + 200 + s);
      const hh2 = taxHash(base + 300 + s);
      let cx, cy, cz, ang;
      if (s % 5 !== 4) {
        // Fan around branch tip
        const fan = (s % 7) / 7 * Math.PI * 1.4 - 0.7;
        ang = tip.ang + fan;
        const spread = h * (0.02 + hh * 0.06);
        cx = tip.x + Math.cos(ang) * spread;
        cy = tip.y + (hh2 - 0.35) * h * 0.05;
        cz = tip.z + Math.sin(ang) * spread;
      } else {
        ang = hh * Math.PI * 2 + yaw;
        // Mid canopy shelf — flat-topped mature Taxodium, not a spike tip
        const yNorm = 0.5 + hh2 * 0.38;
        const crownFlat = yNorm > 0.78 ? 0.75 : 1.05;
        const rad = h * (0.3 * (1 - yNorm * 0.55) + 0.05) * crownFlat * (0.65 + hh * 0.4);
        cx = p.x + Math.cos(ang) * rad;
        cy = trunkY + h * yNorm;
        cz = p.z + Math.sin(ang) * rad;
      }
      const nh = h * (0.09 + hh * 0.12);
      const nr = h * (0.0028 + hh2 * 0.0035); // hair-thin feather shaft
      dummy.position.set(cx, cy, cz);
      const droop = 1.15 + hh * 0.5;
      dummy.rotation.set(droop, ang, (hh2 - 0.5) * 0.45);
      dummy.scale.set(nr, nh, nr);
      dummy.updateMatrix();
      needleInst.setMatrixAt(ni++, dummy.matrix);
    }

    // Soft tufts
    for (let s = 0; s < tuftPer; s++) {
      const tip = tips[s % tips.length];
      const hh = taxHash(base + 500 + s);
      const hh2 = taxHash(base + 600 + s);
      const ang = hh * Math.PI * 2 + yaw;
      const yNorm = 0.5 + hh2 * 0.42;
      const rad = h * (0.16 * (1 - yNorm * 0.6) + 0.025) * (0.55 + hh * 0.5);
      const ts = h * (0.028 + hh * 0.032);
      dummy.position.set(
        (s % 2 ? tip.x : p.x + Math.cos(ang) * rad),
        s % 2 ? tip.y : trunkY + h * yNorm,
        s % 2 ? tip.z : p.z + Math.sin(ang) * rad
      );
      dummy.rotation.set((hh - 0.5) * 0.4, hh * Math.PI, (hh2 - 0.5) * 0.4);
      dummy.scale.set(ts * (0.7 + hh * 0.5), ts * (1.1 + hh2 * 0.5), ts * (0.45 + hh * 0.35));
      dummy.updateMatrix();
      tuftInst.setMatrixAt(ti++, dummy.matrix);
    }

    // Alpha canopy cards — feathery Taxodium leaf planes (branch_cypress.png)
    for (let s = 0; s < cardPer; s++) {
      const tip = tips[s % tips.length];
      const hh = taxHash(base + 700 + s);
      const hh2 = taxHash(base + 800 + s);
      const ang = tip.ang + (hh - 0.5) * 1.4;
      const yNorm = 0.48 + hh2 * 0.38;
      const useTip = s % 3 !== 2;
      const rad = h * (0.16 + hh * 0.18) * (1.05 - yNorm * 0.4);
      const cx = useTip ? tip.x + Math.cos(ang) * h * 0.06 : p.x + Math.cos(ang) * rad;
      const cy = useTip ? tip.y + (hh - 0.4) * h * 0.05 : trunkY + h * yNorm;
      const cz = useTip ? tip.z + Math.sin(ang) * h * 0.06 : p.z + Math.sin(ang) * rad;
      const cs = h * (0.05 + hh * 0.045);
      dummy.position.set(cx, cy, cz);
      dummy.rotation.set(0.65 + hh * 0.85, ang + Math.PI * (0.25 + hh2 * 0.8), (hh2 - 0.5) * 1.2);
      dummy.scale.set(cs * (0.8 + hh * 0.5), cs * (1.35 + hh2 * 0.55), 1);
      dummy.updateMatrix();
      cardInst.setMatrixAt(ci++, dummy.matrix);
    }

    // Feathery Taxodium crown — drooping gold sprays (NOT plate discs / mushrooms)
    for (let s = 0; s < crownPer; s++) {
      const hh = taxHash(base + 900 + s);
      const hh2 = taxHash(base + 950 + s);
      const ang = yaw + (s / crownPer) * Math.PI * 2 + hh * 0.5;
      // Irregular flat-topped envelope: wider mid-canopy, soft top
      const yNorm = 0.55 + hh2 * 0.28;
      const widen = yNorm > 0.78 ? 0.7 : 1.15;
      const rad = h * (0.14 + hh * 0.22) * widen;
      const cs = h * (0.07 + hh * 0.05);
      dummy.position.set(
        p.x + Math.cos(ang) * rad,
        trunkY + h * yNorm,
        p.z + Math.sin(ang) * rad
      );
      // Hang outward-down like Taxodium needle sprays
      dummy.rotation.set(0.85 + hh * 0.55, ang, (hh2 - 0.5) * 0.4);
      dummy.scale.set(cs * (0.55 + hh * 0.35), cs * (1.4 + hh2 * 0.6), cs * (0.4 + hh * 0.3));
      dummy.updateMatrix();
      crownInst.setMatrixAt(cri++, dummy.matrix);
    }
  }

  const zero = new THREE.Object3D();
  zero.scale.set(0, 0, 0);
  zero.updateMatrix();
  for (let i = ki; i < kneeInst.count; i++) kneeInst.setMatrixAt(i, zero.matrix);
  for (let i = bi; i < branchInst.count; i++) branchInst.setMatrixAt(i, zero.matrix);
  for (let i = ni; i < needleInst.count; i++) needleInst.setMatrixAt(i, zero.matrix);
  for (let i = ti; i < tuftInst.count; i++) tuftInst.setMatrixAt(i, zero.matrix);
  for (let i = ci; i < cardInst.count; i++) cardInst.setMatrixAt(i, zero.matrix);
  for (let i = cri; i < crownInst.count; i++) crownInst.setMatrixAt(i, zero.matrix);
  kneeInst.count = ki;
  branchInst.count = bi;
  needleInst.count = ni;
  tuftInst.count = ti;
  cardInst.count = ci;
  crownInst.count = cri;
  for (const inst of [trunkInst, kneeInst, branchInst, needleInst, tuftInst, cardInst, crownInst]) {
    inst.instanceMatrix.needsUpdate = true;
    cypressGroup.add(inst);
  }

  console.info('[cubicles] cathedral chrome Taxodium instanced', n, 'trees',
    { knees: ki, branches: bi, needles: ni, tufts: ti, cards: ci, crown: cri }, 'sketch-C bald-cypress');
  window.__sketchCTrees = {
    n,
    modelH: 1,
    parts: 7,
    meshes: { knees: ki, branches: bi, needles: ni, tufts: ti, cards: ci, crown: cri },
    instanced: true,
    source: 'procedural-bald-cypress-taxodium',
  };
  try { placeSpanishMossFilaments(); } catch (mossErr) { console.warn('[cubicles] moss filaments skipped', mossErr); }
  return n;
}

function makeBaldCypress(height, seed = 1) {
  const g = new THREE.Group();
  const trunk = new THREE.Mesh(taxTrunkGeo, cypressTrunkMat);
  trunk.scale.set(height, height, height);
  g.add(trunk);
  disableRaycast(g);
  return g;
}

function makeCathedralCypress(height) {
  return makeBaldCypress(height, Math.floor(height * 100));
}

function placeProceduralCypresses() {
  return placeBaldCypresses();
}

/**
 * Natural irregular Taxodium grove — jittered positions / scales / yaws.
 * Prefer aisle & margin seeds so floating lab faces stay readable from foyer;
 * no straight grid rows.
 */
const cypressPositions = [];
(function buildIrregularGrove() {
  const seeds = [];
  // Loose aisle seeds (between columns) — then heavily jitter off the lattice
  for (let c = 1; c < COLS; c++) {
    const xAisle = -OUTER_W / 2 + c * CELL_W;
    for (let b = 0; b < ROWS; b++) {
      if (c % 2 === 0 && b === 2) continue; // spare one mid bay for sightline
      const zBay = GRID_Z_MAX - b * CELL_D - CELL_D * (0.15 + ((c * 5 + b * 9) % 7) * 0.04);
      seeds.push({ x: xAisle, z: zBay, role: 'grove', hBias: (b === 0 || b === ROWS - 1) ? 0.7 : 0 });
    }
  }
  // Side-margin clumps (not wall-aligned piers)
  for (const side of [-1, 1]) {
    for (let b = 0; b < ROWS; b++) {
      const zBay = GRID_Z_MAX - b * CELL_D - CELL_D * (0.2 + (b % 3) * 0.08);
      seeds.push({
        x: side * (OUTER_W / 2 - 2.4),
        z: zBay,
        role: 'margin',
        hBias: 0.4,
      });
    }
  }
  // Foyer grove pair — offset, not symmetric gateposts
  seeds.push({ x: -CELL_W * 1.15, z: GRID_Z_MAX + 1.85, role: 'foyer', hBias: 0.9 });
  seeds.push({ x: CELL_W * 0.92, z: GRID_Z_MAX + 1.35, role: 'foyer', hBias: 0.55 });
  // Extra mid-grove fillers (natural clumps, avoid cell centers)
  for (let k = 0; k < 6; k++) {
    const col = 0.5 + (k % 4) + ((k * 3) % 5) * 0.07;
    const row = 0.4 + Math.floor(k / 2) * 0.85 + ((k * 7) % 5) * 0.05;
    seeds.push({
      x: -OUTER_W / 2 + col * CELL_W,
      z: GRID_Z_MAX - row * CELL_D,
      role: 'clump',
      hBias: -0.35,
    });
  }

  function nearLabFace(x, z) {
    for (const h of hung) {
      // Keep clear of floating lab face AABB (panel footprint + margin)
      const dx = Math.abs(x - h.cx);
      const dz = Math.abs(z - h.panelZ);
      if (dx < PANEL_W * 0.72 && dz < PANEL_H * 0.22 + 0.55) return true;
    }
    return false;
  }

  for (let i = 0; i < seeds.length; i++) {
    const s = seeds[i];
    const h1 = taxHash(i * 17 + 3);
    const h2 = taxHash(i * 29 + 11);
    const h3 = taxHash(i * 41 + 7);
    const h4 = taxHash(i * 53 + 19);
    // Strong planar jitter — natural grove, not lattice rows
    const jx = (h1 - 0.5) * CELL_W * (s.role === 'margin' ? 0.85 : 1.15);
    const jz = (h2 - 0.5) * CELL_D * (s.role === 'foyer' ? 0.55 : 1.05);
    let x = s.x + jx;
    let z = s.z + jz;
    // Nudge away from lab faces if we landed on one
    if (nearLabFace(x, z)) {
      x += (h3 > 0.5 ? 1 : -1) * (PANEL_W * 0.55 + h4 * 0.4);
      z += (h1 > 0.5 ? 1 : -1) * (0.7 + h2 * 0.5);
    }
    // Keep inside outer box with buttress clearance
    const marginX = 1.9;
    const marginZ = 1.35;
    x = Math.max(-OUTER_W / 2 + marginX, Math.min(OUTER_W / 2 - marginX, x));
    z = Math.max(GRID_Z_MIN + marginZ, Math.min(OUTER_D / 2 - 1.2, z));
    if (nearLabFace(x, z)) continue; // drop rather than bury a lab

    // Density gaps — skip some seeds so grove reads clumpy, not regimented
    if (s.role === 'grove' && h4 < 0.22) continue;
    if (s.role === 'clump' && h1 < 0.28) continue;
    const hBase = 7.6 + h3 * 3.2 + (s.hBias || 0);
    const h = Math.max(6.8, Math.min(11.6, hBase + (h4 - 0.5) * 1.4));
    const yaw = h1 * Math.PI * 2 + h2 * 2.3 + h3 * 0.9;
    const scale = 0.72 + h3 * 0.52; // wider per-tree scale jitter
    cypressPositions.push({
      x, z,
      h: h * scale,
      yaw,
      role: s.role,
    });
  }
  console.info('[cubicles] irregular Taxodium grove', cypressPositions.length, 'trees (jittered pos/scale/yaw)');
})();

/**
 * Spanish-moss chrome filaments — hanging mercury/magenta fiber strands from canopy.
 * Dense enough to read as Tillandsia under HDR without burying hung panels.
 */
function placeSpanishMossFilaments() {
  if (mobileLike && cypressPositions.length > 18) {
    console.info('[cubicles] moss filaments thinned for mobile');
  }
  const strandGeo = new THREE.CylinderGeometry(1, 1, 1, 5, 1, true);
  const fiberChrome = new THREE.MeshPhysicalMaterial({
    color: chromeVariant === 2 ? 0xe8c090 : chromeVariant === 3 ? 0xd0b8f0 : 0xf0f4fa,
    metalness: 1.0,
    roughness: chromeVariant === 2 ? 0.22 : 0.055,
    envMapIntensity: chromeVariant === 2 ? 1.35 : 2.35,
    clearcoat: chromeVariant === 2 ? 0.25 : 0.95,
    clearcoatRoughness: chromeVariant === 2 ? 0.35 : 0.04,
    side: THREE.DoubleSide,
  });
  const fiberMagenta = new THREE.MeshPhysicalMaterial({
    color: chromeVariant === 2 ? 0xc45a28 : chromeVariant === 3 ? 0x8a30ff : 0xff48c8,
    metalness: 1.0,
    roughness: chromeVariant === 2 ? 0.28 : 0.1,
    envMapIntensity: chromeVariant === 2 ? 1.15 : 1.85,
    clearcoat: 0.7,
    clearcoatRoughness: 0.08,
    emissive: chromeVariant === 3 ? 0x280850 : 0x601838,
    emissiveIntensity: chromeVariant === 2 ? 0.05 : 0.22,
    side: THREE.DoubleSide,
  });
  const perTree = mobileLike ? 18 : 48;
  const count = cypressPositions.length * perTree;
  const chromeInst = new THREE.InstancedMesh(strandGeo, fiberChrome, count);
  const magentaInst = new THREE.InstancedMesh(strandGeo, fiberMagenta, count);
  chromeInst.castShadow = false;
  magentaInst.castShadow = false;
  chromeInst.frustumCulled = true;
  magentaInst.frustumCulled = true;
  chromeInst.raycast = () => {};
  magentaInst.raycast = () => {};
  const dummy = new THREE.Object3D();
  let ci = 0, mi = 0;
  for (let t = 0; t < cypressPositions.length; t++) {
    const p = cypressPositions[t];
    for (let s = 0; s < perTree; s++) {
      const seed = (t * 97 + s * 53) % 1000;
      const ang = (seed / 1000) * Math.PI * 2 + t * 0.37 + s * 0.19;
      // Hang from mid→upper feathery canopy (Taxodium moss zone)
      const attachT = 0.62 + (seed % 18) * 0.012;
      const trunkBaseY = 0.02 - 0.22; // match TRUNK_SINK in placeBaldCypresses
      const canopyY = trunkBaseY + p.h * attachT;
      // Keep moss ON this tree's crown — never span between trunks
      const rad = 0.25 + (seed % 17) * 0.04 + (s % 4) * 0.03;
      const len = 0.55 + (seed % 23) * 0.05 + (s % 4) * 0.12;
      const thick = 0.011 + (seed % 7) * 0.0025;
      const hangY = canopyY - len * 0.45;
      const x = p.x + Math.cos(ang) * rad;
      const z = p.z + Math.sin(ang) * rad * 0.85;
      const lean = 0.75 + ((seed % 9) - 4) * 0.08;
      dummy.position.set(x, Math.max(1.2, hangY), z);
      dummy.rotation.set(lean, ang * 0.7, lean * 0.55 + ((seed % 5) - 2) * 0.06);
      dummy.scale.set(thick, len, thick);
      dummy.updateMatrix();
      if ((s + t) % 2 === 0) {
        magentaInst.setMatrixAt(mi++, dummy.matrix);
      } else {
        chromeInst.setMatrixAt(ci++, dummy.matrix);
      }
    }
  }
  const zero = new THREE.Object3D();
  zero.scale.set(0, 0, 0);
  zero.updateMatrix();
  for (let i = ci; i < count; i++) chromeInst.setMatrixAt(i, zero.matrix);
  for (let i = mi; i < count; i++) magentaInst.setMatrixAt(i, zero.matrix);
  chromeInst.count = ci;
  magentaInst.count = mi;
  chromeInst.instanceMatrix.needsUpdate = true;
  magentaInst.instanceMatrix.needsUpdate = true;
  cypressChromeMats.push(fiberChrome, fiberMagenta);
  if (window.__sketchCEnvTex) {
    fiberChrome.envMap = window.__sketchCEnvTex;
    fiberMagenta.envMap = window.__sketchCEnvTex;
    fiberChrome.needsUpdate = true;
    fiberMagenta.needsUpdate = true;
  }
  cypressGroup.add(chromeInst);
  cypressGroup.add(magentaInst);
  console.info('[cubicles] spanish-moss chrome filaments', ci + mi, 'strands on', cypressPositions.length, 'trees');
  if (window.__sketchCTrees) {
    window.__sketchCTrees.mossStrands = ci + mi;
  } else {
    window.__sketchCMoss = { strands: ci + mi };
  }
}

/**
 * Optional ?glb=1 — OpenGameArt bald cypress GLB (low-poly billboard canopy).
 * Default path is procedural Taxodium (true silhouette under chrome HDR).
 */
async function placeGltfCypresses() {
  const { GLTFLoader } = await import('three/addons/loaders/GLTFLoader.js');
  const loader = new GLTFLoader();
  try {
    const { MeshoptDecoder } = await import('./vendor/meshopt/meshopt_decoder.mjs');
    // meshopt package exports decoder ready for GLTFLoader
    if (MeshoptDecoder) {
      if (MeshoptDecoder.ready) await MeshoptDecoder.ready;
      loader.setMeshoptDecoder(MeshoptDecoder);
    }
  } catch (meshOptErr) {
    console.warn('[cubicles] MeshoptDecoder unavailable', meshOptErr);
  }
  const gltf = await loader.loadAsync('./demo-assets/cypress/cypress.glb');
  const proto = gltf.scene;
  chromeifyCypressRoot(proto);
  proto.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(proto);
  const size = new THREE.Vector3();
  box.getSize(size);
  const modelH = Math.max(size.y, 0.001);
  const modelMinY = box.min.y;
  let meshCount = 0;
  proto.traverse((o) => { if (o.isMesh) meshCount++; });

  const parts = [];
  const seen = new Set();
  proto.traverse((o) => {
    if (!o.isMesh || !o.geometry) return;
    const key = o.geometry.uuid + '|' + (o.material && o.material.uuid);
    if (seen.has(key)) return;
    seen.add(key);
    const rootInv = new THREE.Matrix4().copy(proto.matrixWorld).invert();
    const local = new THREE.Matrix4().multiplyMatrices(rootInv, o.matrixWorld);
    parts.push({ geometry: o.geometry, material: o.material, local });
  });

  const count = cypressPositions.length;
  const dummy = new THREE.Object3D();
  const scratch = new THREE.Matrix4();
  for (const part of parts) {
    const inst = new THREE.InstancedMesh(part.geometry, part.material, count);
    inst.castShadow = !mobileLike;
    inst.receiveShadow = true;
    inst.frustumCulled = true;
    inst.raycast = () => {};
    for (let i = 0; i < count; i++) {
      const p = cypressPositions[i];
      const s = p.h / modelH;
      dummy.position.set(p.x, -modelMinY * s + 0.02, p.z);
      dummy.rotation.set(0, (p.yaw != null) ? p.yaw : ((p.x * 0.3 + p.z * 0.17) % (Math.PI * 2)), 0);
      dummy.scale.set(s, s, s);
      dummy.updateMatrix();
      scratch.multiplyMatrices(dummy.matrix, part.local);
      inst.setMatrixAt(i, scratch);
    }
    inst.instanceMatrix.needsUpdate = true;
    cypressGroup.add(inst);
  }
  console.info('[cubicles] cathedral chrome GLB instanced', count, 'trees ×', parts.length, 'draw', 'sketch-C bald-cypress-glb');
  window.__sketchCTrees = { n: count, modelH, parts: parts.length, meshes: meshCount, instanced: true, source: 'opengameart-bald-cypress' };
  try { placeSpanishMossFilaments(); } catch (mossErr) { console.warn('[cubicles] moss filaments skipped', mossErr); }
  return count;
}

(async function bootSketchCCypress() {
  const wantGlb = params.has('glb') || hashParams.get('glb') === '1';
  try {

})();

function resetToFoyer() {
  pos.set(SPAWN.x, SPAWN.y, SPAWN.z);
  yaw.value = SPAWN.yaw;
  pitch.value = SPAWN.pitch;
}

function findCellAt(x, z) {
  for (const h of hung) {
    const a = h.aabb;
    if (x >= a.minX && x <= a.maxX && z >= a.minZ && z <= a.maxZ) return h;
  }
  return null;
}

// —— Zone chip + lazy embeds (chip UI stripped — silent cell tracking only) ——
let activeCell = null;
const chip = document.getElementById('chip'); // may be null (language chrome removed)
function showChip(_h) { /* visual chip removed */ }
function updateActiveCell() {
  const next = findCellAt(pos.x, pos.z);
  if (next === activeCell) return;
  activeCell = next;
  if (activeCell) showChip(activeCell);
}

function panelDist(h) {
  return Math.hypot(pos.x - h.cx, pos.z - h.panelZ);
}

// Raycaster lives above updateLazyEmbeds so facing/interact can use center-screen casts.
const raycaster = new THREE.Raycaster();
raycaster.layers.enable(LAB_HIT_LAYER); // pick layer-1 hits the camera does not draw
const pointerNDC = new THREE.Vector2();
const centerNDC = new THREE.Vector2(0, 0);

/** First ray hit whose panel is within range (skip nearer out-of-range occluders). */
function panelFromHits(hits, maxDistScale) {
  const scale = maxDistScale == null ? 1 : maxDistScale;
  for (const hit of hits) {
    const panel = hung[hit.object.userData.cellIndex];
    if (!panel) continue;
    if (panelDist(panel) <= interactDistFor(panel) * scale) return panel;
  }
  return null;
}

function hungPickMeshes() {
  const meshes = [];
  for (const h of hung) {
    if (h.hit) meshes.push(h.hit);
    if (h.frame) meshes.push(h.frame);
  }
  return meshes;
}

function facingPanelWithin(maxDistScale) {
  raycaster.setFromCamera(centerNDC, camera);
  const hits = raycaster.intersectObjects(hungPickMeshes(), false);
  const fromHits = panelFromHits(hits, maxDistScale == null ? 1 : maxDistScale / INTERACT_DIST);
  if (fromHits) return fromHits;
  // In-cell fallback: standing in a zone counts as facing that hang
  if (activeCell && panelDist(activeCell) <= interactDistFor(activeCell) * 1.2) return activeCell;
  return null;
}

function eventToNDC(e) {
  const rect = renderer.domElement.getBoundingClientRect();
  pointerNDC.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
  pointerNDC.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
}

function raycastPanels(e) {
  eventToNDC(e);
  raycaster.setFromCamera(pointerNDC, camera);
  return raycaster.intersectObjects(hungPickMeshes(), false);
}

function panelUnderPointer(e) {
  eventToNDC(e);
  raycaster.setFromCamera(pointerNDC, camera);
  const hits = raycaster.intersectObjects(hungPickMeshes(), false);
  return panelFromHits(hits, 1.25);
}

function setInteractTarget(panel) {
  for (const h of hung) {
    h.canInteract = false;
    h.iframe.style.pointerEvents = 'none';
    h.iframe.style.cursor = '';
  }
  if (!panel) {
    stage.classList.remove('panel-hover');
    return;
  }
  armLab(panel);
  panel.canInteract = true;
  panel.iframe.style.pointerEvents = 'auto';
  panel.iframe.style.cursor = 'pointer';
  stage.classList.add('panel-hover');
}

function updateLazyEmbeds() {
  if (overviewOn) {
    stage.classList.remove('panel-hover');
    return;
  }

  const scored = hung.map((h) => ({ h, dist: panelDist(h) }))
    .sort((a, b) => a.dist - b.dist);

  // Arm hover/facing/activeCell first, then nearest-N within ARM_DIST.
  const armSet = new Set();
  if (hoverPanel) armSet.add(hoverPanel);
  const facing = facingPanelWithin(1);
  if (facing) armSet.add(facing);
  if (activeCell) armSet.add(activeCell);
  for (const { h, dist } of scored) {
    if (armSet.size >= MAX_ARMED) break;
    if (dist < ARM_DIST) armSet.add(h);
  }

  for (const h of hung) {
    const want = armSet.has(h);
    if (want && !h.embedArmed) {
      armLab(h);
    } else if (!want && h.embedArmed && !panelPointerLock && h !== hoverPanel) {
      h.iframe.src = 'about:blank';
      h.iframe.style.opacity = '0';
      h.embedArmed = false;
      h._revealWatch = false;
    }
    h.group.visible = true;
  }

  // Cursor-over-frame wins → center facing → activeCell → nearest.
  // Arm hover immediately so pointer cursor is not lost on the far wall.
  let best = null;
  if (hoverPanel && panelDist(hoverPanel) <= interactDistFor(hoverPanel) * 1.25) {
    best = hoverPanel;
  } else if (facing) {
    best = facing;
  } else if (activeCell && panelDist(activeCell) <= interactDistFor(activeCell) * 1.2) {
    best = activeCell;
  } else {
    for (const { h, dist } of scored) {
      if (dist <= interactDistFor(h)) { best = h; break; }
    }
  }
  if (!panelPointerLock) setInteractTarget(best);
}

// —— Wormhole ambient bed (musical loop: beat 1 → beat 4 → 1; unlock on Enter / pointer) ——
// Asset is an 8-bar / 96 BPM trim (20.000s) of wormhole-ambient, beat1@source 0.952s → after beat4.
// Tiny dual-Audio XFADE only hides MP3 decoder padding — not a phrasing blur.
// Primary Audio loads first (high priority); secondary buffer arms only after primary is playing
// so mobile bandwidth isn't split / starved against stargazer + labs. Play on earliest canplay —
// never wait for full-file download. GainNodes unlock speakers; Analyser taps bass → labs.
(function installWormholeAmbient() {
  try {
    const SRC = './demo-assets/audio/wormhole-ambient.mp3?v=amb96';
    const VOL = 0.46; // soft bed after Enter/tap (nudged up from 0.38)
    const BPM = 96;
    const BARS = 8;
    const LOOP_LEN = (60 / BPM) * 4 * BARS; // 20.000s — start on 1, end after 4
    const XFADE = 0.05; // ~1/12 beat; covers MP3 gap without smearing the downbeat
    const a = new Audio();
    const b = new Audio();
    // Primary first — second buffer gets src only after play (avoids dual full-file fetch)
    a.preload = 'auto';
    a.loop = false;
    a.volume = VOL;
    a.setAttribute('playsinline', '');
    try { a.setAttribute('fetchpriority', 'high'); } catch {}
    a.src = SRC;
    try { a.load(); } catch {}
    b.preload = 'auto';
    b.loop = false;
    b.volume = 0;
    b.setAttribute('playsinline', '');
    // no b.src yet
    let bArmed = false;
    function armSecondary() {
      if (bArmed) return;
      bArmed = true;
      b.src = SRC;
      try { b.load(); } catch {}
      console.info('[cubicles] ambient secondary buffer loading (after primary play)');
    }

    a.addEventListener('error', () => console.warn('[cubicles] ambient media error', a.error), { once: true });
    if (a.readyState < 2) {
      a.addEventListener('canplay', () => console.info('[cubicles] ambient canplay (primary)'), { once: true });
    }
    let usingA = true;
    let started = false;
    let raf = 0;
    let arming = false;
    let audioCtx = null;
    let analyser = null;
    let freqData = null;
    let gainA = null;
    let gainB = null;
    let graphWired = false;
    let graphFailed = false;
    let bassSmooth = 0;
    let playWaitBound = false;

    const active = () => (usingA ? a : b);
    const idle = () => (usingA ? b : a);

    function setLevels(curVol, nxtVol) {
      if (graphWired && gainA && gainB) {
        gainA.gain.value = usingA ? curVol : nxtVol;
        gainB.gain.value = usingA ? nxtVol : curVol;
        a.volume = 1;
        b.volume = 1;
      } else {
        a.volume = usingA ? curVol : nxtVol;
        b.volume = usingA ? nxtVol : curVol;
      }
    }

    function wireGainGraph() {
      if (graphWired || graphFailed) return;
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) { graphFailed = true; return; }
      try {
        audioCtx = audioCtx || new AC();
        // MediaElementSource works before b has src — creates silent idle buffer
        const srcA = audioCtx.createMediaElementSource(a);
        const srcB = audioCtx.createMediaElementSource(b);
        gainA = audioCtx.createGain();
        gainB = audioCtx.createGain();
        gainA.gain.value = VOL;
        gainB.gain.value = 0;
        srcA.connect(gainA);
        srcB.connect(gainB);
        gainA.connect(audioCtx.destination);
        gainB.connect(audioCtx.destination);
        graphWired = true;
        a.volume = 1;
        b.volume = 1;
        console.info('[cubicles] ambient GainNode wired (speakers)');
      } catch (err) {
        console.warn('[cubicles] Web Audio wire failed — using element.volume path', err);
        graphFailed = true;
        analyser = null;
        freqData = null;
        gainA = null;
        gainB = null;
      }
    }

    function wireAnalyserTap() {
      if (!graphWired || analyser || !audioCtx) return;
      try {
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 256;
        analyser.smoothingTimeConstant = 0.72;
        analyser.minDecibels = -90;
        analyser.maxDecibels = -28;
        gainA.connect(analyser);
        gainB.connect(analyser);
        freqData = new Uint8Array(analyser.frequencyBinCount);
        console.info('[cubicles] ambient Analyser tap ready (bass → floating labs)');
      } catch (errA) {
        console.warn('[cubicles] AnalyserNode tap failed — audio still plays via GainNode', errA);
        analyser = null;
        freqData = null;
      }
    }

    function sampleBass() {
      if (!analyser || !freqData) return 0;
      try {
        analyser.getByteFrequencyData(freqData);
      } catch { return 0; }
      let sum = 0;
      const n = Math.min(7, freqData.length - 1);
      for (let i = 1; i <= n; i++) sum += freqData[i];
      const avg = sum / n / 255;
      return Math.min(1, Math.pow(avg, 0.85) * 1.15);
    }

    function getBass() {
      const raw = sampleBass();
      const k = raw > bassSmooth ? 0.38 : 0.09;
      bassSmooth += (raw - bassSmooth) * k;
      return bassSmooth;
    }

    function crossfadeTick() {
      if (!started) return;
      const cur = active();
      const dur = LOOP_LEN;
      if (!Number.isFinite(cur.duration) || cur.duration < 1) {
        raf = requestAnimationFrame(crossfadeTick);
        return;
      }
      // Ensure secondary is warming well before seam
      if (!bArmed && cur.currentTime > 0.5) armSecondary();
      const remain = dur - cur.currentTime;
      if (remain <= XFADE && !arming) {
        arming = true;
        armSecondary();
        const nxt = idle();
        try {
          nxt.currentTime = 0;
          const p = nxt.play();
          if (p && typeof p.catch === 'function') {
            p.catch((err) => console.warn('[cubicles] ambient crossfade play failed', err));
          }
        } catch (err) {
          console.warn('[cubicles] ambient crossfade play threw', err);
        }
      }
      if (arming) {
        const t = Math.max(0, Math.min(1, 1 - (dur - cur.currentTime) / XFADE));
        setLevels(VOL * (1 - t), VOL * t);
        if (t >= 0.999 || cur.currentTime >= dur || cur.ended || cur.paused) {
          try { cur.pause(); } catch {}
          try { cur.currentTime = 0; } catch {}
          setLevels(0, VOL);
          usingA = !usingA;
          arming = false;
        }
      } else {
        setLevels(VOL, 0);
      }
      raf = requestAnimationFrame(crossfadeTick);
    }

    const tryPlay = () => {
      const cur = active();
      if (started && !cur.paused && !arming) {
        if (audioCtx && audioCtx.state === 'suspended') {
          audioCtx.resume().catch((err) => console.warn('[cubicles] AudioContext resume failed', err));
        }
        return;
      }
      // Earliest buffered play — canplay / HAVE_CURRENT_DATA; do NOT wait for full file
      if (cur.readyState < 2) {
        if (!playWaitBound) {
          playWaitBound = true;
          const kick = () => {
            playWaitBound = false;
            tryPlay();
          };
          cur.addEventListener('canplay', kick, { once: true });
          cur.addEventListener('loadeddata', kick, { once: true });
          console.info('[cubicles] ambient waiting for canplay (readyState=' + cur.readyState + ')');
          // Kick once only — re-load() on every pointerdown would restart the download
          try {
            if (!cur.src) { cur.src = SRC; cur.load(); }
          } catch {}
        }
        return;
      }
      wireGainGraph();
      setLevels(VOL, 0);
      let p;
      try {
        p = cur.play();
      } catch (err) {
        console.warn('[cubicles] ambient play threw', err);
        return;
      }
      const mark = () => {
        started = true;
        setLevels(VOL, 0);
        // Arm secondary only after primary is audible — frees bandwidth for first seconds
        armSecondary();
        if (!raf) raf = requestAnimationFrame(crossfadeTick);
        console.info('[cubicles] wormhole ambient playing', graphWired ? '(web-audio)' : '(element)');
        try {
          window.dispatchEvent(new CustomEvent('cubicles-ambient-playing'));
        } catch {}
      };
      if (p && typeof p.then === 'function') {
        p.then(mark).catch((err) => console.warn('[cubicles] ambient play blocked/failed', err));
      } else {
        mark();
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume().catch((err) => console.warn('[cubicles] AudioContext resume failed', err));
      }
      try { wireAnalyserTap(); } catch {}
    };

    window.__wormholeAmbient = {
      audio: a, audioB: b, tryPlay, vol: VOL,
      bpm: BPM, bars: BARS, loopLen: LOOP_LEN, xfade: XFADE,
      getBass, get audioCtx() { return audioCtx; }, get analyser() { return analyser; },
      get graphWired() { return graphWired; },
      get started() { return started; },
      get secondaryArmed() { return bArmed; },
    };
    window.addEventListener('pointerdown', tryPlay, { once: false });
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        try { a.pause(); b.pause(); } catch {}
        if (raf) { cancelAnimationFrame(raf); raf = 0; }
        if (audioCtx && audioCtx.state === 'running') {
          try { audioCtx.suspend(); } catch {}
        }
      } else if (started || window.__cubiclesEntered) {
        arming = false;
        if (audioCtx && audioCtx.state === 'suspended') {
          audioCtx.resume().catch(() => {});
        }
        tryPlay();
      }
    });
    console.info('[cubicles] wormhole ambient ready', BARS + ' bars @ ' + BPM + ' BPM, loop ' + LOOP_LEN + 's, xfade ' + XFADE + 's, primary-first');
  } catch (err) {
    console.warn('[cubicles] wormhole ambient failed', err);
  }
})();


/** Subtle bass-reactive scale / bob / yaw on floating CSS3D labs — small amplitude. */
function updateBeatLabs(t) {
  if (reduceMotion) return;
  const bed = window.__wormholeAmbient;
  const bass = bed && typeof bed.getBass === 'function' ? bed.getBass() : 0;
  if (bass < 0.002 && !bed?.analyser) {
    // Rest pose when no audio graph yet
    for (const h of hung) {
      if (h._beatApplied) {
        h.group.position.set(h.cx, h.baseY, h.panelZ);
        h.group.rotation.y = 0;
        h.group.scale.set(1, 1, 1);
        h.cssObj.position.set(h.cx, h.baseY, h.panelZ + 0.02);
        h.cssObj.rotation.y = 0;
        h.cssObj.scale.set(h.cssBaseScale, h.cssBaseScale, h.cssBaseScale);
        if (h.spot) h.spot.position.y = h.baseY + PANEL_H * 0.55;
        h._beatApplied = false;
      }
    }
    return;
  }
  // Elegant caps — never fight walk/look; scale pulse nudged up from 0.050
  const AMP_Y = 0.095;      // ~9.5 cm bob
  const AMP_SCALE = 0.068;  // ±6.8% expand/contract (was 0.050)
  const AMP_YAW = 0.030;    // ~1.7° yaw
  for (const h of hung) {
    const ph = h.beatPhase || 0;
    // Staggered micro-phase so the field breathes, not marches in lockstep
    const local = bass * (0.72 + 0.28 * Math.sin(t * 1.7 + ph));
    const bob = local * AMP_Y * (0.85 + 0.15 * Math.sin(t * 2.3 + ph * 1.3));
    const yawOff = local * AMP_YAW * Math.sin(t * 1.1 + ph);
    const s = 1 + local * AMP_SCALE;
    // Keep hit-plane group and CSS3D iframe on the same center (panelZ+0.02)
    // so raycast / DOM AABB stay under the painted lab during the pulse.
    const y = h.baseY + bob;
    const z = h.panelZ + 0.02;
    h.group.position.set(h.cx, y, h.panelZ);
    h.group.rotation.y = yawOff;
    h.group.scale.set(s, s, s);
    h.cssObj.position.set(h.cx, y, z);
    h.cssObj.rotation.y = yawOff;
    const cs = h.cssBaseScale * s;
    h.cssObj.scale.set(cs, cs, cs);
    if (h.spot) h.spot.position.y = h.baseY + PANEL_H * 0.55 + bob * 0.6;
    h._beatApplied = true;
  }
}
