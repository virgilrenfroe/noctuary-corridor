// —— Overview / walk camera ——
let overviewOn = false;
const WALK_FOV = 48;
const WALK_FOV_MIN = 28;
const WALK_FOV_MAX = 70;
let walkFov = WALK_FOV;
const OVERVIEW_FOV = 58;
const overviewTarget = new THREE.Vector3(0, OUTER_H * 0.22, (GRID_Z_MIN + GRID_Z_MAX) * 0.35);
const overview = {
  on: false,
  // spherical coords relative to box center (elevated front view of cathedral nave)
  theta: 0.28,          // yaw around Y
  phi: 1.05,            // polar from +Y (smaller = higher)
  radius: 56,
  minRadius: 18,
  maxRadius: 58,
};
const walkSnapshot = {
  pos: new THREE.Vector3(),
  yaw: 0,
  pitch: 0,
};

function applyOverviewCamera() {
  const r = overview.radius;
  const phi = THREE.MathUtils.clamp(overview.phi, 0.25, 1.35);
  overview.phi = phi;
  const sinP = Math.sin(phi);
  const x = overviewTarget.x + r * sinP * Math.sin(overview.theta);
  const y = overviewTarget.y + r * Math.cos(phi);
  const z = overviewTarget.z + r * sinP * Math.cos(overview.theta);
  camera.position.set(x, y, z);
  camera.lookAt(overviewTarget);
  camera.rotation.order = 'YXZ';
}

function applyCamera() {
  if (overview.on) {
    applyOverviewCamera();
    return;
  }
  camera.position.copy(pos);
  camera.rotation.order = 'YXZ';
  camera.rotation.y = yaw.value;
  camera.rotation.x = pitch.value;
}

function setOverview(on) {
  if (on === overview.on) {
    document.getElementById('btn-overview')?.classList.toggle('on', overview.on);
    return;
  }
  if (on) {
    walkSnapshot.pos.copy(pos);
    walkSnapshot.yaw = yaw.value;
    walkSnapshot.pitch = pitch.value;
    // disarm panel interaction / freeze walks
    move.f = move.b = move.l = move.r = false;
    velocity.set(0, 0, 0);
    clearPadMove();
    panelPointerLock = false;
    for (const h of hung) {
      h.iframe.style.pointerEvents = 'none';
      if (h.embedArmed) {
        h.iframe.src = 'about:blank';
        h.iframe.style.opacity = '0';
        h.embedArmed = false;
        h.canInteract = false;
      }
    }
    activeCell = null;
    camera.fov = OVERVIEW_FOV;
    camera.updateProjectionMatrix();
    overview.on = true;
    overviewOn = true;
  } else {
    overview.on = false;
    overviewOn = false;
    pos.copy(walkSnapshot.pos);
    yaw.value = walkSnapshot.yaw;
    pitch.value = walkSnapshot.pitch;
    camera.fov = walkFov;
    camera.updateProjectionMatrix();
    updateActiveCell();
    updateLazyEmbeds();
  }
  document.getElementById('btn-overview')?.classList.toggle('on', overview.on);
  document.body.classList.toggle('overview', overview.on);
}
document.getElementById('btn-overview')?.addEventListener('click', () => setOverview(!overview.on));
// Default: full-screen foyer walk (Sketch C) on mobile + desktop.
// ?overview=1 forces dollhouse overview; Overview pill / O still toggles. ?walk=1 kept as no-op alias.
if (params.has('overview') && !params.has('still') && !params.has('walk')) {
  entered = true;
  window.__cubiclesEntered = true;
  if (gate) gate.classList.add('hide');
  resetToFoyer();
  setOverview(true);
} else if (reduceMotion || params.has('still')) {
  entered = true;
  window.__cubiclesEntered = true;
} else {
  // Silent enter — no gate language; audio unlocks on first pointer.
  silentEnter({ reset: true });
}

// Dev assert: foyer spawn must not sit in any cell
{
  const hit = findCellAt(SPAWN.x, SPAWN.z);
  if (hit) console.error('[cubicles] SPAWN inside cell', hit.meta.num, hit.meta.name, SPAWN);
  else console.info('[cubicles] foyer spawn OK', SPAWN.x, SPAWN.y, SPAWN.z, 'gridZ', GRID_Z_MIN, GRID_Z_MAX);
}

document.addEventListener('keydown', (e) => {
  if (!entered && !reduceMotion) return;
  if (e.code === 'KeyO') { setOverview(!overview.on); return; }
  if (e.code === 'KeyB') setDebug(!debugOn);
  if (overview.on) return; // walk keys idle in overview
  if (e.code === 'KeyW' || e.code === 'ArrowUp') move.f = true;
  if (e.code === 'KeyS' || e.code === 'ArrowDown') move.b = true;
  if (e.code === 'KeyA' || e.code === 'ArrowLeft') move.l = true;
  if (e.code === 'KeyD' || e.code === 'ArrowRight') move.r = true;
  if (e.code === 'KeyR') {
    if (overview.on) setOverview(false);
    resetToFoyer();
    velocity.set(0, 0, 0);
    move.f = move.b = move.l = move.r = false;
    activeCell = null;
    updateActiveCell();
    updateLazyEmbeds();
  }
});
document.addEventListener('keyup', (e) => {
  if (e.code === 'KeyW' || e.code === 'ArrowUp') move.f = false;
  if (e.code === 'KeyS' || e.code === 'ArrowDown') move.b = false;
  if (e.code === 'KeyA' || e.code === 'ArrowLeft') move.l = false;
  if (e.code === 'KeyD' || e.code === 'ArrowRight') move.r = false;
});

const mobilePad = document.getElementById('mobile-pad');
const padKnob = document.getElementById('pad-knob');
const PAD_MAX = 42;
let padPointerId = null;
function clearPadMove() {
  move.f = move.b = move.l = move.r = false;
  const k = document.getElementById('pad-knob');
  if (k) k.style.transform = '';
  const mp = document.getElementById('mobile-pad');
  if (mp) mp.classList.remove('active');
}
function applyPadVector(dx, dy) {
  const dist = Math.hypot(dx, dy);
  let ux = dx, uy = dy;
  if (dist > PAD_MAX) { ux = (dx / dist) * PAD_MAX; uy = (dy / dist) * PAD_MAX; }
  if (padKnob) padKnob.style.transform = `translate(${ux}px, ${uy}px)`;
  const dead = 14;
  move.f = uy < -dead; move.b = uy > dead; move.l = ux < -dead; move.r = ux > dead;
  mobilePad.classList.toggle('active', move.f || move.b || move.l || move.r);
}
mobilePad.addEventListener('pointerdown', (e) => {
  if (!entered) return;
  padPointerId = e.pointerId;
  mobilePad.setPointerCapture(e.pointerId);
  const r = mobilePad.getBoundingClientRect();
  applyPadVector(e.clientX - (r.left + r.width / 2), e.clientY - (r.top + r.height / 2));
});
mobilePad.addEventListener('pointermove', (e) => {
  if (padPointerId !== e.pointerId) return;
  const r = mobilePad.getBoundingClientRect();
  applyPadVector(e.clientX - (r.left + r.width / 2), e.clientY - (r.top + r.height / 2));
});
mobilePad.addEventListener('pointerup', (e) => {
  if (padPointerId !== e.pointerId) return;
  padPointerId = null; clearPadMove();
});
mobilePad.addEventListener('pointercancel', clearPadMove);

stage.addEventListener('pointermove', (e) => {
  if (overview.on || !entered || panelPointerLock || dragging) return;
  // Don't fight look-drag; only refresh hover when idle
  const next = panelUnderPointer(e);
  if (next !== hoverPanel) {
    hoverPanel = next;
    if (next) stage.classList.add('panel-hover');
    updateLazyEmbeds();
  } else if (next) {
    stage.classList.add('panel-hover');
  }
}, { passive: true });
stage.addEventListener('pointerleave', (e) => {
  // Moving onto the armed CSS3D iframe is not "leaving" the panel — keep pointer.
  const to = e.relatedTarget;
  if (to && hung.some((h) => h.canInteract && (to === h.iframe || (h.iframe && h.iframe.contains(to))))) {
    return;
  }
  if (hoverPanel) {
    hoverPanel = null;
    if (!panelPointerLock) updateLazyEmbeds();
  }
});

// Keep pointer cursor while the mouse is over an interacting iframe (CSS layer is outside #stage).
document.addEventListener('pointermove', (e) => {
  if (overview.on || !entered || panelPointerLock || dragging) return;
  const t = e.target;
  const over = hung.find((h) => h.canInteract && (t === h.iframe || (h.iframe && h.iframe.contains && h.iframe.contains(t))));
  if (over) {
    if (hoverPanel !== over) {
      hoverPanel = over;
      updateLazyEmbeds();
    } else {
      stage.classList.add('panel-hover');
    }
  }
}, { passive: true, capture: true });

// —— Walk look: full 360° ——
// CSS3D iframes sit above #stage; stage-only pointermove stops when the drag
// crosses a lab iframe. Use document-level move/up + pointer capture so look
// continues across embeds. Optional Pointer Lock (desktop) for continuous look.
let lookPointerId = null;
// Pinch state (handlers installed after look-drag; decls here so guards can see them)
const pinchPointers = new Map(); // pointerId -> {x,y}
let pinching = false;
let pinchStartDist = 0;
let pinchStartFov = WALK_FOV;
let pinchStartRadius = 56;
const PITCH_MIN = -1.25;
const PITCH_MAX = 1.15; // slightly wider than prior −1.0…0.8

function wrapYaw(v) {
  const twopi = Math.PI * 2;
  v = v % twopi;
  if (v < 0) v += twopi;
  return v;
}
function applyLookDelta(dx, dy) {
  if (overview.on) {
    overview.theta -= dx * 0.005;
    overview.phi = THREE.MathUtils.clamp(overview.phi + dy * 0.004, 0.25, 1.35);
    return;
  }
  // Never clamp yaw — full 360° orbit; wrap keeps value bounded for logs.
  yaw.value = wrapYaw(yaw.value - dx * 0.0025);
  pitch.value = Math.max(PITCH_MIN, Math.min(PITCH_MAX, pitch.value - dy * 0.002));
}
function endLookDrag(e) {
  if (lookPointerId != null && e && e.pointerId !== lookPointerId) return;
  if (dragging) {
    dragging = false;
    stage.classList.remove('dragging');
    if (lookPointerId != null) {
      try { stage.releasePointerCapture(lookPointerId); } catch {}
    }
    lookPointerId = null;
  }
  // Don't steal panel interact: only clear panel lock if release is outside an armed iframe
  const t = e && e.target;
  const inPanel = t && hung.some((h) => h.canInteract && (t === h.iframe || (h.iframe && h.iframe.contains && h.iframe.contains(t))));
  if (!inPanel) panelPointerLock = false;
}
function syncLookLockPill() {
  const btn = document.getElementById('btn-look-lock');
  if (!btn) return;
  const on = !!(document.pointerLockElement && (document.pointerLockElement === stage || stage.contains(document.pointerLockElement)));
  btn.classList.toggle('on', on);
  stage.classList.toggle('look-locked', on);
}
function requestWalkPointerLock() {
  if (mobileLike || reduceMotion || !entered || overview.on) return;
  const el = stage;
  if (document.pointerLockElement) {
    document.exitPointerLock();
    return;
  }
  try { el.requestPointerLock(); } catch {}
}

stage.addEventListener('pointerdown', (e) => {
  if (!entered) return;
  // Two-finger pinch owns the gesture — don't start / continue look-drag
  if (pinching || (e.pointerType !== 'mouse' && pinchPointers.size >= 2)) return;
  if (!overview.on) {
    const panel = panelUnderPointer(e);
    if (panel) {
      hoverPanel = panel;
      setInteractTarget(panel);
      panelPointerLock = true;
      return;
    }
  }
  // Don't start look-drag while Pointer Lock owns the mouse (mousemove handles it)
  if (document.pointerLockElement) return;
  panelPointerLock = false;
  dragging = true;
  lookPointerId = e.pointerId;
  stage.classList.add('dragging');
  lastX = downX = e.clientX; lastY = downY = e.clientY;
  try { stage.setPointerCapture(e.pointerId); } catch {}
});
// Document-level look while dragging — survives CSS3D iframe crossings
document.addEventListener('pointermove', (e) => {
  if (!dragging || reduceMotion || panelPointerLock || pinching) return;
  if (lookPointerId != null && e.pointerId !== lookPointerId) return;
  if (document.pointerLockElement) return; // mousemove + movementX path
  const dx = e.clientX - lastX; const dy = e.clientY - lastY;
  lastX = e.clientX; lastY = e.clientY;
  applyLookDelta(dx, dy);
}, { capture: true, passive: true });
document.addEventListener('pointerup', endLookDrag, { capture: true });
document.addEventListener('pointercancel', endLookDrag, { capture: true });

// Desktop Pointer Lock — continuous mouse-look; Esc exits (browser). Double-click stage or pill.
stage.addEventListener('dblclick', (e) => {
  if (!entered || overview.on || mobileLike || reduceMotion) return;
  if (panelUnderPointer(e)) return; // don't break panel interact
  e.preventDefault();
  requestWalkPointerLock();
});
document.getElementById('btn-look-lock')?.addEventListener('click', () => {
  if (!entered) silentEnter({ reset: false });
  if (overview.on) setOverview(false);
  requestWalkPointerLock();
});
document.addEventListener('pointerlockchange', syncLookLockPill);
document.addEventListener('pointerlockerror', () => { console.warn('[cubicles] pointer lock failed'); syncLookLockPill(); });
document.addEventListener('mousemove', (e) => {
  if (!document.pointerLockElement || !entered || reduceMotion || panelPointerLock) return;
  // movementX/Y work under lock even when cursor would cross iframes
  applyLookDelta(e.movementX || 0, e.movementY || 0);
});

function resize() {
  const w = innerWidth, h = innerHeight;
  camera.aspect = w / Math.max(1, h);
  camera.updateProjectionMatrix();
  renderer.setSize(w, h, false);
  cssRenderer.setSize(w, h);
  if (composer) composer.setSize(w, h);
  if (bloomPass) bloomPass.resolution.set(w, h);
}
addEventListener('resize', resize);
resize();

// —— Pinch zoom: walk FOV / overview radius (ignores walk-pad fingers) ——
pinchStartRadius = overview.radius;

function pinchDist() {
  const pts = [...pinchPointers.values()];
  if (pts.length < 2) return 0;
  return Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
}
function endLookForPinch() {
  if (!dragging) return;
  dragging = false;
  stage.classList.remove('dragging');
  if (lookPointerId != null) {
    try { stage.releasePointerCapture(lookPointerId); } catch {}
  }
  lookPointerId = null;
}
function applyPinchZoom() {
  if (!pinching || pinchPointers.size < 2 || !entered || reduceMotion) return;
  const d = pinchDist();
  if (d < 1) return;
  const scale = d / pinchStartDist;
  if (overview.on) {
    overview.radius = THREE.MathUtils.clamp(
      pinchStartRadius / scale,
      overview.minRadius,
      overview.maxRadius
    );
  } else {
    walkFov = THREE.MathUtils.clamp(pinchStartFov / scale, WALK_FOV_MIN, WALK_FOV_MAX);
    camera.fov = walkFov;
    camera.updateProjectionMatrix();
  }
}
function pinchIgnoreTarget(t) {
  if (!t || !t.closest) return false;
  return !!(t.closest('#mobile-pad') || t.closest('.pills') || t.closest('.gate') || t.closest('.chip') || t.closest('button') || t.closest('a'));
}
document.addEventListener('pointerdown', (e) => {
  if (!entered || reduceMotion) return;
  if (e.pointerType === 'mouse') return;
  if (pinchIgnoreTarget(e.target)) return;
  pinchPointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pinchPointers.size >= 2) {
    endLookForPinch();
    panelPointerLock = false;
    if (!pinching) {
      pinching = true;
      pinchStartDist = Math.max(1, pinchDist());
      pinchStartFov = walkFov;
      pinchStartRadius = overview.radius;
    }
  }
}, { capture: true });
document.addEventListener('pointermove', (e) => {
  if (!pinchPointers.has(e.pointerId)) return;
  pinchPointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pinching) applyPinchZoom();
}, { capture: true, passive: true });
function endPinchPointer(e) {
  if (!pinchPointers.has(e.pointerId)) return;
  pinchPointers.delete(e.pointerId);
  if (pinchPointers.size < 2) pinching = false;
}
document.addEventListener('pointerup', endPinchPointer, { capture: true });
document.addEventListener('pointercancel', endPinchPointer, { capture: true });

stage.addEventListener('wheel', (e) => {
  if (!entered || reduceMotion) return;
  // Overview orbit zoom (legacy) OR ctrl/trackpad pinch → walk FOV
  if (overview.on) {
    e.preventDefault();
    overview.radius = THREE.MathUtils.clamp(
      overview.radius + e.deltaY * 0.02,
      overview.minRadius,
      overview.maxRadius
    );
    return;
  }
  if (e.ctrlKey) {
    e.preventDefault();
    const factor = Math.exp(e.deltaY * 0.01);
    walkFov = THREE.MathUtils.clamp(walkFov * factor, WALK_FOV_MIN, WALK_FOV_MAX);
    camera.fov = walkFov;
    camera.updateProjectionMatrix();
  }
}, { passive: false });


const clock = new THREE.Clock();
const forward = new THREE.Vector3();
const right = new THREE.Vector3();
const margin = 0.95;

function frame() {
  const dt = Math.min(0.05, clock.getDelta());
  if (overview.on) {
    // elevated orbit — no walk clamps / embeds
    applyCamera();
  } else if (!reduceMotion && entered) {
    forward.set(-Math.sin(yaw.value), 0, -Math.cos(yaw.value));
    right.set(Math.cos(yaw.value), 0, -Math.sin(yaw.value));
    const wish = new THREE.Vector3();
    if (move.f) wish.add(forward);
    if (move.b) wish.sub(forward);
    if (move.l) wish.sub(right);
    if (move.r) wish.add(right);
    if (wish.lengthSq() > 0) {
      wish.normalize().multiplyScalar(7.2);
      velocity.x += (wish.x - velocity.x) * Math.min(1, 8 * dt);
      velocity.z += (wish.z - velocity.z) * Math.min(1, 8 * dt);
    } else {
      velocity.x *= Math.pow(0.88, dt * 60);
      velocity.z *= Math.pow(0.88, dt * 60);
    }
    pos.x += velocity.x * dt;
    pos.z += velocity.z * dt;
    pos.x = Math.max(-OUTER_W / 2 + margin, Math.min(OUTER_W / 2 - margin, pos.x));
    pos.z = Math.max(-OUTER_D / 2 + margin, Math.min(OUTER_D / 2 - margin, pos.z));
    pos.y = EYE;
    updateActiveCell();
    updateLazyEmbeds();
    applyCamera();
  } else if (reduceMotion || params.has('still')) {
    pos.set(SPAWN.x, SPAWN.y + 0.15, SPAWN.z);
    yaw.value = SPAWN.yaw;
    pitch.value = SPAWN.pitch;
    applyCamera();
    // Still/foyer capture must arm CSS3D labs (reduceMotion otherwise skips walk branch)
    updateLazyEmbeds();
  } else {
    applyCamera();
  }
  if (!glContextLost) {
    const _tSpark = performance.now() * 0.001;
    if (water?.material?.uniforms?.time) {
      water.material.uniforms.time.value += dt * WATER_TIME_SCALE;
      if (water.material.uniforms.sunDirection) {
        water.material.uniforms.sunDirection.value.copy(waterSun);
      }
    }
    updateWallpaper(_tSpark);
    updateSparklines(_tSpark);
    updateBeatLabs(_tSpark);
    try {
      if (composer) composer.render();
      else renderer.render(scene, camera);
      cssRenderer.render(cssScene, camera);
    } catch (err) {
      console.warn('[cubicles] render failed', err);
      glContextLost = true;
      showGlTip('3D view paused — tap to reload');
    }
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

if (params.has('still')) {
  entered = true;
  window.__cubiclesEntered = true;
  if (gate) gate.classList.add('hide');
}
</script>
