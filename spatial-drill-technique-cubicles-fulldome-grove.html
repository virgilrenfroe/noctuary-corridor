<script>
/* Boot guard: if three/module fails (CDN/blocker), beige UI alone must not be silent. */
(function () {
  const tip = document.getElementById('gl-tip');
  let shown = false;
  function showBootFail(err) {
    if (shown || !tip) return;
    const stageEl = document.getElementById('stage');
    if (stageEl && stageEl.querySelector('canvas')) return; // module already started
    shown = true;
    const detail = (err && (err.message || String(err))) || 'unknown error';
    tip.hidden = false;
    tip.classList.add('show');
    tip.innerHTML = '3D failed to load — tap to reload<br><span style="font-size:11px;color:rgba(26,29,38,0.55);word-break:break-word"></span>';
    tip.querySelector('span').textContent = detail.slice(0, 220);
  }
  window.addEventListener('error', (e) => {
    const msg = e.message || (e.error && e.error.message) || '';
    if (!msg && !e.filename) return;
    // Ignore benign resize/resource noise; catch module / fetch / import failures
    if (/Failed to (fetch|load)|Importing a module|error loading dynamically|SyntaxError|TypeError|three/i.test(msg) ||
        (e.filename && /three|spatial-drill|vendor\/three/i.test(e.filename))) {
      showBootFail(e.error || new Error(msg || 'script error'));
    }
  });
  window.addEventListener('unhandledrejection', (e) => {
    showBootFail(e.reason || new Error('unhandled rejection'));
  });
  if (tip) tip.addEventListener('click', () => { location.reload(); });
  setTimeout(() => {
    const stage = document.getElementById('stage');
    if (stage && !stage.querySelector('canvas')) {
      showBootFail(new Error('module did not start (no WebGL canvas)'));
    }
  }, 4000);
})();
</script>
<script>
/* Ambient MP3 fetch first — parallel with Three boot; does not block first paint. */
// —— Wormhole ambient bed (EARLY: classic script, before Three module / first paint) ——
// Stable SINGLE bed only — no dual-A/B crossfade (seams/crackle/pitch drift).
// Prefer AudioBufferSource loop when decode is ready at gesture; else one HTMLAudioElement.
// NEVER soft-handoff mid-play (that caused crackle + tempo/pitch artifacts).
// playbackRate locked to 1. Gain clamped via setTargetAtTime. Analyser in series for water beat.
(function installWormholeAmbient() {
  try {
    const SRC = './demo-assets/audio/wormhole-ambient.mp3?v=ambstable1';
    const VOL = 0.46;
    const VOL_MAX = 0.55;
    const BPM = 96;
    const BARS = 8;
    const LOOP_LEN = (60 / BPM) * 4 * BARS; // 20.000s

    let audioCtx = null;
    let buffer = null;
    let bufferSource = null;
    let gain = null;
    let analyser = null;
    let freqData = null;
    let graphWired = false;
    let graphFailed = false;
    let started = false;
    let playInflight = false;
    let mode = 'none'; // 'buffer' | 'element'
    let bassSmooth = 0;
    let decodePromise = null;
    let elementSrcWired = false;

    const el = new Audio();
    el.preload = 'auto';
    el.loop = true;
    el.playbackRate = 1;
    el.defaultPlaybackRate = 1;
    el.preservesPitch = true;
    el.volume = VOL;
    el.setAttribute('playsinline', '');
    try { el.setAttribute('fetchpriority', 'high'); } catch {}
    el.src = SRC;
    try { el.load(); } catch {}
    try {
      fetch(SRC, { priority: 'high', credentials: 'same-origin', cache: 'force-cache' }).catch(() => {});
    } catch {}
    el.addEventListener('error', () => console.warn('[cubicles] ambient media error', el.error), { once: true });
    el.addEventListener('canplay', () => console.info('[cubicles] ambient canplay (element fallback)'), { once: true });
    // Lock rate — some engines nudge playbackRate under pressure; snap back.
    el.addEventListener('ratechange', () => {
      if (el.playbackRate !== 1) {
        try { el.playbackRate = 1; el.defaultPlaybackRate = 1; } catch {}
      }
    });

    function clampGain(v) {
      const n = Number(v);
      if (!Number.isFinite(n)) return 0;
      return Math.max(0, Math.min(VOL_MAX, n));
    }

    function lockRate() {
      try { el.playbackRate = 1; el.defaultPlaybackRate = 1; } catch {}
      if (bufferSource) {
        try { bufferSource.playbackRate.cancelScheduledValues(audioCtx ? audioCtx.currentTime : 0); } catch {}
        try { bufferSource.playbackRate.value = 1; } catch {}
      }
    }

    function setGainSmooth(v, tauSec) {
      const target = clampGain(v);
      const tau = tauSec == null ? 0.03 : tauSec;
      if (graphWired && gain && audioCtx) {
        const t = audioCtx.currentTime;
        try {
          gain.gain.cancelScheduledValues(t);
          const cur = gain.gain.value;
          gain.gain.setValueAtTime(Number.isFinite(cur) ? cur : 0, t);
          gain.gain.setTargetAtTime(target, t, Math.max(0.008, tau));
        } catch {
          try { gain.gain.value = target; } catch {}
        }
        try { el.volume = mode === 'element' && !elementSrcWired ? target : (elementSrcWired ? 1 : 0); } catch {}
      } else {
        try { el.volume = target; } catch {}
      }
    }

    function ensureAudioCtx() {
      if (audioCtx || graphFailed) return audioCtx;
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) { graphFailed = true; return null; }
      try { audioCtx = new AC(); }
      catch (err) {
        console.warn('[cubicles] AudioContext create failed', err);
        graphFailed = true;
        return null;
      }
      return audioCtx;
    }

    function resumeCtx() {
      const ctx = ensureAudioCtx();
      if (ctx && ctx.state === 'suspended') {
        ctx.resume().catch((err) => console.warn('[cubicles] AudioContext resume failed', err));
      }
      return ctx;
    }

    function kickDecode() {
      if (buffer || decodePromise) return decodePromise;
      const ctx = ensureAudioCtx();
      if (!ctx) return null;
      decodePromise = fetch(SRC, { credentials: 'same-origin', cache: 'force-cache', priority: 'high' })
        .then((r) => {
          if (!r.ok) throw new Error('ambient fetch ' + r.status);
          return r.arrayBuffer();
        })
        .then((ab) => ctx.decodeAudioData(ab.slice(0)))
        .then((buf) => {
          buffer = buf;
          console.info('[cubicles] ambient AudioBuffer ready', buf.duration.toFixed(3) + 's', buf.sampleRate + 'Hz');
          return buf;
        })
        .catch((err) => {
          console.warn('[cubicles] ambient decode failed — element loop fallback', err);
          decodePromise = null;
          return null;
        });
      return decodePromise;
    }

    function wireGainAnalyser() {
      if (graphWired || graphFailed) return false;
      const ctx = ensureAudioCtx();
      if (!ctx || ctx.state !== 'running') return false;
      try {
        gain = ctx.createGain();
        gain.gain.value = 0;
        analyser = ctx.createAnalyser();
        analyser.fftSize = 256;
        analyser.smoothingTimeConstant = 0.72;
        analyser.minDecibels = -90;
        analyser.maxDecibels = -28;
        // Series: gain → analyser → destination (analyser cannot steal speakers)
        gain.connect(analyser);
        analyser.connect(ctx.destination);
        freqData = new Uint8Array(analyser.frequencyBinCount);
        graphWired = true;
        console.info('[cubicles] ambient Gain+Analyser series wired (speakers)');
        return true;
      } catch (err) {
        console.warn('[cubicles] Web Audio wire failed — element.volume path', err);
        graphFailed = true;
        gain = null; analyser = null; freqData = null;
        return false;
      }
    }

    function stopBufferSource() {
      if (!bufferSource) return;
      try { bufferSource.onended = null; } catch {}
      try { bufferSource.stop(0); } catch {}
      try { bufferSource.disconnect(); } catch {}
      bufferSource = null;
    }

    function startBufferSource() {
      const ctx = audioCtx;
      if (!ctx || !buffer || !gain) return false;
      stopBufferSource();
      const src = ctx.createBufferSource();
      src.buffer = buffer;
      src.loop = true;
      src.playbackRate.value = 1; // hard lock — no tempo/pitch drift
      const end = Math.min(LOOP_LEN, Math.max(0.5, buffer.duration));
      src.loopStart = 0;
      src.loopEnd = end;
      src.connect(gain);
      try { src.start(0); }
      catch (err) {
        console.warn('[cubicles] ambient BufferSource start failed', err);
        try { src.disconnect(); } catch {}
        return false;
      }
      bufferSource = src;
      mode = 'buffer';
      lockRate();
      return true;
    }

    function wireElementSource() {
      if (elementSrcWired || graphFailed || !graphWired || !gain || !audioCtx) return false;
      try {
        const mes = audioCtx.createMediaElementSource(el);
        mes.connect(gain);
        elementSrcWired = true;
        el.volume = 1;
        lockRate();
        console.info('[cubicles] ambient MediaElementSource → Gain (element fallback)');
        return true;
      } catch (err) {
        console.warn('[cubicles] MediaElementSource wire failed', err);
        return false;
      }
    }

    function sampleBass() {
      if (!analyser || !freqData) return 0;
      try { analyser.getByteFrequencyData(freqData); }
      catch { return 0; }
      let sum = 0;
      const n = Math.min(7, freqData.length - 1);
      for (let i = 1; i <= n; i++) sum += freqData[i];
      const avg = sum / n / 255;
      return Math.min(1, Math.pow(avg, 0.85) * 1.15);
    }

    function getBass() {
      const raw = sampleBass();
      const k = raw > bassSmooth ? 0.38 : 0.09;
      bassSmooth += (raw - bassSmooth) * k;
      return bassSmooth;
    }

    function tryWireWhenRunning() {
      const ctx = audioCtx || ensureAudioCtx();
      if (!ctx || ctx.state !== 'running') return;
      if (!graphWired && !graphFailed) wireGainAnalyser();
    }

    function markPlaying(which) {
      if (started) return;
      started = true;
      playInflight = false;
      if (which) mode = which;
      lockRate();
      setGainSmooth(VOL, 0.02);
      console.info('[cubicles] wormhole ambient playing', '(' + mode + ', rate=1)',
        buffer ? ('buf=' + buffer.duration.toFixed(3) + 's') : 'buf=pending');
      try { window.dispatchEvent(new CustomEvent('cubicles-ambient-playing')); } catch {}
    }

    function startOnElement() {
      mode = 'element';
      lockRate();
      tryWireWhenRunning();
      if (graphWired) wireElementSource();
      setGainSmooth(VOL, 0.02);
      playInflight = true;
      el.addEventListener('playing', () => markPlaying('element'), { once: true });
      let p;
      try { p = el.play(); }
      catch (err) {
        playInflight = false;
        console.warn('[cubicles] ambient element play threw', err);
        return;
      }
      if (p && typeof p.then === 'function') {
        p.then(() => markPlaying('element')).catch((err) => {
          playInflight = false;
          console.warn('[cubicles] ambient element play blocked/failed', err);
        });
      } else {
        markPlaying('element');
      }
    }

    function startOnBuffer() {
      tryWireWhenRunning();
      if (!graphWired || !buffer) return false;
      if (!startBufferSource()) return false;
      try { el.pause(); } catch {}
      lockRate();
      setGainSmooth(VOL, 0.015);
      markPlaying('buffer');
      return true;
    }

    const tryPlay = () => {
      const ctx = resumeCtx();
      kickDecode();
      lockRate();
      if (ctx && typeof ctx.addEventListener === 'function') {
        const onState = () => {
          if (ctx.state === 'running') {
            tryWireWhenRunning();
            try { ctx.removeEventListener('statechange', onState); } catch {}
          }
        };
        try { ctx.addEventListener('statechange', onState); } catch {}
      }
      tryWireWhenRunning();

      // Anti-thrash + no mid-play handoff (staying on the bed that started prevents pitch/crackle)
      if (started) {
        if (mode === 'buffer' && bufferSource && ctx && ctx.state === 'running') {
          lockRate();
          return;
        }
        if (mode === 'element' && !el.paused) {
          lockRate();
          return;
        }
        // Resume after visibility suspend — same bed, no recreate if possible
        if (mode === 'buffer' && buffer && graphWired) {
          if (!bufferSource) startBufferSource();
          lockRate();
          setGainSmooth(VOL, 0.03);
          return;
        }
        if (mode === 'element') {
          playInflight = true;
          lockRate();
          const p = el.play();
          if (p && p.catch) p.catch(() => { playInflight = false; });
          else playInflight = false;
          setGainSmooth(VOL, 0.03);
          return;
        }
      }

      if (playInflight) return;

      // Prefer buffer if already decoded + ctx running (stable single-bed, rate=1)
      if (buffer && ctx && ctx.state === 'running') {
        if (startOnBuffer()) return;
      }

      // Sync gesture path: element.play() immediately — stay on element for this session
      // (no later buffer handoff → no dual-bed drift / pitch dip)
      startOnElement();
    };

    kickDecode();

    window.__wormholeAmbient = {
      audio: el, audioB: null, tryPlay, vol: VOL,
      bpm: BPM, bars: BARS, loopLen: LOOP_LEN, xfade: 0,
      getBass, get audioCtx() { return audioCtx; }, get analyser() { return analyser; },
      get graphWired() { return graphWired; },
      get started() { return started; },
      get secondaryArmed() { return !!buffer; },
      get mode() { return mode; },
      lockRate,
    };
    window.addEventListener('pointerdown', tryPlay, { once: false });
    window.addEventListener('touchstart', tryPlay, { once: false, passive: true });
    window.addEventListener('keydown', tryPlay, { once: false });
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        try { el.pause(); } catch {}
        if (audioCtx && audioCtx.state === 'running') {
          try { audioCtx.suspend(); } catch {}
        }
      } else if (started || window.__cubiclesEntered) {
        resumeCtx();
        lockRate();
        tryPlay();
      }
    });
    console.info('[cubicles] wormhole ambient ready (single-bed, rate=1, ambstable1)',
      BARS + ' bars @ ' + BPM + ' BPM, loop ' + LOOP_LEN + 's');
  } catch (err) {
    console.warn('[cubicles] wormhole ambient failed', err);
  }
})();


</script>

if (reduceMotion) document.body.classList.add('reduce');

  const n = parseInt(String(raw).replace(/[^0-9]/g, ''), 10);
  if (n === 2 || n === 3) return n;

const chromeVariant = resolveChromeVariant();

/** Magenta/gold-family equirect; punchy specular lobes for liquid mercury. */
function makeMagentaGoldEquirect(size = 512, variant = chromeVariant) {
  const data = new Float32Array(size * size * 4);
  for (let y = 0; y < size; y++) {
    for (let x = 0; x < size; x++) {
      const u = x / size;
      const v = y / size;
      const gold = Math.pow(Math.max(0, Math.cos((u - 0.18) * Math.PI * 2) * 0.55 + 0.35), 2.05);
      const gold2 = Math.pow(Math.max(0, Math.cos((u - 0.72) * Math.PI * 2) * 0.4 + 0.2), 2.2);
      const magenta = Math.pow(Math.max(0, 1 - Math.abs(v - 0.42) * 1.8), 1.45);
      const vault = Math.pow(Math.max(0, v - 0.55), 1.25);
      const coolBand = Math.pow(Math.max(0, 1 - Math.abs(v - 0.55) * 2.2), 1.8);
      // Hot specular windows — extreme beads for mercury chrome
      const winA = Math.pow(Math.max(0, 1 - Math.hypot(u - 0.22, v - 0.62) * 9), 4.5) * 4.2;
      const winB = Math.pow(Math.max(0, 1 - Math.hypot(u - 0.78, v - 0.58) * 11), 5.0) * 3.6;
      const winC = Math.pow(Math.max(0, 1 - Math.hypot(u - 0.5, v - 0.78) * 7), 3.8) * 3.0;
      const i = (y * size + x) * 4;
      let r, g, b;
      if (variant === 2) {
        r = 0.18 + gold * 4.4 + gold2 * 2.6 + magenta * 0.55 + vault * 0.55 + winA * 1.2 + winC;
        g = 0.08 + gold * 3.0 + gold2 * 1.7 + magenta * 0.08 + vault * 0.2 + winA * 0.85 + winC * 0.7;
        b = 0.06 + magenta * 1.4 + vault * 0.9 + gold * 0.25 + winB * 0.35;
      } else if (variant === 3) {
        r = 0.10 + gold * 1.4 + gold2 * 0.6 + magenta * 2.0 + coolBand * 1.2 + vault * 0.5 + winA * 0.6 + winB * 0.9;
        g = 0.03 + gold * 0.7 + magenta * 0.25 + coolBand * 0.35;
        b = 0.22 + magenta * 3.8 + coolBand * 2.8 + vault * 2.2 + gold * 0.15 + winB * 1.4 + winC * 0.5;
      } else {
        // Dark cathedral vault + hot gold/magenta specular windows (mercury beads)
        r = 0.03 + gold * 2.2 + gold2 * 1.1 + magenta * 0.35 + vault * 0.15 + winA * 3.8 + winC * 2.8;
        g = 0.015 + gold * 1.4 + gold2 * 0.7 + winA * 2.4 + winC * 1.8;
        b = 0.04 + magenta * 1.1 + vault * 0.7 + gold * 0.15 + winB * 2.6 + winC * 0.5;
      }
      data[i] = r; data[i + 1] = g; data[i + 2] = b; data[i + 3] = 1;
    }
  }
  const tex = new THREE.DataTexture(data, size, size, THREE.RGBAFormat, THREE.FloatType);
  tex.mapping = THREE.EquirectangularReflectionMapping;
  tex.colorSpace = THREE.LinearSRGBColorSpace;
  tex.needsUpdate = true;
  return tex;
}

/** Lift + tint Poly Haven HDR toward Sketch C magenta/gold (preserve luminance). */
function tintHdrTowardMagentaGold(tex, variant = chromeVariant) {
  const img = tex.image;
  if (!img || !img.data) return tex;
  const data = img.data;
  for (let i = 0; i < data.length; i += 4) {
    const r = data[i], g = data[i + 1], b = data[i + 2];
    const lum = 0.2126 * r + 0.7152 * g + 0.0722 * b;
    const goldW = Math.min(4.5, Math.pow(Math.max(0.02, lum), 0.85) * 1.35);
    const magW = Math.min(3.8, Math.pow(Math.max(0.05, 1.25 - Math.abs(lum - 0.45)), 1.2) * 1.25);
    if (variant === 2) {
      data[i]     = r * 1.05 + goldW * 2.8 + magW * 0.4 + 0.06;
      data[i + 1] = g * 0.95 + goldW * 2.0 + magW * 0.1 + 0.03;
      data[i + 2] = b * 0.75 + goldW * 0.45 + magW * 0.85 + 0.04;
    } else if (variant === 3) {
      data[i]     = r * 0.95 + goldW * 0.9 + magW * 1.8 + 0.05;
      data[i + 1] = g * 0.7 + goldW * 0.4 + magW * 0.25 + 0.02;
      data[i + 2] = b * 1.15 + goldW * 0.25 + magW * 2.6 + 0.08;
    } else {
      data[i]     = r * 1.0 + goldW * 2.5 + magW * 1.55 + 0.07;
      data[i + 1] = g * 0.85 + goldW * 1.55 + magW * 0.15 + 0.03;
      data[i + 2] = b * 1.05 + goldW * 0.35 + magW * 2.15 + 0.06;
    }
  }
  tex.needsUpdate = true;
  return tex;
}

async function setupCathedralEnvAndBloom() {
  const pmrem = new THREE.PMREMGenerator(renderer);
  try { pmrem.compileEquirectangularShader(); } catch (_) {}

  let usedLocalHdrBg = false;
  // Fast path: pre-baked soft cathedral equirect (WebP) — skips RGBE decode + PMREM of 1.6MB HDR on first paint.
  // Visual match for backgroundBlurriness≈0.68; envMap still uses punchy synth below.
  try {
    const prebakedUrl = './demo-assets/hdr/small_cathedral_02_1k_pmrem_bg.webp';
    const prebaked = await new THREE.TextureLoader().loadAsync(prebakedUrl);
    prebaked.mapping = THREE.EquirectangularReflectionMapping;
    prebaked.colorSpace = THREE.SRGBColorSpace;
    scene.background = prebaked;
    scene.backgroundBlurriness = 0.12; // already soft-baked
    scene.backgroundIntensity = chromeVariant === 2 ? 0.42 : 0.36;
    window.__sketchCHdrEnv = prebaked;
    usedLocalHdrBg = true;
    console.info('[cubicles] prebaked PMREM-style bg (skip HDR decode)', prebakedUrl, 'chrome=' + chromeVariant);
  } catch (preErr) {
    console.warn('[cubicles] prebaked bg missing — HDR fallback', preErr);
  }
  // Optional: full HDR upgrade only when ?hdr=1 (quality A/B), otherwise skip decode cost.
  if (!usedLocalHdrBg || params.has('hdr')) {
    try {
      const { RGBELoader } = await import('three/addons/loaders/RGBELoader.js');
      const localCandidates = [
        './demo-assets/hdr/small_cathedral_02_1k.hdr',
        './demo-assets/hdr/neon_photostudio_1k.hdr',
      ];
      let hdr = null;
      let hdrSrc = null;
      for (const url of localCandidates) {
        try {
          hdr = await new RGBELoader().loadAsync(url);
          hdrSrc = url;
          break;
        } catch (_) { /* try next */ }
      }
      if (!hdr) {
        try {
          hdr = await new RGBELoader().loadAsync(
            'https://threejs.org/examples/textures/equirectangular/venice_sunset_1k.hdr'
          );
          hdrSrc = 'cdn:venice_sunset';
        } catch (_) {}
      }
      if (hdr) {
        tintHdrTowardMagentaGold(hdr, chromeVariant);
        const bgRT = pmrem.fromEquirectangular(hdr);
        scene.background = bgRT.texture;
        scene.backgroundBlurriness = 0.68;
        scene.backgroundIntensity = chromeVariant === 2 ? 0.34 : 0.28;
        window.__sketchCHdrEnv = bgRT.texture;
        hdr.dispose();
        usedLocalHdrBg = true;
        console.info('[cubicles] Poly Haven HDR → PMREM background', hdrSrc, 'chrome=' + chromeVariant);
      }
    } catch (loaderErr) {
      console.warn('[cubicles] RGBELoader unavailable', loaderErr);
    }
  }

  // Sketch C chrome reflections: punchy magenta/gold synth with hot specular windows (mercury beads)
  try {
    const synth = makeMagentaGoldEquirect(mobileLike ? 256 : 512, chromeVariant);
    const env = pmrem.fromEquirectangular(synth).texture;
    scene.environment = env;
    scene.environmentIntensity = chromeVariant === 2 ? 1.05 : chromeVariant === 3 ? 1.25 : 1.2;
    if (!scene.background || scene.background.isColor) {
      scene.background = env;
      scene.backgroundBlurriness = 0.48;
      scene.backgroundIntensity = 0.34;
    }
    synth.dispose();
    // Explicit envMap bind — helps InstancedMesh / delayed chrome mats under SwiftShader
    window.__sketchCEnvTex = env;
    const bindChromeEnv = () => {
      const mats = window.__sketchCChromeMats || [];
      for (const m of mats) {
        if (!m) continue;
        m.envMap = env;
        m.needsUpdate = true;
      }
    };
    bindChromeEnv();
    // Re-bind once trees finish chromeify/clone (async GLB)
    setTimeout(bindChromeEnv, 800);
    setTimeout(bindChromeEnv, 2200);
    console.info('[cubicles] magenta/gold synth envMap (mercury)', 'chrome=' + chromeVariant, CHROME_LOOK,
      usedLocalHdrBg ? '+HDR bg' : 'synth-only');
  } catch (pmErr) {
    console.warn('[cubicles] equirect PMREM failed — fromScene / HDR fallback', pmErr);
    if (window.__sketchCHdrEnv) {
      scene.environment = window.__sketchCHdrEnv;
      scene.environmentIntensity = 1.85;
    } else {
      try {
        const probe = new THREE.Scene();
        probe.add(new THREE.Mesh(
          new THREE.SphereGeometry(2, 16, 12),
          new THREE.MeshBasicMaterial({ color: 0xffc050 })
        ).translateX(4).translateY(3).translateZ(-2));
        probe.add(new THREE.Mesh(
          new THREE.SphereGeometry(2.4, 16, 12),
          new THREE.MeshBasicMaterial({ color: 0xc028ff })
        ).translateX(-5).translateY(2.5).translateZ(3));
        scene.environment = pmrem.fromScene(probe, 0.04).texture;
        scene.environmentIntensity = 1.85;
      } catch (probeErr) {
        console.warn('[cubicles] PMREM fromScene failed — colored lights only', probeErr);
      }
    }
  }

  try { pmrem.dispose(); } catch (_) {}

  if (mobileLike) {
    console.info('[cubicles] bloom skipped on mobile-like');
    return;
  }
  try {
    const { EffectComposer } = await import('three/addons/postprocessing/EffectComposer.js');
    const { RenderPass } = await import('three/addons/postprocessing/RenderPass.js');
    const { UnrealBloomPass } = await import('three/addons/postprocessing/UnrealBloomPass.js');
    const { OutputPass } = await import('three/addons/postprocessing/OutputPass.js');
    composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));
    // Mercury bloom: moderate strength, tight radius, mid-high threshold → specular beads not trunk wash
    bloomPass = new UnrealBloomPass(
      new THREE.Vector2(innerWidth, innerHeight),
      wantAisle ? 0.08 : 0.11,
      wantAisle ? 0.12 : 0.15,
      wantAisle ? 0.95 : 0.92
    );
    composer.addPass(bloomPass);
    composer.addPass(new OutputPass());
    composer.setSize(innerWidth, innerHeight);
    console.info('[cubicles] UnrealBloomPass mercury bloom enabled');
  } catch (bloomErr) {
    composer = null;
    bloomPass = null;
    console.warn('[cubicles] bloom skipped', bloomErr);
  }
}

  mesh.castShadow = false;
  mesh.receiveShadow = false;

  const base = new Float32Array(WALLPAPER_COUNT * 3);
  const phase = new Float32Array(WALLPAPER_COUNT);
  const scale = new Float32Array(WALLPAPER_COUNT);
  const euler = new Float32Array(WALLPAPER_COUNT * 3);
  for (let i = 0; i < WALLPAPER_COUNT; i++) {

    base[i * 3 + 2] = z;
    phase[i] = Math.random() * Math.PI * 2;
    const s = 0.35 + Math.random() * 1.35;
    scale[i] = s;
    const rx = Math.random() * Math.PI;
    const ry = Math.random() * Math.PI;
    const rz = Math.random() * 0.4;
    euler[i * 3] = rx;
    euler[i * 3 + 1] = ry;
    euler[i * 3 + 2] = rz;
    dummy.position.set(x, y, z);
    dummy.rotation.set(rx, ry, rz);
    dummy.scale.setScalar(s);
    dummy.updateMatrix();
    mesh.setMatrixAt(i, dummy.matrix);

    color.setHSL(0.07 + Math.random() * 0.1, 0.55 + Math.random() * 0.2, 0.32 + Math.random() * 0.22);

  mesh.instanceMatrix.needsUpdate = true;

  wallpaper = mesh;
  wallpaperDummy = dummy;
  wallpaperBase = base;
  wallpaperPhase = phase;
  wallpaperScale = scale;
  wallpaperEuler = euler;
  wallpaperOk = true;
}

function updateWallpaper(t) {
  if (!wallpaperOk || !wallpaper || reduceMotion) return;
  wallpaperFrame++;
  if (WALLPAPER_FRAME_N > 1 && (wallpaperFrame % WALLPAPER_FRAME_N) !== 0) return;
  try {
    // Rewrite matrix from stored base pos / euler / phase — no getMatrixAt→decompose→Euler mix
    for (let i = 0; i < WALLPAPER_COUNT; i += WALLPAPER_STRIDE) {
      const bx = wallpaperBase[i * 3];
      const by = wallpaperBase[i * 3 + 1];
      const bz = wallpaperBase[i * 3 + 2];
      const ph = wallpaperPhase[i];
      wallpaperDummy.position.set(
        bx + Math.sin(t * 0.55 + ph) * 0.06,
        by + Math.sin(t + ph) * 0.09,
        bz
      );
      wallpaperDummy.rotation.set(
        wallpaperEuler[i * 3] + t * 0.35,
        wallpaperEuler[i * 3 + 1] + t * 0.55,
        wallpaperEuler[i * 3 + 2]
      );
      wallpaperDummy.scale.setScalar(wallpaperScale[i]);
      wallpaperDummy.updateMatrix();
      wallpaper.setMatrixAt(i, wallpaperDummy.matrix);
    }
    wallpaper.instanceMatrix.needsUpdate = true;
  } catch (err) {
    console.warn('[cubicles] wallpaper update failed; removing', err);
    disposeWallpaper();
  }
}

function updateSparklines(t) {
  if (!sparkOk || reduceMotion) return;
  sparkFrame++;
  if (SPARK_FRAME_N > 1 && (sparkFrame % SPARK_FRAME_N) !== 0) return;
  try {
    // Pendants: subtle sway + glow bob
    for (let i = 0; i < SPARK_CEIL_N; i += SPARK_STRIDE) {
      const bx = sparkCeilBase[i * 3];
      const headY = sparkCeilBase[i * 3 + 1];
      const bz = sparkCeilBase[i * 3 + 2];
      const ph = sparkCeilPhase[i];
      const stemLen = sparkCeilScale[i];
      const sway = Math.sin(t * 0.55 + ph) * 0.035;
      const bob = Math.sin(t * 0.7 + ph) * 0.04;

      sparkDummy.position.set(bx + sway, OUTER_H - stemLen * 0.5, bz);
      sparkDummy.rotation.set(sway * 0.4, 0, -sway * 0.3);
      sparkDummy.scale.set(1, stemLen, 1);
      sparkDummy.updateMatrix();
      sparkStem.setMatrixAt(i, sparkDummy.matrix);

      const glowR = 0.9 + Math.sin(t * 1.1 + ph) * 0.08;
      sparkDummy.position.set(bx + sway, headY + bob, bz);
      sparkDummy.rotation.set(0, 0, 0);
      sparkDummy.scale.setScalar(glowR);
      sparkDummy.updateMatrix();
      sparkGlow.setMatrixAt(i, sparkDummy.matrix);
    }
    sparkStem.instanceMatrix.needsUpdate = true;
    sparkGlow.instanceMatrix.needsUpdate = true;

    for (let i = 0; i < sparkLights.length; i++) {
      const ph = sparkCeilPhase[i] || 0;
      sparkLights[i].intensity = 4.2 + Math.sin(t * 1.05 + ph) * 0.85;
    }
  } catch (err) {
    console.warn('[cubicles] sparklines update failed; removing', err);
    disposeSparklines();
  }
}

function loadStillImage(url) {
  return new Promise((resolve) => {

/** Taxodium wall poster: glossy purple bark + orange/cream brush shards; tall full-wall aspect. */
function paintTaxodiumPoster(meta, stillImg) {
  const W = 720, H = 1680;
  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  const g = c.getContext('2d');

  const bark = g.createLinearGradient(0, 0, W * 0.35, H);
  bark.addColorStop(0, '#5a2878');
  bark.addColorStop(0.22, '#3a1458');
  bark.addColorStop(0.55, '#2a0c40');
  bark.addColorStop(0.82, '#1a0828');
  bark.addColorStop(1, '#100418');
  g.fillStyle = bark;
  g.fillRect(0, 0, W, H);

  const gloss = g.createLinearGradient(W * 0.05, 0, W * 0.55, H * 0.4);
  gloss.addColorStop(0, 'rgba(220,180,255,0.28)');
  gloss.addColorStop(0.35, 'rgba(180,120,255,0.08)');
  gloss.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = gloss;
  g.fillRect(0, 0, W, H * 0.55);

  for (let i = 0; i < 70; i++) {
    const x = Math.random() * W;
    const y = Math.random() * H;
    const len = 18 + Math.random() * 55;
    const ang = -0.9 + Math.random() * 1.8;
    const cream = Math.random() > 0.45;
    g.strokeStyle = cream
      ? `rgba(255,236,200,${0.18 + Math.random() * 0.35})`
      : `rgba(255,140,40,${0.2 + Math.random() * 0.4})`;
    g.lineWidth = 1.2 + Math.random() * 2.8;
    g.beginPath();
    g.moveTo(x, y);
    g.lineTo(x + Math.cos(ang) * len, y + Math.sin(ang) * len);
    g.stroke();
  }
  for (let i = 0; i < 40; i++) {
    const side = Math.random() < 0.5;
    const x = side ? Math.random() * 70 : W - 70 + Math.random() * 70;
    const y = Math.random() * H;
    const len = 28 + Math.random() * 70;
    g.strokeStyle = Math.random() > 0.5
      ? 'rgba(255,176,64,0.45)' : 'rgba(255,244,220,0.32)';
    g.lineWidth = 1.5 + Math.random() * 2.2;
    g.beginPath();
    g.moveTo(x, y);
    g.lineTo(x + (side ? 1 : -1) * len * 0.35, y + len);
    g.stroke();
  }

  g.strokeStyle = 'rgba(208,96,184,0.7)';
  g.lineWidth = 8;
  g.strokeRect(14, 14, W - 28, H - 28);
  g.strokeStyle = 'rgba(255,176,64,0.45)';
  g.lineWidth = 2;
  g.strokeRect(28, 28, W - 56, H - 56);

  const pad = 48;
  const stillH = Math.floor(H * 0.58);
  const stillW = W - pad * 2;
  g.fillStyle = 'rgba(10,4,18,0.55)';
  g.fillRect(pad, pad, stillW, stillH);
  if (stillImg) {
    const iw = stillImg.naturalWidth || stillImg.width;
    const ih = stillImg.naturalHeight || stillImg.height;
    const scale = Math.max(stillW / iw, stillH / ih);
    const dw = iw * scale, dh = ih * scale;
    const dx = pad + (stillW - dw) / 2;
    const dy = pad + (stillH - dh) / 2;
    g.save();
    g.beginPath();
    g.rect(pad, pad, stillW, stillH);
    g.clip();
    g.drawImage(stillImg, dx, dy, dw, dh);
    g.restore();
    const vig = g.createLinearGradient(0, pad + stillH * 0.55, 0, pad + stillH);
    vig.addColorStop(0, 'rgba(26,8,40,0)');
    vig.addColorStop(1, 'rgba(26,8,40,0.55)');
    g.fillStyle = vig;
    g.fillRect(pad, pad, stillW, stillH);
  } else {
    g.fillStyle = 'rgba(255,176,64,0.12)';
    g.font = '700 140px "Space Mono", ui-monospace, monospace';
    g.textAlign = 'center';
    g.textBaseline = 'middle';
    g.fillText(meta.num, W / 2, pad + stillH / 2);
  }

  g.fillStyle = 'rgba(255,160,48,0.85)';
  g.fillRect(pad, pad + stillH + 6, stillW, 4);

  const diag = LAB_DIAGRAM[meta.id] || { title: meta.name, blurb: meta.hint || '' };
  const dy0 = pad + stillH + 48;
  g.fillStyle = 'rgba(255,176,64,0.95)';
  g.font = '700 34px "Space Mono", ui-monospace, monospace';
  g.textAlign = 'left';
  g.textBaseline = 'alphabetic';
  g.fillText(meta.num, pad, dy0);
  g.fillStyle = '#ffe8c8';
  g.font = '700 42px "Bricolage Grotesque", system-ui, sans-serif';
  g.fillText(diag.title || meta.name, pad, dy0 + 56);
  // Physics equation plate (Unicode / LaTeX-ish — readable on Three canvas texture)
  const eq = (diag.eq || '').trim();
  let ly = dy0 + 110;
  if (eq) {
    const eqPad = 10;
    g.font = '700 28px "Space Mono", ui-monospace, monospace';
    const eqW = Math.min(stillW, g.measureText(eq).width + eqPad * 2);
    const eqH = 44;
    g.fillStyle = 'rgba(8,2,16,0.72)';
    g.fillRect(pad, ly - 30, eqW, eqH);
    g.strokeStyle = 'rgba(255,176,64,0.75)';
    g.lineWidth = 2;
    g.strokeRect(pad, ly - 30, eqW, eqH);
    g.fillStyle = 'rgba(255,220,120,0.98)';
    g.textAlign = 'left';
    g.fillText(eq, pad + eqPad, ly);
    ly += 56;
  }
  g.fillStyle = 'rgba(255,220,180,0.88)';
  g.font = '400 28px "Instrument Sans", system-ui, sans-serif';
  const blurb = diag.blurb || meta.hint || '';
  const maxW = stillW;
  const words = blurb.split(/\s+/);
  let line = '';
  for (const w of words) {
    const test = line ? line + ' ' + w : w;
    if (g.measureText(test).width > maxW && line) {
      g.fillText(line, pad, ly);
      line = w;
      ly += 36;
      if (ly > H - 70) break;
    } else line = test;
  }
  if (line && ly <= H - 70) g.fillText(line, pad, ly);

  g.fillStyle = 'rgba(208,96,184,0.65)';
  g.font = '400 22px "Space Mono", ui-monospace, monospace';
  g.fillText('WALL · TAXODIUM', pad, H - 36);

  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy?.() || 4);
  tex.needsUpdate = true;
  return tex;
}

async function placeWallLabPosters(wallMetas, opts) {
  const leftX = opts.leftX, rightX = opts.rightX, foyerZ = opts.foyerZ;
  const plateW = opts.plateW, plateH = opts.plateH;
  const y = opts.y;
  const n = wallMetas.length;
  const nLeft = Math.min(6, Math.ceil(n / 3));
  const nRight = Math.min(6, Math.ceil((n - nLeft) / 2));
  const left = wallMetas.slice(0, nLeft);
  const right = wallMetas.slice(nLeft, nLeft + nRight);
  const foyer = wallMetas.slice(nLeft + nRight);

  const zSpan = GRID_Z_MAX - GRID_Z_MIN - 2.8;
  const z0 = GRID_Z_MIN + 2.4; // clear of −Z stargazer band

  const barkMatExtras = {
    roughness: 0.22, metalness: 0.72,
    emissive: new THREE.Color(0x3a1050), emissiveIntensity: 0.28,
    side: THREE.FrontSide,
  };

  // Thick Taxodium slabs (not paper planes) — depth reads from foyer / aisles.
  const plateDepth = opts.plateDepth != null ? opts.plateDepth : 0.58;
  const edgeMat = new THREE.MeshPhysicalMaterial({
    color: 0x2a0c40, roughness: 0.35, metalness: 0.55,
    emissive: new THREE.Color(0x4a1868), emissiveIntensity: 0.22,
    clearcoat: 0.35, clearcoatRoughness: 0.35,
  });

  function makeSlab(w, h, tex) {
    const faceMat = new THREE.MeshPhysicalMaterial({
      map: tex, ...barkMatExtras,
      clearcoat: 0.55, clearcoatRoughness: 0.18,
    });
    // Box faces: 0+X 1-X 2+Y 3-Y 4+Z 5-Z — poster on +Z (matches prior Plane front after rotY).
    const mats = [edgeMat, edgeMat.clone(), edgeMat.clone(), edgeMat.clone(), faceMat, edgeMat.clone()];
    const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, plateDepth), mats);
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    return mesh;
  }

  async function alongZ(list, x, rotY) {
    const count = list.length;
    if (!count) return;
    for (let i = 0; i < count; i++) {
      const meta = list[i];
      const t = count === 1 ? 0.5 : i / (count - 1);
      const z = z0 + t * zSpan * 0.94;
      const stillImg = await loadStillImage(STILL_BY_ID[meta.id]);
      const tex = paintTaxodiumPoster(meta, stillImg);
      const mesh = makeSlab(plateW, plateH, tex);
      mesh.position.set(x, y, z);
      mesh.rotation.y = rotY;
      mesh.userData.wallLab = meta.id;
      wallPosterGroup.add(mesh);
    }
  }
  await alongZ(left, leftX, Math.PI / 2);
  await alongZ(right, rightX, -Math.PI / 2);

  const fx0 = -OUTER_W / 2 + 1.8;
  const fxSpan = OUTER_W - 3.6;
  for (let i = 0; i < foyer.length; i++) {
    const meta = foyer[i];
    const t = foyer.length === 1 ? 0.5 : i / (foyer.length - 1);
    const x = fx0 + t * fxSpan;
    const stillImg = await loadStillImage(STILL_BY_ID[meta.id]);
    const tex = paintTaxodiumPoster(meta, stillImg);
    const mesh = makeSlab(plateW * 0.95, plateH, tex);
    mesh.position.set(x, y, foyerZ);
    mesh.rotation.y = Math.PI;
    mesh.userData.wallLab = meta.id;
    wallPosterGroup.add(mesh);
  }
  console.info('[cubicles] taxodium wall posters', wallPosterGroup.children.length, 'slabD', plateDepth.toFixed(2), 'full-H · live', [...LIVE_IDS].join(','));
}

      /leaf|foliage|canopy|needle|crown|twig|plane/i.test(name);

    const base = isFoliage ? cypressFoliageMat : (isKnee ? cypressKneeMat : cypressTrunkMat);
    const mat = base.clone();
    for (const src of mats) {
      if (!src) continue;
      if (src.normalMap && !mat.normalMap) {
        mat.normalMap = src.normalMap;
        mat.normalScale = src.normalScale ? src.normalScale.clone() : new THREE.Vector2(0.55, 0.55);

      const cy = useTip ? tip.y + (hh - 0.4) * h * 0.05 : trunkY + h * yNorm;
      const cz = useTip ? tip.z + Math.sin(ang) * h * 0.06 : p.z + Math.sin(ang) * rad;
      const cs = h * (0.05 + hh * 0.045);
      dummy.position.set(cx, cy, cz);
      dummy.rotation.set(0.65 + hh * 0.85, ang + Math.PI * (0.25 + hh2 * 0.8), (hh2 - 0.5) * 1.2);
      dummy.scale.set(cs * (0.8 + hh * 0.5), cs * (1.35 + hh2 * 0.55), 1);
      dummy.updateMatrix();
      cardInst.setMatrixAt(ci++, dummy.matrix);
    }

    // Feathery Taxodium crown — drooping gold sprays (NOT plate discs / mushrooms)
    for (let s = 0; s < crownPer; s++) {
      const hh = taxHash(base + 900 + s);
      const hh2 = taxHash(base + 950 + s);
      const ang = yaw + (s / crownPer) * Math.PI * 2 + hh * 0.5;
      // Irregular flat-topped envelope: wider mid-canopy, soft top
      const yNorm = 0.55 + hh2 * 0.28;
      const widen = yNorm > 0.78 ? 0.7 : 1.15;
      const rad = h * (0.14 + hh * 0.22) * widen;
      const cs = h * (0.07 + hh * 0.05);
      dummy.position.set(
        p.x + Math.cos(ang) * rad,
        trunkY + h * yNorm,
        p.z + Math.sin(ang) * rad
      );
      // Hang outward-down like Taxodium needle sprays
      dummy.rotation.set(0.85 + hh * 0.55, ang, (hh2 - 0.5) * 0.4);
      dummy.scale.set(cs * (0.55 + hh * 0.35), cs * (1.4 + hh2 * 0.6), cs * (0.4 + hh * 0.3));
      dummy.updateMatrix();
      crownInst.setMatrixAt(cri++, dummy.matrix);
    }
  }

  const zero = new THREE.Object3D();
  zero.scale.set(0, 0, 0);
  zero.updateMatrix();
  for (let i = ki; i < kneeInst.count; i++) kneeInst.setMatrixAt(i, zero.matrix);
  for (let i = bi; i < branchInst.count; i++) branchInst.setMatrixAt(i, zero.matrix);
  for (let i = ni; i < needleInst.count; i++) needleInst.setMatrixAt(i, zero.matrix);
  for (let i = ti; i < tuftInst.count; i++) tuftInst.setMatrixAt(i, zero.matrix);
  for (let i = ci; i < cardInst.count; i++) cardInst.setMatrixAt(i, zero.matrix);
  for (let i = cri; i < crownInst.count; i++) crownInst.setMatrixAt(i, zero.matrix);
  kneeInst.count = ki;
  branchInst.count = bi;
  needleInst.count = ni;
  tuftInst.count = ti;
  cardInst.count = ci;
  crownInst.count = cri;
  for (const inst of [trunkInst, kneeInst, branchInst, needleInst, tuftInst, cardInst, crownInst]) {
    inst.instanceMatrix.needsUpdate = true;
    cypressGroup.add(inst);
  }

  console.info('[cubicles] cathedral chrome Taxodium instanced', n, 'trees',
    { knees: ki, branches: bi, needles: ni, tufts: ti, cards: ci, crown: cri }, 'sketch-C bald-cypress');
  window.__sketchCTrees = {
    n,
    modelH: 1,
    parts: 7,
    meshes: { knees: ki, branches: bi, needles: ni, tufts: ti, cards: ci, crown: cri },
    instanced: true,
    source: 'procedural-bald-cypress-taxodium',
  };
  // Cypress knees / protruding knuckles — bass-reactive via AnalyserNode (same bed as lab pulse)
  window.__sketchCKnees = {
    inst: kneeInst,
    bases: kneeBases,
    dummy: new THREE.Object3D(),
  };
  try { placeSpanishMossFilaments(); } catch (mossErr) { console.warn('[cubicles] moss filaments skipped', mossErr); }
  return n;
}

function makeBaldCypress(height, seed = 1) {
  const g = new THREE.Group();
  const trunk = new THREE.Mesh(taxTrunkGeo, cypressTrunkMat);
  trunk.scale.set(height, height, height);
  g.add(trunk);
  disableRaycast(g);
  return g;
}

function makeCathedralCypress(height) {
  return makeBaldCypress(height, Math.floor(height * 100));
}

function placeProceduralCypresses() {
  return placeBaldCypresses();
}

/**
 * Natural irregular Taxodium grove — jittered positions / scales / yaws.
 * Prefer aisle & margin seeds so floating lab faces stay readable from foyer;
 * no straight grid rows.
 */
const cypressPositions = [];
(function buildIrregularGrove() {
  const seeds = [];
  // Loose aisle seeds (between columns) — then heavily jitter off the lattice
  for (let c = 1; c < COLS; c++) {
    const xAisle = -OUTER_W / 2 + c * CELL_W;
    for (let b = 0; b < ROWS; b++) {
      if (c % 2 === 0 && b === 2) continue; // spare one mid bay for sightline
      const zBay = GRID_Z_MAX - b * CELL_D - CELL_D * (0.15 + ((c * 5 + b * 9) % 7) * 0.04);
      seeds.push({ x: xAisle, z: zBay, role: 'grove', hBias: (b === 0 || b === ROWS - 1) ? 0.7 : 0 });
    }
  }
  // Side-margin clumps (not wall-aligned piers)
  for (const side of [-1, 1]) {
    for (let b = 0; b < ROWS; b++) {
      const zBay = GRID_Z_MAX - b * CELL_D - CELL_D * (0.2 + (b % 3) * 0.08);
      seeds.push({
        x: side * (OUTER_W / 2 - 2.4),
        z: zBay,
        role: 'margin',
        hBias: 0.4,
      });
    }
  }
  // Foyer grove pair — offset, not symmetric gateposts
  seeds.push({ x: -CELL_W * 1.15, z: GRID_Z_MAX + 1.85, role: 'foyer', hBias: 0.9 });
  seeds.push({ x: CELL_W * 0.92, z: GRID_Z_MAX + 1.35, role: 'foyer', hBias: 0.55 });
  // Extra mid-grove fillers (natural clumps, avoid cell centers)
  for (let k = 0; k < 6; k++) {
    const col = 0.5 + (k % 4) + ((k * 3) % 5) * 0.07;
    const row = 0.4 + Math.floor(k / 2) * 0.85 + ((k * 7) % 5) * 0.05;
    seeds.push({
      x: -OUTER_W / 2 + col * CELL_W,
      z: GRID_Z_MAX - row * CELL_D,
      role: 'clump',
      hBias: -0.35,
    });
  }

  function nearLabFace(x, z) {
    for (const h of hung) {
      // Keep clear of floating lab face AABB (panel footprint + margin)
      const dx = Math.abs(x - h.cx);
      const dz = Math.abs(z - h.panelZ);
      if (dx < PANEL_W * 0.72 && dz < PANEL_H * 0.22 + 0.55) return true;
    }
    return false;
  }

  for (let i = 0; i < seeds.length; i++) {
    const s = seeds[i];
    const h1 = taxHash(i * 17 + 3);
    const h2 = taxHash(i * 29 + 11);
    const h3 = taxHash(i * 41 + 7);
    const h4 = taxHash(i * 53 + 19);
    // Strong planar jitter — natural grove, not lattice rows
    const jx = (h1 - 0.5) * CELL_W * (s.role === 'margin' ? 0.85 : 1.15);
    const jz = (h2 - 0.5) * CELL_D * (s.role === 'foyer' ? 0.55 : 1.05);
    let x = s.x + jx;
    let z = s.z + jz;
    // Nudge away from lab faces if we landed on one
    if (nearLabFace(x, z)) {
      x += (h3 > 0.5 ? 1 : -1) * (PANEL_W * 0.55 + h4 * 0.4);
      z += (h1 > 0.5 ? 1 : -1) * (0.7 + h2 * 0.5);
    }
    // Keep inside outer box with buttress clearance
    const marginX = 1.9;
    const marginZ = 1.35;
    x = Math.max(-OUTER_W / 2 + marginX, Math.min(OUTER_W / 2 - marginX, x));
    z = Math.max(GRID_Z_MIN + marginZ, Math.min(OUTER_D / 2 - 1.2, z));
    if (nearLabFace(x, z)) continue; // drop rather than bury a lab

    // Density gaps — skip some seeds so grove reads clumpy, not regimented
    if (s.role === 'grove' && h4 < 0.22) continue;
    if (s.role === 'clump' && h1 < 0.28) continue;
    const hBase = 7.6 + h3 * 3.2 + (s.hBias || 0);
    const h = Math.max(6.8, Math.min(11.6, hBase + (h4 - 0.5) * 1.4));
    const yaw = h1 * Math.PI * 2 + h2 * 2.3 + h3 * 0.9;
    const scale = 0.72 + h3 * 0.52; // wider per-tree scale jitter
    cypressPositions.push({
      x, z,
      h: h * scale,
      yaw,
      role: s.role,
    });
  }
  console.info('[cubicles] irregular Taxodium grove', cypressPositions.length, 'trees (jittered pos/scale/yaw)');
})();

/**
 * Spanish-moss chrome filaments — hanging mercury/magenta fiber strands from canopy.
 * Dense enough to read as Tillandsia under HDR without burying hung panels.
 */
function placeSpanishMossFilaments() {
  if (mobileLike && cypressPositions.length > 18) {
    console.info('[cubicles] moss filaments thinned for mobile');
  }
  const strandGeo = new THREE.CylinderGeometry(1, 1, 1, 5, 1, true);
  const fiberChrome = new THREE.MeshPhysicalMaterial({
    color: chromeVariant === 2 ? 0xe8c090 : chromeVariant === 3 ? 0xd0b8f0 : 0xf0f4fa,
    metalness: 1.0,
    roughness: chromeVariant === 2 ? 0.22 : 0.055,
    envMapIntensity: chromeVariant === 2 ? 1.35 : 2.35,
    clearcoat: chromeVariant === 2 ? 0.25 : 0.95,
    clearcoatRoughness: chromeVariant === 2 ? 0.35 : 0.04,
    side: THREE.DoubleSide,
  });
  const fiberMagenta = new THREE.MeshPhysicalMaterial({
    color: chromeVariant === 2 ? 0xc45a28 : chromeVariant === 3 ? 0x8a30ff : 0xff48c8,
    metalness: 1.0,
    roughness: chromeVariant === 2 ? 0.28 : 0.1,
    envMapIntensity: chromeVariant === 2 ? 1.15 : 1.85,
    clearcoat: 0.7,
    clearcoatRoughness: 0.08,
    emissive: chromeVariant === 3 ? 0x280850 : 0x601838,
    emissiveIntensity: chromeVariant === 2 ? 0.05 : 0.22,
    side: THREE.DoubleSide,
  });
  const perTree = mobileLike ? 18 : 48;
  const count = cypressPositions.length * perTree;
  const chromeInst = new THREE.InstancedMesh(strandGeo, fiberChrome, count);
  const magentaInst = new THREE.InstancedMesh(strandGeo, fiberMagenta, count);
  chromeInst.castShadow = false;
  magentaInst.castShadow = false;
  chromeInst.frustumCulled = true;
  magentaInst.frustumCulled = true;
  chromeInst.raycast = () => {};
  magentaInst.raycast = () => {};
  const dummy = new THREE.Object3D();
  let ci = 0, mi = 0;
  for (let t = 0; t < cypressPositions.length; t++) {
    const p = cypressPositions[t];
    for (let s = 0; s < perTree; s++) {
      const seed = (t * 97 + s * 53) % 1000;
      const ang = (seed / 1000) * Math.PI * 2 + t * 0.37 + s * 0.19;
      // Hang from mid→upper feathery canopy (Taxodium moss zone)
      const attachT = 0.62 + (seed % 18) * 0.012;
      const trunkBaseY = 0.02 - 0.22; // match TRUNK_SINK in placeBaldCypresses
      const canopyY = trunkBaseY + p.h * attachT;
      // Keep moss ON this tree's crown — never span between trunks
      const rad = 0.25 + (seed % 17) * 0.04 + (s % 4) * 0.03;
      const len = 0.55 + (seed % 23) * 0.05 + (s % 4) * 0.12;
      const thick = 0.011 + (seed % 7) * 0.0025;
      const hangY = canopyY - len * 0.45;
      const x = p.x + Math.cos(ang) * rad;
      const z = p.z + Math.sin(ang) * rad * 0.85;
      const lean = 0.75 + ((seed % 9) - 4) * 0.08;
      dummy.position.set(x, Math.max(1.2, hangY), z);
      dummy.rotation.set(lean, ang * 0.7, lean * 0.55 + ((seed % 5) - 2) * 0.06);
      dummy.scale.set(thick, len, thick);
      dummy.updateMatrix();
      if ((s + t) % 2 === 0) {
        magentaInst.setMatrixAt(mi++, dummy.matrix);
      } else {
        chromeInst.setMatrixAt(ci++, dummy.matrix);
      }
    }
  }
  const zero = new THREE.Object3D();
  zero.scale.set(0, 0, 0);
  zero.updateMatrix();
  for (let i = ci; i < count; i++) chromeInst.setMatrixAt(i, zero.matrix);
  for (let i = mi; i < count; i++) magentaInst.setMatrixAt(i, zero.matrix);
  chromeInst.count = ci;
  magentaInst.count = mi;
  chromeInst.instanceMatrix.needsUpdate = true;
  magentaInst.instanceMatrix.needsUpdate = true;
  cypressChromeMats.push(fiberChrome, fiberMagenta);
  if (window.__sketchCEnvTex) {
    fiberChrome.envMap = window.__sketchCEnvTex;
    fiberMagenta.envMap = window.__sketchCEnvTex;
    fiberChrome.needsUpdate = true;
    fiberMagenta.needsUpdate = true;
  }
  cypressGroup.add(chromeInst);
  cypressGroup.add(magentaInst);
  console.info('[cubicles] spanish-moss chrome filaments', ci + mi, 'strands on', cypressPositions.length, 'trees');
  if (window.__sketchCTrees) {
    window.__sketchCTrees.mossStrands = ci + mi;
  } else {
    window.__sketchCMoss = { strands: ci + mi };
  }
}

/**
 * Optional ?glb=1 — OpenGameArt bald cypress GLB (low-poly billboard canopy).
 * Default path is procedural Taxodium (true silhouette under chrome HDR).
 */
async function placeGltfCypresses() {
  const { GLTFLoader } = await import('three/addons/loaders/GLTFLoader.js');
  const loader = new GLTFLoader();
  try {
    const { MeshoptDecoder } = await import('./vendor/meshopt/meshopt_decoder.mjs');
    // meshopt package exports decoder ready for GLTFLoader
    if (MeshoptDecoder) {
      if (MeshoptDecoder.ready) await MeshoptDecoder.ready;
      loader.setMeshoptDecoder(MeshoptDecoder);
    }
  } catch (meshOptErr) {
    console.warn('[cubicles] MeshoptDecoder unavailable', meshOptErr);
  }
  const gltf = await loader.loadAsync('./demo-assets/cypress/cypress.glb');
  const proto = gltf.scene;
  chromeifyCypressRoot(proto);
  proto.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(proto);
  const size = new THREE.Vector3();
  box.getSize(size);
  const modelH = Math.max(size.y, 0.001);
  const modelMinY = box.min.y;
  let meshCount = 0;
  proto.traverse((o) => { if (o.isMesh) meshCount++; });

  const parts = [];
  const seen = new Set();
  proto.traverse((o) => {
    if (!o.isMesh || !o.geometry) return;
    const key = o.geometry.uuid + '|' + (o.material && o.material.uuid);
    if (seen.has(key)) return;
    seen.add(key);
    const rootInv = new THREE.Matrix4().copy(proto.matrixWorld).invert();
    const local = new THREE.Matrix4().multiplyMatrices(rootInv, o.matrixWorld);
    parts.push({ geometry: o.geometry, material: o.material, local });
  });

  const count = cypressPositions.length;
  const dummy = new THREE.Object3D();
  const scratch = new THREE.Matrix4();
  for (const part of parts) {
    const inst = new THREE.InstancedMesh(part.geometry, part.material, count);
    inst.castShadow = !mobileLike;
    inst.receiveShadow = true;
    inst.frustumCulled = true;
    inst.raycast = () => {};
    for (let i = 0; i < count; i++) {
      const p = cypressPositions[i];
      const s = p.h / modelH;
      dummy.position.set(p.x, -modelMinY * s + 0.02, p.z);
      dummy.rotation.set(0, (p.yaw != null) ? p.yaw : ((p.x * 0.3 + p.z * 0.17) % (Math.PI * 2)), 0);
      dummy.scale.set(s, s, s);
      dummy.updateMatrix();
      scratch.multiplyMatrices(dummy.matrix, part.local);
      inst.setMatrixAt(i, scratch);
    }
    inst.instanceMatrix.needsUpdate = true;
    cypressGroup.add(inst);
  }
  console.info('[cubicles] cathedral chrome GLB instanced', count, 'trees ×', parts.length, 'draw', 'sketch-C bald-cypress-glb');
  window.__sketchCTrees = { n: count, modelH, parts: parts.length, meshes: meshCount, instanced: true, source: 'opengameart-bald-cypress' };
  try { placeSpanishMossFilaments(); } catch (mossErr) { console.warn('[cubicles] moss filaments skipped', mossErr); }
  return count;
}

(async function bootSketchCCypress() {
  const wantGlb = params.has('glb') || hashParams.get('glb') === '1';
  try {
    if (wantGlb) {
      await placeGltfCypresses();
    } else {
      placeBaldCypresses();
    }
  } catch (err) {
    console.error('[cubicles] cypress place failed — Taxodium fallback', err);
    try {
      while (cypressGroup.children.length) cypressGroup.remove(cypressGroup.children[0]);
      placeBaldCypresses();
    } catch (fallbackErr) {
      console.error('[cubicles] Taxodium fallback failed', fallbackErr);
    }
  }
})();

/** CSS3D iframes share no depth buffer with WebGL Taxodium meshes.
 *  Per-frame: hide a lab’s CSS3DObject when a trunk is closer along the view
 *  and screen AABBs overlap. Hit planes keep raycasting (arm facing lab);
 *  iframe pointer-events stay none while occluded so in-front labs remain tappable. */
const TREE_OCCLUDERS = [];
const _depthCorner = new THREE.Vector3();
const _depthView = new THREE.Vector3();
const _depthInvCam = new THREE.Matrix4();
const _labNdc = { minX: 0, maxX: 0, minY: 0, maxY: 0 };
const _treeNdc = { minX: 0, maxX: 0, minY: 0, maxY: 0 };

function rebuildTreeOccluders() {
  TREE_OCCLUDERS.length = 0;
  for (const p of cypressPositions) {
    // Match lathe profile: buttress flare 0.255*h → mid-stem ~0.05*h
    TREE_OCCLUDERS.push({
      x: p.x,
      z: p.z,
      y0: -0.25,
      y1: p.h * 1.02,
      h: p.h,
      rButt: p.h * 0.255,
      rStem: p.h * 0.055,
    });
  }
  window.__treeOccluders = TREE_OCCLUDERS;
  console.info('[cubicles] CSS3D depth occluders', TREE_OCCLUDERS.length, 'trunks');
}

function trunkRadiusAtY(tree, y) {
  const t = THREE.MathUtils.clamp(y / Math.max(0.01, tree.h), 0, 1);
  if (t < 0.14) {
    const u = t / 0.14;
    return tree.rButt * (1 - Math.pow(u, 0.34)) + tree.rStem * Math.pow(u, 0.34);
  }
  if (t < 0.52) {
    const u = (t - 0.14) / 0.38;
    return THREE.MathUtils.lerp(tree.rStem, tree.h * 0.038, u);
  }
  const u = (t - 0.52) / 0.48;
  return tree.h * THREE.MathUtils.lerp(0.038, 0.024, Math.pow(u, 0.7));
}

function expandNdcRect(x, y, z, rect) {
  _depthCorner.set(x, y, z).project(camera);
  if (_depthCorner.z < -1.05 || _depthCorner.z > 1.05) return false;
  rect.minX = Math.min(rect.minX, _depthCorner.x);
  rect.maxX = Math.max(rect.maxX, _depthCorner.x);
  rect.minY = Math.min(rect.minY, _depthCorner.y);
  rect.maxY = Math.max(rect.maxY, _depthCorner.y);
  return true;
}

function viewZOf(x, y, z) {
  _depthView.set(x, y, z).applyMatrix4(_depthInvCam);
  return _depthView.z; // Three view: closer to camera ⇒ larger (less negative) z
}

function resetNdcRect(rect) {
  rect.minX = Infinity; rect.maxX = -Infinity;
  rect.minY = Infinity; rect.maxY = -Infinity;
}

function labBehindTree(h, tree) {
  const lx = h.cssObj.position.x;
  const ly = h.cssObj.position.y;
  const lz = h.cssObj.position.z;
  const sx = h.group.scale.x || 1;
  const sy = h.group.scale.y || 1;
  const labW = h.wallMounted ? (h.wallLabW || PANEL_W) : PANEL_W;
  const labH = h.wallMounted ? (h.wallLabH || PANEL_H) : PANEL_H;
  const hw = labW * 0.5 * sx;
  const hh = labH * 0.5 * sy;
  const yaw = h.cssObj.rotation.y || 0;
  const cos = Math.cos(yaw);
  const sin = Math.sin(yaw);

  const labVz = viewZOf(lx, ly, lz);
  if (labVz >= -0.08) return false;

  const ty = THREE.MathUtils.clamp(ly, tree.y0, tree.y1);
  const treeVz = viewZOf(tree.x, ty, tree.z);
  // Tree must sit closer to the camera than the lab
  if (!(treeVz > labVz + 0.15)) return false;

  if (ly + hh < tree.y0 || ly - hh > tree.y1) return false;

  resetNdcRect(_labNdc);
  let labOk = false;
  for (const ox of [-hw, hw]) {
    for (const oy of [-hh, hh]) {
      const wx = lx + ox * cos;
      const wz = lz - ox * sin;
      if (expandNdcRect(wx, ly + oy, wz, _labNdc)) labOk = true;
    }
  }
  if (!labOk) return false;

  const rLo = trunkRadiusAtY(tree, Math.max(tree.y0, ly - hh));
  const rHi = trunkRadiusAtY(tree, Math.min(tree.y1, ly + hh));
  const rMid = trunkRadiusAtY(tree, ly);
  const rp = Math.max(rLo, rHi, rMid) * 1.1;
  const yLo = Math.max(tree.y0, ly - hh - 0.2);
  const yHi = Math.min(tree.y1, ly + hh + 0.2);

  resetNdcRect(_treeNdc);
  let treeOk = false;
  for (const dx of [-rp, rp]) {
    for (const dz of [-rp, rp]) {
      if (expandNdcRect(tree.x + dx, yLo, tree.z + dz, _treeNdc)) treeOk = true;
      if (expandNdcRect(tree.x + dx, yHi, tree.z + dz, _treeNdc)) treeOk = true;
    }
  }
  if (!treeOk) return false;

  return _labNdc.minX < _treeNdc.maxX && _labNdc.maxX > _treeNdc.minX
      && _labNdc.minY < _treeNdc.maxY && _labNdc.maxY > _treeNdc.minY;
}

function updateCssDepthOcclusion() {
  if (!TREE_OCCLUDERS.length) return;
  camera.updateMatrixWorld(true);
  _depthInvCam.copy(camera.matrixWorldInverse);

  for (const h of hung) {
    if (!h.cssObj || !h.iframe) continue;
    // Side-wall LIVE plates span most of the wall AABB — tree NDC overlap falsely hid them (empty frames).
    if (h.wallMounted) {
      if (h._depthOccluded) {
        h._depthOccluded = false;
        h.cssObj.visible = true;
      }
      continue;
    }
    let occluded = false;
    if (h.embedArmed) {
      for (let i = 0; i < TREE_OCCLUDERS.length; i++) {
        if (labBehindTree(h, TREE_OCCLUDERS[i])) { occluded = true; break; }
      }
    }
    if (h._depthOccluded === occluded) {
      // Even if flag unchanged, keep pointer-events honest after setInteractTarget
      if (occluded && h.iframe.style.pointerEvents !== 'none') {
        h.iframe.style.pointerEvents = 'none';
        h.canInteract = false;
      }
      continue;
    }
    h._depthOccluded = occluded;
    // visible=false → CSS3DRenderer display:none (visual only). Hit mesh stays raycastable.
    h.cssObj.visible = !occluded;
    if (occluded) {
      h.iframe.style.pointerEvents = 'none';
      h.canInteract = false;
    }
  }
}

rebuildTreeOccluders();

function resetToFoyer() {
  pos.set(SPAWN.x, SPAWN.y, SPAWN.z);
  yaw.value = SPAWN.yaw;
  pitch.value = SPAWN.pitch;
}

function findCellAt(x, z) {
  for (const h of hung) {
    const a = h.aabb;

// —— Zone chip + lazy embeds (chip UI stripped — silent cell tracking only) ——
let activeCell = null;
const chip = document.getElementById('chip'); // may be null (language chrome removed)

function panelDist(h) {

// Raycaster lives above updateLazyEmbeds so facing/interact can use center-screen casts.
const raycaster = new THREE.Raycaster();
raycaster.layers.enable(LAB_HIT_LAYER); // pick layer-1 hits the camera does not draw
const pointerNDC = new THREE.Vector2();

/** First ray hit whose panel is within range (skip nearer out-of-range occluders). */
function panelFromHits(hits, maxDistScale) {
  const scale = maxDistScale == null ? 1 : maxDistScale;
  for (const hit of hits) {
    const panel = hung[hit.object.userData.cellIndex];
    if (!panel) continue;
    if (panelDist(panel) <= interactDistFor(panel) * scale) return panel;
  }
  return null;
}

function hungPickMeshes() {
  const meshes = [];
  for (const h of hung) {
    if (h.hit) meshes.push(h.hit);
    if (h.frame) meshes.push(h.frame);
  }
  return meshes;
}

function facingPanelWithin(maxDistScale) {
  raycaster.setFromCamera(centerNDC, camera);
  const hits = raycaster.intersectObjects(hungPickMeshes(), false);
  const fromHits = panelFromHits(hits, maxDistScale == null ? 1 : maxDistScale / INTERACT_DIST);
  if (fromHits) return fromHits;
  // In-cell fallback: standing in a zone counts as facing that hang
  if (activeCell && panelDist(activeCell) <= interactDistFor(activeCell) * 1.2) return activeCell;
  return null;
}

function eventToNDC(e) {
  const rect = renderer.domElement.getBoundingClientRect();
  pointerNDC.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
  pointerNDC.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
}

function raycastPanels(e) {
  eventToNDC(e);
  raycaster.setFromCamera(pointerNDC, camera);

}

/** CSS3D iframe screen AABB — matches painted lab (beat pulse / projection). */
function panelFromDomPoint(clientX, clientY, maxDistScale) {
  const scale = maxDistScale == null ? 1.35 : maxDistScale;
  let best = null;
  let bestArea = Infinity;
  for (const h of hung) {
    if (!h.iframe || !h.embedArmed) continue;
    if (h._depthOccluded || h.cssObj?.visible === false) continue;
    if (h.iframe.style.opacity === '0') continue;
    const r = h.iframe.getBoundingClientRect();
    if (r.width < 4 || r.height < 4) continue;
    if (clientX < r.left || clientX > r.right || clientY < r.top || clientY > r.bottom) continue;
    if (panelDist(h) > interactDistFor(h) * scale) continue;
    const area = r.width * r.height;
    if (area < bestArea) { best = h; bestArea = area; }
  }
  return best;
}

function panelUnderPointer(e) {
  // DOM AABB first for in-front painted iframes; raycast hit planes always work (incl. occluded arm).
  const fromDom = panelFromDomPoint(e.clientX, e.clientY, 1.35);
  if (fromDom) return fromDom;
  eventToNDC(e);
  raycaster.setFromCamera(pointerNDC, camera);
  const hits = raycaster.intersectObjects(hungPickMeshes(), false);

function setInteractTarget(panel) {

    h.canInteract = false;

    h.iframe.style.cursor = '';

  if (!panel) {
    stage.classList.remove('panel-hover');
    return;
  }
  // Raycast / facing may still select a depth-occluded lab so it stays armed;
  // never enable iframe pointer-events while visually suppressed (clicks fall to walk).
  armLab(panel);
  if (panel._depthOccluded || panel.cssObj?.visible === false) {
    stage.classList.remove('panel-hover');
    return;
  }
  panel.canInteract = true;
  panel.iframe.style.pointerEvents = 'auto';
  panel.iframe.style.cursor = 'pointer';
  stage.classList.add('panel-hover');
}

function updateLazyEmbeds() {
  if (overviewOn) {
    stage.classList.remove('panel-hover');
    return;
  }

  const scored = hung.map((h) => ({ h, dist: panelDist(h) }))
    .sort((a, b) => a.dist - b.dist);

  // Arm hover/facing/activeCell first, then nearest-N within ARM_DIST.
  // Side-wall LIVE plates stay armed (foyer→wall span often exceeds ARM_DIST).
  const armSet = new Set();
  for (const h of hung) {
    if (h.wallMounted) armSet.add(h);
  }
  if (hoverPanel) armSet.add(hoverPanel);
  const facing = facingPanelWithin(1);
  if (facing) armSet.add(facing);
  if (activeCell) armSet.add(activeCell);
  for (const { h, dist } of scored) {
    if (armSet.size >= MAX_ARMED) break;
    if (h.wallMounted) continue;
    if (dist < ARM_DIST) armSet.add(h);
  }

  for (const h of hung) {
    const want = armSet.has(h);
    if (want && !h.embedArmed) {
      try { armLab(h); } catch (e) { console.warn('[cubicles] armLab', e); }
    } else if (!want && h.embedArmed && !h.wallMounted && !panelPointerLock && h !== hoverPanel) {
      h.iframe.src = 'about:blank';
      h.iframe.style.opacity = '0';
      h.embedArmed = false;
      h._revealWatch = false;
    }
    h.group.visible = true;
  }

  // Cursor-over-frame wins → center facing → activeCell → nearest.
  // Arm hover immediately so pointer cursor is not lost on the far wall.
  let best = null;
  const inFront = (p) => p && !p._depthOccluded && p.cssObj?.visible !== false;
  // Cursor-over visible iframe wins; else prefer an in-front facing/near lab for taps.
  // Occluded facing still arms via setInteractTarget (pointer-events stay none).
  if (inFront(hoverPanel) && panelDist(hoverPanel) <= interactDistFor(hoverPanel) * 1.25) {
    best = hoverPanel;
  } else if (inFront(facing)) {
    best = facing;
  } else if (inFront(activeCell) && panelDist(activeCell) <= interactDistFor(activeCell) * 1.2) {
    best = activeCell;
  } else {
    for (const { h, dist } of scored) {
      if (!inFront(h)) continue;
      if (dist <= interactDistFor(h)) { best = h; break; }
    }
    // Fallback: arm occluded facing/near so embed stays warm (no iframe clicks)
    if (!best) {
      if (facing) best = facing;
      else if (activeCell && panelDist(activeCell) <= interactDistFor(activeCell) * 1.2) best = activeCell;
      else {
        for (const { h, dist } of scored) {
          if (dist <= interactDistFor(h)) { best = h; break; }
        }
      }
    }
  }
  if (!panelPointerLock) setInteractTarget(best);
}

/** Subtle bass-reactive scale / bob / yaw on floating CSS3D labs — small amplitude. */
function updateBeatLabs(t, bassOpt) {
  if (reduceMotion) return;
  const bed = window.__wormholeAmbient;
  const bass = bassOpt != null ? bassOpt : (bed && typeof bed.getBass === 'function' ? bed.getBass() : 0);
  if (bass < 0.002 && !bed?.analyser) {
    // Rest pose when no audio graph yet
    for (const h of hung) {
      if (h.wallMounted) continue;
      if (h._beatApplied) {
        h.group.position.set(h.cx, h.baseY, h.panelZ);
        h.group.rotation.y = 0;
        h.group.scale.set(1, 1, 1);
        h.cssObj.position.set(h.cx, h.baseY, h.panelZ + 0.02);
        h.cssObj.rotation.y = 0;
        h.cssObj.scale.set(h.cssBaseScale, h.cssBaseScale, h.cssBaseScale);
        if (h.spot) h.spot.position.y = h.baseY + PANEL_H * 0.55;
        h._beatApplied = false;
      }
    }
    return;
  }
  // Elegant caps — never fight walk/look; scale pulse nudged up from 0.050
  const AMP_Y = 0.095;      // ~9.5 cm bob
  const AMP_SCALE = 0.068;  // ±6.8% expand/contract (was 0.050)
  const AMP_YAW = 0.030;    // ~1.7° yaw
  for (const h of hung) {
    if (h.wallMounted) continue; // side-wall plates stay fixed (water/knees keep the beat)
    const ph = h.beatPhase || 0;
    // Staggered micro-phase so the field breathes, not marches in lockstep
    const local = bass * (0.72 + 0.28 * Math.sin(t * 1.7 + ph));
    const bob = local * AMP_Y * (0.85 + 0.15 * Math.sin(t * 2.3 + ph * 1.3));
    const yawOff = local * AMP_YAW * Math.sin(t * 1.1 + ph);
    const s = 1 + local * AMP_SCALE;
    // Keep hit-plane group and CSS3D iframe on the same center (panelZ+0.02)
    // so raycast / DOM AABB stay under the painted lab during the pulse.
    const y = h.baseY + bob;
    const z = h.panelZ + 0.02;
    h.group.position.set(h.cx, y, h.panelZ);
    h.group.rotation.y = yawOff;
    h.group.scale.set(s, s, s);
    h.cssObj.position.set(h.cx, y, z);
    h.cssObj.rotation.y = yawOff;
    const cs = h.cssBaseScale * s;
    h.cssObj.scale.set(cs, cs, cs);
    if (h.spot) h.spot.position.y = h.baseY + PANEL_H * 0.55 + bob * 0.6;
    h._beatApplied = true;
  }
}

/** Cypress knuckle / knee pulse + visible water ripple from wormhole ambient AnalyserNode. */
const WATER_DISTORTION_BASE = 3.6;
const WATER_SIZE_BASE = 0.58;
const WATER_TIME_BASE = WATER_TIME_SCALE;
function updateBeatKneesWater(t, dt, bassOpt) {
  const bed = window.__wormholeAmbient;
  const bass = bassOpt != null ? bassOpt : (bed && typeof bed.getBass === 'function' ? bed.getBass() : 0);
  // —— Water ripple (always animate; bass makes it visibly surge) ——
  if (water?.material?.uniforms) {
    const u = water.material.uniforms;
    const surge = reduceMotion ? 0 : bass;
    // Time races ahead on the kick so normals crawl into a readable ripple
    const timeScale = WATER_TIME_BASE * (1 + surge * 2.8);
    if (u.time) u.time.value += dt * timeScale;
    if (u.distortionScale) u.distortionScale.value = WATER_DISTORTION_BASE + surge * 5.2;
    if (u.size) u.size.value = WATER_SIZE_BASE + surge * 0.22;
    if (u.sunDirection) u.sunDirection.value.copy(waterSun);
  }
  if (reduceMotion) return;
  const pack = window.__sketchCKnees;
  if (!pack?.inst || !pack.bases?.length) return;
  const { inst, bases, dummy } = pack;
  const AMP_Y = 0.28;   // vertical protrusion (knuckle pops out of water)
  const AMP_XZ = 0.10;  // slight swell
  const AMP_LIFT = 0.18; // lift mound so emergence reads
  for (let i = 0; i < bases.length; i++) {
    const b = bases[i];
    const local = bass * (0.70 + 0.30 * Math.sin(t * 1.9 + b.phase));
    const sy = b.sy * (1 + local * AMP_Y);
    const sx = b.sx * (1 + local * AMP_XZ);

    dummy.position.set(b.px, b.py + local * b.sy * AMP_LIFT, b.pz);
    dummy.rotation.set(b.rx, b.ry, b.rz);
    dummy.scale.set(sx, sy, sz);
    dummy.updateMatrix();
    inst.setMatrixAt(i, dummy.matrix);
  }
  inst.instanceMatrix.needsUpdate = true;
}

}
function endLookDrag(e) {
  if (lookPointerId != null && e && e.pointerId !== lookPointerId) return;
  if (dragging) {
    dragging = false;
    stage.classList.remove('dragging');
    if (lookPointerId != null) {
      try { stage.releasePointerCapture(lookPointerId); } catch {}
    }
    lookPointerId = null;
  }
  // Don't steal panel interact: only clear panel lock if release is outside an armed iframe
  const t = e && e.target;
  const inPanel = t && hung.some((h) => h.canInteract && (t === h.iframe || (h.iframe && h.iframe.contains && h.iframe.contains(t))));
  if (!inPanel) panelPointerLock = false;
}
function syncLookLockPill() {
  const btn = document.getElementById('btn-look-lock');
  if (!btn) return;
  const on = !!(document.pointerLockElement && (document.pointerLockElement === stage || stage.contains(document.pointerLockElement)));
  btn.classList.toggle('on', on);
  stage.classList.toggle('look-locked', on);
}
function requestWalkPointerLock() {
  if (mobileLike || reduceMotion || !entered || overview.on) return;
  const el = stage;
  if (document.pointerLockElement) {
    document.exitPointerLock();
    return;
  }
  try { el.requestPointerLock(); } catch {}
}

stage.addEventListener('pointerdown', (e) => {
  if (!entered) return;
  // Two-finger pinch owns the gesture — don't start / continue look-drag
  if (pinching || (e.pointerType !== 'mouse' && pinchPointers.size >= 2)) return;
  if (!overview.on) {
    const panel = panelUnderPointer(e);
    if (panel) {
      hoverPanel = panel;
      setInteractTarget(panel);
      panelPointerLock = true;
      return;
    }
  }
  // Don't start look-drag while Pointer Lock owns the mouse (mousemove handles it)
  if (document.pointerLockElement) return;
  panelPointerLock = false;
  dragging = true;
  lookPointerId = e.pointerId;
  stage.classList.add('dragging');
  lastX = downX = e.clientX; lastY = downY = e.clientY;
  try { stage.setPointerCapture(e.pointerId); } catch {}
});
// Document-level look while dragging — survives CSS3D iframe crossings
document.addEventListener('pointermove', (e) => {
  if (!dragging || reduceMotion || panelPointerLock || pinching) return;
  if (lookPointerId != null && e.pointerId !== lookPointerId) return;
  if (document.pointerLockElement) return; // mousemove + movementX path
  const dx = e.clientX - lastX; const dy = e.clientY - lastY;
  lastX = e.clientX; lastY = e.clientY;
  applyLookDelta(dx, dy);
}, { capture: true, passive: true });
document.addEventListener('pointerup', endLookDrag, { capture: true });
document.addEventListener('pointercancel', endLookDrag, { capture: true });

// Desktop Pointer Lock — continuous mouse-look; Esc exits (browser). Double-click stage or pill.
stage.addEventListener('dblclick', (e) => {
  if (!entered || overview.on || mobileLike || reduceMotion) return;
  if (panelUnderPointer(e)) return; // don't break panel interact
  e.preventDefault();
  requestWalkPointerLock();
});
document.getElementById('btn-look-lock')?.addEventListener('click', () => {
  if (!entered) silentEnter({ reset: false });
  if (overview.on) setOverview(false);
  requestWalkPointerLock();
});
document.addEventListener('pointerlockchange', syncLookLockPill);
document.addEventListener('pointerlockerror', () => { console.warn('[cubicles] pointer lock failed'); syncLookLockPill(); });
document.addEventListener('mousemove', (e) => {
  if (!document.pointerLockElement || !entered || reduceMotion || panelPointerLock) return;
  // movementX/Y work under lock even when cursor would cross iframes
  applyLookDelta(e.movementX || 0, e.movementY || 0);
});

function resize() {
  const w = innerWidth, h = innerHeight;
  camera.aspect = w / Math.max(1, h);
  camera.updateProjectionMatrix();
  renderer.setSize(w, h, false);
  cssRenderer.setSize(w, h);
  if (composer) composer.setSize(w, h);
  if (bloomPass) bloomPass.resolution.set(w, h);
}
addEventListener('resize', resize);
resize();

// —— Pinch zoom: walk FOV / overview radius (ignores walk-pad fingers) ——
pinchStartRadius = overview.radius;

function pinchDist() {
  const pts = [...pinchPointers.values()];
  if (pts.length < 2) return 0;
  return Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
}
function endLookForPinch() {
  if (!dragging) return;
  dragging = false;
  stage.classList.remove('dragging');
  if (lookPointerId != null) {
    try { stage.releasePointerCapture(lookPointerId); } catch {}
  }
  lookPointerId = null;
}
function applyPinchZoom() {
  if (!pinching || pinchPointers.size < 2 || !entered || reduceMotion) return;
  const d = pinchDist();
  if (d < 1) return;
  const scale = d / pinchStartDist;
  if (overview.on) {
    overview.radius = THREE.MathUtils.clamp(
      pinchStartRadius / scale,
      overview.minRadius,
      overview.maxRadius
    );
  } else {
    walkFov = THREE.MathUtils.clamp(pinchStartFov / scale, WALK_FOV_MIN, WALK_FOV_MAX);
    camera.fov = walkFov;
    camera.updateProjectionMatrix();
  }
}
function pinchIgnoreTarget(t) {
  if (!t || !t.closest) return false;
  return !!(t.closest('#mobile-pad') || t.closest('.pills') || t.closest('.gate') || t.closest('.chip') || t.closest('button') || t.closest('a'));
}
document.addEventListener('pointerdown', (e) => {
  if (!entered || reduceMotion) return;
  if (e.pointerType === 'mouse') return;
  if (pinchIgnoreTarget(e.target)) return;
  pinchPointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pinchPointers.size >= 2) {
    endLookForPinch();
    panelPointerLock = false;
    if (!pinching) {
      pinching = true;
      pinchStartDist = Math.max(1, pinchDist());
      pinchStartFov = walkFov;
      pinchStartRadius = overview.radius;
    }
  }
}, { capture: true });
document.addEventListener('pointermove', (e) => {
  if (!pinchPointers.has(e.pointerId)) return;
  pinchPointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pinching) applyPinchZoom();
}, { capture: true, passive: true });
function endPinchPointer(e) {
  if (!pinchPointers.has(e.pointerId)) return;
  pinchPointers.delete(e.pointerId);
  if (pinchPointers.size < 2) pinching = false;
}
document.addEventListener('pointerup', endPinchPointer, { capture: true });
document.addEventListener('pointercancel', endPinchPointer, { capture: true });

stage.addEventListener('wheel', (e) => {
  if (!entered || reduceMotion) return;
  // Overview orbit zoom (legacy) OR ctrl/trackpad pinch → walk FOV
  if (overview.on) {
    e.preventDefault();
    overview.radius = THREE.MathUtils.clamp(
      overview.radius + e.deltaY * 0.02,
      overview.minRadius,
      overview.maxRadius
    );
    return;
  }
  if (e.ctrlKey) {
    e.preventDefault();
    const factor = Math.exp(e.deltaY * 0.01);
    walkFov = THREE.MathUtils.clamp(walkFov * factor, WALK_FOV_MIN, WALK_FOV_MAX);
    camera.fov = walkFov;
    camera.updateProjectionMatrix();
  }
}, { passive: false });


const clock = new THREE.Clock();
const forward = new THREE.Vector3();
const right = new THREE.Vector3();
const margin = 0.95;

function frame() {
  const dt = Math.min(0.05, clock.getDelta());
  if (overview.on) {
    // elevated orbit — no walk clamps / embeds
    applyCamera();
  } else if (!reduceMotion && entered) {
    forward.set(-Math.sin(yaw.value), 0, -Math.cos(yaw.value));
    right.set(Math.cos(yaw.value), 0, -Math.sin(yaw.value));
    const wish = new THREE.Vector3();
    if (move.f) wish.add(forward);
    if (move.b) wish.sub(forward);
    if (move.l) wish.sub(right);
    if (move.r) wish.add(right);
    if (wish.lengthSq() > 0) {
      wish.normalize().multiplyScalar(7.2);
      velocity.x += (wish.x - velocity.x) * Math.min(1, 8 * dt);
      velocity.z += (wish.z - velocity.z) * Math.min(1, 8 * dt);
    } else {
      velocity.x *= Math.pow(0.88, dt * 60);
      velocity.z *= Math.pow(0.88, dt * 60);
    }
    pos.x += velocity.x * dt;
    pos.z += velocity.z * dt;
    pos.x = Math.max(-OUTER_W / 2 + margin, Math.min(OUTER_W / 2 - margin, pos.x));
    pos.z = Math.max(-OUTER_D / 2 + margin, Math.min(OUTER_D / 2 - margin, pos.z));
    pos.y = EYE;
    updateActiveCell();
    updateLazyEmbeds();
    applyCamera();
  } else if (reduceMotion || params.has('still')) {
    pos.set(SPAWN.x, SPAWN.y + 0.15, SPAWN.z);
    yaw.value = SPAWN.yaw;
    pitch.value = SPAWN.pitch;
    applyCamera();
    // Still/foyer capture must arm CSS3D labs (reduceMotion otherwise skips walk branch)
    updateLazyEmbeds();
  } else {
    applyCamera();
  }
  if (!glContextLost) {
    const _tSpark = performance.now() * 0.001;
    // One AnalyserNode sample / frame — shared by labs + knuckles + water ripple (watbeat1)
    const _bed = window.__wormholeAmbient;
    const _bass = _bed && typeof _bed.getBass === 'function' ? _bed.getBass() : 0;
    updateBeatKneesWater(_tSpark, dt, _bass);
    updateWallpaper(_tSpark);
    updateSparklines(_tSpark);
    updateBeatLabs(_tSpark, _bass);
    updateCssDepthOcclusion();
    try {
      if (composer) composer.render();
      else renderer.render(scene, camera);
      cssRenderer.render(cssScene, camera);
    } catch (err) {
      console.warn('[cubicles] render failed', err);
      glContextLost = true;
      showGlTip('3D view paused — tap to reload');
    }
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

if (params.has('still')) {
  entered = true;
  window.__cubiclesEntered = true;
  if (gate) gate.classList.add('hide');
}
</script>
