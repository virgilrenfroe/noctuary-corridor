<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Work samples — exhibit demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Instrument+Sans:ital,wght@0,400..600;1,400..600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet"/>
<style>
  :root {
    --ink: #05060a;
    --paper: #f2ebe0;
    --mute: rgba(242,235,224,0.62);
    --line: rgba(242,235,224,0.14);
    --violet: #c4a7e0;
    --accent: #8a7bb8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    background: var(--ink);
    color: var(--paper);
    font-family: "Instrument Sans", system-ui, sans-serif;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  body.embed, body.embed * { pointer-events: none; user-select: none; cursor: default; }

  .stage {
    width: 100%; height: 100%;
    display: grid;
    place-items: center;
    background:
      radial-gradient(ellipse 70% 48% at 18% 12%, rgba(138,123,184,0.16), transparent 55%),
      radial-gradient(ellipse 55% 40% at 88% 78%, rgba(196,167,224,0.08), transparent 50%),
      linear-gradient(165deg, #0c0e16 0%, var(--ink) 52%, #03040a 100%);
  }
  .frame {
    position: relative;
    width: min(92vw, 420px);
    height: min(94vh, 620px);
    aspect-ratio: 26 / 38;
    max-height: 94vh;
    border-radius: 14px;
    border: 1px solid rgba(138,123,184,0.28);
    box-shadow:
      0 0 0 1px rgba(242,235,224,0.04),
      0 22px 52px rgba(0,0,0,0.55);
    overflow: hidden;
    background: #080a10;
  }
  .chrome {
    position: absolute;
    top: 10px; left: 14px; right: 14px;
    z-index: 8;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-family: "Space Mono", monospace;
    font-size: 9px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: rgba(242,235,224,0.72);
    text-shadow: 0 1px 4px rgba(0,0,0,0.75);
  }
  .chrome .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--violet);
    box-shadow: 0 0 8px rgba(196,167,224,0.65);
  }

  .slides { position: absolute; inset: 0; }
  .slide {
    position: absolute; inset: 0;
    opacity: 0;
    transition: opacity 0.9s ease;
    pointer-events: none;
  }
  .slide.on { opacity: 1; z-index: 2; }
  .slide .shot {
    position: absolute; inset: 0;
    background: #12141c center top / cover no-repeat;
    transform: scale(1.04);
  }
  .slide.on .shot { animation: ken 6.5s ease-out forwards; }
  body.still .slide.on .shot { animation: none; transform: scale(1.06); }
  @keyframes ken {
    from { transform: scale(1.04) translate(0, 0); }
    to   { transform: scale(1.11) translate(-0.6%, -0.5%); }
  }

  .veil {
    position: absolute; inset: 0;
    background:
      linear-gradient(180deg, rgba(5,6,10,0.2) 0%, transparent 18%, transparent 48%, rgba(5,6,10,0.9) 100%);
    z-index: 3;
    pointer-events: none;
  }
  .caption {
    position: absolute;
    left: 16px; right: 18px; bottom: 26px;
    z-index: 4;
  }
  .caption .eyebrow {
    font-family: "Space Mono", monospace;
    font-size: 10px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--violet);
    margin-bottom: 6px;
  }
  .caption h2 {
    font-family: "Bricolage Grotesque", system-ui, sans-serif;
    font-weight: 700;
    font-size: clamp(22px, 5.8vw, 28px);
    letter-spacing: -0.03em;
    line-height: 1.05;
    text-shadow: 0 2px 14px rgba(0,0,0,0.65);
  }
  .caption h2 em { font-style: normal; color: #e4d4f5; }
  .caption p {
    margin-top: 8px;
    font-size: 13px;
    line-height: 1.4;
    color: rgba(242,235,224,0.88);
    max-width: 32ch;
  }

  .still-compose {
    position: absolute; inset: 0;
    display: none;
    z-index: 6;
    background: #080a10;
  }
  body.still .still-compose { display: block; }
  body.still .slides { display: none; }
  .still-compose .mosaic {
    position: absolute; inset: 0;
    display: grid;
    grid-template-columns: 1.15fr 0.85fr;
    grid-template-rows: 1.2fr 1fr;
    gap: 2px;
  }
  .still-compose .tile {
    position: relative;
    overflow: hidden;
    background: #12141c center top / cover no-repeat;
  }
  .still-compose .tile.t1 {
    grid-row: 1 / 3;
    background-image: url('./demo-assets/work-samples/01-hub-hero.jpg');
  }
  .still-compose .tile.t2 { background-image: url('./demo-assets/work-samples/02-hub-cards.jpg'); }
  .still-compose .tile.t3 { background-image: url('./demo-assets/work-samples/03-hub-apps.jpg'); }
  .still-compose .veil {
    background: linear-gradient(180deg, transparent 30%, rgba(5,6,10,0.82) 100%);
  }
  .still-compose .label {
    position: absolute;
    left: 14px; right: 12px; bottom: 16px;
    z-index: 2;
  }
  .still-compose .label h1 {
    font-family: "Bricolage Grotesque", system-ui, sans-serif;
    font-size: 24px;
    font-weight: 700;
    letter-spacing: -0.03em;
    text-shadow: 0 2px 14px rgba(0,0,0,0.7);
  }
  .still-compose .label p {
    margin-top: 6px;
    font-size: 12px;
    color: rgba(242,235,224,0.85);
  }

  a.click {
    position: absolute; inset: 0;
    z-index: 10;
    text-indent: -9999px;
  }
  body.embed a.click { display: none; }
</style>
</head>
<body>
  <div class="stage">
    <div class="frame">
      <div class="chrome"><span>Work samples</span><span class="dot" aria-hidden="true"></span></div>

      <div class="slides" aria-live="polite">
        <section class="slide" data-beat="0">
          <div class="shot" style="background-image:url('./demo-assets/work-samples/01-hub-hero.jpg')"></div>
          <div class="veil"></div>
          <div class="caption">
            <p class="eyebrow">Hub</p>
            <h2>Work <em>samples</em></h2>
            <p>Learning design · small apps someone can click once.</p>
          </div>
        </section>

        <section class="slide" data-beat="1">
          <div class="shot" style="background-image:url('./demo-assets/work-samples/02-hub-cards.jpg'); background-position: center 35%;"></div>
          <div class="veil"></div>
          <div class="caption">
            <p class="eyebrow">Shelf</p>
            <h2>Course · Nestlight</h2>
            <p>Taught kits and a bedtime homework pack — from the hub.</p>
          </div>
        </section>

        <section class="slide" data-beat="2">
          <div class="shot" style="background-image:url('./demo-assets/work-samples/03-hub-apps.jpg'); background-position: center 20%;"></div>
          <div class="veil"></div>
          <div class="caption">
            <p class="eyebrow">Shipped</p>
            <h2>Nestlight · Noctuary</h2>
            <p>Working apps linked from the same page.</p>
          </div>
        </section>
      </div>

      <div class="still-compose" aria-hidden="true">
        <div class="mosaic">
          <div class="tile t1">
            <div class="veil"></div>
            <div class="label">
              <h1>Work samples</h1>
              <p>Hub · cards · apps</p>
            </div>
          </div>
          <div class="tile t2"></div>
          <div class="tile t3"></div>
        </div>
      </div>

      <a class="click" href="https://virgilrenfroe.github.io/" target="_blank" rel="noopener">Open Work samples</a>
    </div>
  </div>

<script>
(function () {
  const params = new URLSearchParams(location.search);
  const embed = params.has('embed');
  const still = params.has('still') || matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (embed) document.body.classList.add('embed');
  if (still) {
    document.body.classList.add('still');
    return;
  }

  const slides = Array.from(document.querySelectorAll('.slide[data-beat]'));
  const BEATS = [
    { id: 0, dur: 5500 },
    { id: 1, dur: 5500 },
    { id: 2, dur: 5500 },
  ];

  function show(id) {
    slides.forEach((s) => s.classList.toggle('on', Number(s.dataset.beat) === id));
  }

  let idx = 0;
  function arm() {
    show(BEATS[idx].id);
    setTimeout(() => {
      idx = (idx + 1) % BEATS.length;
      arm();
    }, BEATS[idx].dur);
  }
  arm();
})();
</script>
</body>
</html>
