<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>BarPal</title>
<meta name="description" content="Gift drinks, tip staff, settle the table." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
<style>
  :root {
    --ink: #0e0b09;
    --foam: #f0e6d4;
    --brass: #c4a574;
    --amber: #e8a54b;
    --neon: #7ec8c4;
    --muted: #a89888;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    min-height: 100vh;
    min-height: 100dvh;
    background:
      radial-gradient(ellipse 80% 45% at 50% 0%, rgba(232,165,75,0.12), transparent 55%),
      radial-gradient(circle at 85% 70%, rgba(126,200,196,0.08), transparent 40%),
      linear-gradient(180deg, #1c1512 0%, var(--ink) 100%);
    color: var(--foam);
    font-family: "DM Sans", system-ui, sans-serif;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  body.embed, body.embed * { pointer-events: none; user-select: none; cursor: default; }

  .gate {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1.5rem 1.25rem;
    text-align: center;
  }
  .inner { width: min(420px, 92vw); position: relative; z-index: 2; }
  .eyebrow {
    font-size: 0.7rem;
    font-weight: 600;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--brass);
  }
  .title {
    margin-top: 0.75rem;
    font-family: "Instrument Serif", Georgia, serif;
    font-size: clamp(3rem, 10vw, 4.4rem);
    font-weight: 400;
    letter-spacing: -0.02em;
    line-height: 1;
    color: var(--foam);
  }
  .tagline {
    margin: 1.1rem auto 0;
    max-width: 22rem;
    font-size: 1.05rem;
    line-height: 1.55;
    color: rgba(240,230,212,0.88);
  }
  .enter {
    margin-top: 1.75rem;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 2.75rem;
    padding: 0.7rem 1.55rem;
    border: 1px solid rgba(196,165,116,0.45);
    border-radius: 999px;
    background: var(--amber);
    color: #1a1208;
    font: inherit;
    font-size: 0.98rem;
    font-weight: 600;
    letter-spacing: 0.02em;
    cursor: pointer;
    box-shadow: 0 0 0 1px rgba(14,11,9,0.35), 0 10px 28px rgba(0,0,0,0.35);
  }
  .enter:hover { filter: brightness(1.04); }
  .enter:active { transform: translateY(1px); }
  .age {
    margin-top: 1.1rem;
    font-size: 0.68rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
  }

  /* Soft brass ring accents — no feature grid */
  .glow {
    position: fixed;
    inset: 0;
    pointer-events: none;
    background:
      radial-gradient(circle at 50% 42%, rgba(232,165,75,0.07), transparent 42%),
      radial-gradient(circle at 20% 80%, rgba(126,200,196,0.06), transparent 35%);
  }
  .ring {
    position: absolute;
    left: 50%; top: 48%;
    width: min(520px, 88vw);
    height: min(520px, 88vw);
    transform: translate(-50%, -50%);
    border: 1px solid rgba(196,165,116,0.14);
    border-radius: 50%;
    pointer-events: none;
  }
  .ring.inner {
    width: min(340px, 58vw);
    height: min(340px, 58vw);
    border-color: rgba(126,200,196,0.12);
  }

  .room {
    display: none;
    min-height: 100vh;
    min-height: 100dvh;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 1rem;
    gap: 0.85rem;
    background: var(--ink);
  }
  body.show-room .gate { display: none; }
  body.show-room .room { display: flex; }
  .room-frame {
    width: min(92vw, 380px);
    aspect-ratio: 9 / 16;
    max-height: 78vh;
    border-radius: 14px;
    border: 1px solid rgba(196,165,116,0.28);
    overflow: hidden;
    background: #120e0c;
    box-shadow: 0 20px 50px rgba(0,0,0,0.55);
    position: relative;
  }
  .room-frame img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .room-label {
    font-size: 0.72rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--brass);
  }
  .room-go {
    margin-top: 0.25rem;
    display: inline-flex;
    padding: 0.55rem 1.2rem;
    border-radius: 999px;
    border: 1px solid rgba(126,200,196,0.4);
    background: transparent;
    color: var(--neon);
    font: inherit;
    font-size: 0.85rem;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    text-decoration: none;
    cursor: pointer;
  }
</style>
</head>
<body>
  <div class="glow" aria-hidden="true"></div>
  <div class="ring" aria-hidden="true"></div>
  <div class="ring inner" aria-hidden="true"></div>

  <main class="gate" id="gate">
    <div class="inner">
      <p class="eyebrow">Your local bar</p>
      <h1 class="title">BarPal</h1>
      <p class="tagline">Gift drinks. Tip staff. Settle the table.</p>
      <button type="button" class="enter" id="enter">Enter BarPal</button>
      <p class="age">21+</p>
    </div>
  </main>

  <section class="room" id="room" aria-label="Choose a room">
    <p class="room-label">Pick a room</p>
    <div class="room-frame">
      <img id="room-shot" src="demo-assets/barpal/02-room-selection.jpg" alt="" />
    </div>
    <a class="room-go" id="room-go" href="https://app.barpal.app/">Open BarPal</a>
  </section>

<script>
(function () {
  var APP = "https://app.barpal.app/";
  var params = new URLSearchParams(location.search);
  var embed = params.get("embed") === "1";
  var KEY = "barpal-entered";
  if (params.has("clear") || params.get("reset") === "1") {
    try { sessionStorage.removeItem(KEY); } catch (e) {}
  }
  if (embed) document.body.classList.add("embed");

  var btn = document.getElementById("enter");
  var shots = [
    "demo-assets/barpal/02-room-selection.jpg",
    "demo-assets/barpal/01-landing.jpg",
    "demo-assets/barpal/04-dashboard-wallet.jpg"
  ];
  var i = 0;
  var img = document.getElementById("room-shot");

  function enterProduction() {
    try { sessionStorage.setItem(KEY, "1"); } catch (e) {}
    location.href = APP;
  }

  function showRoomTease() {
    document.body.classList.add("show-room");
    try { sessionStorage.setItem(KEY, "1"); } catch (e) {}
    if (!embed && img) {
      setInterval(function () {
        i = (i + 1) % shots.length;
        img.src = shots[i];
      }, 3200);
    }
  }

  if (btn) {
    btn.addEventListener("click", function () {
      if (embed) showRoomTease();
      else enterProduction();
    });
  }

  // Corridor: stay on the Enter gate (non-interactive). Optional ?room=1 shows tease.
  if (embed && params.get("room") === "1") showRoomTease();
})();
</script>
</body>
</html>
