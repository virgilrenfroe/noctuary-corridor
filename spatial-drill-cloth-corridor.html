<!DOCTYPE html>

<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #07060a; touch-action: none; }
  canvas { display: block; width: 100%; height: 100%; }
  /* CSS3D lab layer sits over the WebGL canvas; clicks fall through to point-pull. */
  .css3d-layer {
    position: fixed; inset: 0; z-index: 1;
    pointer-events: none;
  }
  .css3d-layer iframe {
    pointer-events: none !important;
    border: 0 !important;
    border-radius: 0 !important;

  .hint .mob { display: none; }

  #mobile-pad .pad-base {
    position: absolute; inset: 0; border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.42);
    background:
      radial-gradient(120% 90% at 28% 18%, rgba(255,255,255,0.92) 0%, rgba(255,255,255,0.28) 18%, transparent 42%),

  }
  #mobile-pad .pad-knob {
    position: absolute; left: 50%; top: 50%; width: 56px; height: 56px;
    margin: -28px 0 0 -28px; border-radius: 50%; pointer-events: none;

  }
  #mobile-pad.active .pad-knob { filter: brightness(1.12); }
  @media (pointer: coarse), (max-width: 900px) {
    #mobile-pad { display: block; }
    .hint { left: 172px; } .hint .mob { display: none; } .hint .desk { display: none; } .hint .mob { display: inline; }
  }

<script type="module">
import * as THREE from 'three';
import { CSS3DRenderer, CSS3DObject } from 'three/addons/renderers/CSS3DRenderer.js';

const FABRICS = [
  { name: 'Velvet', note: 'deep pile', color: '#3a1848', sheen: 1, sheenColor: '#d7b4ff', rough: 0.78, clearcoat: 0.04, transmission: 0, wind: 0.28, sag: 0.1, weave: 'velvet' },
  { name: 'Silk', note: 'tight sheen', color: '#f2e2b8', sheen: 0.85, sheenColor: '#fff6df', rough: 0.16, clearcoat: 0.35, transmission: 0, wind: 0.55, sag: 0.05, weave: 'silk' },
  { name: 'Linen', note: 'open weave', color: '#cbb89a', sheen: 0.05, sheenColor: '#efe4d2', rough: 0.96, clearcoat: 0, transmission: 0, wind: 0.22, sag: 0.07, weave: 'linen' },
  { name: 'Denim', note: 'twill', color: '#243e78', sheen: 0.08, sheenColor: '#9eb4e6', rough: 0.88, clearcoat: 0, transmission: 0, wind: 0.16, sag: 0.12, weave: 'denim' },
  { name: 'Satin', note: 'wine gloss', color: '#6e1430', sheen: 1, sheenColor: '#ffb3c4', rough: 0.18, clearcoat: 0.45, transmission: 0, wind: 0.4, sag: 0.06, weave: 'satin' },
  { name: 'Wool', note: 'felted', color: '#6d645c', sheen: 0.15, sheenColor: '#d9d0c6', rough: 0.94, clearcoat: 0, transmission: 0, wind: 0.12, sag: 0.14, weave: 'wool' },
  { name: 'Organza', note: 'sheer', color: '#f7f1ea', sheen: 0.4, sheenColor: '#ffffff', rough: 0.22, clearcoat: 0.2, transmission: 0.72, wind: 0.85, sag: 0.03, weave: 'organza' },
  { name: 'Canvas', note: 'heavy', color: '#8d7344', sheen: 0, sheenColor: '#e6d2a4', rough: 0.92, clearcoat: 0, transmission: 0, wind: 0.08, sag: 0.16, weave: 'canvas' },
  { name: 'Chiffon', note: 'blush', color: '#e7a8b4', sheen: 0.55, sheenColor: '#ffe4ea', rough: 0.28, clearcoat: 0.12, transmission: 0.45, wind: 0.95, sag: 0.04, weave: 'chiffon' },
  { name: 'Brocade', note: 'gold thread', color: '#1c140c', sheen: 0.7, sheenColor: '#f0d48a', rough: 0.42, clearcoat: 0.22, transmission: 0, wind: 0.2, sag: 0.09, weave: 'brocade' },
];

const COLS = 20;
const ROWS = 15;
const REST = 0.19;
const CLOTH_HALF = ((COLS - 1) * REST) / 2;
const SPACING = 7.2;
const EYE = 1.55;

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.75));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color('#07060a');
scene.fog = new THREE.Fog('#07060a', 8, 28);

const camera = new THREE.PerspectiveCamera(58, innerWidth / innerHeight, 0.08, 80);
camera.position.set(0, EYE, -1.2);

const cssRenderer = new CSS3DRenderer();
cssRenderer.domElement.className = 'css3d-layer';
cssRenderer.setSize(innerWidth, innerHeight);
document.body.appendChild(cssRenderer.domElement);
const cssScene = new THREE.Scene();

scene.add(new THREE.AmbientLight(0x2a242c, 0.55));
const key = new THREE.DirectionalLight(0xffe2c4, 1.35);
key.position.set(2.4, 6.2, 1.2);
scene.add(key);
const rim = new THREE.DirectionalLight(0x8ea6ff, 0.45);
rim.position.set(-3, 3, -4);
scene.add(rim);
const lamp = new THREE.PointLight(0xffb27a, 18, 11, 2);
scene.add(lamp);

const length = FABRICS.length * SPACING + 6;
const wallMat = new THREE.MeshStandardMaterial({ color: 0x121016, roughness: 0.92, metalness: 0.04 });
const floor = new THREE.Mesh(new THREE.PlaneGeometry(4.2, length), new THREE.MeshStandardMaterial({ color: 0x0c0b10, roughness: 0.72, metalness: 0.18 }));
floor.rotation.x = -Math.PI / 2;
floor.position.set(0, 0, length / 2 - 2);
scene.add(floor);
for (const side of [-1, 1]) {
  const wall = new THREE.Mesh(new THREE.PlaneGeometry(length, 4.2), wallMat);
  wall.position.set(side * 2.05, 2.05, length / 2 - 2);
  wall.rotation.y = side * -Math.PI / 2;
  scene.add(wall);
}
const ceiling = new THREE.Mesh(new THREE.PlaneGeometry(4.2, length), wallMat);
ceiling.rotation.x = Math.PI / 2;
ceiling.position.set(0, 3.35, length / 2 - 2);
scene.add(ceiling);

const brass = new THREE.MeshStandardMaterial({ color: 0xd7b56a, roughness: 0.22, metalness: 0.92 });
const glow = new THREE.MeshBasicMaterial({ color: 0xffe0a8 });
function addSconce(side, z) {
  const g = new THREE.Group();
  const plate = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.62, 0.28), brass);
  const arm = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 0.22, 8), brass);
  arm.rotation.z = Math.PI / 2;
  arm.position.x = -side * 0.12;
  const cup = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.045, 0.09, 12), brass);
  cup.position.set(-side * 0.24, -0.04, 0);
  const flame = new THREE.Mesh(new THREE.SphereGeometry(0.07, 12, 10), glow);
  flame.position.set(-side * 0.24, 0.06, 0);
  const wash = new THREE.Mesh(
    new THREE.CircleGeometry(0.42, 20),
    new THREE.MeshBasicMaterial({ color: 0xffb060, transparent: true, opacity: 0.45, depthWrite: false })
  );
  wash.position.set(side * 0.02, 0, 0);
  wash.rotation.y = -side * Math.PI / 2;
  const light = new THREE.PointLight(0xffb070, 18, 7.5, 2);
  light.position.copy(flame.position);
  g.add(plate, arm, cup, flame, wash, light);
  g.position.set(side * 1.9, 1.7, z);
  scene.add(g);
}
for (let i = 0; i < FABRICS.length; i++) {
  const z = 2.4 + i * SPACING - 0.35;
  addSconce(-1, z);
  addSconce(1, z);
}

function weaveTexture(fabric) {
  const c = document.createElement('canvas');
  c.width = 256; c.height = 256;
  const g = c.getContext('2d');
  g.fillStyle = fabric.color;
  g.fillRect(0, 0, 256, 256);
  if (fabric.weave === 'denim') {
    g.strokeStyle = 'rgba(255,255,255,0.16)';
    g.lineWidth = 2;
    for (let i = -256; i < 512; i += 7) {
      g.beginPath(); g.moveTo(i, 0); g.lineTo(i + 256, 256); g.stroke();
    }
  } else if (fabric.weave === 'linen' || fabric.weave === 'canvas') {
    const step = fabric.weave === 'canvas' ? 10 : 6;
    for (let i = 0; i < 256; i += step) {
      g.fillStyle = i % (step * 2) === 0 ? 'rgba(255,255,255,0.08)' : 'rgba(0,0,0,0.08)';
      g.fillRect(i, 0, 2, 256);
      g.fillRect(0, i, 256, 2);
    }
  } else if (fabric.weave === 'brocade') {
    g.fillStyle = 'rgba(240,212,138,0.55)';
    for (let y = 16; y < 256; y += 42) {
      for (let x = 16; x < 256; x += 42) {
        g.beginPath(); g.ellipse(x, y, 8, 14, 0, 0, Math.PI * 2); g.fill();
      }
    }
  } else if (fabric.weave === 'wool') {
    for (let i = 0; i < 900; i++) {
      g.fillStyle = Math.random() > 0.5 ? 'rgba(255,255,255,0.05)' : 'rgba(0,0,0,0.08)';
      g.fillRect(Math.random() * 256, Math.random() * 256, 3, 2);
    }
  } else if (fabric.weave === 'silk' || fabric.weave === 'satin') {
    const grad = g.createLinearGradient(0, 0, 256, 256);
    grad.addColorStop(0, 'rgba(255,255,255,0.22)');
    grad.addColorStop(0.5, 'rgba(255,255,255,0)');
    grad.addColorStop(1, 'rgba(0,0,0,0.18)');
    g.fillStyle = grad;
    g.fillRect(0, 0, 256, 256);
  } else {
    for (let i = 0; i < 256; i += 4) {
      g.fillStyle = i % 8 === 0 ? 'rgba(255,255,255,0.06)' : 'rgba(0,0,0,0.05)';
      g.fillRect(i, 0, 1, 256);
      g.fillRect(0, i, 256, 1);
    }
  }
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(fabric.weave === 'denim' ? 2.2 : 3, 2.4);
  return tex;
}

function makeCloth(fabric, index) {
  const group = new THREE.Group();
  group.position.z = 2.4 + index * SPACING;
  const particles = [];
  const originX = -((COLS - 1) * REST) / 2;
  const originY = 3.05;
  for (let y = 0; y < ROWS; y++) {
    for (let x = 0; x < COLS; x++) {
      const u = y / (ROWS - 1);
      const sag = u * u * fabric.sag;
      const fold = Math.sin(x * 0.7 + index) * 0.035 * u;
      const px = originX + x * REST;
      const py = originY - y * REST - sag;
      const pz = fold;
      particles.push({ pos: new THREE.Vector3(px, py, pz), prev: new THREE.Vector3(px, py, pz), pinned: y === 0 });
    }
  }
  const constraints = [];
  const link = (a, b) => constraints.push({ a, b, rest: particles[a].pos.distanceTo(particles[b].pos) });
  for (let y = 0; y < ROWS; y++) {
    for (let x = 0; x < COLS; x++) {
      const i = y * COLS + x;
      if (x < COLS - 1) link(i, i + 1);
      if (y < ROWS - 1) link(i, i + COLS);
      if (x < COLS - 1 && y < ROWS - 1) { link(i, i + COLS + 1); link(i + 1, i + COLS); }
    }
  }
  const railW = (COLS - 1) * REST + 0.22;
  const railMat = new THREE.MeshStandardMaterial({ color: 0xc4a574, roughness: 0.32, metalness: 0.86 });
  const rail = new THREE.Mesh(new THREE.CylinderGeometry(0.028, 0.028, railW, 12), railMat);
  rail.rotation.z = Math.PI / 2;
  rail.position.set(0, originY + 0.03, 0);
  group.add(rail);

  const positions = new Float32Array(COLS * ROWS * 3);
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  const uvs = new Float32Array(COLS * ROWS * 2);
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
    const i = y * COLS + x;
    uvs[i * 2] = x / (COLS - 1);
    uvs[i * 2 + 1] = 1 - y / (ROWS - 1);
  }
  geo.setAttribute('uv', new THREE.BufferAttribute(uvs, 2));
  const indices = [];
  for (let y = 0; y < ROWS - 1; y++) for (let x = 0; x < COLS - 1; x++) {
    const i = y * COLS + x;
    indices.push(i, i + COLS, i + 1, i + 1, i + COLS, i + COLS + 1);
  }
  geo.setIndex(indices);
  const mat = new THREE.MeshPhysicalMaterial({
    map: weaveTexture(fabric),
    color: fabric.color,
    roughness: fabric.rough,
    metalness: 0.02,
    sheen: fabric.sheen,
    sheenRoughness: 0.45,
    sheenColor: new THREE.Color(fabric.sheenColor),
    clearcoat: fabric.clearcoat,
    clearcoatRoughness: 0.55,
    transmission: fabric.transmission,
    thickness: fabric.transmission ? 0.15 : 0,
    side: THREE.DoubleSide,
    transparent: fabric.transmission > 0,
    opacity: fabric.transmission > 0.6 ? 0.72 : 1,
  });
  const mesh = new THREE.Mesh(geo, mat);
  group.add(mesh);
  scene.add(group);
  return { fabric, group, particles, constraints, geo, positions, mesh, t: index * 1.7, live: false };
}

const cloths = FABRICS.map(makeCloth);
const nameEl = document.getElementById('name');

// First 9 technique-exhibit cells, cloth demo skipped (this corridor is already cloth).
// Same embed URLs as the fulldome grove. Frameless CSS3D iframes only.
const LABS = [
  { id: 'anisotropic', name: 'Anisotropic PBR', src: './webgl-lab/12-anisotropic-pbr.html?embed=1&v=orbit1' },
  { id: 'particles', name: 'Flow particles', src: './physics-panel.html?demo=particles&embed=1&v=orbit1' },
  { id: 'hdr-ibl', name: 'HDR IBL / PMREM', src: './webgl-lab/10-hdr-ibl-pmrem.html?embed=1&v=orbit1' },
  { id: 'ssao', name: 'SSAO', src: './webgl-lab/05-ssao.html?embed=1&v=orbit1' },
  { id: 'pcss', name: 'PCSS shadows', src: './webgl-lab/06-pcss-contact-shadows.html?embed=1&v=orbit1' },
  { id: 'outline', name: 'Outline selection', src: './webgl-lab/07-outline-selection.html?embed=1&v=orbit1' },
  { id: 'stencil', name: 'Stencil portals', src: './webgl-lab/08-stencil-portals.html?embed=1&v=orbit1' },
  { id: 'decals', name: 'Decals', src: './webgl-lab/09-decals.html?embed=1&v=eyes1' },
  { id: 'ssr', name: 'SSR', src: './webgl-lab/04-ssr.html?embed=1&v=orbit1' },
];
const MAX_ARMED = 2;
const LAB_W = 1.42;
const LAB_H = 1.06;
const LAB_X = 1.18; // right-wall side of the walk (walls at x = ±2.05)

const labs = LABS.map((meta, i) => {
  // Bay between cloth i and cloth i+1 (cloths at 2.4 + n * 7.2).
  const z = 2.4 + (i + 0.5) * SPACING;
  const cssW = Math.round(LAB_W * 100);
  const cssH = Math.round(LAB_H * 100);
  const scale = LAB_W / cssW;
  const iframe = document.createElement('iframe');
  iframe.src = 'about:blank';
  iframe.setAttribute('loading', 'lazy');
  iframe.title = meta.name;
  iframe.setAttribute('referrerpolicy', 'no-referrer');
  iframe.allow = 'autoplay';
  iframe.style.width = cssW + 'px';
  iframe.style.height = cssH + 'px';
  iframe.style.border = '0';
  iframe.style.background = 'transparent';
  iframe.style.pointerEvents = 'none';
  iframe.style.borderRadius = '0';
  iframe.style.boxShadow = 'none';
  iframe.style.opacity = '0';
  iframe.style.transition = 'opacity 0.45s ease';
  const cssObj = new CSS3DObject(iframe);
  // Constructor forces pointer-events:auto; keep none so cloth point-pull still wins.
  iframe.style.pointerEvents = 'none';
  cssObj.scale.set(scale, scale, scale);
  cssObj.position.set(LAB_X, EYE, z);
  cssObj.rotation.y = Math.PI; // face the walker approaching from −Z
  cssScene.add(cssObj);
  return { meta, z, cssObj, iframe, embedUrl: meta.src, embedArmed: false, _revealWatch: false };
});

/** Reveal iframe only once its WebGL canvas exists (avoids empty black rectangles). */
function revealLabWhenReady(lab) {
  if (!lab || lab._revealWatch) return;
  lab._revealWatch = true;
  let tries = 0;
  const tick = () => {
    if (!lab.embedArmed) { lab._revealWatch = false; return; }
    tries++;
    try {
      const doc = lab.iframe.contentDocument;
      const canvas = doc && doc.querySelector('canvas');
      if (canvas && canvas.width > 0) {
        lab.iframe.style.opacity = '1';
        lab._revealWatch = false;
        return;
      }
    } catch {}
    if (tries < 180) requestAnimationFrame(tick);
    else lab._revealWatch = false;
  };
  lab.iframe.addEventListener('load', () => {
    if (!lab.embedArmed) return;
    tries = 0;
    requestAnimationFrame(tick);
  }, { once: true });
  requestAnimationFrame(tick);
}

function armLab(lab) {
  if (!lab) return;
  if (!lab.embedArmed) {
    lab.iframe.src = lab.embedUrl;
    lab.embedArmed = true;
    lab._revealWatch = false;
    revealLabWhenReady(lab);
  } else if (lab.iframe.style.opacity !== '1') {
    revealLabWhenReady(lab);
  }
}

function disarmLab(lab) {
  if (!lab || !lab.embedArmed) return;
  lab.iframe.src = 'about:blank';
  lab.iframe.style.opacity = '0';
  lab.embedArmed = false;
  lab._revealWatch = false;
}

/** Approaching lab + the one just passed. Everyone else stays about:blank. */
function updateLabEmbeds() {
  let approach = -1;
  let approachD = Infinity;
  for (let i = 0; i < labs.length; i++) {
    const dz = labs[i].z - camera.position.z;
    if (dz > 0.15 && dz < approachD) { approachD = dz; approach = i; }
  }
  const want = [];
  if (approach >= 0) {
    want.push(approach);
    if (approach > 0) want.push(approach - 1);
  } else if (labs.length) {
    want.push(labs.length - 1);
  }
  while (want.length > MAX_ARMED) want.pop();
  const wantSet = new Set(want);
  for (let i = 0; i < labs.length; i++) {
    if (wantSet.has(i)) armLab(labs[i]);
    else disarmLab(labs[i]);
  }
}

function writeMesh(cloth) {
  let i3 = 0;
  for (const p of cloth.particles) {
    cloth.positions[i3++] = p.pos.x;
    cloth.positions[i3++] = p.pos.y;
    cloth.positions[i3++] = p.pos.z;
  }
  cloth.geo.attributes.position.needsUpdate = true;
  cloth.geo.computeVertexNormals();
}

function stepCloth(cloth, dt) {
  cloth.t += dt;
  const g = 9.82 * (0.28 + cloth.fabric.sag);
  const windAmp = cloth.fabric.wind;
  const parts = cloth.particles;
  for (let i = 0; i < parts.length; i++) {
    const p = parts[i];
    if (p.pinned) continue;
    const y = Math.floor(i / COLS);
    const x = i % COLS;
    const vx = p.pos.x - p.prev.x;
    const vy = p.pos.y - p.prev.y;
    const vz = p.pos.z - p.prev.z;
    p.prev.copy(p.pos);
    const falloff = y / ROWS;
    const wind = Math.sin(cloth.t * 1.2 + x * 0.35) * windAmp * falloff;
    p.pos.x += vx * 0.985 + wind * dt * dt * 16;
    p.pos.y += vy * 0.985 - g * dt * dt;
    p.pos.z += vz * 0.985 + Math.sin(cloth.t * 0.85 + x * 0.4) * windAmp * falloff * dt * dt * 12;
    if (p.pos.y < 0.08) { p.pos.y = 0.08; p.prev.y = p.pos.y; }
  }
  if (grab && grab.cloth === cloth) {
    const held = parts[grab.index];
    held.pos.copy(grab.target);
    held.prev.copy(grab.target);
  }
  for (let iter = 0; iter < 4; iter++) {
    for (const c of cloth.constraints) {
      const pa = parts[c.a];
      const pb = parts[c.b];
      const dx = pb.pos.x - pa.pos.x;
      const dy = pb.pos.y - pa.pos.y;
      const dz = pb.pos.z - pa.pos.z;
      const dist = Math.hypot(dx, dy, dz) || 0.0001;
      const diff = (dist - c.rest) / dist;
      const ox = dx * 0.5 * diff, oy = dy * 0.5 * diff, oz = dz * 0.5 * diff;
      if (!pa.pinned) { pa.pos.x += ox; pa.pos.y += oy; pa.pos.z += oz; }
      if (!pb.pinned) { pb.pos.x -= ox; pb.pos.y -= oy; pb.pos.z -= oz; }
    }
  }
  writeMesh(cloth);
}

let grab = null;
for (const cloth of cloths) {
  for (let i = 0; i < 28; i++) stepCloth(cloth, 1 / 60);
  cloth.live = false;
  cloth.settled = true;
}

const keys = new Set();
addEventListener('keydown', (e) => {
  if (['KeyW','KeyA','KeyS','KeyD','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault();
  keys.add(e.code);
});
addEventListener('keyup', (e) => keys.delete(e.code));
const padMove = { f: false, b: false, l: false, r: false };
const mobilePad = document.getElementById('mobile-pad');
const padKnob = document.getElementById('pad-knob');
const PAD_MAX = 42;
let padPointerId = null;
function clearPad() {
  padMove.f = padMove.b = padMove.l = padMove.r = false;
  if (padKnob) padKnob.style.transform = '';
  mobilePad.classList.remove('active');
}
function applyPad(dx, dy) {
  const dist = Math.hypot(dx, dy) || 1;
  const scale = Math.min(1, PAD_MAX / dist);
  const ux = dx * scale, uy = dy * scale;
  if (padKnob) padKnob.style.transform = `translate(${ux}px, ${uy}px)`;
  const dead = 14;
  padMove.f = uy < -dead; padMove.b = uy > dead; padMove.l = ux < -dead; padMove.r = ux > dead;
  mobilePad.classList.toggle('active', padMove.f || padMove.b || padMove.l || padMove.r);
}
mobilePad.addEventListener('pointerdown', (e) => {
  e.preventDefault(); e.stopPropagation();
  padPointerId = e.pointerId;
  try { mobilePad.setPointerCapture(e.pointerId); } catch {}
  const r = mobilePad.getBoundingClientRect();
  applyPad(e.clientX - (r.left + r.width / 2), e.clientY - (r.top + r.height / 2));
});
mobilePad.addEventListener('pointermove', (e) => {
  if (padPointerId !== e.pointerId) return;
  e.preventDefault(); e.stopPropagation();
  const r = mobilePad.getBoundingClientRect();
  applyPad(e.clientX - (r.left + r.width / 2), e.clientY - (r.top + r.height / 2));
});
function endPad(e) {
  if (e && padPointerId !== e.pointerId) return;
  padPointerId = null;
  clearPad();
}
mobilePad.addEventListener('pointerup', endPad);
mobilePad.addEventListener('pointercancel', endPad);

let yaw = 0, pitch = 0, looking = false, lx = 0, ly = 0;
const raycaster = new THREE.Raycaster();
const ndc = new THREE.Vector2();
const hit = new THREE.Vector3();
const grabPlane = new THREE.Plane();
function pointerNdc(e) {
  const r = renderer.domElement.getBoundingClientRect();
  ndc.x = ((e.clientX - r.left) / r.width) * 2 - 1;
  ndc.y = -((e.clientY - r.top) / r.height) * 2 + 1;
}
function placeGrab(e) {
  if (!grab) return;
  pointerNdc(e);
  raycaster.setFromCamera(ndc, camera);
  grabPlane.set(new THREE.Vector3(0, 0, 1), -grab.cloth.group.position.z);
  if (!raycaster.ray.intersectPlane(grabPlane, hit)) return;
  grab.cloth.group.worldToLocal(hit);
  grab.target.copy(hit);
}
renderer.domElement.addEventListener('pointerdown', (e) => {
  pointerNdc(e);
  raycaster.setFromCamera(ndc, camera);
  const hits = raycaster.intersectObjects(cloths.filter(c => c.live).map(c => c.mesh), false);
  if (hits.length) {
    const cloth = cloths.find(c => c.mesh === hits[0].object);
    const local = cloth.group.worldToLocal(hits[0].point.clone());
    let bestI = 0, bestD = Infinity;
    cloth.particles.forEach((p, i) => {
      const d = p.pos.distanceTo(local);
      if (d < bestD) { bestD = d; bestI = i; }
    });
    grab = { cloth, index: bestI, target: local.clone() };
    looking = false;
    renderer.domElement.setPointerCapture(e.pointerId);
    return;
  }
  looking = true; lx = e.clientX; ly = e.clientY;
  renderer.domElement.setPointerCapture(e.pointerId);
});
renderer.domElement.addEventListener('pointerup', () => { looking = false; grab = null; });
renderer.domElement.addEventListener('pointermove', (e) => {
  if (grab) { placeGrab(e); return; }
  if (!looking) return;
  yaw -= (e.clientX - lx) * 0.0045;
  pitch -= (e.clientY - ly) * 0.0035;
  pitch = Math.max(-0.7, Math.min(0.6, pitch));
  lx = e.clientX; ly = e.clientY;
});
const endZ = cloths[cloths.length - 1].group.position.z + 3;
let shown = -1;
const clock = new THREE.Clock();

function frame() {
  const dt = Math.min(clock.getDelta(), 0.033);
  const forward = (keys.has('KeyW') || keys.has('ArrowUp') || padMove.f ? 1 : 0) - (keys.has('KeyS') || keys.has('ArrowDown') || padMove.b ? 1 : 0);
  const strafe = (keys.has('KeyD') || keys.has('ArrowRight') || padMove.r ? 1 : 0) - (keys.has('KeyA') || keys.has('ArrowLeft') || padMove.l ? 1 : 0);
  const sp = 3.1 * dt;
  let nx = camera.position.x + (Math.sin(yaw) * forward + Math.cos(yaw) * strafe) * sp;
  let nz = camera.position.z + (Math.cos(yaw) * forward - Math.sin(yaw) * strafe) * sp;
  camera.position.x = nx;
  camera.position.z = nz;
  camera.position.x = Math.max(-1.55, Math.min(1.55, camera.position.x));
  camera.position.z = Math.max(-1.6, Math.min(endZ, camera.position.z));
  camera.position.y = EYE;
  const look = new THREE.Vector3(Math.sin(yaw) * Math.cos(pitch), Math.sin(pitch), Math.cos(yaw) * Math.cos(pitch));
  camera.lookAt(camera.position.clone().add(look));
  lamp.position.set(camera.position.x, 2.4, camera.position.z + 1.6);

  let best = 0, bestD = Infinity;
  cloths.forEach((cloth, i) => {
    cloth.live = false;
    const dz = cloth.group.position.z - camera.position.z;
    if (dz > 0.15 && dz < bestD) { bestD = dz; best = i; }
  });
  if (bestD === Infinity) best = cloths.length - 1;
  cloths[best].live = true;
  if (best > 0) {
    const prev = cloths[best - 1];
    const dz = prev.group.position.z - camera.position.z;
    if (dz > -2.2) prev.live = true;
  }
  for (const cloth of cloths) if (cloth.live) stepCloth(cloth, dt);
  if (best !== shown) {
    shown = best;
    const f = cloths[best].fabric;
    nameEl.innerHTML = f.name + '<span>' + f.note + '</span>';
  }
  updateLabEmbeds();
  renderer.render(scene, camera);
  cssRenderer.render(cssScene, camera);
  requestAnimationFrame(frame);
}
frame();
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  cssRenderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
